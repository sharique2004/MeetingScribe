<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeetingScribe — Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">

<style>
/* ============================== TOKENS ============================== */
:root{
  --base:#0d0e11; --panel:#16181d; --panel-2:#1b1e24; --raise:#20242c;
  --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.045); --line-strong: rgba(255,255,255,.14);
  --text:#e9ebf1; --text-2:#a4aab8; --text-3:#71778a;
  --accent:#3b82f6; --accent-2:#5b9dff; --accent-dim: rgba(59,130,246,.15); --accent-ink:#eef4ff;
  --live:#a3e635;
  --f-ui:'Archivo', system-ui, sans-serif;
  --f-body:'IBM Plex Sans', system-ui, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, monospace;
  --ease-out: cubic-bezier(.22,1,.32,1);
  --ease-io: cubic-bezier(.77,0,.175,1);
  --spring: cubic-bezier(.34,1.3,.64,1);
  --ease: cubic-bezier(.4,0,.2,1);
  --shadow: 0 18px 44px -12px rgba(0,0,0,.66), 0 4px 10px rgba(0,0,0,.4);
  --ts:16px; /* transcript reading size, JS-controlled */
  color-scheme: dark;
}
*{box-sizing:border-box}
html{ -webkit-text-size-adjust:100% }
body{
  margin:0; background:var(--base); color:var(--text);
  font-family:var(--f-ui); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
/* faint console texture: two soft graphite washes, no motion */
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(1100px 620px at 78% -12%, rgba(59,130,246,.10), transparent 62%),
    radial-gradient(900px 560px at -8% 108%, rgba(120,90,200,.07), transparent 60%);
}
button{font-family:inherit; color:inherit; cursor:pointer}
:focus-visible{ outline:2px solid var(--accent-2); outline-offset:2px; border-radius:6px }
::selection{ background:rgba(59,130,246,.34); color:#fff }
mark{ background:rgba(163,230,53,.24); color:#eaf6c9; border-radius:3px; padding:0 .1em; box-decoration-break:clone }

.mono{ font-family:var(--f-mono); font-variant-numeric:tabular-nums }
.eyebrow{
  font-family:var(--f-mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--text-3); font-weight:500;
}

/* ============================== SHELL ============================== */
.wrap{ max-width:1140px; margin:0 auto; padding:26px 26px 200px }

/* ---- hero console ---- */
.console{
  background:linear-gradient(180deg, var(--panel) 0%, #14161b 100%);
  border:1px solid var(--line); border-radius:20px;
  padding:20px 22px 6px;
  position:relative; overflow:hidden;
}
.console::after{ /* top hairline sheen */
  content:""; position:absolute; inset:0 0 auto 0; height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.10) 30% 70%, transparent);
}

.hero-top{ display:flex; align-items:flex-start; gap:18px; flex-wrap:wrap }
.title-block{ flex:1 1 340px; min-width:0 }
.rec{
  display:inline-flex; align-items:center; gap:7px; margin-bottom:9px;
  font-family:var(--f-mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-3);
}
.rec b{ width:7px; height:7px; border-radius:50%; background:var(--live); box-shadow:0 0 0 3px rgba(163,230,53,.14) }
h1#title{
  font-family:var(--f-ui); font-weight:700; font-size:clamp(23px,3.1vw,31px); line-height:1.08;
  letter-spacing:-.02em; margin:0; color:var(--text);
  outline:none; border-radius:6px; max-width:22ch;
}
h1#title:focus-visible{ box-shadow:0 0 0 2px var(--accent); outline:none }
h1#title:hover{ cursor:text }
h1#title[contenteditable]:empty::before{ content:"Untitled meeting"; color:var(--text-3) }

.meta{ display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 2px }
.tag{
  font-family:var(--f-mono); font-size:11px; color:var(--text-2);
  background:rgba(255,255,255,.028); border:1px solid var(--line-2); border-radius:6px;
  padding:3px 8px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.tag svg{ opacity:.75 }

/* hero actions */
.hero-actions{ display:flex; align-items:center; gap:10px; flex-shrink:0 }
.btn-primary{
  position:relative; overflow:hidden; border:none; border-radius:11px;
  background:var(--accent); color:var(--accent-ink); font-weight:600; font-size:14px; letter-spacing:-.01em;
  padding:10px 17px; display:inline-flex; align-items:center; gap:8px;
  transition:transform .14s var(--ease-out), background .2s var(--ease), filter .2s var(--ease);
  will-change:transform;
}
.btn-primary:hover{ filter:brightness(1.07) }
.btn-primary:active{ transform:scale(.965) }
.btn-primary span{ position:relative; z-index:1; display:inline-flex; align-items:center; gap:8px }
.btn-primary .rp{ position:absolute; border-radius:50%; background:rgba(255,255,255,.5); transform:scale(0); pointer-events:none; z-index:0 }

.menu-wrap{ position:relative }
.btn-ghost{
  border:1px solid var(--line-strong); background:rgba(255,255,255,.02); color:var(--text);
  border-radius:11px; padding:10px 12px; font-size:14px; font-weight:500;
  display:inline-flex; align-items:center; gap:7px;
  transition:transform .14s var(--ease-out), background .2s var(--ease), border-color .2s var(--ease);
}
.btn-ghost:hover{ background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.2) }
.btn-ghost:active{ transform:scale(.965) }
.btn-ghost .chev{ transition:transform .2s var(--ease); opacity:.7 }
.menu-wrap.open .btn-ghost .chev{ transform:rotate(180deg) }

.popover{
  position:absolute; top:calc(100% + 8px); right:0; min-width:232px; z-index:60;
  background:var(--panel-2); border:1px solid var(--line-strong); border-radius:14px;
  box-shadow:var(--shadow); padding:7px;
  transform-origin:top right; transform:scale(.96) translateY(-4px); opacity:0; pointer-events:none;
  transition:opacity .16s var(--ease-out), transform .18s var(--ease-out);
}
.menu-wrap.open .popover{ transform:none; opacity:1; pointer-events:auto }
.pop-label{ padding:8px 10px 4px; font-family:var(--f-mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-3) }
.pop-item{
  width:100%; text-align:left; background:none; border:none; border-radius:9px;
  padding:8px 10px; font-size:13.5px; color:var(--text); display:flex; align-items:center; gap:10px;
  transition:background .13s var(--ease);
}
.pop-item:hover{ background:rgba(255,255,255,.06) }
.pop-item .ic{ width:16px; color:var(--text-3); flex:0 0 16px; display:inline-flex }
.pop-item.danger:hover{ background:rgba(240,90,90,.14) } .pop-item.danger .ic{ color:#e57373 }
.pop-sep{ height:1px; background:var(--line); margin:6px 8px }

/* ---- waveform ---- */
.wave-shell{ margin:18px 0 0; position:relative }
.wave-frame{
  position:relative; height:96px; border-radius:12px; overflow:hidden; cursor:pointer;
  background:linear-gradient(180deg, #101217, #0c0e12);
  border:1px solid var(--line);
}
.wave-frame canvas{ display:block; width:100%; height:100% }
.wave-frame::after{ /* center-line seam */
  content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(255,255,255,.05); pointer-events:none;
}
.wave-frame:focus-visible{ outline:2px solid var(--accent-2); outline-offset:2px }

.clockrow{ display:flex; align-items:center; gap:16px; margin:12px 2px 2px; flex-wrap:wrap }
.odometer{ display:inline-flex; align-items:baseline; font-family:var(--f-mono); font-weight:500;
  font-size:clamp(28px,4.4vw,40px); letter-spacing:-.01em; color:var(--text); line-height:1 }
.od-col{ display:inline-block; height:1em; overflow:hidden; width:.6em; text-align:center }
.od-reel{ display:flex; flex-direction:column; transition:transform .34s var(--spring) }
.od-reel > span{ height:1em; line-height:1em }
.od-col.dim{ opacity:.3 }
.od-colon{ padding:0 .04em; opacity:.6 }
.total{ font-family:var(--f-mono); font-size:13px; color:var(--text-3); align-self:flex-end; margin-bottom:4px }
.legend{ margin-left:auto; display:flex; gap:14px; flex-wrap:wrap; align-items:center }
.leg{ display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--text-2) }
.leg i{ width:9px; height:9px; border-radius:3px; display:inline-block }

/* ---- segmented tabs (sticky) ---- */
.tabbar{
  position:sticky; top:0; z-index:40; margin:16px -22px 0; padding:12px 22px 12px;
  background:linear-gradient(180deg, rgba(13,14,17,.86), rgba(13,14,17,.62));
  backdrop-filter:blur(12px) saturate(1.1); -webkit-backdrop-filter:blur(12px) saturate(1.1);
  border-top:1px solid var(--line-2);
}
.seg{
  position:relative; display:grid; grid-template-columns:repeat(4,1fr);
  background:#101217; border:1px solid var(--line); border-radius:12px; padding:4px;
  max-width:520px;
}
.seg .pill{
  position:absolute; top:4px; left:4px; height:calc(100% - 8px);
  background:var(--accent); border-radius:9px; z-index:0;
  transform:translateX(0); width:0;
  transition:transform .34s var(--spring);
  will-change:transform;
}
.seg button{
  position:relative; z-index:1; background:none; border:none; padding:8px 6px;
  font-family:var(--f-ui); font-weight:600; font-size:13.5px; letter-spacing:-.005em; color:var(--text-2);
  border-radius:9px; transition:color .2s var(--ease), transform .12s var(--ease-out);
}
.seg button:active{ transform:scale(.96) }
.seg button[aria-selected="true"]{ color:var(--accent-ink) }

/* ============================== PANELS ============================== */
.panels{ margin-top:22px }
.panel{ display:none }
.panel.active{ display:block }
.panel.enter{ opacity:0; transform:translateY(10px) }
.panel.in{ opacity:1; transform:none; transition:opacity .3s var(--ease-out), transform .3s var(--ease-out) }

.reader{ max-width:760px; margin:0 auto }
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px 22px;
}
.card + .card{ margin-top:14px }
.card h3{ font-family:var(--f-ui); font-weight:700; font-size:15px; letter-spacing:-.01em; margin:0 0 2px }
.card .eyebrow{ margin-bottom:12px; display:block }

/* Overview */
.tldr{ font-family:var(--f-body); font-size:17px; line-height:1.62; color:var(--text); font-weight:400 }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px }
.dlist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:13px }
.dlist li{ display:flex; gap:11px; font-family:var(--f-body); font-size:14.5px; line-height:1.55; color:var(--text) }
.dnum{ flex:0 0 auto; width:20px; height:20px; border-radius:6px; background:var(--accent-dim); color:var(--accent-2);
  font-family:var(--f-mono); font-size:11px; display:grid; place-items:center; margin-top:1px; font-weight:500 }
.acts{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px }
.act{ display:flex; align-items:center; gap:11px }
.act .who-av{ flex:0 0 auto }
.act .task{ flex:1; font-family:var(--f-body); font-size:14px; line-height:1.4; color:var(--text) }
.due{ flex:0 0 auto; font-family:var(--f-mono); font-size:11px; color:var(--text-2);
  background:rgba(255,255,255,.03); border:1px solid var(--line-2); border-radius:6px; padding:3px 8px; white-space:nowrap }
.topic{ display:flex; align-items:center; gap:12px; margin:11px 0 }
.topic .tl{ flex:0 0 40%; font-size:13.5px; color:var(--text) }
.tbar{ flex:1; height:6px; border-radius:4px; background:rgba(255,255,255,.05); overflow:hidden }
.tbar i{ display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,var(--accent),var(--accent-2));
  transform-origin:left; transform:scaleX(0); transition:transform .8s var(--ease-out) }
.email{ font-family:var(--f-body); font-size:13.5px; line-height:1.62; color:var(--text-2); white-space:pre-wrap;
  background:#111318; border:1px solid var(--line-2); border-radius:12px; padding:16px; max-height:none }
.mini-btn{ border:1px solid var(--line-strong); background:rgba(255,255,255,.02); color:var(--text);
  border-radius:9px; padding:6px 11px; font-size:12.5px; font-weight:500; display:inline-flex; align-items:center; gap:6px;
  transition:transform .14s var(--ease-out), background .2s var(--ease) }
.mini-btn:hover{ background:rgba(255,255,255,.06) } .mini-btn:active{ transform:scale(.95) }
.card-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px }
.card-head .eyebrow{ margin:0 }
.privacy{ display:flex; align-items:center; gap:9px; margin:16px auto 0; max-width:760px; padding:0 4px;
  font-size:12px; color:var(--text-3) }
.privacy svg{ flex:0 0 auto; opacity:.7 }

/* Transcript */
.tx-list{ position:relative; max-width:760px; margin:0 auto }
.mhl{ position:absolute; top:0; left:0; width:0; height:0; z-index:0; pointer-events:none;
  background:rgba(255,255,255,.045); border:1px solid var(--line-2); border-radius:13px;
  opacity:0; transform:translate(0,0);
  transition:transform .3s var(--spring), opacity .2s var(--ease); will-change:transform }
.turn{
  position:relative; z-index:1; display:grid; grid-template-columns:56px 1fr; gap:14px;
  padding:13px 14px 15px; border-left:1.5px solid var(--rl); margin-left:2px;
}
.turn.hide{ display:none }
.turn::after{ /* flash on timestamp jump */
  content:""; position:absolute; inset:0; border-radius:13px; background:rgba(59,130,246,.16);
  opacity:0; pointer-events:none; z-index:-1; transition:opacity .5s var(--ease-out) }
.turn.flash::after{ opacity:1; transition:opacity .12s var(--ease-out) }
.ts{ font-family:var(--f-mono); font-size:11.5px; color:var(--text-3); background:rgba(255,255,255,.03);
  border:1px solid var(--line-2); border-radius:6px; padding:3px 0; height:fit-content; margin-top:3px;
  transition:color .16s var(--ease), background .16s var(--ease), transform .12s var(--ease-out) }
.ts:hover{ color:var(--accent-2); background:var(--accent-dim); border-color:rgba(59,130,246,.3) }
.ts:active{ transform:scale(.94) }
.turn-who{ display:flex; align-items:center; gap:8px; margin-bottom:6px }
.who-av{ width:20px; height:20px; border-radius:50%; display:grid; place-items:center;
  font-family:var(--f-ui); font-size:9.5px; font-weight:700; letter-spacing:.02em; flex:0 0 auto }
.nm{ font-size:12.5px; font-weight:500; color:var(--text-2); letter-spacing:.005em }
.turn-text{ font-family:var(--f-body); font-size:var(--ts); line-height:1.62; color:var(--text); font-weight:400 }

/* Insights */
.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px }
.stat{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 16px 15px }
.stat .v{ font-family:var(--f-mono); font-weight:500; font-size:30px; letter-spacing:-.02em; line-height:1; color:var(--text) }
.stat .l{ font-size:12.5px; color:var(--text-2); margin-top:9px; font-weight:500 }
.stat .s{ font-family:var(--f-mono); font-size:10.5px; color:var(--text-3); margin-top:3px }
.spk-card{ margin-top:14px }
.spk-row{ display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:14px; padding:12px 0 }
.spk-row + .spk-row{ border-top:1px solid var(--line-2) }
.spk-id{ display:flex; align-items:center; gap:11px; min-width:0 }
.spk-id .who-av{ width:30px; height:30px; font-size:12px }
.spk-name-wrap{ display:flex; align-items:center; gap:6px; min-width:0 }
.spk-name{ font-size:14px; font-weight:500; color:var(--text) }
.pencil{ background:none; border:none; padding:4px; color:var(--text-3); border-radius:6px; display:inline-flex; opacity:0;
  transition:opacity .16s var(--ease), color .16s var(--ease), background .16s var(--ease) }
.spk-row:hover .pencil, .pencil:focus-visible{ opacity:1 }
.pencil:hover{ color:var(--accent-2); background:rgba(255,255,255,.06) }
.name-input{ font-family:var(--f-ui); font-size:14px; font-weight:500; color:var(--text);
  background:#0e1014; border:1px solid var(--accent); border-radius:7px; padding:3px 8px; width:150px; outline:none }
.spk-share{ display:flex; align-items:center; gap:12px; width:min(46%,260px) }
.sbar{ flex:1; height:7px; border-radius:5px; background:rgba(255,255,255,.05); overflow:hidden }
.sbar i{ display:block; height:100%; border-radius:5px; transform-origin:left; transform:scaleX(0);
  transition:transform .9s var(--ease-out) }
.spct{ font-family:var(--f-mono); font-size:13px; color:var(--text); width:44px; text-align:right; font-variant-numeric:tabular-nums }
.stime{ font-family:var(--f-mono); font-size:11px; color:var(--text-3); margin-top:2px }

/* recluster popover trigger */
.recluster{ position:relative }
.rc-pop{ position:absolute; top:calc(100% + 8px); right:0; z-index:50; background:var(--panel-2);
  border:1px solid var(--line-strong); border-radius:12px; box-shadow:var(--shadow); padding:10px; width:210px;
  transform-origin:top right; transform:scale(.96) translateY(-4px); opacity:0; pointer-events:none;
  transition:opacity .16s var(--ease-out), transform .18s var(--ease-out) }
.recluster.open .rc-pop{ transform:none; opacity:1; pointer-events:auto }
.rc-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:8px }
.rc-grid button{ background:#0f1116; border:1px solid var(--line); color:var(--text-2); border-radius:8px;
  padding:8px 0; font-family:var(--f-mono); font-size:12.5px; transition:all .14s var(--ease) }
.rc-grid button:hover{ border-color:var(--line-strong); color:var(--text) }
.rc-grid button.on{ background:var(--accent-dim); border-color:var(--accent); color:var(--accent-2) }
.rc-note{ font-size:11px; color:var(--text-3); margin-top:10px; line-height:1.4 }

/* Ask */
.ask{ display:flex; flex-direction:column; gap:14px; max-width:720px; margin:0 auto }
.bubble{ max-width:82%; padding:13px 16px; border-radius:16px; font-family:var(--f-body); font-size:14.5px; line-height:1.58 }
.bubble.user{ align-self:flex-end; background:var(--accent-dim); border:1px solid rgba(59,130,246,.28); color:var(--text);
  border-bottom-right-radius:5px }
.bubble.assistant{ align-self:flex-start; background:var(--panel); border:1px solid var(--line); color:var(--text-2);
  border-bottom-left-radius:5px }
.bubble .role{ font-family:var(--f-mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-3); margin-bottom:6px }
.composer{ display:flex; gap:10px; align-items:center; margin-top:4px; padding:10px 12px;
  background:var(--panel); border:1px solid var(--line); border-radius:14px }
.composer input{ flex:1; background:none; border:none; color:var(--text); font-family:var(--f-body); font-size:14px; outline:none }
.composer input::placeholder{ color:var(--text-3) }
.composer .demo-tag{ font-family:var(--f-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-3);
  border:1px solid var(--line-2); border-radius:6px; padding:3px 7px }

/* ============================== COMMAND DOCK ============================== */
.dock-scope{ position:fixed; left:0; right:0; bottom:0; z-index:70; pointer-events:none; padding:0 18px 18px;
  display:flex; justify-content:center }
.dock{
  pointer-events:auto; display:flex; align-items:center; gap:10px; max-width:100%;
  background:rgba(24,26,32,.86); backdrop-filter:blur(18px) saturate(1.2); -webkit-backdrop-filter:blur(18px) saturate(1.2);
  border:1px solid var(--line-strong); border-radius:18px; box-shadow:var(--shadow);
  padding:9px 12px; flex-wrap:wrap; justify-content:center;
}
.dock .grp{ display:flex; align-items:center; gap:8px }
.dock .div{ width:1px; height:24px; background:var(--line); margin:0 2px }
.play{ width:42px; height:42px; border-radius:12px; border:none; background:var(--accent); color:var(--accent-ink);
  display:grid; place-items:center; transition:transform .15s var(--ease-out), filter .2s var(--ease) }
.play:hover{ filter:brightness(1.08); transform:scale(1.05) }
.play:active{ transform:scale(.94) }
.dock-clock{ font-family:var(--f-mono); font-size:13px; color:var(--text); white-space:nowrap; min-width:96px; text-align:center }
.dock-clock b{ color:var(--text); font-weight:500 } .dock-clock i{ color:var(--text-3); font-style:normal }
.tracks{ display:flex; background:#101217; border:1px solid var(--line); border-radius:10px; padding:3px; gap:2px }
.tracks button{ background:none; border:none; color:var(--text-3); font-size:12px; font-weight:500; padding:6px 11px; border-radius:8px;
  transition:all .16s var(--ease) }
.tracks button:hover{ color:var(--text-2) }
.tracks button.on{ background:rgba(255,255,255,.08); color:var(--text) }
.dock-ico{ width:38px; height:38px; border-radius:11px; border:1px solid var(--line); background:rgba(255,255,255,.02);
  color:var(--text-2); display:grid; place-items:center; transition:transform .15s var(--ease-out), background .2s var(--ease), color .2s var(--ease) }
.dock-ico:hover{ background:rgba(255,255,255,.06); color:var(--text); transform:scale(1.06) }
.dock-ico:active{ transform:scale(.94) }
.search-wrap{ display:flex; align-items:center; gap:8px; background:#101217; border:1px solid var(--line); border-radius:11px;
  padding:0 10px; height:38px; transition:border-color .2s var(--ease), background .2s var(--ease) }
.search-wrap:focus-within{ border-color:var(--accent); background:#0e1014 }
.search-wrap svg{ color:var(--text-3); flex:0 0 auto }
.search-wrap input{ background:none; border:none; color:var(--text); font-family:var(--f-ui); font-size:13px; outline:none;
  width:118px; transition:width .26s var(--ease-out) }
.search-wrap input::placeholder{ color:var(--text-3) }
.match{ font-family:var(--f-mono); font-size:11px; color:var(--text-3); white-space:nowrap; min-width:0 }
.match.has{ color:var(--live) }
.size-grp button{ font-family:var(--f-ui); font-weight:600 }
.size-a1{ font-size:11px } .size-a2{ font-size:15px }

/* toast */
.toast-scope{ position:fixed; left:0; right:0; bottom:92px; z-index:80; display:flex; justify-content:center; pointer-events:none }
.toast{ background:var(--panel-2); border:1px solid var(--line-strong); box-shadow:var(--shadow);
  border-radius:11px; padding:9px 15px; font-size:13px; color:var(--text); display:flex; align-items:center; gap:9px;
  transform:translateY(14px) scale(.96); opacity:0; transition:transform .24s var(--ease-out), opacity .24s var(--ease-out) }
.toast.show{ transform:none; opacity:1 }
.toast .dot{ width:7px; height:7px; border-radius:50%; background:var(--live) }

/* ============================== RESPONSIVE ============================== */
@media (max-width:760px){
  .wrap{ padding:16px 14px 200px }
  .console{ padding:16px 15px 4px; border-radius:16px }
  .tabbar{ margin:14px -15px 0; padding:11px 15px }
  .grid2{ grid-template-columns:1fr }
  .stats{ grid-template-columns:repeat(2,1fr) }
  .hero-actions{ width:100%; }
  .btn-primary{ flex:1; justify-content:center }
  .legend{ margin-left:0; width:100% }
  .turn{ grid-template-columns:48px 1fr; gap:11px }
  .spk-row{ grid-template-columns:auto 1fr; row-gap:10px }
  .spk-share{ grid-column:1/-1; width:100% }
}
@media (max-width:480px){
  .stats{ grid-template-columns:1fr 1fr }
  .search-wrap input{ width:82px }
  .dock{ gap:7px; padding:8px 9px }
}

/* pointer-only hover niceties */
@media (hover:none){
  .pencil{ opacity:1 }
}

/* ============================== REDUCED MOTION ============================== */
@media (prefers-reduced-motion: reduce){
  *{ animation:none !important }
  .od-reel{ transition:none !important }
  .seg .pill{ transition:opacity .001s !important }
  .mhl{ transition:opacity .18s var(--ease) !important }
  .panel.in{ transition:opacity .2s var(--ease) !important }
  .tbar i, .sbar i{ transition:transform .001s !important }
  .play:hover, .dock-ico:hover, .btn-primary:hover{ transform:none }
}

<script>
(function(){
  "use strict";
  var D = window.DEMO;
  if(!D){ document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif">Missing data.js</p>'; return; }
  var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var FINE = matchMedia('(hover:hover) and (pointer:fine)').matches;
  var $ = function(s,r){ return (r||document).querySelector(s); };
  var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
  var SP = D.SPEAKERS, MEET = D.MEETING;
  // mutable speaker names (rename is cosmetic)
  var names = {}; Object.keys(SP).forEach(function(k){ names[k]=SP[k].name; });

  function hexToRgba(hex,a){
    var h = hex.replace('#',''); if(h.length===3) h=h.split('').map(function(c){return c+c;}).join('');
    var n = parseInt(h,16);
    return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
  }
  function esc(s){ return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
  // set speaker color vars
  Object.keys(SP).forEach(function(k){ document.documentElement.style.setProperty('--sp-'+k, SP[k].color); });

  /* ---------------- HEADER ---------------- */
  $('#title').textContent = MEET.title;
  $('#title').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); this.blur(); } });

  var lockSvg = '<svg width="12" height="12" viewBox="0 0 14 14" fill="none"><rect x="3" y="6" width="8" height="6" rx="1.3" stroke="currentColor" stroke-width="1.2"/><path d="M4.6 6V4.6a2.4 2.4 0 0 1 4.8 0V6" stroke="currentColor" stroke-width="1.2"/></svg>';
  var metaItems = [
    {t: MEET.dateShort},
    {t: D.fmtTs(MEET.duration)},
    {t: MEET.mode==='online'?'Online call':'In person'},
    {t: MEET.engine},
    {t: MEET.language},
    {t: 'On-device', ic: lockSvg}
  ];
  $('#meta').innerHTML = metaItems.map(function(m){
    return '<span class="tag">'+(m.ic||'')+m.t+'</span>';
  }).join('');

  /* legend + total */
  $('#totalTime').textContent = '/ '+D.fmtTs(MEET.duration)+' total';
  $('#dockTotal').textContent = D.fmtTs(MEET.duration);
  $('#legend').innerHTML = Object.keys(SP).map(function(k){
    return '<span class="leg"><i style="background:'+SP[k].color+'"></i><span data-nm="'+k+'">'+esc(names[k])+'</span></span>';
  }).join('');

  /* ---------------- WAVEFORM ---------------- */
  var canvas = $('#wave'), ctx = canvas.getContext('2d');
  var frame = $('#waveFrame');
  var total = MEET.duration;
  var state = { t:0, playing:false };
  // build speaker segments from transcript
  var segs = D.TRANSCRIPT.map(function(turn,i){
    var next = D.TRANSCRIPT[i+1];
    return { start: turn.t, end: next? next.t : total, key: turn.s };
  });
  function keyAt(sec){ for(var i=0;i<segs.length;i++){ if(sec>=segs[i].start && sec<segs[i].end) return segs[i].key; } return segs[segs.length-1].key; }
  // stable pseudo-random per bar
  function noise(i){ var x = Math.sin(i*12.9898 + 4.1)*43758.5453; x = x - Math.floor(x);
    var y = Math.sin(i*3.233 + 1.7)*1934.31; y = y - Math.floor(y);
    return 0.28 + 0.72*(0.6*x + 0.4*y); }
  var bars = [], cssW=0, cssH=0, dpr=1;
  var ACCENT = (getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#3b82f6');
  function layoutWave(){
    var r = frame.getBoundingClientRect();
    cssW = r.width; cssH = r.height; dpr = Math.min(window.devicePixelRatio||1, 2);
    canvas.width = Math.round(cssW*dpr); canvas.height = Math.round(cssH*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    var gap = 2, bw = 3;
    var N = Math.max(24, Math.floor(cssW/(bw+gap)));
    bars = [];
    for(var i=0;i<N;i++){
      var sec = ((i+0.5)/N)*total;
      bars.push({ x: i*(bw+gap)+3, h: noise(i), key: keyAt(sec) });
    }
    drawWave();
  }
  function drawWave(){
    ctx.clearRect(0,0,cssW,cssH);
    var playX = (state.t/total)*cssW;
    var bw = 3, midY = cssH/2, maxH = cssH*0.82;
    for(var i=0;i<bars.length;i++){
      var b = bars[i], bh = b.h*maxH, y = midY - bh/2;
      var col = SP[b.key].color;
      var played = b.x <= playX;
      ctx.fillStyle = played ? col : hexToRgba(col,.26);
      if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(b.x, y, bw, bh, 1.5); ctx.fill(); }
      else ctx.fillRect(b.x, y, bw, bh);
    }
    // playhead
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.fillRect(playX-1, 4, 2, cssH-8);
    ctx.beginPath(); ctx.arc(playX, 6, 4.2, 0, Math.PI*2);
    ctx.fillStyle = ACCENT;
    ctx.fill();
    frame.setAttribute('aria-valuenow', Math.round((state.t/total)*100));
  }
  function seekToClientX(clientX){
    var r = frame.getBoundingClientRect();
    var p = Math.max(0, Math.min(1, (clientX - r.left)/r.width));
    state.t = p*total; drawWave(); updateClocks();
  }
  frame.addEventListener('pointerdown', function(e){ seekToClientX(e.clientX); frame.setPointerCapture(e.pointerId);
    var mv = function(ev){ seekToClientX(ev.clientX); };
    var up = function(){ frame.removeEventListener('pointermove', mv); frame.removeEventListener('pointerup', up); };
    frame.addEventListener('pointermove', mv); frame.addEventListener('pointerup', up);
  });
  frame.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight'){ state.t=Math.min(total,state.t+5); drawWave(); updateClocks(); e.preventDefault(); }
    if(e.key==='ArrowLeft'){ state.t=Math.max(0,state.t-5); drawWave(); updateClocks(); e.preventDefault(); }
  });

  /* ---------------- ODOMETER ---------------- */
  var odo = $('#odometer'); var reels = [];
  (function buildOdo(){
    var cols = [0,1,':',2,3];
    cols.forEach(function(c){
      if(c===':'){ var s=document.createElement('span'); s.className='od-colon'; s.textContent=':'; odo.appendChild(s); return; }
      var col=document.createElement('span'); col.className='od-col';
      var reel=document.createElement('span'); reel.className='od-reel';
      for(var d=0; d<=9; d++){ var sp=document.createElement('span'); sp.textContent=d; reel.appendChild(sp); }
      col.appendChild(reel); odo.appendChild(col); reels.push({col:col,reel:reel});
    });
  })();
  function setOdo(sec){
    sec = Math.round(sec);
    var m = Math.floor(sec/60), s = sec%60;
    var digits = [Math.floor(m/10), m%10, Math.floor(s/10), s%10];
    reels.forEach(function(r,i){ r.reel.style.transform = 'translateY(-'+digits[i]+'em)'; });
    reels[0].col.classList.toggle('dim', m<10);
  }
  function updateClocks(){
    setOdo(state.t);
    $('#dockClock').innerHTML = '<b>'+D.fmtTs(state.t)+'</b> <i>/</i> <i>'+D.fmtTs(total)+'</i>';
  }

  /* ---------------- PLAYBACK (fake) ---------------- */
  var playBtn = $('#playBtn'), playIcon = $('#playIcon'), lastT = 0;
  var ICON_PLAY = '<path d="M4.5 3.2 12.5 8l-8 4.8z"/>';
  var ICON_PAUSE = '<path d="M4.5 3h2.4v10H4.5zM9.1 3h2.4v10H9.1z"/>';
  function tick(now){
    if(!state.playing) return;
    var dt = (now - lastT)/1000; lastT = now;
    state.t += dt;
    if(state.t >= total){ state.t = total; setPlaying(false); }
    drawWave(); updateClocks();
    if(state.playing) requestAnimationFrame(tick);
  }
  function setPlaying(p){
    state.playing = p;
    playBtn.setAttribute('aria-pressed', p?'true':'false');
    playBtn.setAttribute('aria-label', p?'Pause':'Play');
    playIcon.innerHTML = p?ICON_PAUSE:ICON_PLAY;
    if(p){ if(state.t>=total) state.t=0; lastT = performance.now(); requestAnimationFrame(tick); }
  }
  playBtn.addEventListener('click', function(){ setPlaying(!state.playing); });

  /* ---------------- SEGMENTED TABS ---------------- */
  var seg = $('#seg'), pill = $('.pill', seg);
  var tabBtns = $$('button[role=tab]', seg);
  var order = ['overview','transcript','insights','ask'];
  var current = 'overview';
  function movePill(){
    var idx = order.indexOf(current);
    var w = seg.clientWidth - 8; // minus padding
    var colW = w/4;
    pill.style.width = colW+'px';
    pill.style.transform = 'translateX('+(idx*colW)+'px)';
  }
  function switchTab(name){
    if(order.indexOf(name)<0) return;
    current = name;
    tabBtns.forEach(function(b){ b.setAttribute('aria-selected', b.dataset.tab===name?'true':'false'); });
    movePill();
    $$('.panel').forEach(function(p){
      var on = p.id === 'p-'+name;
      if(on){
        p.classList.add('active');
        if(!REDUCED){ p.classList.remove('in'); p.classList.add('enter'); void p.offsetHeight; p.classList.add('in'); p.classList.remove('enter'); }
      } else { p.classList.remove('active','in'); }
    });
    // (re)trigger animations for the panel
    if(name==='overview') animateTopics();
    if(name==='insights') animateInsights();
    if(name==='transcript') resetHighlight();
  }
  tabBtns.forEach(function(b){ b.addEventListener('click', function(){ switchTab(b.dataset.tab); }); });
  seg.addEventListener('keydown', function(e){
    var i = order.indexOf(current);
    if(e.key==='ArrowRight'){ switchTab(order[Math.min(3,i+1)]); tabBtns[Math.min(3,i+1)].focus(); e.preventDefault(); }
    if(e.key==='ArrowLeft'){ switchTab(order[Math.max(0,i-1)]); tabBtns[Math.max(0,i-1)].focus(); e.preventDefault(); }
  });

  /* ---------------- AVATAR helper ---------------- */
  function avatar(key, cls){
    var s = SP[key];
    return '<span class="who-av '+(cls||'')+'" style="background:'+hexToRgba(s.color,.2)+';color:'+s.color+'" aria-hidden="true">'+s.initials+'</span>';
  }

  /* ---------------- OVERVIEW ---------------- */
  function renderOverview(){
    var S = D.SUMMARY;
    var html = '';
    html += '<div class="reader">';
    html += '<div class="card"><span class="eyebrow">Summary</span><p class="tldr">'+esc(S.tldr)+'</p></div>';
    html += '<div class="grid2">';
    // decisions
    html += '<div class="card"><span class="eyebrow">Decisions</span><ul class="dlist">'+
      S.decisions.map(function(d,i){ return '<li><span class="dnum">'+(i+1)+'</span><span>'+esc(d)+'</span></li>'; }).join('')+
      '</ul></div>';
    // actions
    html += '<div class="card"><span class="eyebrow">Action items</span><ul class="acts">'+
      S.actions.map(function(a){
        return '<li class="act">'+avatar(a.ownerKey)+'<span class="task">'+esc(a.task)+'</span><span class="due">'+esc(a.due)+'</span></li>';
      }).join('')+'</ul></div>';
    html += '</div>'; // grid2
    // topics
    html += '<div class="card" id="topicCard"><span class="eyebrow">Topics by weight</span>'+
      S.topics.map(function(t){ return '<div class="topic"><span class="tl">'+esc(t.label)+'</span><span class="tbar"><i data-w="'+t.weight+'"></i></span></div>'; }).join('')+
      '</div>';
    // email
    html += '<div class="card"><div class="card-head"><span class="eyebrow">Recap email</span>'+
      '<button class="mini-btn" id="copyEmail"><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="5" y="5" width="8" height="9" rx="1.4" stroke="currentColor" stroke-width="1.4"/><path d="M3 10V3.4A1.4 1.4 0 0 1 4.4 2H10" stroke="currentColor" stroke-width="1.4"/></svg>Copy</button></div>'+
      '<div class="email">'+esc(S.email)+'</div></div>';
    html += '</div>'; // reader
    $('#p-overview').innerHTML = html;
    html = '';
    $('#copyEmail').addEventListener('click', function(){ copy(S.email, 'Recap email copied'); });
  }
  var topicsDone = false;
  function animateTopics(){
    $$('#topicCard .tbar i').forEach(function(el){
      if(REDUCED){ el.style.transform='scaleX('+el.dataset.w+')'; return; }
      el.style.transform='scaleX(0)'; requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.style.transform='scaleX('+el.dataset.w+')'; }); });
    });
  }

  /* privacy note appended after overview panel content (subtle) */

  /* ---------------- TRANSCRIPT ---------------- */
  var txListEl, mhl;
  function renderTranscript(){
    var html = '<div class="privacy">'+lockSvg+'<span>Audio never leaves this Mac. Only transcript text is sent to Claude.</span></div>';
    html += '<div class="tx-list" id="txList"><div class="mhl" id="mhl" aria-hidden="true"></div>';
    D.TRANSCRIPT.forEach(function(turn,i){
      var s = SP[turn.s];
      html += '<div class="turn" id="t-'+i+'" data-key="'+turn.s+'" data-i="'+i+'" style="--rl:'+hexToRgba(s.color,.34)+'">'+
        '<button class="ts mono" data-t="'+turn.t+'" data-i="'+i+'" aria-label="Jump to '+D.fmtTs(turn.t)+'">'+D.fmtTs(turn.t)+'</button>'+
        '<div class="turn-main">'+
          '<div class="turn-who">'+avatar(turn.s)+'<span class="nm" data-nm="'+turn.s+'">'+esc(names[turn.s])+'</span></div>'+
          '<div class="turn-text" data-i="'+i+'">'+esc(turn.text)+'</div>'+
        '</div></div>';
    });
    html += '</div>';
    $('#p-transcript').innerHTML = html;
    txListEl = $('#txList'); mhl = $('#mhl');
    // timestamp jump
    $$('.ts', txListEl).forEach(function(b){
      b.addEventListener('click', function(){
        var i = b.dataset.i, t = +b.dataset.t;
        state.t = t; drawWave(); updateClocks();
        jumpTo(i);
      });
    });
    // motion highlight
    if(FINE){
      $$('.turn', txListEl).forEach(function(row){ row.addEventListener('mouseenter', function(){ moveHighlight(row); }); });
      txListEl.addEventListener('mouseleave', function(){ mhl.style.opacity='0'; });
    }
  }
  var hlFirst = true;
  function moveHighlight(row){
    if(REDUCED){ mhl.style.opacity='1'; mhl.style.transition='opacity .15s'; }
    var lr = txListEl.getBoundingClientRect(), rr = row.getBoundingClientRect();
    var x = rr.left - lr.left, y = rr.top - lr.top;
    mhl.style.width = rr.width+'px'; mhl.style.height = rr.height+'px';
    if(hlFirst){ mhl.style.transition='none'; mhl.style.transform='translate('+x+'px,'+y+'px)'; void mhl.offsetHeight;
      mhl.style.transition=''; hlFirst=false; }
    else { mhl.style.transform='translate('+x+'px,'+y+'px)'; }
    mhl.style.opacity='1';
  }
  function resetHighlight(){ hlFirst = true; if(mhl) mhl.style.opacity='0'; }
  function jumpTo(i){
    var el = document.getElementById('t-'+i);
    if(!el) return;
    var flash = function(){ el.classList.add('flash'); setTimeout(function(){ el.classList.remove('flash'); }, 620); };
    if(window.lenisInst){
      window.lenisInst.scrollTo(el, { offset:-120, duration:1.0, easing:function(t){return 1-Math.pow(1-t,3);}, lock:true, onComplete:flash });
    } else {
      el.scrollIntoView({behavior: REDUCED?'auto':'smooth', block:'center'}); setTimeout(flash, 400);
    }
  }

  /* search */
  var searchInput = $('#search'), matchEl = $('#matchCount');
  function reEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
  function applySearch(q){
    q = q.trim();
    if(!txListEl) return;
    var rows = $$('.turn', txListEl), occ = 0, shown = 0;
    var rx = q ? new RegExp('('+reEsc(q)+')','ig') : null;
    rows.forEach(function(row){
      var i = row.dataset.i, textEl = $('.turn-text', row), raw = D.TRANSCRIPT[i].text;
      if(!q){ textEl.innerHTML = esc(raw); row.classList.remove('hide'); shown++; return; }
      if(rx.test(raw)){
        rx.lastIndex = 0;
        var count = (raw.match(rx)||[]).length; occ += count;
        // highlight on escaped text
        textEl.innerHTML = esc(raw).replace(new RegExp('('+reEsc(esc(q))+')','ig'), '<mark>$1</mark>');
        row.classList.remove('hide'); shown++;
      } else {
        textEl.innerHTML = esc(raw); row.classList.add('hide');
      }
    });
    if(!q){ matchEl.textContent=''; matchEl.classList.remove('has'); }
    else { matchEl.textContent = occ+(occ===1?' match':' matches'); matchEl.classList.toggle('has', occ>0); }
    resetHighlight();
  }
  searchInput.addEventListener('input', function(){
    if(current!=='transcript'){ switchTab('transcript'); tabBtns[1].setAttribute('aria-selected','true'); }
    applySearch(this.value);
  });
  searchInput.addEventListener('focus', function(){ if(current!=='transcript') switchTab('transcript'); });

  /* font size */
  var fs = 16;
  function setFs(v){ fs = Math.max(13, Math.min(19, v)); document.documentElement.style.setProperty('--ts', fs+'px'); }
  $('#sizeUp').addEventListener('click', function(){ setFs(fs+1); });
  $('#sizeDown').addEventListener('click', function(){ setFs(fs-1); });

  /* ---------------- INSIGHTS ---------------- */
  function renderInsights(){
    var html = '<div class="reader">';
    html += '<div class="stats">'+ D.INSIGHTS.map(function(s){
      return '<div class="stat"><div class="v" data-val="'+s.value+'">'+s.value+'</div><div class="l">'+esc(s.label)+'</div><div class="s">'+esc(s.sub)+'</div></div>';
    }).join('') +'</div>';
    // speakers
    html += '<div class="card spk-card"><div class="card-head"><span class="eyebrow">Speakers &amp; talk share</span>'+
      '<div class="recluster" id="recluster"><button class="mini-btn" id="rcBtn" aria-haspopup="true" aria-expanded="false">Speakers: <b style="margin-left:4px" id="rcVal">Auto</b>'+
      '<svg class="chev" width="11" height="11" viewBox="0 0 12 12" fill="none" style="margin-left:2px;opacity:.6"><path d="M3 4.5 6 7.5 9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'+
      '<div class="rc-pop"><div class="eyebrow">Re-cluster speakers</div><div class="rc-grid" id="rcGrid">'+
        ['Auto',1,2,3,4,5,6,7,8].map(function(n){ return '<button data-n="'+n+'"'+(n==='Auto'?' class="on"':'')+'>'+n+'</button>'; }).join('')+
      '</div><div class="rc-note">Auto detected 3 voices. Override only if diarization looks off.</div></div></div>'+
      '</div>';
    Object.keys(SP).forEach(function(k){
      var share = D.SHARE[k], secs = D.speakerSeconds(k);
      html += '<div class="spk-row" data-key="'+k+'">'+
        '<div class="spk-id">'+avatar(k,'')+
          '<div><div class="spk-name-wrap"><span class="spk-name" data-nm="'+k+'">'+esc(names[k])+'</span>'+
            '<button class="pencil" data-key="'+k+'" aria-label="Rename '+esc(names[k])+'"><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M11 2.6 13.4 5 5.6 12.8 2.5 13.5l.7-3.1z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button></div>'+
            '<div class="stime mono">'+D.fmtTs(secs)+'</div></div>'+
        '</div>'+
        '<div class="spk-share"><div class="sbar"><i data-w="'+share+'" style="background:'+SP[k].color+'"></i></div><span class="spct mono" data-pct="'+Math.round(share*100)+'">0%</span></div>'+
      '</div>';
    });
    html += '</div></div>';
    $('#p-insights').innerHTML = html;
    wireRecluster();
    wireRename();
  }
  var insDone = false;
  function animateInsights(){
    // stat counters
    $$('#p-insights .stat .v').forEach(function(el){ countTo(el, el.dataset.val); });
    // talk share bars + pct
    $$('#p-insights .sbar i').forEach(function(el){
      if(REDUCED){ el.style.transform='scaleX('+el.dataset.w+')'; return; }
      el.style.transform='scaleX(0)'; requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.style.transform='scaleX('+el.dataset.w+')'; }); });
    });
    $$('#p-insights .spct').forEach(function(el){ countPct(el, +el.dataset.pct); });
  }
  function countTo(el, val){
    // integer or M:SS
    if(/^\d+$/.test(val)){ var target=+val; anim(0,target,900,function(v){ el.textContent=Math.round(v); }); }
    else if(/^\d+:\d\d$/.test(val)){ var parts=val.split(':'); var secs=(+parts[0])*60+(+parts[1]);
      anim(0,secs,1000,function(v){ el.textContent=D.fmtTs(v); }); }
    else el.textContent=val;
  }
  function countPct(el, target){ anim(0,target,900,function(v){ el.textContent=Math.round(v)+'%'; }); }
  function anim(from,to,dur,cb){
    if(REDUCED){ cb(to); return; }
    var start=null;
    function step(ts){ if(!start) start=ts; var p=Math.min(1,(ts-start)/dur); var e=1-Math.pow(1-p,3);
      cb(from+(to-from)*e); if(p<1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  }
  function wireRecluster(){
    var rc = $('#recluster'), btn = $('#rcBtn');
    btn.addEventListener('click', function(e){ e.stopPropagation(); rc.classList.toggle('open'); btn.setAttribute('aria-expanded', rc.classList.contains('open')); });
    $$('#rcGrid button').forEach(function(b){ b.addEventListener('click', function(){
      $$('#rcGrid button').forEach(function(x){ x.classList.remove('on'); }); b.classList.add('on');
      $('#rcVal').textContent = b.dataset.n; rc.classList.remove('open'); btn.setAttribute('aria-expanded','false');
      toast('Re-clustered to '+b.dataset.n+(b.dataset.n==='Auto'?'':' speaker'+(b.dataset.n==='1'?'':'s')));
    }); });
    document.addEventListener('click', function(e){ if(!rc.contains(e.target)) { rc.classList.remove('open'); btn.setAttribute('aria-expanded','false'); } });
  }
  function wireRename(){
    $$('.pencil').forEach(function(p){
      p.addEventListener('click', function(){
        var key = p.dataset.key, wrap = p.closest('.spk-name-wrap');
        var span = $('.spk-name', wrap);
        if($('.name-input', wrap)) return;
        var input = document.createElement('input');
        input.className='name-input'; input.value = names[key]; input.setAttribute('aria-label','Speaker name');
        span.style.display='none'; p.style.visibility='hidden';
        wrap.insertBefore(input, p); input.focus(); input.select();
        var commit = function(){
          var v = input.value.trim() || names[key]; names[key]=v;
          $$('[data-nm="'+key+'"]').forEach(function(n){ n.textContent=v; });
          input.remove(); span.style.display=''; p.style.visibility='';
        };
        input.addEventListener('keydown', function(e){ if(e.key==='Enter'){ commit(); } if(e.key==='Escape'){ input.value=names[key]; commit(); } });
        input.addEventListener('blur', commit);
      });
    });
  }

  /* ---------------- ASK ---------------- */
  function renderAsk(){
    var html = '<div class="ask">';
    D.ASK.forEach(function(m){
      html += '<div class="bubble '+m.role+'"><div class="role">'+(m.role==='user'?'You':'Claude')+'</div>'+esc(m.text)+'</div>';
    });
    html += '<div class="composer"><input type="text" placeholder="Ask about this meeting" aria-label="Ask about this meeting"><span class="demo-tag">Demo</span></div>';
    html += '</div>';
    $('#p-ask').innerHTML = html;
    var inp = $('#p-ask .composer input');
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter' && this.value.trim()){ toast('Ask is not connected in this demo'); this.value=''; } });
  }

  /* ---------------- ACTIONS MENU ---------------- */
  var am = $('#actionsMenu'), amBtn = $('#actionsBtn');
  var amOpen=false, hoverTimer;
  function amSet(o){ amOpen=o; am.classList.toggle('open',o); amBtn.setAttribute('aria-expanded',o); }
  amBtn.addEventListener('click', function(e){ e.stopPropagation(); amSet(!amOpen); });
  if(FINE){
    am.addEventListener('mouseenter', function(){ clearTimeout(hoverTimer); amSet(true); });
    am.addEventListener('mouseleave', function(){ hoverTimer=setTimeout(function(){ amSet(false); }, 140); });
  }
  document.addEventListener('click', function(e){ if(!am.contains(e.target)) amSet(false); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') amSet(false); });
  function transcriptText(){ return D.TRANSCRIPT.map(function(t){ return '['+D.fmtTs(t.t)+'] '+names[t.s]+': '+t.text; }).join('\n\n'); }
  function transcriptMd(){ return '# '+MEET.title+'\n\n'+D.TRANSCRIPT.map(function(t){ return '**'+names[t.s]+'** `'+D.fmtTs(t.t)+'`\n\n'+t.text; }).join('\n\n'); }
  $$('.pop-item', am).forEach(function(b){ b.addEventListener('click', function(){
    var a = b.dataset.act; amSet(false);
    if(a==='copy') copy(transcriptText(),'Transcript copied');
    else if(a==='md') copy(transcriptMd(),'Copied as Markdown');
    else if(a==='txt') download(MEET.title.replace(/\s+/g,'-').toLowerCase()+'.txt', transcriptText());
    else if(a==='tidy') toast('Transcript tidied');
    else if(a==='sync') toast('Synced to phone');
    else if(a==='finder') toast('Reveal in Finder is off in the demo');
    else if(a==='undo') toast('Reverted last tidy');
    else if(a==='reprocess') toast('Reprocessing audio');
    else if(a==='delete') toast('Delete is off in the demo');
  }); });

  /* ---------------- SUMMARY: magnetic + ripple ---------------- */
  var summ = $('#summaryBtn'), summInner = $('span', summ);
  summ.addEventListener('click', function(e){
    // ripple
    if(!REDUCED){
      var r = summ.getBoundingClientRect(), rp = document.createElement('span'); rp.className='rp';
      var d = Math.max(r.width, r.height)*2.2;
      rp.style.width=rp.style.height=d+'px'; rp.style.left=(e.clientX-r.left-d/2)+'px'; rp.style.top=(e.clientY-r.top-d/2)+'px';
      summ.appendChild(rp);
      rp.animate([{transform:'scale(0)',opacity:.55},{transform:'scale(1)',opacity:0}],{duration:600,easing:'cubic-bezier(.22,1,.32,1)'}).onfinish=function(){ rp.remove(); };
    }
    switchTab('overview'); tabBtns[0].focus();
    if(window.lenisInst) window.lenisInst.scrollTo(0,{duration:.9}); else window.scrollTo({top:0,behavior:REDUCED?'auto':'smooth'});
  });
  if(FINE && !REDUCED){
    var cx=0, cy=0, tx=0, ty=0, raf=null;
    summ.addEventListener('pointermove', function(e){
      var r = summ.getBoundingClientRect(), mx=r.left+r.width/2, my=r.top+r.height/2;
      var dx=e.clientX-mx, dy=e.clientY-my, dist=Math.hypot(dx,dy), range=90;
      var f = Math.max(0, (1-dist/range))*0.4;
      tx = dx*f; ty = dy*f; if(!raf) loop();
    });
    summ.addEventListener('pointerleave', function(){ tx=0; ty=0; if(!raf) loop(); });
    function loop(){ cx += (tx-cx)*0.15; cy += (ty-cy)*0.15;
      summ.style.transform = 'translate('+cx.toFixed(2)+'px,'+cy.toFixed(2)+'px)';
      if(Math.abs(cx-tx)>0.1 || Math.abs(cy-ty)>0.1){ raf=requestAnimationFrame(loop); } else { summ.style.transform='translate('+tx+'px,'+ty+'px)'; raf=null; } }
  }

  /* ---------------- TRACK TOGGLES ---------------- */
  $$('.tracks button').forEach(function(b){ b.addEventListener('click', function(){
    $$('.tracks button').forEach(function(x){ x.classList.remove('on'); x.setAttribute('aria-pressed','false'); });
    b.classList.add('on'); b.setAttribute('aria-pressed','true');
  }); });

  /* ---------------- TOAST / COPY / DOWNLOAD ---------------- */
  var toastEl = $('#toast'), toastMsg = $('#toastMsg'), toastTimer;
  function toast(msg){ toastMsg.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(function(){ toastEl.classList.remove('show'); }, 2100); }
  function copy(text, msg){
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ toast(msg); }, function(){ toast('Copy blocked by browser'); }); }
    else toast('Copy not available');
  }
  function download(name, text){
    try{ var blob = new Blob([text], {type:'text/plain'}); var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000); toast('Saved '+name); }
    catch(e){ toast('Save not available'); }
  }

  /* ---------------- LENIS ---------------- */
  if(window.Lenis && !REDUCED){
    var lenis = new Lenis({ duration:1.1, smoothWheel:true });
    window.lenisInst = lenis;
    function raf(t){ lenis.raf(t); requestAnimationFrame(raf); }
    requestAnimationFrame(raf);
  }

  /* ---------------- INIT ---------------- */
  renderOverview();
  renderTranscript();
  renderInsights();
  renderAsk();
  layoutWave();
  updateClocks();
  setFs(16);
  // initial pill + first-panel anims
  requestAnimationFrame(function(){ movePill(); animateTopics(); });

  var rz;
  window.addEventListener('resize', function(){ clearTimeout(rz); rz=setTimeout(function(){ layoutWave(); movePill(); resetHighlight(); }, 120); });
  // fonts can shift metrics
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(function(){ movePill(); layoutWave(); }); }
})();
</script>
