<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MeetingScribe — Aurora</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ============ tokens ============ */
@property --angle { syntax:'<angle>'; initial-value:0deg; inherits:false; }

:root{
  --bg:#0a0a12;
  --panel:rgba(255,255,255,.03);
  --panel-2:rgba(255,255,255,.055);
  --hair:rgba(255,255,255,.08);
  --hair-lit:rgba(255,255,255,.14);
  --text:#e7e9f2;
  --dim:rgba(231,233,242,.62);
  --faint:rgba(231,233,242,.40);
  --ghost:rgba(231,233,242,.26);
  --aqua:#5eead4;
  --aqua-2:#7dd3fc;
  --v-blue:#3b82f6; --v-blue2:#60a5fa; --v-lav:#a5b4fc; --v-vio:#c4b5fd;
  --ts-size:16px;

  --ease-out:cubic-bezier(0.22,1,0.32,1);
  --ease-in-out:cubic-bezier(0.77,0,0.175,1);
  --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --ease:cubic-bezier(0.4,0,0.2,1);

  --r-lg:20px; --r-md:14px; --r-sm:10px;
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Hanken Grotesk",system-ui,sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
input{ font:inherit; }
::selection{ background:rgba(94,234,212,.24); color:#fff; }

:focus-visible{ outline:2px solid var(--aqua); outline-offset:2px; border-radius:6px; }

.sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* ============ aurora background ============ */
.bg{ position:fixed; inset:0; z-index:-2; background:var(--bg); overflow:hidden; }
.bg .blob{ position:absolute; border-radius:50%; filter:blur(80px); opacity:.5; mix-blend-mode:screen; will-change:transform; }
.b1{ width:56vw; height:56vw; left:-12vw; top:-22vw; background:radial-gradient(circle at 40% 40%, var(--v-blue), transparent 62%); animation:drift1 62s var(--ease-in-out) infinite; }
.b2{ width:48vw; height:48vw; right:-10vw; top:-16vw; background:radial-gradient(circle at 50% 50%, var(--v-lav), transparent 60%); opacity:.42; animation:drift2 74s var(--ease-in-out) infinite; }
.b3{ width:52vw; height:52vw; left:18vw; top:-6vw; background:radial-gradient(circle at 50% 50%, var(--v-vio), transparent 60%); opacity:.32; animation:drift3 88s var(--ease-in-out) infinite; }
.b4{ width:40vw; height:40vw; right:6vw; top:2vw; background:radial-gradient(circle at 50% 50%, var(--aqua), transparent 64%); opacity:.16; animation:drift1 96s var(--ease-in-out) infinite reverse; }
/* aurora is concentrated toward the top so the reading surface stays calm */
.bg::after{ content:""; position:absolute; inset:0; background:linear-gradient(to bottom, transparent 0%, rgba(10,10,18,.55) 46%, var(--bg) 78%); }
#particles{ position:absolute; inset:0; width:100%; height:100%; z-index:1; opacity:.6; }

@keyframes drift1{ 0%,100%{ transform:translate3d(0,0,0) scale(1);} 50%{ transform:translate3d(6vw,4vw,0) scale(1.12);} }
@keyframes drift2{ 0%,100%{ transform:translate3d(0,0,0) scale(1.05);} 50%{ transform:translate3d(-5vw,5vw,0) scale(.94);} }
@keyframes drift3{ 0%,100%{ transform:translate3d(0,0,0) scale(1);} 50%{ transform:translate3d(3vw,-3vw,0) scale(1.1);} }

/* ============ shell ============ */
.app{
  width:min(1140px,100%); margin-inline:auto; height:100dvh;
  display:flex; flex-direction:column;
  padding:0 clamp(14px,3vw,30px);
}

/* ============ hero ============ */
.hero{ padding:26px 4px 16px; flex:0 0 auto; }
.hero-top{ display:flex; align-items:flex-start; gap:20px; }
.title-wrap{ flex:1 1 auto; min-width:0; }
.eyebrow{ font-size:10.5px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); }
h1#title{
  margin:6px 0 0; font-family:"Bricolage Grotesque",sans-serif;
  font-weight:700; font-size:clamp(29px,4.2vw,46px); line-height:1.04; letter-spacing:-.02em;
  color:#dfe2ee; outline:none; max-width:20ch;
  background:linear-gradient(105deg,#c9cde0 0%,#c9cde0 38%,#ffffff 50%,#c9cde0 62%,#c9cde0 100%);
  background-size:230% 100%;
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  caret-color:var(--aqua);
  animation:shimmer 5.5s linear infinite;
}
h1#title:focus-visible{ outline:2px solid var(--aqua); outline-offset:6px; }
@keyframes shimmer{ to{ background-position:-230% 0; } }

.meta{ display:flex; flex-wrap:wrap; gap:8px 8px; margin-top:14px; }
.chip{
  display:inline-flex; align-items:center; gap:6px;
  font-size:12px; color:var(--dim);
  padding:4px 10px; border-radius:999px;
  background:rgba(255,255,255,.025); border:1px solid var(--hair);
}
.chip .dot{ width:5px; height:5px; border-radius:50%; background:var(--aqua); box-shadow:0 0 8px rgba(94,234,212,.6); }
.chip.mono{ font-family:"JetBrains Mono",monospace; font-size:11.5px; letter-spacing:-.02em; }

.hero-actions{ flex:0 0 auto; display:flex; align-items:center; gap:10px; padding-top:6px; }

/* primary summary button w/ border-beam + single glow signature */
.btn-primary{
  position:relative; display:inline-flex; align-items:center; gap:8px;
  padding:11px 18px; border-radius:12px; font-weight:600; font-size:14px;
  color:#04211c; background:linear-gradient(180deg,#7ff0dd,#4fd8c2);
  box-shadow:0 0 20px rgba(94,234,212,.28);
  transition:transform .14s var(--ease-out), box-shadow .3s var(--ease);
  isolation:isolate; overflow:hidden;
}
.btn-primary:hover{ box-shadow:0 0 24px rgba(94,234,212,.42); }
.btn-primary:active{ transform:scale(.97); }
.btn-primary svg{ width:15px; height:15px; }
.beam::after{
  content:""; position:absolute; inset:0; border-radius:inherit; padding:1.5px;
  background:conic-gradient(from var(--angle), transparent 0 68%, var(--aqua) 80%, #d6fff6 88%, var(--aqua-2) 94%, transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  animation:spin 7s linear infinite; pointer-events:none; z-index:2;
}
@keyframes spin{ to{ --angle:360deg; } }

/* ============ speaker constellation ============ */
.const-head{ display:flex; align-items:center; gap:12px; margin:18px 0 10px; }
.const-head .eyebrow{ line-height:1; }
.recluster{
  position:relative; margin-left:auto;
}
.recluster-btn{
  display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--dim);
  padding:5px 10px; border-radius:999px; border:1px solid var(--hair); background:rgba(255,255,255,.02);
  transition:transform .14s var(--ease-out), border-color .25s var(--ease), color .25s var(--ease);
}
.recluster-btn:hover{ color:var(--text); border-color:var(--hair-lit); }
.recluster-btn:active{ transform:scale(.97); }
.recluster-btn .caret{ width:8px; height:8px; opacity:.6; }

.constellation{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.sp-card{
  position:relative; overflow:hidden; border-radius:16px;
  padding:14px 16px; border:1px solid var(--hair);
  background:var(--panel); backdrop-filter:blur(14px);
  transition:transform .18s var(--ease-out), border-color .3s var(--ease);
}
.sp-card::before{
  content:""; position:absolute; inset:0; border-radius:inherit; opacity:0;
  background:radial-gradient(300px circle at var(--x,50%) var(--y,0%), color-mix(in srgb, var(--sp) 22%, transparent), transparent 46%);
  transition:opacity .4s var(--ease); pointer-events:none;
}
.sp-card:hover{ border-color:var(--hair-lit); }
.sp-card:hover::before{ opacity:1; }
.sp-top{ display:flex; align-items:center; gap:11px; position:relative; }
.avatar{
  flex:0 0 auto; width:38px; height:38px; border-radius:50%;
  display:grid; place-items:center; font-weight:700; font-size:13px; color:#fff;
  font-family:"Hanken Grotesk"; letter-spacing:.02em;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14), 0 4px 12px rgba(0,0,0,.3);
}
.sp-id{ min-width:0; display:flex; align-items:center; gap:6px; }
.sp-name{ font-weight:600; font-size:14.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.name-input{ background:rgba(0,0,0,.3); border:1px solid var(--aqua); border-radius:6px; color:#fff; padding:2px 6px; font-size:14px; width:110px; }
.pencil{ display:grid; place-items:center; width:22px; height:22px; border-radius:6px; color:var(--ghost); transition:color .2s var(--ease), background .2s var(--ease); flex:0 0 auto; }
.pencil:hover{ color:var(--aqua); background:rgba(255,255,255,.05); }
.pencil svg{ width:13px; height:13px; }
.sp-stat{ display:flex; align-items:baseline; gap:8px; margin-top:12px; position:relative; }
.sp-pct{ font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:26px; line-height:1; letter-spacing:-.02em; color:var(--text); font-variant-numeric:tabular-nums; }
.sp-pct .u{ font-size:15px; color:var(--dim); margin-left:1px; }
.sp-sub{ font-size:11.5px; color:var(--faint); margin-left:auto; font-family:"JetBrains Mono",monospace; }
.sp-bar{ position:absolute; left:0; right:0; bottom:-6px; height:2px; border-radius:2px; background:rgba(255,255,255,.06); overflow:hidden; }
.sp-bar > i{ display:block; height:100%; width:0; border-radius:2px; background:var(--sp); box-shadow:0 0 8px color-mix(in srgb,var(--sp) 60%, transparent); transition:width 1.1s var(--ease-out); }

/* ============ glass toolbar ============ */
.toolbar{
  flex:0 0 auto; display:flex; align-items:center; gap:12px;
  margin-top:16px; padding:8px 10px; border-radius:16px;
  background:rgba(12,12,20,.55); backdrop-filter:blur(18px);
  border:1px solid var(--hair); border-top-color:var(--hair-lit);
  box-shadow:0 10px 30px rgba(0,0,0,.34);
}
.tabs{ position:relative; display:flex; gap:2px; padding:3px; border-radius:12px; background:rgba(255,255,255,.03); }
.tabs .pill{ position:absolute; top:3px; left:0; height:calc(100% - 6px); border-radius:9px; background:rgba(94,234,212,.14); box-shadow:0 0 16px rgba(94,234,212,.18), inset 0 0 0 1px rgba(94,234,212,.28); z-index:0; transition:transform .28s var(--ease-out), width .28s var(--ease-out); }
.tab{ position:relative; z-index:1; padding:7px 15px; font-size:13px; font-weight:500; color:var(--dim); border-radius:9px; transition:color .25s var(--ease), transform .14s var(--ease-out); white-space:nowrap; }
.tab[aria-selected="true"]{ color:#eafffb; }
.tab:active{ transform:scale(.97); }

.tool-right{ margin-left:auto; display:flex; align-items:center; gap:8px; }

.search-wrap{ position:relative; display:flex; align-items:center; }
.search-ico{ position:absolute; left:10px; width:14px; height:14px; color:var(--faint); pointer-events:none; }
#search{
  width:150px; padding:8px 10px 8px 30px; border-radius:10px;
  background:rgba(255,255,255,.035); border:1px solid var(--hair); color:var(--text);
  transition:width .22s var(--ease-out), border-color .25s var(--ease), background .25s var(--ease);
}
#search::placeholder{ color:var(--faint); }
#search:focus{ width:220px; outline:none; border-color:rgba(94,234,212,.55); background:rgba(94,234,212,.05); box-shadow:0 0 0 3px rgba(94,234,212,.1); }
.match-count{ font-size:11px; color:var(--aqua); font-family:"JetBrains Mono",monospace; min-width:0; white-space:nowrap; opacity:0; transition:opacity .2s var(--ease); }
.match-count.on{ opacity:1; }

.aa{ display:flex; align-items:center; gap:1px; padding:2px; border-radius:10px; background:rgba(255,255,255,.03); border:1px solid var(--hair); }
.aa button{ width:28px; height:26px; border-radius:8px; color:var(--dim); display:grid; place-items:center; transition:background .2s var(--ease), color .2s var(--ease), transform .14s var(--ease-out); }
.aa button:hover{ background:rgba(255,255,255,.06); color:var(--text); }
.aa button:active{ transform:scale(.94); }
.aa .a-sm{ font-size:11px; font-weight:600; } .aa .a-lg{ font-size:15px; font-weight:600; }

.icon-btn{ width:32px; height:32px; border-radius:10px; display:grid; place-items:center; color:var(--dim); border:1px solid transparent; transition:background .2s var(--ease), color .2s var(--ease), transform .14s var(--ease-out); }
.icon-btn:hover{ background:rgba(255,255,255,.06); color:var(--text); }
.icon-btn:active{ transform:scale(.95); }
.icon-btn svg{ width:16px; height:16px; }

/* tooltip */
.tip{ position:relative; }
.tip .tip-body{
  position:absolute; top:calc(100% + 8px); right:0; z-index:40;
  width:210px; padding:9px 11px; border-radius:10px; font-size:11.5px; line-height:1.45; color:var(--dim);
  background:rgba(16,16,26,.92); backdrop-filter:blur(12px); border:1px solid var(--hair-lit);
  box-shadow:0 12px 30px rgba(0,0,0,.4);
  opacity:0; transform:translateY(-4px) scale(.98); transform-origin:top right; pointer-events:none;
  transition:opacity .18s var(--ease-out), transform .18s var(--ease-out);
}
.tip .tip-body b{ color:var(--aqua); font-weight:600; }
.tip:hover .tip-body, .tip:focus-within .tip-body{ opacity:1; transform:translateY(0) scale(1); }

/* menus */
.menu-wrap{ position:relative; }
.menu{
  position:absolute; top:calc(100% + 8px); right:0; z-index:50; min-width:190px;
  padding:6px; border-radius:12px; background:rgba(16,16,26,.94); backdrop-filter:blur(16px);
  border:1px solid var(--hair-lit); box-shadow:0 16px 40px rgba(0,0,0,.5);
  opacity:0; transform:translateY(-6px) scale(.96); transform-origin:top right; pointer-events:none;
  transition:opacity .18s var(--ease-out), transform .18s var(--ease-out);
}
.menu-wrap.open .menu{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
.menu .m-lbl{ font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); padding:8px 10px 4px; }
.menu button{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:8px 10px; border-radius:8px; font-size:13px; color:var(--dim); transition:background .16s var(--ease), color .16s var(--ease); }
.menu button:hover{ background:rgba(255,255,255,.06); color:var(--text); }
.menu button.danger:hover{ background:rgba(244,120,120,.12); color:#ffb3b3; }
.menu button svg{ width:14px; height:14px; opacity:.8; flex:0 0 auto; }
.menu .sep{ height:1px; background:var(--hair); margin:5px 6px; }

/* recluster popover */
.rc-pop{
  position:absolute; top:calc(100% + 8px); right:0; z-index:50; width:196px;
  padding:12px; border-radius:12px; background:rgba(16,16,26,.94); backdrop-filter:blur(16px);
  border:1px solid var(--hair-lit); box-shadow:0 16px 40px rgba(0,0,0,.5);
  opacity:0; transform:translateY(-6px) scale(.96); transform-origin:top right; pointer-events:none;
  transition:opacity .18s var(--ease-out), transform .18s var(--ease-out);
}
.recluster.open .rc-pop{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
.rc-pop .m-lbl{ font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }
.rc-pop p{ margin:2px 0 10px; font-size:11px; color:var(--faint); line-height:1.4; }
.rc-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.rc-grid button{ padding:7px 0; border-radius:8px; font-size:12.5px; color:var(--dim); background:rgba(255,255,255,.03); border:1px solid var(--hair); transition:all .16s var(--ease); }
.rc-grid button.wide{ grid-column:span 3; }
.rc-grid button:hover{ border-color:var(--hair-lit); color:var(--text); }
.rc-grid button.sel{ background:rgba(94,234,212,.14); border-color:rgba(94,234,212,.5); color:#eafffb; }

/* ============ stage / panels ============ */
.stage{ position:relative; flex:1 1 auto; min-height:0; margin-top:14px; }
.panel{
  position:absolute; inset:0; opacity:0; transform:translateY(8px);
  visibility:hidden; pointer-events:none;
  transition:opacity .26s var(--ease-out), transform .26s var(--ease-out);
}
.panel.active{ opacity:1; transform:none; visibility:visible; pointer-events:auto; }
.scroll{ height:100%; overflow-y:auto; overflow-x:hidden; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.14) transparent; }
.scroll::-webkit-scrollbar{ width:9px; } .scroll::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.12); border-radius:9px; border:2px solid transparent; background-clip:padding-box; }

/* ---- transcript ---- */
#panel-transcript{ }
.tx-scroll{ position:relative; height:100%; overflow-y:auto; overflow-x:hidden; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.14) transparent; }
.tx-scroll::-webkit-scrollbar{ width:9px; } .tx-scroll::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.12); border-radius:9px; border:2px solid transparent; background-clip:padding-box; }
.tx-inner{ max-width:730px; margin:0 auto; padding:34px 6px 140px; }
.tx-fade{ position:absolute; left:0; right:0; z-index:4; pointer-events:none; }
.tx-fade.top{ top:0; height:52px; background:linear-gradient(to bottom, rgba(10,10,18,.85), transparent); -webkit-mask:linear-gradient(to bottom,#000 40%,transparent); mask:linear-gradient(to bottom,#000 40%,transparent); backdrop-filter:blur(3px); }
.tx-fade.bot{ bottom:0; height:110px; background:linear-gradient(to top, rgba(10,10,18,.9) 12%, transparent); -webkit-mask:linear-gradient(to top,#000 42%,transparent); mask:linear-gradient(to top,#000 42%,transparent); backdrop-filter:blur(4px); }

.turn{
  position:relative; display:grid; grid-template-columns:46px minmax(0,1fr); column-gap:14px;
  padding:9px 14px; border-radius:var(--r-md);
  transition:background .35s var(--ease), box-shadow .35s var(--ease);
}
.turn.change{ margin-top:16px; }
.turn.cont{ margin-top:2px; }
.gutter{ position:relative; }
.gutter::after{ content:""; position:absolute; left:18px; top:-8px; bottom:-9px; width:1px; background:rgba(255,255,255,.05); }
.turn:first-child .gutter::after{ top:14px; }
.gutter .avatar{ position:relative; z-index:1; }
.gutter .tick{ position:absolute; left:14px; top:6px; width:9px; height:9px; border-radius:50%; background:var(--bg); box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--sp) 55%, #2a2a38); z-index:1; }
.tmeta{ display:flex; align-items:baseline; gap:10px; margin-bottom:3px; }
.tname{ font-weight:600; font-size:14px; color:var(--sp); letter-spacing:-.01em; }
.ts{ font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--faint); letter-spacing:-.03em; transition:color .18s var(--ease); border-radius:5px; padding:1px 3px; }
.ts:hover{ color:var(--aqua); background:rgba(94,234,212,.08); }
.ts.cont-ts{ display:inline-block; margin-bottom:3px; }
.ttext{ font-size:var(--ts-size); line-height:1.62; color:rgba(231,233,242,.9); max-width:64ch; }
.ttext mark{ background:rgba(94,234,212,.22); color:#eafffb; border-radius:3px; padding:0 1px; box-shadow:0 0 0 1px rgba(94,234,212,.25); }
.turn.dim{ opacity:.32; }
.turn.reveal{ opacity:0; transform:translateY(10px); filter:blur(6px); transition:opacity .5s var(--ease-out), transform .5s var(--ease-out), filter .5s var(--ease-out); }
.turn.reveal.in{ opacity:1; transform:none; filter:none; }
.turn.playing{ background:rgba(94,234,212,.055); box-shadow:0 0 22px rgba(94,234,212,.10); }
.turn.playing::after{
  content:""; position:absolute; inset:0; border-radius:inherit; padding:1.4px;
  background:conic-gradient(from var(--angle), transparent 0 66%, var(--aqua) 80%, #d6fff6 88%, var(--aqua-2) 95%, transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  animation:spin 6.5s linear infinite; pointer-events:none;
}
.turn.flash{ background:rgba(94,234,212,.1); box-shadow:0 0 26px rgba(94,234,212,.16); }

/* ---- overview ---- */
.ov{ max-width:900px; margin:0 auto; padding:8px 6px 60px; }
.ov-lede{ font-family:"Bricolage Grotesque",sans-serif; font-weight:400; font-size:clamp(17px,2.1vw,21px); line-height:1.5; letter-spacing:-.01em; color:#eceef6; max-width:62ch; }
.ov-lede b{ color:#fff; font-weight:600; }
.ov-grid{ display:grid; grid-template-columns:1.15fr .85fr; gap:16px; margin-top:26px; }
@media (max-width:820px){ .ov-grid{ grid-template-columns:1fr; } }
.card{ border:1px solid var(--hair); background:var(--panel); backdrop-filter:blur(14px); border-radius:var(--r-lg); padding:18px 20px; }
.card h3{ font-family:"Bricolage Grotesque",sans-serif; font-weight:600; font-size:15px; margin:0 0 14px; letter-spacing:-.01em; }
.card h3 .n{ color:var(--aqua); font-family:"JetBrains Mono",monospace; font-size:12px; margin-left:6px; }
.dlist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; }
.dlist li{ display:grid; grid-template-columns:20px 1fr; gap:10px; font-size:14px; line-height:1.5; color:rgba(231,233,242,.86); }
.dlist .mk{ width:18px; height:18px; border-radius:6px; display:grid; place-items:center; background:rgba(94,234,212,.12); color:var(--aqua); margin-top:1px; }
.dlist .mk svg{ width:11px; height:11px; }
.actions-list{ display:flex; flex-direction:column; gap:10px; }
.act{ display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:12px; background:rgba(255,255,255,.025); border:1px solid var(--hair); }
.act .who{ width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:10px; font-weight:700; color:#fff; flex:0 0 auto; box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); }
.act .task{ flex:1 1 auto; font-size:13px; color:rgba(231,233,242,.88); line-height:1.35; }
.act .due{ font-size:11px; font-family:"JetBrains Mono",monospace; color:var(--aqua); background:rgba(94,234,212,.1); padding:3px 8px; border-radius:999px; white-space:nowrap; }
.topics{ display:flex; flex-wrap:wrap; gap:8px; }
.topic{ display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--dim); padding:6px 12px; border-radius:999px; border:1px solid var(--hair); background:rgba(255,255,255,.02); }
.topic .tw{ width:5px; height:5px; border-radius:50%; background:var(--v-lav); }
.email-card{ margin-top:16px; }
.email-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.email-body{ font-size:13px; line-height:1.62; color:rgba(231,233,242,.78); white-space:pre-wrap; font-family:"Hanken Grotesk"; }
.btn-ghost{ display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--dim); padding:6px 12px; border-radius:9px; border:1px solid var(--hair); background:rgba(255,255,255,.02); transition:all .18s var(--ease); }
.btn-ghost:hover{ color:var(--text); border-color:var(--hair-lit); background:rgba(255,255,255,.05); }
.btn-ghost:active{ transform:scale(.97); }
.btn-ghost svg{ width:13px; height:13px; }

/* ---- insights ---- */
.ins{ max-width:900px; margin:0 auto; padding:8px 6px 60px; }
.ins-metrics{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
@media (max-width:820px){ .ins-metrics{ grid-template-columns:repeat(2,1fr); } }
.metric{ border:1px solid var(--hair); background:var(--panel); backdrop-filter:blur(14px); border-radius:var(--r-lg); padding:18px; }
.metric .mlabel{ font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }
.metric .mval{ font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:clamp(30px,3.4vw,40px); line-height:1; letter-spacing:-.02em; margin:12px 0 6px; color:var(--text); font-variant-numeric:tabular-nums; }
.metric .msub{ font-size:12px; color:var(--dim); }
.ins-speakers{ margin-top:20px; border:1px solid var(--hair); background:var(--panel); backdrop-filter:blur(14px); border-radius:var(--r-lg); padding:20px 22px; }
.ins-speakers h3{ font-family:"Bricolage Grotesque",sans-serif; font-weight:600; font-size:15px; margin:0 0 16px; }
.spk-row{ display:grid; grid-template-columns:150px 1fr 62px; align-items:center; gap:14px; padding:11px 0; border-top:1px solid var(--hair); }
.spk-row:first-of-type{ border-top:none; }
.spk-who{ display:flex; align-items:center; gap:10px; min-width:0; }
.spk-who .avatar{ width:30px; height:30px; font-size:11px; }
.spk-who span{ font-size:13.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.spk-track{ height:8px; border-radius:6px; background:rgba(255,255,255,.05); overflow:hidden; }
.spk-track > i{ display:block; height:100%; width:0; border-radius:6px; background:var(--sp); box-shadow:0 0 10px color-mix(in srgb,var(--sp) 50%, transparent); transition:width 1s var(--ease-out); }
.spk-num{ text-align:right; font-family:"JetBrains Mono",monospace; font-size:13px; color:var(--dim); }
.spk-num b{ color:var(--text); font-weight:500; }
.spk-time{ font-size:11px; color:var(--faint); }

/* ---- ask ---- */
.ask{ max-width:760px; margin:0 auto; height:100%; display:flex; flex-direction:column; }
.ask-thread{ flex:1 1 auto; overflow-y:auto; padding:12px 6px 20px; display:flex; flex-direction:column; gap:16px; scrollbar-width:thin; }
.msg{ display:flex; gap:11px; max-width:82%; }
.msg .mav{ width:28px; height:28px; border-radius:9px; display:grid; place-items:center; flex:0 0 auto; font-size:11px; font-weight:700; }
.msg .mbody{ padding:12px 15px; border-radius:14px; font-size:14px; line-height:1.55; }
.msg.user{ align-self:flex-end; flex-direction:row-reverse; }
.msg.user .mav{ background:linear-gradient(180deg,#5b8cff,#4a74e0); color:#fff; }
.msg.user .mbody{ background:rgba(94,234,212,.1); border:1px solid rgba(94,234,212,.22); color:#eafffb; border-bottom-right-radius:5px; }
.msg.bot .mav{ background:rgba(255,255,255,.06); color:var(--aqua); box-shadow:inset 0 0 0 1px var(--hair); }
.msg.bot .mbody{ background:var(--panel-2); border:1px solid var(--hair); color:rgba(231,233,242,.9); border-bottom-left-radius:5px; }
.ask-input{ flex:0 0 auto; display:flex; gap:9px; padding:10px 6px 6px; }
.ask-input input{ flex:1; padding:12px 15px; border-radius:12px; background:rgba(255,255,255,.04); border:1px solid var(--hair); color:var(--text); transition:border-color .2s var(--ease), background .2s var(--ease); }
.ask-input input:focus{ outline:none; border-color:rgba(94,234,212,.5); background:rgba(94,234,212,.05); }
.ask-input input::placeholder{ color:var(--faint); }
.ask-send{ width:44px; border-radius:12px; background:linear-gradient(180deg,#7ff0dd,#4fd8c2); color:#04211c; display:grid; place-items:center; transition:transform .14s var(--ease-out), box-shadow .25s var(--ease); box-shadow:0 0 16px rgba(94,234,212,.24); }
.ask-send:hover{ box-shadow:0 0 20px rgba(94,234,212,.36); } .ask-send:active{ transform:scale(.95); }
.ask-send svg{ width:17px; height:17px; }

/* ============ transport ============ */
.transport{
  flex:0 0 auto; display:flex; align-items:center; gap:16px;
  margin:8px 0 14px; padding:10px 14px; border-radius:16px;
  background:rgba(12,12,20,.6); backdrop-filter:blur(18px);
  border:1px solid var(--hair); border-top-color:var(--hair-lit);
  box-shadow:0 10px 30px rgba(0,0,0,.36);
}
.play-btn{ flex:0 0 auto; width:42px; height:42px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(180deg,#7ff0dd,#4fd8c2); color:#04211c; box-shadow:0 0 18px rgba(94,234,212,.3); transition:transform .14s var(--ease-out), box-shadow .25s var(--ease); }
.play-btn:hover{ box-shadow:0 0 22px rgba(94,234,212,.44); } .play-btn:active{ transform:scale(.94); }
.play-btn svg{ width:17px; height:17px; }
.clock{ flex:0 0 auto; font-family:"JetBrains Mono",monospace; font-size:13px; letter-spacing:-.02em; color:var(--dim); white-space:nowrap; }
.clock b{ color:var(--text); font-weight:500; }
.wave-wrap{ flex:1 1 auto; min-width:0; height:44px; position:relative; }
#wave{ width:100%; height:100%; display:block; cursor:pointer; border-radius:8px; }
.tracks{ flex:0 0 auto; display:flex; gap:2px; padding:2px; border-radius:10px; background:rgba(255,255,255,.03); border:1px solid var(--hair); }
.tracks button{ padding:6px 11px; border-radius:8px; font-size:11.5px; color:var(--faint); transition:color .2s var(--ease), background .2s var(--ease); white-space:nowrap; }
.tracks button:hover{ color:var(--dim); }
.tracks button.on{ color:#eafffb; background:rgba(94,234,212,.13); box-shadow:inset 0 0 0 1px rgba(94,234,212,.24); }

/* ============ toasts ============ */
#toasts{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
.toast{ padding:10px 16px; border-radius:11px; background:rgba(16,16,26,.94); backdrop-filter:blur(14px); border:1px solid var(--hair-lit); font-size:13px; color:var(--text); box-shadow:0 14px 34px rgba(0,0,0,.46); display:flex; align-items:center; gap:9px; opacity:0; transform:translateY(10px) scale(.97); transition:opacity .24s var(--ease-out), transform .24s var(--ease-out); }
.toast.in{ opacity:1; transform:none; }
.toast .dot{ width:6px; height:6px; border-radius:50%; background:var(--aqua); box-shadow:0 0 8px rgba(94,234,212,.7); }

/* ============ responsive ============ */
@media (max-width:760px){
  .hero-top{ flex-direction:column; gap:14px; }
  .hero-actions{ padding-top:0; }
  .constellation{ grid-template-columns:1fr; }
  .toolbar{ flex-wrap:wrap; }
  .tool-right{ width:100%; margin-left:0; justify-content:flex-start; flex-wrap:wrap; }
  #search{ width:130px; } #search:focus{ width:170px; }
  .transport{ flex-wrap:wrap; }
  .wave-wrap{ order:5; width:100%; flex-basis:100%; }
  .tracks{ margin-left:auto; }
}

/* ============ reduced motion ============ */
@media (prefers-reduced-motion:reduce){
  .bg .blob{ animation:none !important; }
  h1#title{ animation:none; -webkit-text-fill-color:#dfe2ee; background:none; }
  .beam::after, .turn.playing::after{ animation:none; background:conic-gradient(from 130deg, transparent 0 70%, var(--aqua) 82%, transparent 100%); }
  #particles{ display:none; }
  .turn.reveal{ opacity:1; transform:none; filter:none; transition:none; }
  .tabs .pill{ transition:none; }
  .panel{ transform:none !important; transition:opacity .22s var(--ease-out); }
  .sp-bar > i, .spk-track > i{ transition:none; }
  .toast{ transform:none; transition:opacity .24s var(--ease-out); }
  *{ scroll-behavior:auto !important; }
}
@media (hover:none){
  .sp-card:hover::before{ opacity:0; }
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  <canvas id="particles"></canvas>
</div>

<div class="app">
  <!-- HERO -->
  <header class="hero">
    <div class="hero-top">
      <div class="title-wrap">
        <div class="eyebrow">Recording · saved locally</div>
        <h1 id="title" contenteditable="true" spellcheck="false" aria-label="Meeting title, editable"></h1>
        <div class="meta" id="meta"></div>
      </div>
      <div class="hero-actions">
        <button class="btn-primary beam" id="summaryBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9l-3.4 3 1 4.7L12 14.4 7.9 16.7l1-4.7L5.5 9l4.6-1.4z"/></svg>
          <span>Summary</span>
        </button>
      </div>
    </div>

    <div class="const-head">
      <div class="eyebrow">Speakers</div>
      <div class="recluster" id="recluster">
        <button class="recluster-btn" id="reclusterBtn" aria-haspopup="true" aria-expanded="false">
          <span id="reclusterLabel">Auto · 3 voices</span>
          <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="rc-pop" role="menu" aria-label="Speaker count">
          <div class="m-lbl">Voices to detect</div>
          <p>Re-cluster the recording into a fixed number of speakers.</p>
          <div class="rc-grid" id="rcGrid"></div>
        </div>
      </div>
    </div>
    <div class="constellation" id="constellation"></div>
  </header>

  <!-- TOOLBAR -->
  <nav class="toolbar" aria-label="View controls">
    <div class="tabs" id="tabs" role="tablist" aria-label="Meeting views">
      <span class="pill" id="pill" aria-hidden="true"></span>
      <button class="tab" role="tab" aria-selected="true"  id="tab-overview"   aria-controls="panel-overview"   data-tab="overview">Overview</button>
      <button class="tab" role="tab" aria-selected="false" id="tab-transcript" aria-controls="panel-transcript" data-tab="transcript">Transcript</button>
      <button class="tab" role="tab" aria-selected="false" id="tab-insights"   aria-controls="panel-insights"   data-tab="insights">Insights</button>
      <button class="tab" role="tab" aria-selected="false" id="tab-ask"        aria-controls="panel-ask"        data-tab="ask">Ask</button>
    </div>

    <div class="tool-right">
      <div class="search-wrap">
        <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <label class="sr" for="search">Find in transcript</label>
        <input id="search" type="search" placeholder="Find in transcript" autocomplete="off" />
      </div>
      <span class="match-count" id="matchCount" aria-live="polite"></span>

      <div class="aa" role="group" aria-label="Transcript text size">
        <button id="aMinus" class="a-sm" aria-label="Decrease text size">A</button>
        <button id="aPlus" class="a-lg" aria-label="Increase text size">A</button>
      </div>

      <div class="tip">
        <button class="icon-btn" id="shield" aria-label="Privacy details">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.4-3 8.3-7 9.4C8 19.3 5 15.4 5 11V6z"/><path d="M9.5 12l1.8 1.8 3.4-3.6"/></svg>
        </button>
        <div class="tip-body"><b>Private by default.</b> Audio never leaves this Mac. Only transcript text is sent to Claude for summaries.</div>
      </div>

      <div class="menu-wrap" id="exportWrap">
        <button class="icon-btn" id="exportBtn" aria-haspopup="true" aria-expanded="false" aria-label="Export">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 20h16"/></svg>
        </button>
        <div class="menu" role="menu" aria-label="Export">
          <div class="m-lbl">Export</div>
          <button data-toast="Transcript copied to clipboard" data-copy="transcript"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>Copy transcript</button>
          <button data-toast="Saved as Markdown"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15V9l2.5 3L12 9v6M16 9v4m0 0l-1.6-1.6M16 13l1.6-1.6"/></svg>Export Markdown</button>
          <button data-toast="Saved as plain text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Export .txt</button>
          <button data-toast="Revealed in Finder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Reveal in Finder</button>
        </div>
      </div>

      <div class="menu-wrap" id="moreWrap">
        <button class="icon-btn" id="moreBtn" aria-haspopup="true" aria-expanded="false" aria-label="More actions">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
        <div class="menu" role="menu" aria-label="More actions">
          <div class="m-lbl">Refine</div>
          <button data-toast="Tidied with Claude"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/></svg>Tidy transcript</button>
          <button data-toast="Sent to your phone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>Sync to phone</button>
          <div class="sep"></div>
          <div class="m-lbl">Manage</div>
          <button data-toast="Tidy undone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4 12l5 5"/><path d="M4 12h11a5 5 0 0 1 0 10h-1"/></svg>Undo tidy</button>
          <button data-toast="Reprocessing recording"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>Reprocess audio</button>
          <button class="danger" data-toast="Recording deleted"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg>Delete recording</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- STAGE -->
  <main class="stage" id="stage">
    <section class="panel active" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview" tabindex="0">
      <div class="scroll"><div class="ov" id="ov"></div></div>
    </section>

    <section class="panel" id="panel-transcript" role="tabpanel" aria-labelledby="tab-transcript" tabindex="0">
      <div class="tx-fade top"></div>
      <div class="tx-scroll" id="txScroll"><div class="tx-inner" id="txInner"></div></div>
      <div class="tx-fade bot"></div>
    </section>

    <section class="panel" id="panel-insights" role="tabpanel" aria-labelledby="tab-insights" tabindex="0">
      <div class="scroll"><div class="ins" id="ins"></div></div>
    </section>

    <section class="panel" id="panel-ask" role="tabpanel" aria-labelledby="tab-ask" tabindex="0">
      <div class="ask">
        <div class="ask-thread" id="askThread"></div>
        <form class="ask-input" id="askForm">
          <label class="sr" for="askField">Ask about this meeting</label>
          <input id="askField" placeholder="Ask about this meeting" autocomplete="off" />
          <button class="ask-send" type="submit" aria-label="Send question">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>
      </div>
    </section>
  </main>

  <!-- TRANSPORT -->
  <footer class="transport" aria-label="Playback">
    <button class="play-btn" id="play" aria-label="Play recording" aria-pressed="false">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="clock"><b id="clockCur">0:00</b> / <span id="clockDur">24:18</span></div>
    <div class="wave-wrap"><canvas id="wave"></canvas></div>
    <div class="tracks" role="group" aria-label="Audio track">
      <button class="on" data-track="mix">Mix</button>
      <button data-track="you">Your mic</button>
      <button data-track="room">Meeting</button>
    </div>
  </footer>
</div>

<div id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.25/dist/lenis.min.js"></script>
<script src="data.js"></script>
<script>
(function(){
  "use strict";
  var D = window.DEMO;
  if(!D){ document.body.innerHTML = '<p style="padding:40px;color:#fff">data.js failed to load.</p>'; return; }
  var reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var $ = function(s,r){ return (r||document).querySelector(s); };
  var esc = function(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var escReg = function(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); };

  // local, editable copy of speaker names (rename is cosmetic)
  var NAMES = {}; Object.keys(D.SPEAKERS).forEach(function(k){ NAMES[k] = D.SPEAKERS[k].name; });
  function color(k){ return D.SPEAKERS[k] ? D.SPEAKERS[k].color : '#888'; }
  function initials(k){ return D.SPEAKERS[k] ? D.SPEAKERS[k].initials : '?'; }

  /* ---------- title + meta ---------- */
  $('#title').textContent = D.MEETING.title;
  (function(){
    var m = D.MEETING;
    var chips = [
      { t:m.created, dot:true },
      { t:D.fmtTs(m.duration), mono:true },
      { t: m.mode==='online' ? 'Online call' : 'In person' },
      { t:m.engine },
      { t:m.language }
    ];
    $('#meta').innerHTML = chips.map(function(c){
      return '<span class="chip'+(c.mono?' mono':'')+'">'+(c.dot?'<span class="dot"></span>':'')+esc(c.t)+'</span>';
    }).join('');
  })();

  /* ---------- speaker constellation ---------- */
  var constellation = $('#constellation');
  var order = ['you','priya','marcus'];
  constellation.innerHTML = order.map(function(k){
    var pct = Math.round((D.SHARE[k]||0)*100);
    return ''+
    '<article class="sp-card" data-key="'+k+'" style="--sp:'+color(k)+'">'+
      '<div class="sp-top">'+
        '<span class="avatar" style="background:'+color(k)+'">'+esc(initials(k))+'</span>'+
        '<div class="sp-id">'+
          '<span class="sp-name" data-namekey="'+k+'">'+esc(NAMES[k])+'</span>'+
          '<button class="pencil" data-rename="'+k+'" aria-label="Rename '+esc(NAMES[k])+'">'+
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M13.5 6.5l3 3"/></svg>'+
          '</button>'+
        '</div>'+
      '</div>'+
      '<div class="sp-stat">'+
        '<span class="sp-pct"><span class="ticker" data-to="'+pct+'">0</span><span class="u">%</span></span>'+
        '<span class="sp-sub">'+D.fmtTs(D.speakerSeconds(k))+' talk</span>'+
        '<span class="sp-bar"><i data-w="'+pct+'"></i></span>'+
      '</div>'+
    '</article>';
  }).join('');

  // pointer spotlight
  constellation.querySelectorAll('.sp-card').forEach(function(card){
    card.addEventListener('pointermove', function(e){
      var r = card.getBoundingClientRect();
      card.style.setProperty('--x', (e.clientX-r.left)+'px');
      card.style.setProperty('--y', (e.clientY-r.top)+'px');
    });
  });
  // animate share bars in
  requestAnimationFrame(function(){ setTimeout(function(){
    constellation.querySelectorAll('.sp-bar > i').forEach(function(i){ i.style.width = (reduce?1:1)*i.dataset.w+'%'; });
  }, 120); });

  /* ---------- rename ---------- */
  function renameSpeaker(k, pencilBtn){
    var nameEl = pencilBtn.previousElementSibling; // .sp-name
    var current = NAMES[k];
    var input = document.createElement('input');
    input.className = 'name-input'; input.value = current; input.setAttribute('aria-label','Speaker name');
    nameEl.replaceWith(input); input.focus(); input.select();
    var committed = false;
    function commit(){
      if(committed) return; committed = true;
      var v = input.value.trim() || current;
      NAMES[k] = v;
      var span = document.createElement('span');
      span.className = 'sp-name'; span.setAttribute('data-namekey', k); span.textContent = v;
      input.replaceWith(span);
      pencilBtn.setAttribute('aria-label','Rename '+v);
      // propagate to transcript attributions
      document.querySelectorAll('.tname[data-namekey="'+k+'"]').forEach(function(el){ el.textContent = v; });
    }
    input.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); commit(); } if(e.key==='Escape'){ input.value=current; commit(); } });
    input.addEventListener('blur', commit);
  }
  constellation.addEventListener('click', function(e){
    var b = e.target.closest('[data-rename]'); if(b) renameSpeaker(b.dataset.rename, b);
  });

  /* ---------- recluster popover ---------- */
  (function(){
    var wrap = $('#recluster'), btn = $('#reclusterBtn'), grid = $('#rcGrid'), label = $('#reclusterLabel');
    var opts = ['Auto',1,2,3,4,5,6,7,8]; var sel = 'Auto';
    grid.innerHTML = opts.map(function(o){
      return '<button data-v="'+o+'"'+(o==='Auto'?' class="wide sel"':'')+'>'+o+'</button>';
    }).join('');
    function refresh(){
      grid.querySelectorAll('button').forEach(function(b){ b.classList.toggle('sel', b.dataset.v===String(sel)); });
      label.textContent = sel==='Auto' ? 'Auto · 3 voices' : sel+(sel==1?' voice':' voices');
    }
    grid.addEventListener('click', function(e){ var b=e.target.closest('button'); if(!b) return; sel=b.dataset.v; refresh(); close(); toast('Re-clustered · '+(sel==='Auto'?'auto':sel+' voices')); });
    function open(){ wrap.classList.add('open'); btn.setAttribute('aria-expanded','true'); }
    function close(){ wrap.classList.remove('open'); btn.setAttribute('aria-expanded','false'); }
    btn.addEventListener('click', function(e){ e.stopPropagation(); wrap.classList.contains('open')?close():open(); });
    document.addEventListener('click', function(e){ if(!wrap.contains(e.target)) close(); });
  })();

  /* ---------- tabs ---------- */
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var pill = $('#pill');
  var panels = { overview:$('#panel-overview'), transcript:$('#panel-transcript'), insights:$('#panel-insights'), ask:$('#panel-ask') };
  var activeTab = 'overview';
  function movePill(btn){ pill.style.width = btn.offsetWidth+'px'; pill.style.transform = 'translateX('+btn.offsetLeft+'px)'; }
  function selectTab(name, focus){
    activeTab = name;
    tabs.forEach(function(t){ var on = t.dataset.tab===name; t.setAttribute('aria-selected', on?'true':'false'); if(on){ movePill(t); if(focus) t.focus(); } });
    Object.keys(panels).forEach(function(k){ panels[k].classList.toggle('active', k===name); });
    if(name==='transcript') initTxReveal();
    if(name==='insights'){ runTickers(panels.insights); animateInsightBars(); }
  }
  tabs.forEach(function(t,i){
    t.addEventListener('click', function(){ selectTab(t.dataset.tab); });
    t.addEventListener('keydown', function(e){
      var idx = i;
      if(e.key==='ArrowRight'){ e.preventDefault(); selectTab(tabs[(idx+1)%tabs.length].dataset.tab, true); }
      if(e.key==='ArrowLeft'){ e.preventDefault(); selectTab(tabs[(idx-1+tabs.length)%tabs.length].dataset.tab, true); }
    });
  });
  window.addEventListener('resize', function(){ var a = document.querySelector('.tab[aria-selected="true"]'); if(a) movePill(a); });

  /* ---------- overview ---------- */
  (function(){
    var S = D.SUMMARY;
    var decisions = S.decisions.map(function(d){
      return '<li><span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-11"/></svg></span><span>'+esc(d)+'</span></li>';
    }).join('');
    var actions = S.actions.map(function(a){
      return '<div class="act"><span class="who" style="background:'+color(a.ownerKey)+'">'+esc(initials(a.ownerKey))+'</span>'+
             '<span class="task">'+esc(a.task)+'</span><span class="due">'+esc(a.due)+'</span></div>';
    }).join('');
    var topics = S.topics.map(function(t){ return '<span class="topic"><span class="tw"></span>'+esc(t.label)+'</span>'; }).join('');
    $('#ov').innerHTML =
      '<p class="ov-lede">'+esc(S.tldr)+'</p>'+
      '<div class="ov-grid">'+
        '<div class="card"><h3>Decisions<span class="n">'+S.decisions.length+'</span></h3><ul class="dlist">'+decisions+'</ul></div>'+
        '<div class="card"><h3>Action items<span class="n">'+S.actions.length+'</span></h3><div class="actions-list">'+actions+'</div>'+
          '<h3 style="margin:20px 0 12px">Topics</h3><div class="topics">'+topics+'</div></div>'+
      '</div>'+
      '<div class="card email-card">'+
        '<div class="email-head"><h3 style="margin:0">Recap email</h3>'+
          '<button class="btn-ghost" id="copyEmail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>Copy email</button></div>'+
        '<div class="email-body">'+esc(S.email)+'</div>'+
      '</div>';
    $('#copyEmail').addEventListener('click', function(){ copy(S.email); toast('Recap email copied'); });
  })();

  /* ---------- insights ---------- */
  (function(){
    var metrics = D.INSIGHTS.map(function(m){
      var isNum = /^\d+$/.test(m.value);
      var val = isNum ? '<span class="ticker" data-to="'+m.value+'">0</span>' : esc(m.value);
      return '<div class="metric"><div class="mlabel">'+esc(m.label)+'</div><div class="mval">'+val+'</div><div class="msub">'+esc(m.sub)+'</div></div>';
    }).join('');
    var rows = order.map(function(k){
      var pct = Math.round((D.SHARE[k]||0)*100);
      return '<div class="spk-row" style="--sp:'+color(k)+'">'+
        '<div class="spk-who"><span class="avatar" style="background:'+color(k)+'">'+esc(initials(k))+'</span><span data-namekey="'+k+'">'+esc(NAMES[k])+'</span></div>'+
        '<div class="spk-track"><i data-w="'+pct+'"></i></div>'+
        '<div class="spk-num"><b><span class="ticker" data-to="'+pct+'">0</span>%</b><div class="spk-time">'+D.fmtTs(D.speakerSeconds(k))+'</div></div>'+
      '</div>';
    }).join('');
    $('#ins').innerHTML =
      '<div class="ins-metrics">'+metrics+'</div>'+
      '<div class="ins-speakers"><h3>Who spoke, and for how long</h3>'+rows+'</div>';
  })();
  function animateInsightBars(){ document.querySelectorAll('.spk-track > i').forEach(function(i){ i.style.width = i.dataset.w+'%'; }); }

  /* ---------- ask ---------- */
  var askThread = $('#askThread');
  function renderAsk(){
    askThread.innerHTML = D.ASK.map(function(m){
      var bot = m.role==='assistant';
      return '<div class="msg '+(bot?'bot':'user')+'"><span class="mav">'+(bot?'AI':'Y')+'</span><div class="mbody">'+esc(m.text)+'</div></div>';
    }).join('');
    askThread.scrollTop = askThread.scrollHeight;
  }
  renderAsk();
  $('#askForm').addEventListener('submit', function(e){
    e.preventDefault();
    var f = $('#askField'); var v = f.value.trim(); if(!v) return;
    D.ASK.push({role:'user', text:v});
    D.ASK.push({role:'assistant', text:'This is a design demo, so answers are not live. In the real app this reply is generated locally from your transcript text only.'});
    f.value=''; renderAsk();
  });

  /* ---------- transcript ---------- */
  var txInner = $('#txInner'), txScroll = $('#txScroll');
  var T = D.TRANSCRIPT;
  txInner.innerHTML = T.map(function(turn, i){
    var change = (i===0 || T[i-1].s !== turn.s);
    var ts = D.fmtTs(turn.t);
    var gutter = change
      ? '<span class="avatar" style="background:'+color(turn.s)+'">'+esc(initials(turn.s))+'</span>'
      : '<span class="tick" style="--sp:'+color(turn.s)+'"></span>';
    var head = change
      ? '<div class="tmeta"><span class="tname" data-namekey="'+turn.s+'">'+esc(NAMES[turn.s])+'</span><button class="ts" data-seek="'+i+'" aria-label="Play from '+ts+'">'+ts+'</button></div>'
      : '<button class="ts cont-ts" data-seek="'+i+'" aria-label="Play from '+ts+'">'+ts+'</button>';
    return '<div class="turn '+(change?'change':'cont')+'" id="t-'+i+'" data-i="'+i+'" style="--sp:'+color(turn.s)+'">'+
      '<div class="gutter">'+gutter+'</div>'+
      '<div class="body">'+head+'<div class="ttext" data-text="'+esc(turn.text)+'">'+esc(turn.text)+'</div></div>'+
    '</div>';
  }).join('');
  var turnEls = Array.prototype.slice.call(txInner.querySelectorAll('.turn'));

  // blur-fade reveal — lazy-inits the first time the Transcript tab is opened,
  // so the reveal actually plays on the visible surface. Turns are visible by
  // default (no .reveal class) so text never stays hidden if this never runs.
  var txRevealDone = false;
  function revealAllTurns(){ turnEls.forEach(function(el){ el.classList.add('in'); }); }
  function initTxReveal(){
    if(txRevealDone) return; txRevealDone = true;
    if(!('IntersectionObserver' in window) || reduce){ return; }
    turnEls.forEach(function(el){ el.classList.add('reveal'); });
    var io = new IntersectionObserver(function(ents){
      ents.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
    }, { root: txScroll, rootMargin:'0px 0px -6% 0px', threshold:0.04 });
    turnEls.forEach(function(el){ io.observe(el); });
    setTimeout(revealAllTurns, 1600); // safety net once the surface is visible
  }

  // seek from timestamp
  txInner.addEventListener('click', function(e){
    var b = e.target.closest('[data-seek]'); if(!b) return;
    var i = +b.dataset.seek; seekTo(T[i].t, true); scrollToTurn(i);
  });

  function flash(el){ if(!el) return; el.classList.add('flash'); setTimeout(function(){ el.classList.remove('flash'); }, 900); }
  function parkOffset(){ return Math.round(txScroll.clientHeight * 0.4); }
  function scrollToTurn(i){
    var el = document.getElementById('t-'+i); if(!el) return;
    if(lenis){ lenis.scrollTo('#t-'+i, { offset:-parkOffset(), duration:1.1, lock:true, onComplete:function(){ flash(el); } }); }
    else { var top = el.offsetTop - parkOffset(); txScroll.scrollTo({ top:top, behavior: reduce?'auto':'smooth' }); flash(el); }
  }

  // lenis on the transcript wrapper
  var lenis = null;
  if(window.Lenis){
    try{
      lenis = new Lenis({ wrapper: txScroll, content: txInner, duration:1.1, smoothWheel:true });
      var raf = function(t){ lenis.raf(t); requestAnimationFrame(raf); }; requestAnimationFrame(raf);
    }catch(err){ lenis = null; }
  }
  // suppress auto-follow briefly after the user scrolls manually
  var lastManual = 0;
  txScroll.addEventListener('wheel', function(){ lastManual = Date.now(); }, {passive:true});
  txScroll.addEventListener('touchmove', function(){ lastManual = Date.now(); }, {passive:true});

  /* ---------- search ---------- */
  var search = $('#search'), matchCount = $('#matchCount');
  search.addEventListener('input', function(){
    var q = search.value.trim();
    var total = 0;
    turnEls.forEach(function(el){
      var tx = el.querySelector('.ttext'); var raw = tx.getAttribute('data-text');
      if(!q){ tx.innerHTML = esc(raw); el.classList.remove('dim'); return; }
      var parts = raw.split(new RegExp('('+escReg(q)+')','ig'));
      var hits = 0;
      var html = parts.map(function(p,idx){ if(idx%2===1 && p!==''){ hits++; return '<mark>'+esc(p)+'</mark>'; } return esc(p); }).join('');
      tx.innerHTML = html; total += hits;
      el.classList.toggle('dim', hits===0);
    });
    if(!q){ matchCount.classList.remove('on'); matchCount.textContent=''; return; }
    matchCount.classList.add('on');
    matchCount.textContent = total===0 ? 'No matches' : total+(total===1?' match':' matches');
    // jump to transcript so results are visible
    if(activeTab!=='transcript') selectTab('transcript');
  });
  search.addEventListener('focus', function(){ if(activeTab!=='transcript') selectTab('transcript'); });

  /* ---------- text size ---------- */
  var tsize = 16;
  function setSize(v){ tsize = Math.max(13, Math.min(19, v)); document.documentElement.style.setProperty('--ts-size', tsize+'px'); }
  $('#aMinus').addEventListener('click', function(){ setSize(tsize-1); });
  $('#aPlus').addEventListener('click', function(){ setSize(tsize+1); });

  /* ---------- menus (hover + click) ---------- */
  function setupMenu(wrapId, btnId){
    var wrap = $('#'+wrapId), btn = $('#'+btnId), hideT;
    function open(){ clearTimeout(hideT); wrap.classList.add('open'); btn.setAttribute('aria-expanded','true'); }
    function close(){ wrap.classList.remove('open'); btn.setAttribute('aria-expanded','false'); }
    wrap.addEventListener('mouseenter', open);
    wrap.addEventListener('mouseleave', function(){ hideT = setTimeout(close, 140); });
    btn.addEventListener('click', function(e){ e.stopPropagation(); wrap.classList.contains('open')?close():open(); });
    wrap.querySelectorAll('.menu button').forEach(function(mi){
      mi.addEventListener('click', function(){
        if(mi.dataset.copy==='transcript') copy(transcriptText());
        toast(mi.dataset.toast || 'Done'); close();
      });
    });
    document.addEventListener('click', function(e){ if(!wrap.contains(e.target)) close(); });
    return { close: close };
  }
  setupMenu('exportWrap','exportBtn');
  setupMenu('moreWrap','moreBtn');

  $('#summaryBtn').addEventListener('click', function(){ selectTab('overview'); toast('Summary ready'); });

  function transcriptText(){
    return T.map(function(t){ return NAMES[t.s]+'  ['+D.fmtTs(t.t)+']\n'+t.text; }).join('\n\n');
  }

  /* ---------- transport / fake playback ---------- */
  var DUR = D.MEETING.duration;
  var cur = 0, playing = false, RATE = 2.6, lastFrame = 0;
  var play = $('#play'), playIcon = $('#playIcon'), clockCur = $('#clockCur');
  $('#clockDur').textContent = D.fmtTs(DUR);
  var canvas = $('#wave'), ctx = canvas.getContext('2d');
  var trackSeed = { mix:1, you:2, room:3 }, curTrack = 'mix';

  function sizeCanvas(){
    var r = canvas.getBoundingClientRect(); var dpr = window.devicePixelRatio||1;
    canvas.width = Math.max(1, Math.round(r.width*dpr)); canvas.height = Math.max(1, Math.round(r.height*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0); drawWave();
  }
  function seeded(i){ var s = trackSeed[curTrack]; var x = Math.sin(i*12.9898 + s*78.233)*43758.5453; return x - Math.floor(x); }
  function drawWave(){
    var r = canvas.getBoundingClientRect(); var W = r.width, H = r.height;
    ctx.clearRect(0,0,W,H);
    var gap = 3, bw = 2.4, step = gap+bw; var n = Math.floor(W/step);
    var prog = DUR>0 ? cur/DUR : 0; var mid = H/2;
    for(var i=0;i<n;i++){
      var x = i*step + gap/2;
      // stable envelope: taller toward center of speech, plus per-bar variation
      var env = 0.35 + 0.65*Math.sin((i/n)*Math.PI);
      var h = (0.18 + seeded(i)*0.82) * env * (H*0.86);
      var played = (i/n) <= prog;
      if(played){ ctx.fillStyle = 'rgba(94,234,212,0.9)'; ctx.shadowColor='rgba(94,234,212,0.5)'; ctx.shadowBlur=6; }
      else { ctx.fillStyle = 'rgba(231,233,242,0.16)'; ctx.shadowBlur=0; }
      var rad = Math.min(bw/2, h/2);
      roundBar(x, mid-h/2, bw, h, rad);
    }
    ctx.shadowBlur = 0;
    // playhead
    var px = prog*W;
    ctx.fillStyle = 'rgba(125,211,252,0.95)';
    ctx.fillRect(px-0.75, 2, 1.5, H-4);
    ctx.beginPath(); ctx.arc(px, 3, 2.4, 0, Math.PI*2); ctx.fill();
  }
  function roundBar(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill(); }

  function activeIndex(){
    var idx = -1;
    for(var i=0;i<T.length;i++){ if(T[i].t <= cur+0.001) idx = i; else break; }
    return idx;
  }
  var lastActive = -1;
  function updateActive(follow){
    var idx = activeIndex();
    if(idx!==lastActive){
      turnEls.forEach(function(el,i){ el.classList.toggle('playing', i===idx); });
      lastActive = idx;
      if(follow && idx>=0 && activeTab==='transcript' && (Date.now()-lastManual)>3500){ scrollToTurn(idx); }
    }
  }
  function setClock(){ clockCur.textContent = D.fmtTs(cur); }
  function seekTo(sec, updateBeam){ cur = Math.max(0, Math.min(DUR, sec)); setClock(); drawWave(); if(updateBeam) updateActive(false); }

  function setPlay(on){
    playing = on;
    play.setAttribute('aria-pressed', on?'true':'false');
    play.setAttribute('aria-label', on?'Pause recording':'Play recording');
    playIcon.innerHTML = on ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    if(on){ lastFrame = performance.now(); requestAnimationFrame(loop); }
  }
  function loop(now){
    if(!playing) return;
    var dt = (now-lastFrame)/1000; lastFrame = now;
    cur += dt*RATE;
    if(cur>=DUR){ cur = DUR; setClock(); drawWave(); updateActive(true); setPlay(false); return; }
    setClock(); drawWave(); updateActive(true);
    requestAnimationFrame(loop);
  }
  play.addEventListener('click', function(){ setPlay(!playing); });

  canvas.addEventListener('click', function(e){
    var r = canvas.getBoundingClientRect(); var p = (e.clientX-r.left)/r.width;
    seekTo(p*DUR, true);
    if(activeTab==='transcript'){ var idx=activeIndex(); if(idx>=0) scrollToTurn(idx); }
  });
  document.querySelectorAll('.tracks button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.tracks button').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on'); curTrack = b.dataset.track; drawWave();
    });
  });

  /* ---------- number tickers ---------- */
  function tick(el){
    if(el.dataset.done) return; el.dataset.done='1';
    var to = parseFloat(el.dataset.to);
    if(reduce){ el.textContent = to; return; }
    var start = performance.now(), dur = 1000;
    (function step(now){ var t = Math.min(1,(now-start)/dur); var e = 1-Math.pow(1-t,3); el.textContent = Math.round(to*e); if(t<1) requestAnimationFrame(step); })(performance.now());
  }
  function runTickers(root){ (root||document).querySelectorAll('.ticker:not([data-done])').forEach(tick); }
  runTickers(document.querySelector('.constellation'));

  /* ---------- toasts ---------- */
  var toastBox = $('#toasts');
  function toast(msg){
    var t = document.createElement('div'); t.className='toast'; t.innerHTML = '<span class="dot"></span>'+esc(msg);
    toastBox.appendChild(t); requestAnimationFrame(function(){ t.classList.add('in'); });
    setTimeout(function(){ t.classList.remove('in'); setTimeout(function(){ t.remove(); }, 260); }, 2100);
  }
  function copy(text){ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).catch(function(){}); } }

  /* ---------- init sizing ---------- */
  function remeasurePill(){ var a = document.querySelector('.tab[aria-selected="true"]'); if(a) movePill(a); }
  remeasurePill();
  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);
  setClock(); drawWave();
  // re-measure once webfonts land (tab widths shift as fonts swap in)
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(function(){ remeasurePill(); sizeCanvas(); }); }
  setTimeout(remeasurePill, 400);

  /* ---------- ambient particles ---------- */
  (function(){
    if(reduce) return;
    var pc = $('#particles'), pctx = pc.getContext('2d'); var parts = [];
    function size(){ var dpr = Math.min(2, window.devicePixelRatio||1); pc.width = innerWidth*dpr; pc.height = innerHeight*dpr; pctx.setTransform(dpr,0,0,dpr,0,0); }
    size();
    var COLORS = ['165,180,252','196,181,253','94,234,212'];
    for(var i=0;i<26;i++){ parts.push({ x:Math.random()*innerWidth, y:Math.random()*innerHeight, r:Math.random()*1.6+0.5, s:Math.random()*0.12+0.03, c:COLORS[i%3], a:Math.random()*0.35+0.08, tw:Math.random()*Math.PI*2 }); }
    function frame(){
      pctx.clearRect(0,0,innerWidth,innerHeight);
      for(var i=0;i<parts.length;i++){ var p=parts[i]; p.y -= p.s; p.tw += 0.01; if(p.y < -4){ p.y = innerHeight+4; p.x = Math.random()*innerWidth; }
        var alpha = p.a*(0.6+0.4*Math.sin(p.tw));
        pctx.beginPath(); pctx.fillStyle='rgba('+p.c+','+alpha+')'; pctx.arc(p.x,p.y,p.r,0,Math.PI*2); pctx.fill(); }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    window.addEventListener('resize', size);
  })();

})();
</script>
</body>
