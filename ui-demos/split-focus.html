<!doctype html>
<!-- MeetingScribe — Direction 4: "Split Focus" -->
<!-- Two-pane pro workspace: calm transcript reader (left) + swapping context rail (right) + ⌘K command palette. -->
<meta charset="utf-8">
<title>MeetingScribe — Split Focus</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ============================== TOKENS ============================== */
:root{
  --bg:#0c0d10;
  --rail:#101216;
  --panel:#14161b;
  --panel-2:#181b21;
  --hair:rgba(255,255,255,.075);
  --hair-2:rgba(255,255,255,.13);
  --text:#e7e8ea;
  --dim:#8b8f98;
  --dim-2:#666a73;

  --accent:#6366f1;
  --accent-2:#818cf8;
  --accent-soft:rgba(99,102,241,.16);
  --accent-line:rgba(99,102,241,.5);
  --danger:#f0616a;

  --you:#5b8cff;
  --priya:#c07af6;
  --marcus:#2fbf87;

  --ease-out:cubic-bezier(.22,1,.32,1);
  --ease-in-out:cubic-bezier(.77,0,.175,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);

  --reader:16px;
  --rail-w:340px;

  --shadow:0 18px 50px rgba(0,0,0,.5);
  --shadow-sm:0 8px 24px rgba(0,0,0,.4);

  --sans:"Instrument Sans",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}

/* ============================== RESET ============================== */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;margin:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
::selection{background:rgba(99,102,241,.35)}
mark{background:rgba(99,102,241,.32);color:#fff;border-radius:2px;padding:0 .1em}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:6px}
button:active{transform:scale(.97)}
.icon{width:16px;height:16px;display:block;flex:none}
.icon svg{width:100%;height:100%;display:block}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ============================== APP SHELL ============================== */
.app{display:flex;flex-direction:column;height:100%;height:100dvh}

/* ---------------------------- TOP BAR ---------------------------- */
.topbar{
  flex:none;
  height:56px;
  display:flex;
  align-items:center;
  gap:16px;
  padding:0 16px;
  border-bottom:1px solid var(--hair);
  background:linear-gradient(180deg,rgba(255,255,255,.015),transparent);
  position:relative;
  z-index:30;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  width:26px;height:26px;flex:none;border-radius:8px;
  background:linear-gradient(140deg,var(--accent),#4f46e5);
  display:grid;place-items:center;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
}
.logo .icon{width:14px;height:14px}
.title-wrap{min-width:0;display:flex;flex-direction:column;gap:1px}
.title{
  font-size:16px;font-weight:600;letter-spacing:-.01em;
  line-height:1.15;color:var(--text);
  padding:1px 6px;margin:-1px -6px;border-radius:6px;
  outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw;
  transition:background .15s ease,box-shadow .15s ease;
}
.title:hover{background:rgba(255,255,255,.04)}
.title:focus{background:rgba(255,255,255,.06);box-shadow:0 0 0 1px var(--hair-2)}
.meta{
  display:flex;align-items:center;gap:0;font-size:11.5px;color:var(--dim);
  white-space:nowrap;overflow:hidden;
}
.meta span{padding:0 7px;position:relative}
.meta span:first-child{padding-left:0}
.meta span+span::before{content:"";position:absolute;left:0;top:50%;width:2px;height:2px;border-radius:50%;background:var(--dim-2);transform:translateY(-50%)}

.spacer{flex:1}

/* ⌘K launcher */
.cmdk-btn{
  display:flex;align-items:center;gap:9px;
  height:32px;padding:0 10px 0 11px;
  border:1px solid var(--hair);border-radius:9px;
  background:rgba(255,255,255,.02);
  color:var(--dim);font-size:12.5px;
  min-width:230px;max-width:300px;
  transition:border-color .15s ease,background .15s ease,color .15s ease;
}
.cmdk-btn:hover{border-color:var(--hair-2);background:rgba(255,255,255,.04);color:var(--text)}
.cmdk-btn .icon{width:14px;height:14px;color:var(--dim)}
.cmdk-btn .lbl{flex:1;text-align:left}
.kbd{
  font-family:var(--mono);font-size:11px;color:var(--dim);
  border:1px solid var(--hair);border-radius:5px;
  padding:2px 5px;background:rgba(255,255,255,.03);line-height:1;
}

/* top-bar tool cluster */
.tools{display:flex;align-items:center;gap:4px}
.divide{width:1px;height:20px;background:var(--hair);margin:0 4px}
.tbtn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  height:32px;min-width:32px;padding:0 8px;border-radius:8px;
  color:var(--dim);font-size:12.5px;font-weight:500;
  border:1px solid transparent;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.tbtn:hover{background:rgba(255,255,255,.05);color:var(--text)}
.tbtn[aria-expanded="true"]{background:rgba(255,255,255,.06);color:var(--text);border-color:var(--hair)}
.tbtn .icon{width:15px;height:15px}
.tbtn .chev{width:12px;height:12px;opacity:.7}
.size-step{display:flex;align-items:center;border:1px solid var(--hair);border-radius:8px;overflow:hidden}
.size-step button{width:30px;height:30px;display:grid;place-items:center;color:var(--dim);transition:background .15s ease,color .15s ease}
.size-step button:hover{background:rgba(255,255,255,.05);color:var(--text)}
.size-step .sm{font-size:11px;font-weight:600}
.size-step .lg{font-size:15px;font-weight:600}
.size-step .mid{width:1px;height:16px;background:var(--hair)}

/* menus (export / more) */
.menu-wrap{position:relative}
.menu{
  position:absolute;top:calc(100% + 7px);right:0;
  min-width:216px;padding:6px;
  background:var(--panel);border:1px solid var(--hair-2);border-radius:12px;
  box-shadow:var(--shadow);
  transform-origin:top right;
  opacity:0;transform:scale(.96) translateY(-4px);pointer-events:none;
  transition:opacity .16s var(--ease-out),transform .16s var(--ease-out);
  z-index:40;
}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:8px 9px;border-radius:8px;font-size:13px;color:var(--text);
  text-align:left;transition:background .12s ease;
}
.menu-item:hover,.menu-item:focus-visible{background:rgba(255,255,255,.06);outline:none}
.menu-item .icon{width:15px;height:15px;color:var(--dim)}
.menu-item .rt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim-2)}
.menu-item.danger{color:var(--danger)}
.menu-item.danger .icon{color:var(--danger)}
.menu-sep{height:1px;background:var(--hair);margin:5px 6px}
.menu-label{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim-2);padding:8px 9px 4px}

/* ---------------------------- WORKSPACE ---------------------------- */
.workspace{
  flex:1;min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) 50px var(--rail-w);
}
.workspace.collapsed{grid-template-columns:minmax(0,1fr) 50px 0px}

/* ---------------------------- LEFT PANE ---------------------------- */
.leftpane{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}

/* subtle finder */
.finder{
  flex:none;display:flex;align-items:center;gap:9px;
  height:44px;padding:0 22px;
  border-bottom:1px solid transparent;
  transition:border-color .2s ease,background .2s ease;
  position:relative;z-index:5;
}
.finder.active,.finder:focus-within{border-bottom-color:var(--hair);background:rgba(255,255,255,.012)}
.finder .icon{width:15px;height:15px;color:var(--dim-2);flex:none}
.finder input{
  flex:1;background:none;border:none;outline:none;
  font-size:13px;color:var(--text);min-width:0;
}
.finder input::placeholder{color:var(--dim-2)}
.finder .count{
  font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;
  white-space:nowrap;opacity:0;transition:opacity .15s ease;
}
.finder.active .count{opacity:1}
.finder .clear{
  width:22px;height:22px;display:none;place-items:center;border-radius:6px;color:var(--dim);
  transition:background .12s ease,color .12s ease;
}
.finder .clear:hover{background:rgba(255,255,255,.06);color:var(--text)}
.finder.active .clear{display:grid}
.finder .clear .icon{width:12px;height:12px;color:inherit}

/* reader (lenis wrapper) */
.reader{flex:1;min-height:0;overflow-y:auto;position:relative}
.reader-inner{
  max-width:704px;margin:0 auto;
  padding:40px 24px 140px;
}
.empty{
  display:none;text-align:center;color:var(--dim);font-size:13.5px;
  padding:60px 20px;
}
.empty.show{display:block}

/* a turn */
.turn{
  display:grid;grid-template-columns:52px 1fr;column-gap:16px;
  padding:2px 8px;margin:0 -8px;border-radius:10px;
  scroll-margin-top:120px;
}
.turn.newspk{margin-top:26px}
.turn.newspk:first-child{margin-top:0}
.turn.hidden{display:none}
.turn.flash{animation:flash 1.25s var(--ease-out)}
@keyframes flash{
  0%{background:var(--accent-soft)}
  100%{background:transparent}
}
.ts{
  grid-column:1;font-family:var(--mono);font-size:11.5px;color:var(--dim-2);
  padding-top:2px;text-align:right;align-self:start;
  letter-spacing:-.02em;border-radius:5px;
  transition:color .14s ease,background .14s ease;
  line-height:1.62;
}
.turn.newspk .ts{padding-top:24px}
.turn-main{grid-column:2;min-width:0}
.spk{
  font-size:12.5px;font-weight:600;letter-spacing:-.005em;
  margin-bottom:3px;line-height:1.2;
}
.turn:not(.newspk) .spk{display:none}
.line{
  margin:0;font-size:var(--reader);line-height:1.62;
  color:rgba(231,232,234,.9);letter-spacing:.002em;
  transition:font-size .18s var(--ease-out);
}
.turn.newspk+.turn .line,.turn .line{}

/* edge fades */
.fade{position:absolute;left:0;right:0;height:44px;pointer-events:none;z-index:4}
.fade.top{top:44px;background:linear-gradient(180deg,var(--bg),rgba(12,13,16,0))}
.fade.bot{bottom:52px;height:64px;background:linear-gradient(0deg,var(--bg) 32%,rgba(12,13,16,0))}

/* ---------------------------- TRANSPORT ---------------------------- */
.transport{
  flex:none;height:52px;display:flex;align-items:center;gap:14px;
  padding:0 16px 0 14px;border-top:1px solid var(--hair);
  background:linear-gradient(0deg,rgba(255,255,255,.018),transparent);
  position:relative;z-index:6;
}
.play{
  width:34px;height:34px;flex:none;border-radius:9px;
  display:grid;place-items:center;color:#fff;
  background:var(--accent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
  transition:background .15s ease,transform .12s var(--ease-out);
}
.play:hover{background:var(--accent-2)}
.play .icon{width:15px;height:15px;margin-left:1px}
.play.playing .icon{margin-left:0}
.clock{font-family:var(--mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em}
.clock b{color:var(--text);font-weight:500}
.wave-wrap{flex:1;min-width:0;height:34px;position:relative;cursor:pointer}
.wave-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tracks{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.03);border:1px solid var(--hair);border-radius:8px;padding:2px}
.tracks button{
  font-size:11px;font-weight:500;color:var(--dim);
  padding:4px 9px;border-radius:6px;white-space:nowrap;
  transition:background .15s ease,color .15s ease;
}
.tracks button:hover{color:var(--text)}
.tracks button[aria-pressed="true"]{background:rgba(255,255,255,.09);color:var(--text)}
.shield{
  width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:8px;
  color:var(--dim-2);transition:color .15s ease,background .15s ease;position:relative;
}
.shield:hover{color:var(--marcus);background:rgba(47,191,135,.08)}
.shield .icon{width:15px;height:15px}

/* ---------------------------- SEAM / MINIMAP ---------------------------- */
.seam{
  position:relative;border-left:1px solid var(--hair);border-right:1px solid var(--hair);
  background:rgba(255,255,255,.008);
  display:flex;flex-direction:column;align-items:stretch;
  padding:22px 0 22px;overflow:hidden;
}
.seam .tick{font-family:var(--mono);font-size:9px;color:var(--dim-2);text-align:center;letter-spacing:-.02em;flex:none;height:12px}
.mini{position:relative;flex:1;margin:8px 0}
.mini-block{
  position:absolute;left:50%;transform:translateX(-50%);
  width:12px;border-radius:3px;
  opacity:.42;
  transition:opacity .18s ease,width .18s var(--ease-out),transform .18s var(--ease-out);
  padding:0;min-height:3px;
}
.mini-block:hover{opacity:1;width:22px}
.mini-block.dim{opacity:.1}
.mini-block.match{opacity:.95;width:20px}
/* reading-progress veil */
.mini-read{
  position:absolute;left:0;right:0;top:0;height:100%;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  transform:scaleY(0);transform-origin:top;pointer-events:none;
}
/* audio playhead */
.mini-head{position:absolute;left:0;right:0;top:0;pointer-events:none}
.mini-head .ln{position:absolute;left:6px;right:6px;height:1.5px;background:var(--accent);box-shadow:0 0 8px rgba(99,102,241,.7);border-radius:2px}
.mini-head .dot{position:absolute;right:4px;top:-2.5px;width:6px;height:6px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 8px rgba(129,140,248,.9)}

/* ---------------------------- RAIL ---------------------------- */
.rail{
  min-width:0;background:var(--rail);
  display:flex;flex-direction:column;overflow:hidden;
  border-left:1px solid var(--hair);
}
.rail.hiding{opacity:0;transform:translateX(14px);transition:opacity .2s var(--ease-out),transform .22s var(--ease-drawer)}
.seg{
  flex:none;position:relative;display:grid;grid-template-columns:repeat(4,1fr);
  margin:12px;padding:3px;gap:0;
  background:rgba(255,255,255,.03);border:1px solid var(--hair);border-radius:10px;
}
.seg .pill{
  position:absolute;top:3px;left:3px;bottom:3px;width:0;
  background:var(--panel-2);border:1px solid var(--hair-2);border-radius:8px;
  box-shadow:var(--shadow-sm);
  transition:transform .3s var(--ease-out),width .3s var(--ease-out);
  z-index:0;
}
.seg button{
  position:relative;z-index:1;
  padding:6px 2px;font-size:11.5px;font-weight:500;color:var(--dim);
  border-radius:8px;letter-spacing:-.005em;
  transition:color .2s ease;
}
.seg button[aria-selected="true"]{color:var(--text);font-weight:600}
.rail-body{flex:1;min-height:0;position:relative}
.rpanel{
  position:absolute;inset:0;overflow-y:auto;padding:6px 16px 24px;
  opacity:0;transform:translateY(6px);pointer-events:none;visibility:hidden;
  transition:opacity .2s var(--ease-out),transform .24s var(--ease-out),visibility 0s .24s;
}
.rpanel.active{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition:opacity .24s var(--ease-out),transform .24s var(--ease-out)}
.rpanel::-webkit-scrollbar,.reader::-webkit-scrollbar{width:8px}
.rpanel::-webkit-scrollbar-thumb,.reader::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:8px;border:2px solid transparent;background-clip:padding-box}

.eyebrow{font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--dim-2);margin:18px 0 9px}
.eyebrow:first-child{margin-top:8px}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 9px}
.rhead:first-child{margin-top:8px}
.rhead .eyebrow{margin:0}

/* summary rail */
.tldr{font-size:13.5px;line-height:1.6;color:rgba(231,232,234,.88);margin:0 0 4px}
.tldr.shimmer{
  background:linear-gradient(110deg,rgba(231,232,234,.4) 30%,#fff 50%,rgba(231,232,234,.4) 70%);
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shim 1.1s var(--ease-out) 1;
}
@keyframes shim{from{background-position:180% 0}to{background-position:-120% 0}}
.decision{
  display:flex;gap:10px;font-size:13px;line-height:1.5;color:rgba(231,232,234,.82);
  padding:9px 0;border-bottom:1px solid var(--hair);
}
.decision:last-child{border-bottom:none}
.decision .dot{flex:none;width:6px;height:6px;border-radius:2px;background:var(--accent);margin-top:6px;transform:rotate(45deg)}
.action{
  display:flex;gap:11px;align-items:flex-start;padding:11px;border-radius:11px;
  border:1px solid var(--hair);background:rgba(255,255,255,.014);margin-bottom:8px;
  transition:border-color .15s ease,background .15s ease;
}
.action:hover{border-color:var(--hair-2);background:rgba(255,255,255,.028)}
.av{
  width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-size:10px;font-weight:600;color:#fff;letter-spacing:.02em;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
}
.action .body{min-width:0;flex:1}
.action .task{font-size:12.5px;line-height:1.4;color:var(--text)}
.action .who{font-size:11px;color:var(--dim);margin-top:3px;display:flex;gap:7px;align-items:center}
.due{font-family:var(--mono);font-size:10px;color:var(--accent-2);border:1px solid rgba(99,102,241,.28);background:var(--accent-soft);border-radius:5px;padding:1px 5px;letter-spacing:-.02em}
.email-card{border:1px solid var(--hair);border-radius:11px;background:rgba(255,255,255,.014);overflow:hidden;margin-top:2px}
.email-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:8px}
.email-head .t{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:8px}
.btn-mini{
  display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--text);
  border:1px solid var(--hair-2);border-radius:7px;padding:5px 9px;
  transition:background .14s ease,border-color .14s ease;
}
.btn-mini:hover{background:rgba(255,255,255,.06)}
.btn-mini.primary{background:var(--accent);border-color:transparent;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.btn-mini.primary:hover{background:var(--accent-2)}
.btn-mini .icon{width:13px;height:13px}
.email-body{
  max-height:0;overflow:hidden;transition:max-height .3s var(--ease-drawer);
  border-top:1px solid transparent;
}
.email-card.open .email-body{max-height:420px;border-top-color:var(--hair)}
.email-body pre{margin:0;padding:12px;font-family:var(--sans);font-size:12px;line-height:1.6;color:var(--dim);white-space:pre-wrap;overflow-wrap:break-word}

/* speakers rail */
.spkrow{padding:13px 0;border-bottom:1px solid var(--hair)}
.spkrow:last-of-type{border-bottom:none}
.spk-top{display:flex;align-items:center;gap:10px}
.spk-name-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.spk-name{font-size:13px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pencil{width:22px;height:22px;flex:none;display:grid;place-items:center;border-radius:6px;color:var(--dim-2);opacity:0;transition:opacity .14s ease,color .14s ease,background .14s ease}
.spkrow:hover .pencil{opacity:1}
.pencil:hover{color:var(--text);background:rgba(255,255,255,.06)}
.pencil .icon{width:13px;height:13px}
.spk-edit{
  flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--accent);border-radius:6px;
  padding:3px 7px;font-size:13px;font-weight:600;outline:none;
}
.spk-time{font-family:var(--mono);font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.spk-bar{height:6px;border-radius:4px;background:rgba(255,255,255,.05);margin-top:10px;overflow:hidden;position:relative}
.spk-fill{position:absolute;inset:0 auto 0 0;border-radius:4px;transform-origin:left;transform:scaleX(0);transition:transform .6s var(--ease-out)}
.spk-sub{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--dim)}
.spk-sub b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.recluster{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding:11px 12px;border:1px solid var(--hair);border-radius:11px;background:rgba(255,255,255,.014)}
.recluster .lab{font-size:12px;color:var(--text)}
.recluster .sub{font-size:11px;color:var(--dim);margin-top:2px}
.pop-wrap{position:relative}
.chip-btn{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--text);border:1px solid var(--hair-2);border-radius:7px;padding:5px 9px;transition:background .14s ease}
.chip-btn:hover{background:rgba(255,255,255,.06)}
.chip-btn .icon{width:12px;height:12px;color:var(--dim)}
.pop{
  position:absolute;bottom:calc(100% + 8px);right:0;
  background:var(--panel);border:1px solid var(--hair-2);border-radius:11px;
  box-shadow:var(--shadow);padding:9px;z-index:20;width:200px;
  transform-origin:bottom right;opacity:0;transform:scale(.96) translateY(4px);pointer-events:none;
  transition:opacity .16s var(--ease-out),transform .16s var(--ease-out);
}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.pop .ptitle{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim-2);padding:2px 4px 8px}
.pop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pop-grid button{
  font-family:var(--mono);font-size:12px;color:var(--dim);border:1px solid var(--hair);border-radius:7px;padding:8px 0;
  transition:background .12s ease,color .12s ease,border-color .12s ease;
}
.pop-grid button.wide{grid-column:span 3;font-family:var(--sans);font-size:11.5px}
.pop-grid button:hover{background:rgba(255,255,255,.05);color:var(--text)}
.pop-grid button.on{background:var(--accent-soft);color:var(--accent-2);border-color:rgba(99,102,241,.4)}

/* stats rail */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{border:1px solid var(--hair);border-radius:12px;padding:13px;background:rgba(255,255,255,.014)}
.stat .v{font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--dim);margin-top:7px}
.stat .s{font-size:10.5px;color:var(--dim-2);margin-top:2px}
.topic{margin-bottom:12px}
.topic-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:6px}
.topic-top .pct{font-family:var(--mono);font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.topic-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.05);overflow:hidden;position:relative}
.topic-fill{position:absolute;inset:0 auto 0 0;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transform-origin:left;transform:scaleX(0);transition:transform .6s var(--ease-out)}

/* ask rail */
.ask-thread{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.msg{max-width:88%;font-size:12.5px;line-height:1.55}
.msg .rlab{font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--dim-2);margin-bottom:5px}
.msg.user{align-self:flex-end;text-align:left}
.msg.user .bub{background:var(--accent);color:#fff;border-radius:13px 13px 4px 13px;padding:9px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.msg.assistant .bub{background:rgba(255,255,255,.035);border:1px solid var(--hair);color:rgba(231,232,234,.9);border-radius:13px 13px 13px 4px;padding:10px 12px}
.composer{flex:none;border-top:1px solid var(--hair);padding:12px 16px}
.composer .field{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--hair-2);border-radius:12px;padding:8px 8px 8px 12px;background:rgba(255,255,255,.02);transition:border-color .15s ease}
.composer .field:focus-within{border-color:var(--accent)}
.composer textarea{flex:1;background:none;border:none;outline:none;resize:none;font-size:12.5px;line-height:1.5;max-height:110px;min-height:20px}
.composer textarea::placeholder{color:var(--dim-2)}
.send{width:30px;height:30px;flex:none;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;transition:background .15s ease,opacity .15s ease}
.send:hover{background:var(--accent-2)}
.send:disabled{opacity:.4;cursor:default}
.send .icon{width:14px;height:14px}
.privacy-note{font-size:10.5px;color:var(--dim-2);margin-top:8px;display:flex;align-items:center;gap:6px}
.privacy-note .icon{width:12px;height:12px;color:var(--marcus);opacity:.8}

/* ---------------------------- COMMAND PALETTE ---------------------------- */
.cmdk-overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(6,7,9,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;
  padding-top:12vh;
  opacity:0;pointer-events:none;transition:opacity .12s var(--ease-out);
}
.cmdk-overlay.open{opacity:1;pointer-events:auto}
.cmdk{
  width:min(600px,92vw);max-height:64vh;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--hair-2);border-radius:15px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;
  transform:scale(.97);opacity:0;transform-origin:center;
  transition:transform .12s var(--ease-out),opacity .12s var(--ease-out);
}
.cmdk-overlay.open .cmdk{transform:none;opacity:1}
.cmdk-input{display:flex;align-items:center;gap:11px;padding:15px 16px;border-bottom:1px solid var(--hair)}
.cmdk-input .icon{width:17px;height:17px;color:var(--dim)}
.cmdk-input input{flex:1;background:none;border:none;outline:none;font-size:15px;color:var(--text)}
.cmdk-input input::placeholder{color:var(--dim-2)}
.cmdk-input .esc{font-family:var(--mono);font-size:10.5px;color:var(--dim-2);border:1px solid var(--hair);border-radius:5px;padding:2px 6px}
.cmdk-list{overflow-y:auto;padding:8px;flex:1}
.cmdk-group{font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim-2);padding:9px 9px 5px}
.cmdk-item{
  display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:9px;
  font-size:13.5px;color:var(--text);text-align:left;
}
.cmdk-item .icon{width:16px;height:16px;color:var(--dim);flex:none}
.cmdk-item.sel{background:var(--accent-soft)}
.cmdk-item.sel .icon{color:var(--accent-2)}
.cmdk-item .hint{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim-2);font-variant-numeric:tabular-nums}
.cmdk-item.danger{color:var(--danger)}
.cmdk-item.danger .icon,.cmdk-item.danger.sel .icon{color:var(--danger)}
.cmdk-item .av{width:20px;height:20px;font-size:8.5px}
.cmdk-empty{padding:26px;text-align:center;color:var(--dim-2);font-size:13px}

/* ---------------------------- TOAST ---------------------------- */
.toast-host{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:var(--panel-2);border:1px solid var(--hair-2);border-radius:10px;
  padding:9px 14px;font-size:12.5px;color:var(--text);box-shadow:var(--shadow-sm);
  display:flex;align-items:center;gap:9px;
  opacity:0;transform:translateY(8px);transition:opacity .2s var(--ease-out),transform .22s var(--ease-out);
}
.toast.in{opacity:1;transform:none}
.toast .icon{width:14px;height:14px;color:var(--accent-2)}

/* ---------------------------- RESPONSIVE ---------------------------- */
@media (max-width:980px){
  .cmdk-btn{min-width:150px}
  .title{max-width:30vw}
}
@media (max-width:880px){
  .workspace{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .workspace.collapsed{grid-template-columns:1fr}
  .seam{display:none}
  .rail{border-left:none;border-top:1px solid var(--hair);max-height:46vh}
  .rail.hiding{transform:translateY(14px)}
  .leftpane{min-height:0}
  .meta{display:none}
}
@media (max-width:640px){
  .topbar{gap:8px;padding:0 10px}
  .cmdk-btn .lbl{display:none}
  .cmdk-btn{min-width:0;padding:0 9px}
  .tbtn .tlabel{display:none}
  .title{max-width:38vw}
}

/* ---------------------------- REDUCED MOTION ---------------------------- */
@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto}
  .seg .pill{transition:opacity .15s ease}
  .spk-fill,.topic-fill{transition:none}
  .mini-block{transition:opacity .15s ease}
  .tldr.shimmer{animation:none;-webkit-text-fill-color:currentColor;color:var(--text)}
  .rpanel,.rpanel.active{transition:opacity .18s ease}
  button:active{transform:none}
  .turn.flash{animation:flash .6s ease}
}
@media (hover:none){
  .pencil{opacity:1}
}

  /* ================= SEARCH / FILTER ================= */
  var findInput = $("#findInput"), findCount = $("#findCount"), finder = $("#finder");
  function applySearch(q){
    q = (q||"").trim();
    findInput.value = q;
    var matchTurns = 0, matchHits = 0;
    var rx = q ? new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig") : null;
    turns.forEach(function(t, i){
      if(!q){
        t.line.textContent = t.text;
        t.el.classList.remove("hidden");
        if(miniBlocks[i]) miniBlocks[i].classList.remove("dim","match");
        return;
      }
      var hits = (t.text.match(rx)||[]).length;
      if(hits>0){
        matchTurns++; matchHits += hits;
        t.el.classList.remove("hidden");
        t.line.innerHTML = esc(t.text).replace(rx, "<mark>$1</mark>");
        if(miniBlocks[i]){ miniBlocks[i].classList.add("match"); miniBlocks[i].classList.remove("dim"); }
      } else {
        t.el.classList.add("hidden");
        t.line.textContent = t.text;
        if(miniBlocks[i]){ miniBlocks[i].classList.add("dim"); miniBlocks[i].classList.remove("match"); }
      }
    });
    finder.classList.toggle("active", !!q);
    if(q){
      findCount.textContent = matchHits + (matchHits===1?" match":" matches");
      emptyState.classList.toggle("show", matchTurns===0);
    } else {
      findCount.textContent = "";
      emptyState.classList.remove("show");
    }
  }

  /* ================= TRANSPORT / PLAYBACK ================= */
  var playhead = 0, playing = false, rafPlay = null, lastNow = 0, track = "mix";
  var playBtn = $("#playBtn"), clock = $("#clock"), waveWrap = $("#waveWrap");
  var canvas = $("#wave"), ctx = canvas.getContext("2d");
  var SEED = { mix:1.7, mic:3.3, meeting:5.1 };

  function updateClock(){
    clock.innerHTML = "<b>"+fmt(playhead)+"</b> / "+fmt(DUR);
    waveWrap.setAttribute("aria-valuenow", Math.round(playhead/DUR*100));
  }
  function barAmp(i, seed){
    var x = Math.sin((i+1)*(seed*0.9)+seed*13.1)*43758.5453; x = x - Math.floor(x);
    var y = Math.sin((i+1)*(seed*0.31)+seed*7.7)*8901.77; y = y - Math.floor(y);
    var env = 0.55 + 0.45*Math.sin(i*0.09 + seed);
    return 0.14 + (0.55*x + 0.45*y) * 0.86 * (0.6+0.4*env);
  }
  function drawWave(){
    var dpr = window.devicePixelRatio || 1;
    var w = waveWrap.clientWidth, h = waveWrap.clientHeight;
    if(w===0||h===0) return;
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    var seed = SEED[track] || 1.7;
    var bw = 2, gap = 2, n = Math.floor(w/(bw+gap));
    var progX = (playhead/DUR)*w;
    var mid = h/2;
    for(var i=0;i<n;i++){
      var x = i*(bw+gap);
      var amp = barAmp(i, seed) * (h*0.46);
      var played = x < progX;
      ctx.fillStyle = played ? "rgba(129,140,248,.95)" : "rgba(255,255,255,.15)";
      var bh = Math.max(2, amp);
      var r = 1;
      roundRect(ctx, x, mid-bh, bw, bh*2, r);
      ctx.fill();
    }
    // playhead line
    ctx.fillStyle = "rgba(99,102,241,1)";
    ctx.fillRect(progX-0.75, 0, 1.5, h);
    ctx.beginPath(); ctx.arc(progX, 2, 2.4, 0, Math.PI*2); ctx.fillStyle="rgba(129,140,248,1)"; ctx.fill();
  }
  function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

  ]);
  buildMenu($("#moreMenu"), [
    { icon:"tidy", label:"Tidy transcript", run:function(){ toast("Transcript tidied with Claude", "tidy"); } },
    { icon:"phone", label:"Sync to phone", run:function(){ toast("Syncing to iPhone", "phone"); } },
    { sep:true },
    { icon:"undo", label:"Undo tidy", run:function(){ toast("Reverted to original transcript", "undo"); } },
    { icon:"reprocess", label:"Reprocess audio", run:function(){ toast("Reprocessing on GPU", "reprocess"); } },
    { icon:"trash", label:"Delete meeting", danger:true, run:function(){ toast("Meeting moved to Trash", "trash"); } }
  ]);

  function bindMenu(btnId, wrapId, menuId){
    var btn=$("#"+btnId), wrap=$("#"+wrapId), menu=$("#"+menuId), hideT=null;
    function open(){ closeMenus(menu); clearTimeout(hideT); menu.classList.add("open"); btn.setAttribute("aria-expanded","true"); }
    function close(){ menu.classList.remove("open"); btn.setAttribute("aria-expanded","false"); }
    btn.addEventListener("click", function(e){ e.stopPropagation(); menu.classList.contains("open")?close():open(); });
    wrap.addEventListener("mouseenter", open);
    wrap.addEventListener("mouseleave", function(){ hideT = setTimeout(close, 140); });
    menu._close = close;
  }
  function closeMenus(except){ $$(".menu.open").forEach(function(m){ if(m!==except && m._close) m._close(); else if(m!==except){ m.classList.remove("open"); } }); }
  bindMenu("exportBtn","exportWrap","exportMenu");
  bindMenu("moreBtn","moreWrap","moreMenu");
  document.addEventListener("click", function(e){ if(!e.target.closest(".menu-wrap")) closeMenus(); });

  function plainTranscript(){
    return D.TRANSCRIPT.map(function(t){ return names[t.s]+" ("+fmt(t.t)+"): "+t.text; }).join("\n\n");
  }
  function mdTranscript(){
    return "# "+M.title+"\n\n"+D.TRANSCRIPT.map(function(t){ return "**"+names[t.s]+"** `"+fmt(t.t)+"`\n"+t.text; }).join("\n\n");
  }

  /* ================= PRIVACY SHIELD tooltip via toast ================= */
  $("#shield").addEventListener("click", function(){ toast("Audio never leaves this Mac. Only transcript text goes to Claude.", "shield"); });

  /* ================= TOAST ================= */
  var toastHost = $("#toastHost");
  function toast(msg, icon){
    var t = document.createElement("div"); t.className="toast";
    t.innerHTML = '<span class="icon">'+(ICON[icon]||ICON.check)+'</span>'+esc(msg);
    toastHost.appendChild(t);
    requestAnimationFrame(function(){ t.classList.add("in"); });
    setTimeout(function(){ t.classList.remove("in"); setTimeout(function(){ t.remove(); }, 260); }, 2100);
  }
  function copy(text, msg){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast(msg,"copy"); }, function(){ toast(msg,"copy"); });
    } else { toast(msg,"copy"); }
  }

  /* ================= COMMAND PALETTE ================= */
  var overlay = $("#cmdkOverlay"), cmdkInput = $("#cmdkInput"), cmdkList = $("#cmdkList");
  var firstTurnOf = {};
  turns.forEach(function(t,i){ if(firstTurnOf[t.s]===undefined) firstTurnOf[t.s]=i; });

  var COMMANDS = [
    { g:"Suggested", label:"Summarize meeting", icon:"sparkle", primary:true, run:function(){ setView("summary"); $("#regenBtn").click(); } },
    { g:"Actions", label:"Tidy transcript", icon:"tidy", run:function(){ toast("Transcript tidied with Claude","tidy"); } },
    { g:"Actions", label:"Sync to phone", icon:"phone", run:function(){ toast("Syncing to iPhone","phone"); } },
    { g:"Actions", label:"Copy transcript", icon:"copy", run:function(){ copy(plainTranscript(),"Transcript copied"); } },
    { g:"Actions", label:"Copy as Markdown", icon:"md", run:function(){ copy(mdTranscript(),"Markdown copied"); } },
    { g:"Actions", label:"Save as .txt", icon:"txt", run:function(){ toast("Saved transcript.txt","txt"); } },
    { g:"Actions", label:"Reveal in Finder", icon:"finder", run:function(){ toast("Revealed in Finder","finder"); } },
    { g:"Actions", label:"Undo tidy", icon:"undo", run:function(){ toast("Reverted to original transcript","undo"); } },
    { g:"Actions", label:"Reprocess audio", icon:"reprocess", run:function(){ toast("Reprocessing on GPU","reprocess"); } },
    { g:"Actions", label:"Delete meeting", icon:"trash", danger:true, run:function(){ toast("Meeting moved to Trash","trash"); } },
    { g:"Navigate", label:"Jump to first line", icon:"top", run:function(){ scrollToTurn(0,false); } },
    { g:"Navigate", label:"Jump to last line", icon:"bottom", run:function(){ scrollToTurn(turns.length-1,false); } },
    { g:"View", label:"Show Summary", icon:"sparkle", run:function(){ setRail(true); setView("summary"); } },
    { g:"View", label:"Show Speakers", icon:"users", run:function(){ setRail(true); setView("speakers"); } },
    { g:"View", label:"Show Stats", icon:"chart", run:function(){ setRail(true); setView("stats"); } },
    { g:"View", label:"Show Ask", icon:"chat", run:function(){ setRail(true); setView("ask"); } },
    { g:"View", label:"Increase text size", icon:"plus", run:function(){ setSize(size+1); } },
    { g:"View", label:"Decrease text size", icon:"minus", run:function(){ setSize(size-1); } },
    { g:"View", label:"Toggle context rail", icon:"panel", run:function(){ setRail(collapsed); } }
  ];
  // speaker jump commands (use live names)
  function speakerCommands(){
    return Object.keys(SP).map(function(key){
      return { g:"Navigate", label:"Jump to "+names[key], icon:"__spk", spkKey:key,
        run:function(){ if(firstTurnOf[key]!==undefined) scrollToTurn(firstTurnOf[key], true); } };
    });
  }

  var cmSelIndex = 0, cmFlat = [];
  function fuzzy(q, s){
    q=q.toLowerCase(); s=s.toLowerCase();
    if(s.indexOf(q)>=0) return true;
    var i=0; for(var j=0;j<s.length && i<q.length;j++){ if(s[j]===q[i]) i++; } return i===q.length;
  }
  function renderCmdk(){
    var q = cmdkInput.value.trim();
    cmdkList.innerHTML = ""; cmFlat = [];
    var groups = [];

    if(q){
      var hits = turns.reduce(function(a,t){ return a + (t.text.match(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig"))||[]).length; }, 0);
      groups.push({ name:"Search", items:[{ label:'Search transcript for "'+q+'"', icon:"search", hint: hits+(hits===1?" hit":" hits"),
        run:function(){ setRail(true); closeCmdk(); applySearch(q); setTimeout(function(){ findInput.focus(); },0); } }] });
    }

    var all = COMMANDS.concat(speakerCommands());
    var byGroup = {};
    all.forEach(function(c){
      if(q && !fuzzy(q, c.label)) return;
      (byGroup[c.g] = byGroup[c.g] || []).push(c);
    });
    ["Suggested","Navigate","Actions","View"].forEach(function(gn){
      if(byGroup[gn] && byGroup[gn].length) groups.push({ name:gn, items:byGroup[gn] });
    });

    if(groups.length===0){ cmdkList.innerHTML = '<div class="cmdk-empty">No commands match.</div>'; return; }

    groups.forEach(function(gr){
      var gl = document.createElement("div"); gl.className="cmdk-group"; gl.textContent=gr.name; cmdkList.appendChild(gl);
      gr.items.forEach(function(it){
        var idx = cmFlat.length;
        var b = document.createElement("button");
        b.className = "cmdk-item" + (it.danger?" danger":"");
        b.setAttribute("data-idx", idx);
        var iconHtml;
        if(it.icon==="__spk"){ iconHtml = '<span class="av" style="background:'+SP[it.spkKey].color+'">'+SP[it.spkKey].initials+'</span>'; }
        else { iconHtml = '<span class="icon">'+ICON[it.icon]+'</span>'; }
        b.innerHTML = iconHtml + '<span>'+esc(it.label)+'</span>' + (it.hint?'<span class="hint">'+esc(it.hint)+'</span>':(it.primary?'<span class="hint">'+(MAC?"⏎":"Enter")+'</span>':''));
        b.addEventListener("mousemove", function(){ setSel(idx); });
        b.addEventListener("click", function(){ it.run(); if(it.label.indexOf("text size")<0) closeCmdk(); });
        cmdkList.appendChild(b);
        cmFlat.push({ el:b, run:it.run, keepOpen: it.label.indexOf("text size")>=0 });
      });
    });
    setSel(0);
  }
  function setSel(i){
    if(cmFlat.length===0) return;
    cmSelIndex = Math.max(0, Math.min(cmFlat.length-1, i));
    cmFlat.forEach(function(c,j){ c.el.classList.toggle("sel", j===cmSelIndex); });
    var el = cmFlat[cmSelIndex].el;
    var lr = el.getBoundingClientRect(), pr = cmdkList.getBoundingClientRect();
    if(lr.bottom>pr.bottom) cmdkList.scrollTop += lr.bottom-pr.bottom+8;
    else if(lr.top<pr.top) cmdkList.scrollTop -= pr.top-lr.top+8;
  }
  function openCmdk(){
    overlay.classList.add("open");
    cmdkInput.value=""; renderCmdk();
    setTimeout(function(){ cmdkInput.focus(); }, 20);
  }
  function closeCmdk(){ overlay.classList.remove("open"); }
  $("#cmdkBtn").addEventListener("click", openCmdk);
  cmdkInput.addEventListener("input", renderCmdk);
  cmdkInput.addEventListener("keydown", function(e){
    if(e.key==="ArrowDown"){ setSel(cmSelIndex+1); e.preventDefault(); }
    else if(e.key==="ArrowUp"){ setSel(cmSelIndex-1); e.preventDefault(); }
    else if(e.key==="Enter"){ var c=cmFlat[cmSelIndex]; if(c){ c.run(); if(!c.keepOpen) closeCmdk(); } e.preventDefault(); }
    else if(e.key==="Escape"){ closeCmdk(); }
  });
  overlay.addEventListener("click", function(e){ if(e.target===overlay) closeCmdk(); });

  document.addEventListener("keydown", function(e){
    if((e.metaKey||e.ctrlKey) && (e.key==="k"||e.key==="K")){ e.preventDefault(); overlay.classList.contains("open")?closeCmdk():openCmdk(); }
    else if((e.metaKey||e.ctrlKey) && (e.key==="f"||e.key==="F")){ e.preventDefault(); setRail(true); findInput.focus(); findInput.select(); }
    else if(e.key==="Escape"){ closeMenus(); }
  });

  /* ================= INIT ================= */
  setSize(16);
  updateClock(); drawWave(); updateMiniHead(); onReaderScroll();
  // re-measure the tab pill once the webfont has swapped in (button widths shift)
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(function(){ var a=seg.querySelector('[aria-selected="true"]'); if(a) movePill(a); drawWave(); }); }
  window.addEventListener("resize", function(){ setTimeout(drawWave, 60); });
  if(window.ResizeObserver){ new ResizeObserver(function(){ drawWave(); }).observe(waveWrap); }
})();
</script>
