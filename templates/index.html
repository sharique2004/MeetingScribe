<!DOCTYPE html>
<html lang="en" data-theme="teal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeetingScribe</title>
<!-- Aurora type. Fully progressive: every family below has a system fallback in
     its CSS stack, so the app is unchanged if these never load. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================== TOKENS ============================== */
/* Converged Aurora stylesheet (ui-demos/converged.html), lifted verbatim.
   The only departure: the night-base colours live on the html[data-theme]
   blocks below so the appearance picker keeps working — converged's own
   values ARE the "teal" palette. Legacy token names are aliased so every
   functional rule further down resolves against the same table. */
@property --angle { syntax:'<angle>'; initial-value:0deg; inherits:false; }

:root{
  --aqua:#5eead4;
  --aqua-2:#7dd3fc;
  --aqua-soft:rgba(94,234,212,.12);
  --aqua-line:rgba(94,234,212,.32);
  --aqua-ink:#04211c;

  --v-blue:#3b82f6; --v-blue2:#60a5fa; --v-lav:#a5b4fc; --v-vio:#c4b5fd;

  --ease-out:cubic-bezier(0.22,1,0.32,1);
  --ease-in-out:cubic-bezier(0.77,0,0.175,1);
  --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --ease:cubic-bezier(0.4,0,0.2,1);
  --spring:cubic-bezier(0.34,1.28,0.64,1);

  --reader:16px;
  --side-w:248px;
  --seam-w:18px;
  --rail-w:340px;

  --r-lg:18px; --r-md:13px; --r-sm:9px;

  --sans:"Hanken Grotesk",system-ui,sans-serif;
  --display:"Bricolage Grotesque",var(--sans);
  --mono:"JetBrains Mono",ui-monospace,monospace;

  /* legacy aliases — older rules and inline styles keep resolving */
  --font-ui:var(--sans); --font-display:var(--display); --font-mono:var(--mono);
  --side-bg:var(--bg-sidebar); --rail-bg:var(--bg-sidebar);
  --hair:var(--border); --hair-lit:var(--border-strong);
  --dim:var(--text-dim); --faint:var(--text-faint);
  --ghost:color-mix(in oklab, var(--text) 30%, transparent);
  --panel-glass:rgba(16,16,26,.94);
  --accent:var(--aqua); --accent-ink:var(--aqua-ink);
}
/* Teal is the Aurora default — converged's own night base. */
html[data-theme="teal"] {
  color-scheme: dark;
  --bg: #0a0a12; --bg-sidebar: #0b0b14;
  --panel: rgba(255,255,255,.03); --panel-2: rgba(255,255,255,.055); --panel-3: rgba(255,255,255,.09);
  --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.14);
  --bg-hover: rgba(255,255,255,.045);
  --text: #e7e9f2; --text-dim: rgba(231,233,242,.62); --text-faint: rgba(231,233,242,.40);
  --shadow-pop: 0 18px 48px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  --ok: #2fbf87; --warn: #e0b341; --danger: #f0616a;
  --mark-bg: rgba(94,234,212,.22);
  --accent: #5eead4; --accent-ink: #04211c;
  --spk-a: #c07af6; --spk-b: #2fbf87; --spk-c: #7dd3fc;
  --avatar-ink: #04120f;
}
html[data-theme="graphite"] {
  color-scheme: dark;
  --bg: #0b0d12; --bg-sidebar: #0d0f15;
  --panel: rgba(255,255,255,.035); --panel-2: rgba(255,255,255,.06); --panel-3: rgba(255,255,255,.10);
  --border: rgba(255,255,255,.09); --border-strong: rgba(255,255,255,.15);
  --bg-hover: rgba(255,255,255,.05);
  --text: #eef1f7; --text-dim: rgba(238,241,247,.62); --text-faint: rgba(238,241,247,.40);
  --shadow-pop: 0 18px 48px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  --ok: #2fbf87; --warn: #e0b341; --danger: #f0616a;
  --mark-bg: rgba(125,211,252,.24);
  --accent: #7dd3fc; --accent-ink: #04222e;
  --spk-a: #c07af6; --spk-b: #2fbf87; --spk-c: #5b8cff;
  --avatar-ink: #04120f;
}
html[data-theme="indigo"] {
  color-scheme: dark;
  --bg: #0c0c1a; --bg-sidebar: #0e0e20;
  --panel: rgba(255,255,255,.035); --panel-2: rgba(255,255,255,.06); --panel-3: rgba(255,255,255,.10);
  --border: rgba(255,255,255,.09); --border-strong: rgba(255,255,255,.15);
  --bg-hover: rgba(255,255,255,.05);
  --text: #ecedfa; --text-dim: rgba(236,237,250,.62); --text-faint: rgba(236,237,250,.40);
  --shadow-pop: 0 18px 48px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  --ok: #2fbf87; --warn: #e0b341; --danger: #f0616a;
  --mark-bg: rgba(165,180,252,.26);
  --accent: #a5b4fc; --accent-ink: #0b1030;
  --spk-a: #7dd3fc; --spk-b: #2fbf87; --spk-c: #c07af6;
  --avatar-ink: #0b1030;
}
html[data-theme="ember"] {
  color-scheme: dark;
  --bg: #12100c; --bg-sidebar: #14110d;
  --panel: rgba(255,255,255,.035); --panel-2: rgba(255,255,255,.06); --panel-3: rgba(255,255,255,.10);
  --border: rgba(255,255,255,.09); --border-strong: rgba(255,255,255,.15);
  --bg-hover: rgba(255,255,255,.05);
  --text: #f4f0ea; --text-dim: rgba(244,240,234,.62); --text-faint: rgba(244,240,234,.40);
  --shadow-pop: 0 18px 48px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  --ok: #2fbf87; --warn: #f0b441; --danger: #f0616a;
  --mark-bg: rgba(246,165,79,.26);
  --accent: #f6a54f; --accent-ink: #2a1600;
  --spk-a: #7dd3fc; --spk-b: #2fbf87; --spk-c: #c07af6;
  --avatar-ink: #2a1600;
}
html[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f5f8; --bg-sidebar: #eceef3;
  --panel: rgba(18,20,40,.03); --panel-2: rgba(18,20,40,.05); --panel-3: rgba(18,20,40,.08);
  --border: rgba(18,20,40,.10); --border-strong: rgba(18,20,40,.17);
  --bg-hover: rgba(18,20,40,.05);
  --text: #14161f; --text-dim: rgba(20,22,31,.62); --text-faint: rgba(20,22,31,.42);
  --shadow-pop: 0 18px 48px rgba(20,22,55,.16), 0 0 0 1px rgba(18,20,40,.06);
  --ok: #0f8a5f; --warn: #a3700a; --danger: #d0453c;
  --mark-bg: rgba(13,148,136,.26);
  --accent: #0d9488; --accent-ink: #ffffff;
  --spk-a: #7c3aed; --spk-b: #0d9488; --spk-c: #2563eb;
  --avatar-ink: #ffffff;
  --panel-glass: rgba(246,247,250,.96);
}

/* ============================== RESET ============================== */
*{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow:hidden;
}
button{ font:inherit; color:inherit; background:none; border:none; margin:0; padding:0; cursor:pointer; }
input,textarea,select{ font:inherit; color:inherit; }
::selection{ background:rgba(94,234,212,.24); color:#fff; }
mark{ background:rgba(94,234,212,.22); color:#eafffb; border-radius:3px; padding:0 1px; box-shadow:0 0 0 1px rgba(94,234,212,.25); }
html[data-theme="light"] mark{ color:inherit; }
:focus-visible{ outline:2px solid var(--aqua); outline-offset:2px; border-radius:6px; }
@media (hover:hover) and (pointer:fine){ button:active{ transform:scale(.97); } }
.icon{ width:16px; height:16px; display:block; flex:none; }
.icon svg{ width:100%; height:100%; display:block; }
.vh{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; }

/* ============================== AURORA WASH ============================== */
.bg{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.bg .blob{ position:absolute; border-radius:50%; filter:blur(84px); mix-blend-mode:screen; will-change:transform; }
.b1{ width:52vw; height:52vw; left:6vw; top:-30vh; background:radial-gradient(circle at 42% 42%, var(--v-blue), transparent 62%); opacity:.36; animation:drift1 62s var(--ease-in-out) infinite; }
.b2{ width:42vw; height:42vw; right:-6vw; top:-26vh; background:radial-gradient(circle at 50% 50%, var(--v-lav), transparent 60%); opacity:.34; animation:drift2 74s var(--ease-in-out) infinite; }
.b3{ width:44vw; height:44vw; left:34vw; top:-24vh; background:radial-gradient(circle at 50% 50%, var(--v-vio), transparent 60%); opacity:.22; animation:drift3 88s var(--ease-in-out) infinite; }
.b4{ width:30vw; height:30vw; right:6vw; top:-12vh; background:radial-gradient(circle at 50% 50%, var(--aqua), transparent 64%); opacity:.14; animation:drift1 96s var(--ease-in-out) infinite reverse; }
.bg::after{ content:""; position:absolute; inset:0; background:linear-gradient(to bottom, transparent 0%, rgba(10,10,18,.5) 30%, var(--bg) 56%); }
html[data-theme="light"] .bg{ display:none; }

@keyframes drift1{ 0%,100%{ transform:translate3d(0,0,0) scale(1);} 50%{ transform:translate3d(5vw,3vw,0) scale(1.1);} }
@keyframes drift2{ 0%,100%{ transform:translate3d(0,0,0) scale(1.04);} 50%{ transform:translate3d(-4vw,4vw,0) scale(.95);} }
@keyframes drift3{ 0%,100%{ transform:translate3d(0,0,0) scale(1);} 50%{ transform:translate3d(3vw,-2vw,0) scale(1.08);} }

/* ============================== SHELL (3 zones + seam) ============================== */
.shell{
  position:relative; z-index:1; height:100%; height:100dvh;
  display:grid;
  grid-template-columns:
    minmax(0,var(--side-w)) minmax(0,1fr) minmax(0,var(--seam-w)) minmax(0,var(--rail-w));
  /* one definite row: content (a long meetings list) must never size the shell */
  grid-template-rows:minmax(0,1fr);
}
.shell.rail-off{ --rail-w:0px; --seam-w:0px; }
.shell.no-seam{ --seam-w:0px; }
.shell.no-seam .seam{ display:none; }
#main{ display:contents; }
.sidebar{ grid-column:1; }
.pane{ grid-column:2; }
.seam{ grid-column:3; }
.rail{ grid-column:4; }
.pane.full{ grid-column:2 / -1; }

.scrim{ position:fixed; inset:0; background:rgba(6,7,11,.5); backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); z-index:65; opacity:0; pointer-events:none; transition:opacity .28s var(--ease-out); }

/* ============================== ZONE 1 · SIDEBAR ============================== */
.sidebar{
  position:relative; z-index:2; min-width:0; display:flex; flex-direction:column;
  background:linear-gradient(180deg,rgba(255,255,255,.016),transparent 26%),var(--side-bg);
  border-right:1px solid var(--hair);
}
.side-head{ flex:none; display:flex; align-items:center; gap:10px; padding:18px 16px 14px; }
.logo{
  width:28px; height:28px; flex:none; border-radius:9px;
  background:linear-gradient(150deg,var(--aqua),#3fbfaa);
  display:grid; place-items:center; color:var(--aqua-ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 0 16px rgba(94,234,212,.28);
}
.logo .icon{ width:15px; height:15px; }
.brandname{ font-family:var(--display); font-size:15.5px; font-weight:600; letter-spacing:-.01em; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.side-collapse{ width:28px; height:28px; flex:none; display:grid; place-items:center; border-radius:8px; color:var(--ghost); transition:background .16s var(--ease), color .16s var(--ease); }
.side-collapse:hover{ background:rgba(255,255,255,.06); color:var(--text); }
.side-collapse .icon{ width:17px; height:17px; }

.side-top{ flex:none; padding:0 14px 12px; display:flex; flex-direction:column; gap:10px; }
.new-rec{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%; height:40px; border-radius:12px;
  font-family:var(--sans); font-weight:600; font-size:13px; color:var(--aqua-ink);
  background:linear-gradient(180deg,#7ff0dd,#4fd8c2);
  box-shadow:0 0 18px rgba(94,234,212,.22), inset 0 1px 0 rgba(255,255,255,.32);
  transition:box-shadow .25s var(--ease), transform .12s var(--ease-out);
}
.new-rec:hover{ box-shadow:0 0 24px rgba(94,234,212,.4); }
.new-rec:active{ transform:scale(.97); }
.new-rec.is-active{ outline:2px solid var(--aqua-line); outline-offset:2px; }
.new-rec .icon{ width:15px; height:15px; }
.side-search{
  display:flex; align-items:center; gap:8px; height:38px; padding:0 11px;
  border:1px solid var(--hair); border-radius:11px; background:rgba(255,255,255,.02);
  transition:border-color .18s var(--ease), background .18s var(--ease);
}
.side-search:focus-within{ border-color:var(--aqua-line); background:rgba(94,234,212,.04); }
.side-search .icon{ width:14px; height:14px; color:var(--ghost); }
.side-search:focus-within .icon{ color:var(--aqua); }
.side-search input{ flex:1; background:none; border:none; outline:none; font-size:13px; min-width:0; }
.side-search input::placeholder{ color:var(--ghost); }

.meet-list{ flex:1; min-height:0; overflow-y:auto; padding:4px 10px 22px; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.14) transparent; }
.meet-list::-webkit-scrollbar{ width:9px; }
.meet-list::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.1); border-radius:9px; border:2px solid transparent; background-clip:padding-box; }
.glabel{ font-size:10px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); padding:16px 8px 7px; }
.meet-group:first-child .glabel{ padding-top:6px; }
.meet-item{
  display:block; width:100%; text-align:left; padding:9px 10px; border-radius:10px;
  border:1px solid transparent; margin-bottom:2px; position:relative;
  transition:background .16s var(--ease), border-color .16s var(--ease);
}
.meet-item:hover{ background:rgba(255,255,255,.035); }
.meet-item.active{ background:rgba(255,255,255,.05); border-color:var(--hair); }
.meet-item .mt{ display:flex; align-items:center; gap:7px; overflow:hidden; }
.meet-item .name{ min-width:0; flex:0 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:13px; font-weight:500; color:rgba(231,233,242,.82); letter-spacing:-.005em; }
html[data-theme="light"] .meet-item .name{ color:var(--text); }
.meet-item.active .name{ font-weight:600; color:var(--text); }
.meet-item .adot{ flex:none; width:6px; height:6px; border-radius:50%; background:var(--aqua); box-shadow:0 0 7px rgba(94,234,212,.75); opacity:0; transition:opacity .18s var(--ease); }
.meet-item.active .adot{ opacity:1; }
.meet-item .mm{ font-family:var(--mono); font-size:10.5px; color:var(--faint); margin-top:4px; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.meet-item .mm .st{ display:inline-flex; align-items:center; gap:4px; }
.meet-item .mm .st .dot{ width:5px; height:5px; border-radius:50%; display:inline-block; }
.meet-item .mm .st.processing{ color:var(--warn); } .meet-item .mm .st.processing .dot{ background:var(--warn); }
.meet-item .mm .st.error{ color:var(--danger); } .meet-item .mm .st.error .dot{ background:var(--danger); }
.meet-item .mm .st.recording{ color:var(--danger); } .meet-item .mm .st.recording .dot{ background:var(--danger); animation:ms-blink 1.4s ease-in-out infinite; }

/* ============================== ZONE 2 · TRANSCRIPT PANE ============================== */
.pane{ position:relative; z-index:1; min-width:0; display:flex; flex-direction:column; }

.pane-top{
  flex:none; min-height:66px; display:flex; align-items:center; gap:14px; padding:0 26px;
  border-bottom:1px solid var(--hair);
  background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);
  position:relative; z-index:20;
}
.side-toggle{ display:none; width:34px; height:34px; align-items:center; justify-content:center; border-radius:10px; color:var(--dim); border:1px solid var(--hair); flex:none; transition:background .16s var(--ease), color .16s var(--ease); }
.side-toggle:hover{ background:rgba(255,255,255,.06); color:var(--text); }
.side-toggle .icon{ width:17px; height:17px; }
/* desktop sidebar collapse */
.shell.side-collapsed{ --side-w:0px; }
@media (min-width:901px){
  .sidebar.hiding{ opacity:0; transform:translateX(-16px); transition:opacity .2s var(--ease-out), transform .22s var(--ease-drawer); }
  .shell.side-collapsed .side-toggle{ display:inline-flex; }
}
.title-wrap{ min-width:0; }
.title{
  font-family:var(--display); font-size:26px; font-weight:600; letter-spacing:-.02em; line-height:1.1;
  padding:2px 8px; margin:-2px -8px; border-radius:9px;
  outline:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:44vw;
  background:linear-gradient(105deg,#c9cde0 0%,#c9cde0 40%,#ffffff 50%,#c9cde0 60%,#c9cde0 100%);
  background-size:230% 100%;
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  caret-color:var(--aqua);
  animation:shimmer 6.5s linear infinite;
}
@keyframes shimmer{ to{ background-position:-230% 0; } }
.title:hover{ box-shadow:0 1px 0 rgba(255,255,255,.14); }
.title:focus{ -webkit-text-fill-color:var(--text); background:none; animation:none; box-shadow:0 0 0 1px var(--hair-lit); }
html[data-theme="light"] .title{ animation:none; background:none; -webkit-text-fill-color:var(--text); }
.spacer{ flex:1; }
.pane-tools{ display:flex; align-items:center; gap:9px; flex:none; }

.cmdk-pill{
  display:flex; align-items:center; height:34px; padding:0 12px;
  border:1px solid var(--hair); border-radius:10px; background:rgba(255,255,255,.025);
  font-family:var(--mono); font-size:12px; color:var(--dim);
  transition:border-color .2s var(--ease), background .2s var(--ease), color .2s var(--ease);
}
.cmdk-pill:hover{ border-color:var(--hair-lit); background:rgba(255,255,255,.05); color:var(--text); }

.size-step{ display:flex; align-items:center; border:1px solid var(--hair); border-radius:10px; background:rgba(255,255,255,.03); overflow:hidden; }
.size-step button{ width:32px; height:32px; display:grid; place-items:center; color:var(--dim); transition:background .18s var(--ease), color .18s var(--ease); }
.size-step button:hover{ background:rgba(255,255,255,.06); color:var(--text); }
.size-step button:disabled{ opacity:.4; cursor:default; }
.size-step .sm{ font-size:11px; font-weight:600; }
.size-step .lg{ font-size:15px; font-weight:600; }
.size-step .mid{ width:1px; height:16px; background:var(--hair); }

.btn-primary{
  position:relative; display:inline-flex; align-items:center; gap:8px; padding:9px 15px; border-radius:11px;
  font-family:var(--sans); font-weight:600; font-size:13px; color:var(--aqua-ink);
  background:linear-gradient(180deg,#7ff0dd,#4fd8c2); box-shadow:0 0 18px rgba(94,234,212,.26);
  transition:box-shadow .3s var(--ease), transform .14s var(--ease-out); isolation:isolate; overflow:hidden;
}
.btn-primary:hover{ box-shadow:0 0 22px rgba(94,234,212,.42); }
.btn-primary:active{ transform:scale(.97); }
.btn-primary:disabled{ opacity:.7; cursor:default; }
.btn-primary .icon{ width:15px; height:15px; }
.beam::after{
  content:""; position:absolute; inset:0; border-radius:inherit; padding:1.5px;
  background:conic-gradient(from var(--angle), transparent 0 68%, var(--aqua) 80%, #d6fff6 88%, var(--aqua-2) 94%, transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  animation:spin 7s linear infinite; pointer-events:none; z-index:2;
}
@keyframes spin{ to{ --angle:360deg; } }

.rail-toggle{ width:34px; height:34px; display:grid; place-items:center; border-radius:10px; color:var(--faint); border:1px solid transparent; flex:none; transition:background .16s var(--ease), color .16s var(--ease), border-color .16s var(--ease); }
.rail-toggle:hover{ background:rgba(255,255,255,.06); color:var(--text); }
.rail-toggle[aria-pressed="false"]{ color:var(--ghost); }
.rail-toggle .icon{ width:17px; height:17px; }

/* meta chips */
.chips{ flex:none; display:flex; flex-wrap:wrap; gap:8px; padding:15px 28px 13px; }
.chip{ font-family:var(--mono); font-size:11px; color:var(--dim); border:1px solid var(--hair); background:rgba(255,255,255,.02); border-radius:999px; padding:4px 11px; letter-spacing:-.01em; white-space:nowrap; }

/* reader */
.reader-wrap{ position:relative; flex:1; min-height:0; }
.reader{ position:absolute; inset:0; overflow-y:auto; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.14) transparent; }
.reader::-webkit-scrollbar{ width:10px; }
.reader::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.12); border-radius:9px; border:2px solid transparent; background-clip:padding-box; }
.reader-inner{ max-width:720px; margin:0 auto; padding:36px clamp(28px,5vw,64px) 150px; }
/* roomy: as side panels collapse and the pane widens, the transcript takes the space */
.shell.rail-off .reader-inner,
.shell.side-collapsed .reader-inner{ max-width:min(1040px,88%); }
.shell.rail-off.side-collapsed .reader-inner{ max-width:min(1440px,94%); }
.empty{ display:none; text-align:center; color:var(--dim); font-size:13.5px; padding:60px 20px; }
.empty.show{ display:block; }
.tr-empty{ padding:40px 0; color:var(--faint); font-size:13px; text-align:center; }

/* a turn */
.turn{
  position:relative; display:grid; grid-template-columns:54px 1fr; column-gap:18px;
  padding:7px 14px; margin:0 -14px; border-radius:var(--r-md);
  scroll-margin-top:130px;
  transition:background .35s var(--ease), box-shadow .35s var(--ease), opacity .34s var(--ease-out);
}
.turn.newspk{ margin-top:26px; }
.turn.newspk:first-child{ margin-top:0; }
.turn.hidden{ display:none; }
.turn.flash{ animation:flash 1.2s var(--ease-out); }
@keyframes flash{ 0%{ background:rgba(94,234,212,.14); } 100%{ background:transparent; } }
.turn.playing{ background:rgba(94,234,212,.06); box-shadow:0 0 22px rgba(94,234,212,.10); }
.turn.playing::after{
  content:""; position:absolute; inset:0; border-radius:inherit; padding:1.4px;
  background:conic-gradient(from var(--angle), transparent 0 66%, var(--aqua) 80%, #d6fff6 88%, var(--aqua-2) 95%, transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  animation:spin 6.5s linear infinite; pointer-events:none;
}

/* READING FOCUS */
.reader.rf .turn{ opacity:.56; }
.reader.rf .turn.rf-focus,
.reader.rf .turn.playing,
.reader.rf.searching .turn{ opacity:1; }

.ts{
  grid-column:1; font-family:var(--mono); font-size:11.5px; color:var(--ghost);
  padding-top:2px; text-align:right; align-self:start; letter-spacing:-.03em; border-radius:5px;
  transition:color .16s var(--ease), background .16s var(--ease); line-height:1.62;
}
button.ts:hover{ color:var(--aqua); background:rgba(94,234,212,.08); }
.turn.newspk .ts{ padding-top:24px; }
.turn-main{ grid-column:2; min-width:0; }
.spk{ font-family:var(--sans); font-size:12.5px; font-weight:600; letter-spacing:-.01em; margin-bottom:4px; line-height:1.2; }
.turn:not(.newspk) .spk{ display:none; }
.line{ margin:0; font-size:var(--reader); line-height:1.64; color:rgba(231,233,242,.9); letter-spacing:.002em; max-width:68ch; transition:font-size .18s var(--ease-out); }
html[data-theme="light"] .line{ color:var(--text); }
.shell.rail-off .line,
.shell.side-collapsed .line{ max-width:none; }

/* progressive-blur edge fades */
.fade{ position:absolute; left:0; right:0; pointer-events:none; z-index:4; }
.fade.top{ top:0; height:48px; background:linear-gradient(to bottom, var(--bg), transparent); -webkit-mask:linear-gradient(to bottom,#000 40%,transparent); mask:linear-gradient(to bottom,#000 40%,transparent); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
.fade.bot{ bottom:0; height:86px; background:linear-gradient(to top, var(--bg) 12%, transparent); -webkit-mask:linear-gradient(to top,#000 42%,transparent); mask:linear-gradient(to top,#000 42%,transparent); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }

/* floating find bar */
.findbar{
  position:absolute; top:10px; left:50%; z-index:15;
  display:flex; align-items:center; gap:10px; padding:7px 8px 7px 13px;
  width:min(440px, calc(100% - 60px));
  background:var(--panel-glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--hair-lit); border-radius:12px; box-shadow:0 14px 34px rgba(0,0,0,.44);
  opacity:0; pointer-events:none; transform:translate(-50%,-12px);
  transition:opacity .16s var(--ease-out), transform .2s var(--ease-out);
}
.findbar.open{ opacity:1; pointer-events:auto; transform:translate(-50%,0); }
.findbar .icon{ width:15px; height:15px; color:var(--aqua); flex:none; }
.findbar input{ flex:1; background:none; border:none; outline:none; font-size:13.5px; min-width:0; }
.findbar input::placeholder{ color:var(--ghost); }
.findbar .count{ font-size:11.5px; color:var(--aqua); font-family:var(--mono); white-space:nowrap; }
.findbar .clear{ width:24px; height:24px; display:grid; place-items:center; border-radius:7px; color:var(--dim); transition:background .12s var(--ease), color .12s var(--ease); }
.findbar .clear:hover{ background:rgba(255,255,255,.08); color:var(--text); }
.findbar .clear .icon{ width:12px; height:12px; color:inherit; }

/* transport */
.transport{
  flex:none; height:56px; display:flex; align-items:center; gap:14px; padding:0 24px 0 20px;
  border-top:1px solid var(--hair);
  background:linear-gradient(0deg,rgba(12,12,20,.55),transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  position:relative; z-index:6;
}
.play{
  width:38px; height:38px; flex:none; border-radius:50%; display:grid; place-items:center; color:var(--aqua-ink);
  background:linear-gradient(180deg,#7ff0dd,#4fd8c2); box-shadow:0 0 18px rgba(94,234,212,.3);
  transition:box-shadow .25s var(--ease), transform .12s var(--ease-out);
}
.play:hover{ box-shadow:0 0 22px rgba(94,234,212,.46); }
.play:active{ transform:scale(.94); }
.play .icon, .play svg{ width:15px; height:15px; margin-left:1px; display:block; }
.play.playing .icon, .play.playing svg{ margin-left:0; }
.clock{ font-family:var(--mono); font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; white-space:nowrap; letter-spacing:-.02em; }
.clock b{ color:var(--text); font-weight:500; }
.wave-wrap{ flex:1; min-width:0; height:38px; position:relative; cursor:pointer; }
.wave-wrap canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; border-radius:8px; }
.tracks{ display:flex; align-items:center; gap:2px; background:rgba(255,255,255,.03); border:1px solid var(--hair); border-radius:9px; padding:2px; }
.tracks button{ font-size:11px; font-weight:500; color:var(--faint); padding:6px 11px; border-radius:7px; white-space:nowrap; transition:background .18s var(--ease), color .18s var(--ease); }
.tracks button:hover{ color:var(--dim); }
.tracks button[aria-pressed="true"], .tracks button.on{ color:#eafffb; background:rgba(94,234,212,.13); box-shadow:inset 0 0 0 1px rgba(94,234,212,.24); }
html[data-theme="light"] .tracks button.on{ color:var(--text); }
.shield{ width:32px; height:32px; flex:none; display:grid; place-items:center; border-radius:9px; color:var(--ghost); transition:color .18s var(--ease), background .18s var(--ease); }
.shield:hover{ color:var(--aqua); background:rgba(94,234,212,.08); }
.shield .icon{ width:15px; height:15px; }

/* ============================== ZONE 3 · SEAM (speaker timeline) ============================== */
.seam{
  position:relative; z-index:1; overflow:hidden; cursor:pointer;
  border-left:1px solid var(--hair); border-right:1px solid var(--hair);
  background:rgba(255,255,255,.008);
}
.mini{ position:absolute; inset:26px 6px; border-radius:6px; overflow:hidden; }
.seg-block{ position:absolute; left:0; right:0; z-index:1; opacity:.62; transition:opacity .2s var(--ease); }
.seam:hover .seg-block{ opacity:.82; }
.seg-block.dim{ opacity:.12; }
.seg-block.match{ opacity:1; }
.mini-read{ position:absolute; left:0; right:0; top:0; height:100%; z-index:2; background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05)); mix-blend-mode:overlay; transform:scaleY(0); transform-origin:top; pointer-events:none; }
.mini-head{ position:absolute; left:0; right:0; z-index:3; pointer-events:none; }
.mini-head .ln{ position:absolute; left:-2px; right:-2px; height:2px; background:var(--aqua); box-shadow:0 0 8px rgba(94,234,212,.9); border-radius:2px; }
.mini-head .dot{ position:absolute; right:-3px; top:-2.5px; width:7px; height:7px; border-radius:50%; background:var(--aqua-2); box-shadow:0 0 9px rgba(125,211,252,.95); }

/* ============================== ZONE 4 · RAIL ============================== */
.rail{
  position:relative; z-index:2; min-width:0; display:flex; flex-direction:column; overflow:hidden;
  border-left:1px solid var(--hair);
  background:
    radial-gradient(130% 44% at 100% 0%, rgba(94,234,212,.07), transparent 60%),
    radial-gradient(120% 40% at 100% 8%, rgba(165,180,252,.06), transparent 58%),
    var(--rail-bg);
}
.rail.hiding{ opacity:0; transform:translateX(16px); transition:opacity .2s var(--ease-out), transform .22s var(--ease-drawer); }
.seg{
  flex:none; position:relative; display:grid; grid-template-columns:repeat(3,1fr); margin:16px; padding:3px;
  background:rgba(255,255,255,.03); border:1px solid var(--hair); border-radius:11px;
}
.seg .pill{
  position:absolute; top:3px; left:3px; bottom:3px; width:0;
  background:rgba(94,234,212,.14); border-radius:9px;
  box-shadow:0 0 16px rgba(94,234,212,.18), inset 0 0 0 1px rgba(94,234,212,.28);
  transition:transform .3s var(--spring), width .3s var(--spring); z-index:0;
}
.seg button{ position:relative; z-index:1; padding:8px 2px; font-size:12.5px; font-weight:500; color:var(--dim); border-radius:9px; letter-spacing:-.005em; transition:color .22s var(--ease); }
.seg button[aria-selected="true"]{ color:#eafffb; font-weight:600; }
html[data-theme="light"] .seg button[aria-selected="true"]{ color:var(--text); }
.rail-body{ flex:1; min-height:0; position:relative; }
.rpanel{
  position:absolute; inset:0; overflow-y:auto; padding:4px 18px 24px;
  opacity:0; transform:translateY(8px); pointer-events:none; visibility:hidden;
  transition:opacity .22s var(--ease-out), transform .26s var(--ease-out), visibility 0s .26s;
  scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.14) transparent;
}
.rpanel.active{ opacity:1; transform:none; pointer-events:auto; visibility:visible; transition:opacity .26s var(--ease-out), transform .26s var(--ease-out); }
.rpanel::-webkit-scrollbar{ width:9px; }
.rpanel::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.12); border-radius:9px; border:2px solid transparent; background-clip:padding-box; }

.eyebrow{ font-size:10px; font-weight:600; letter-spacing:.15em; text-transform:uppercase; color:var(--faint); margin:22px 0 11px; }
.eyebrow:first-child{ margin-top:10px; }
.eyebrow-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.eyebrow-row .eyebrow{ margin:22px 0 11px; }
.eyebrow-row:first-child .eyebrow{ margin-top:10px; }

/* summary rail */
.brief-card{ border:1px solid var(--hair); border-radius:var(--r-md); background:rgba(255,255,255,.02); padding:14px 15px 15px; margin-top:8px; }
.brief-card .eyebrow{ margin:0 0 9px; }
.brief-card .head-row{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.brief-card .head-row .eyebrow{ margin:0 0 9px; }
.brief-depth{ font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; }
.tldr{ font-size:13.5px; line-height:1.64; color:rgba(231,233,242,.88); margin:0; }
html[data-theme="light"] .tldr{ color:var(--text); }
.tldr.shimmer{
  background:linear-gradient(110deg,rgba(231,233,242,.42) 30%,#fff 50%,rgba(231,233,242,.42) 70%);
  background-size:220% 100%; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  animation:shim 1.1s var(--ease-out) 1;
}
@keyframes shim{ from{ background-position:180% 0; } to{ background-position:-120% 0; } }
.decision{ display:flex; gap:11px; font-size:13px; line-height:1.55; color:rgba(231,233,242,.84); padding:7px 0; }
html[data-theme="light"] .decision{ color:var(--text); }
.decision .dot{ flex:none; width:6px; height:6px; border-radius:50%; background:var(--aqua); margin-top:7px; box-shadow:0 0 6px rgba(94,234,212,.55); }
.q-item{ display:flex; gap:11px; font-size:13px; line-height:1.55; color:rgba(231,233,242,.84); padding:7px 0; }
html[data-theme="light"] .q-item{ color:var(--text); }
.q-item .dot{ flex:none; width:6px; height:6px; border-radius:50%; background:var(--v-lav); margin-top:7px; }
.action{ display:flex; gap:11px; align-items:flex-start; padding:9px 0; }
.av{ width:26px; height:26px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:10px; font-weight:700; color:#fff; letter-spacing:.02em; box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); }
.action .body{ min-width:0; flex:1; }
.action .task{ font-size:12.5px; line-height:1.46; color:rgba(231,233,242,.9); }
html[data-theme="light"] .action .task{ color:var(--text); }
.action .due-line{ font-size:11px; color:var(--faint); margin-top:3px; }
.email-btn{
  display:flex; align-items:center; gap:9px; width:100%; padding:12px 14px; margin-top:12px;
  border:1px solid var(--hair); border-radius:var(--r-md); background:rgba(255,255,255,.02);
  font-size:13px; font-weight:500; color:var(--text);
  transition:border-color .16s var(--ease), background .16s var(--ease);
}
.email-btn:hover{ border-color:var(--hair-lit); background:rgba(255,255,255,.04); }
.email-btn .icon{ width:15px; height:15px; color:var(--dim); }
.email-preview{ padding:11px 12px; background:rgba(255,255,255,.02); border:1px solid var(--hair); border-radius:var(--r-md); margin-top:8px; }
.email-preview b{ display:block; font-size:12.5px; margin-bottom:5px; }
.email-preview p{ margin:0; font-size:12px; line-height:1.55; color:var(--dim); display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }

/* rail notes + cues (the user's own words, in the rail's language) */
.rail-note{ display:flex; align-items:flex-start; gap:10px; padding:8px 0; }
.note-time{ flex:none; min-width:46px; padding:2px 8px; font-family:var(--mono); font-size:11px; font-weight:600; color:var(--dim); background:rgba(255,255,255,.03); border:1px solid var(--hair); border-radius:999px; text-align:center; }
button.note-time:hover{ color:var(--aqua-ink); background:linear-gradient(180deg,#7ff0dd,#4fd8c2); border-color:transparent; }
.note-time.is-untimed{ color:var(--faint); background:transparent; border-style:dashed; font-weight:500; letter-spacing:.04em; }
.note-body{ flex:1; min-width:0; font-size:12.5px; line-height:1.55; color:rgba(231,233,242,.88); white-space:pre-wrap; overflow-wrap:anywhere; }
html[data-theme="light"] .note-body{ color:var(--text); }
.note-jump{ flex:none; display:inline-flex; align-items:center; gap:5px; margin-top:1px; padding:2px 8px; font-size:11px; color:var(--faint); border:1px solid transparent; border-radius:999px; transition:color .14s var(--ease), border-color .14s var(--ease), background .14s var(--ease); }
.note-jump:hover{ color:var(--aqua); border-color:var(--aqua-line); background:var(--aqua-soft); }
.cue-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.cue-list li{ display:flex; align-items:flex-start; gap:9px; font-size:12.5px; line-height:1.5; color:rgba(231,233,242,.84); overflow-wrap:anywhere; }
html[data-theme="light"] .cue-list li{ color:var(--text); }
.cue-mark{ flex:none; width:18px; height:18px; margin-top:1px; border-radius:6px; display:grid; place-items:center; color:var(--ok); background:color-mix(in oklab, var(--ok) 15%, transparent); }
.cue-list li.missed{ color:var(--text); }
.cue-list li.missed .cue-mark{ color:var(--warn); background:color-mix(in oklab, var(--warn) 16%, transparent); }
.cue-note{ margin:11px 0 0; font-size:11px; line-height:1.5; color:var(--faint); }
.q-list{ margin:0; padding-left:17px; display:flex; flex-direction:column; gap:6px; }
.q-list li{ font-size:12.5px; line-height:1.55; color:var(--dim); }
.miss-label,.ready-label{ font-size:10px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; border-radius:999px; padding:1px 8px; }
.ready-label{ color:var(--ok); background:color-mix(in oklab, var(--ok) 14%, transparent); }
.miss-label{ color:var(--warn); background:color-mix(in oklab, var(--warn) 15%, transparent); }
.count-badge{ font-size:11px; font-weight:650; color:var(--dim); background:rgba(255,255,255,.04); border:1px solid var(--hair); border-radius:999px; padding:1px 9px; }

/* speakers rail */
.spkcard{
  position:relative; overflow:hidden; padding:13px 14px; margin-bottom:9px; border-radius:var(--r-md);
  border:1px solid var(--hair); background:var(--panel);
  transition:border-color .3s var(--ease);
}
.spkcard::before{ content:""; position:absolute; inset:0; border-radius:inherit; opacity:0; background:radial-gradient(280px circle at var(--x,50%) var(--y,0%), color-mix(in srgb, var(--sp) 20%, transparent), transparent 46%); transition:opacity .4s var(--ease); pointer-events:none; }
.spkcard:hover{ border-color:var(--hair-lit); }
@media (hover:hover) and (pointer:fine){ .spkcard:hover::before{ opacity:1; } }
.spk-top{ display:flex; align-items:center; gap:10px; position:relative; }
.spk-name-wrap{ flex:1; min-width:0; display:flex; align-items:center; gap:6px; }
.spk-name{ font-size:13px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pencil{ width:22px; height:22px; flex:none; display:grid; place-items:center; border-radius:7px; color:var(--ghost); opacity:0; transition:opacity .14s var(--ease), color .14s var(--ease), background .14s var(--ease); }
.spkcard:hover .pencil{ opacity:1; }
.pencil:hover{ color:var(--aqua); background:rgba(255,255,255,.06); }
.pencil .icon{ width:13px; height:13px; }
.spk-edit, .spk-name-wrap input{ flex:1; min-width:0; width:100%; background:rgba(0,0,0,.3); border:1px solid var(--aqua); border-radius:7px; padding:3px 7px; font-size:13px; font-weight:600; outline:none; color:#fff; }
html[data-theme="light"] .spk-name-wrap input{ background:rgba(255,255,255,.8); color:var(--text); }
.spk-time{ font-family:var(--mono); font-size:11px; color:var(--faint); }
.spk-stat{ display:flex; align-items:baseline; gap:8px; margin-top:11px; position:relative; }
.spk-pct{ font-family:var(--display); font-weight:700; font-size:24px; line-height:1; letter-spacing:-.02em; color:var(--text); font-variant-numeric:tabular-nums; }
.spk-pct .u{ font-size:14px; color:var(--dim); margin-left:1px; }
.spk-sub{ font-size:11px; color:var(--faint); margin-left:auto; font-family:var(--mono); }
.spk-bar{ height:4px; border-radius:3px; background:rgba(255,255,255,.06); margin-top:11px; overflow:hidden; position:relative; }
.spk-fill{ position:absolute; inset:0 auto 0 0; width:100%; border-radius:3px; transform-origin:left; transform:scaleX(0); box-shadow:0 0 8px color-mix(in srgb,var(--sp) 60%, transparent); transition:transform .9s var(--ease-out); }
.spk-meta{ display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:10px; font-size:10.5px; color:var(--faint); font-family:var(--mono); }
.spk-flash{ display:block; color:var(--ok); font-size:11px; font-weight:550; margin-top:8px; }
.spk-note{ display:flex; align-items:flex-start; gap:7px; padding:10px 12px; margin-top:9px; border:1px solid var(--hair); border-radius:var(--r-md); background:rgba(255,255,255,.02); font-size:11.5px; line-height:1.45; color:var(--dim); }
.spk-note .ic{ flex:none; color:var(--warn); display:grid; place-items:center; padding-top:1px; }

.recluster{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:14px; padding:11px 12px; border:1px solid var(--hair); border-radius:var(--r-md); background:rgba(255,255,255,.02); }
.recluster .lab{ font-size:12px; color:var(--text); }
.recluster .sub{ font-size:11px; color:var(--faint); margin-top:2px; }
.recluster select{
  appearance:none; -webkit-appearance:none; flex:none; max-width:96px;
  font-size:11.5px; font-weight:500; color:var(--text); cursor:pointer; outline:none;
  border:1px solid var(--hair-lit); border-radius:999px; padding:5px 24px 5px 11px;
  background:rgba(255,255,255,.03) url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888da0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E") no-repeat right 8px center / 11px;
  transition:background-color .14s var(--ease), border-color .14s var(--ease);
}
.recluster select:hover{ background-color:rgba(255,255,255,.06); }
.recluster select:disabled{ opacity:.5; cursor:not-allowed; }
.pop-wrap{ position:relative; }
.chip-btn{ display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:500; color:var(--text); border:1px solid var(--hair-lit); border-radius:999px; padding:5px 10px; transition:background .14s var(--ease), border-color .14s var(--ease); }
.chip-btn:hover{ background:rgba(255,255,255,.06); border-color:var(--hair-lit); }
.chip-btn .icon{ width:12px; height:12px; color:var(--dim); }

.stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.stat{ border:1px solid var(--hair); border-radius:var(--r-md); padding:13px; background:var(--panel); }
.stat .v{ font-family:var(--display); font-size:26px; font-weight:700; letter-spacing:-.02em; line-height:1; font-variant-numeric:tabular-nums; }
.stat .l{ font-size:11px; color:var(--dim); margin-top:8px; }
.stat .s{ font-size:10.5px; color:var(--faint); margin-top:2px; }
.topic{ margin-bottom:12px; }
.topic-top{ display:flex; justify-content:space-between; align-items:baseline; font-size:12px; margin-bottom:6px; color:rgba(231,233,242,.82); gap:10px; }
html[data-theme="light"] .topic-top{ color:var(--text); }
.topic-top .pct{ font-family:var(--mono); font-size:10.5px; color:var(--dim); font-variant-numeric:tabular-nums; text-align:right; }
.topic-bar{ height:5px; border-radius:3px; background:rgba(255,255,255,.06); overflow:hidden; position:relative; }
.topic-fill{ position:absolute; inset:0 auto 0 0; width:100%; border-radius:3px; background:linear-gradient(90deg,var(--aqua),var(--aqua-2)); transform-origin:left; transform:scaleX(0); transition:transform .9s var(--ease-out); }

/* ask rail */
.ask-scroll{ flex:1; min-height:0; overflow-y:auto; padding:16px 18px 8px; scrollbar-width:thin; }
.ask-thread{ display:flex; flex-direction:column; gap:14px; }
.msg{ display:flex; gap:10px; max-width:92%; }
.msg .mav{ width:26px; height:26px; border-radius:8px; display:grid; place-items:center; flex:none; font-size:10px; font-weight:700; }
.msg .mcol{ min-width:0; display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
.msg .bub{ padding:10px 13px; border-radius:14px; font-size:12.5px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; }
.msg.user{ align-self:flex-end; flex-direction:row-reverse; }
.msg.user .mav{ background:linear-gradient(180deg,#5b8cff,#4a74e0); color:#fff; }
.msg.user .bub{ background:rgba(94,234,212,.1); border:1px solid rgba(94,234,212,.22); color:#eafffb; border-bottom-right-radius:5px; }
html[data-theme="light"] .msg.user .bub{ color:var(--text); }
.msg.assistant .mav{ background:rgba(255,255,255,.06); color:var(--aqua); box-shadow:inset 0 0 0 1px var(--hair); }
.msg.assistant .bub{ background:var(--panel-2); border:1px solid var(--hair); color:rgba(231,233,242,.9); border-bottom-left-radius:5px; }
html[data-theme="light"] .msg.assistant .bub{ color:var(--text); }
.composer{ flex:none; border-top:1px solid var(--hair); padding:12px 18px; }
.composer .field{ display:flex; align-items:flex-end; gap:8px; margin:0; border:1px solid var(--hair-lit); border-radius:12px; padding:8px 8px 8px 12px; background:rgba(255,255,255,.025); transition:border-color .18s var(--ease), background .18s var(--ease); }
.composer .field:focus-within{ border-color:rgba(94,234,212,.5); background:rgba(94,234,212,.04); }
.composer textarea{ flex:1; background:none; border:none; outline:none; resize:none; font-size:12.5px; line-height:1.5; max-height:110px; min-height:20px; }
.composer textarea::placeholder{ color:var(--ghost); }
.send{ width:30px; height:30px; flex:none; border-radius:9px; background:linear-gradient(180deg,#7ff0dd,#4fd8c2); color:var(--aqua-ink); display:grid; place-items:center; box-shadow:0 0 14px rgba(94,234,212,.24); transition:box-shadow .2s var(--ease), opacity .18s var(--ease), transform .12s var(--ease-out); }
.send:hover{ box-shadow:0 0 18px rgba(94,234,212,.38); }
.send:active{ transform:scale(.95); }
.send:disabled{ opacity:.4; cursor:default; box-shadow:none; }
.send .icon{ width:14px; height:14px; }
.privacy-note{ font-size:10.5px; color:var(--faint); margin-top:8px; display:flex; align-items:center; gap:6px; }
.privacy-note .icon{ width:12px; height:12px; color:var(--ok); opacity:.85; }

/* ask: streaming, citations, empty-thread starters */
.msg .bub.is-pending{ display:inline-flex; align-items:center; gap:9px; color:var(--dim); }
.msg .bub.is-pending .ask-stream{ display:none; }
.msg .bub.is-streaming{ display:block; color:rgba(231,233,242,.9); }
html[data-theme="light"] .msg .bub.is-streaming{ color:var(--text); }
.msg .bub.is-streaming .spinner, .msg .bub.is-streaming .ask-wait{ display:none; }
.msg .bub.is-streaming .ask-stream{ display:inline; }
.msg .bub.is-streaming .ask-stream::after{
  content:""; display:inline-block; width:2px; height:1em; margin-left:2px;
  vertical-align:-2px; background:var(--aqua); animation:ms-caret 1.1s steps(1) infinite;
}
@keyframes ms-caret{ 0%,49%{ opacity:1; } 50%,100%{ opacity:0; } }
.ask-cites{ display:flex; flex-wrap:wrap; gap:6px; }
.ask-cite{ display:inline-flex; align-items:center; gap:7px; max-width:100%; padding:4px 10px 4px 9px; border-radius:999px; border:1px solid var(--hair); background:rgba(255,255,255,.03); font-size:11px; color:var(--dim); transition:color .14s var(--ease), border-color .14s var(--ease); }
button.ask-cite:hover{ color:var(--text); border-color:var(--aqua-line); }
.ask-cite .t{ font-family:var(--mono); color:var(--aqua); flex:none; }
.ask-cite .q{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ask-start{ padding:10px 2px 2px; }
.ask-start h3{ margin:0 0 5px; font-family:var(--display); font-size:15.5px; font-weight:600; letter-spacing:-.01em; }
.ask-start p{ margin:0 0 14px; font-size:12.5px; line-height:1.55; color:var(--dim); }
.ask-chips{ display:flex; flex-wrap:wrap; gap:8px; }
.ask-chip{ padding:6px 12px; border-radius:999px; border:1px solid var(--hair); background:rgba(255,255,255,.02); font-size:12px; color:var(--dim); transition:color .14s var(--ease), border-color .14s var(--ease), background .14s var(--ease); }
.ask-chip:hover{ color:var(--text); border-color:var(--hair-lit); background:rgba(255,255,255,.05); }

/* ============================== COMMAND PALETTE ============================== */
.cmdk-overlay{
  position:fixed; inset:0; z-index:100; background:rgba(6,7,11,.55); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  display:flex; align-items:flex-start; justify-content:center; padding-top:12vh;
  opacity:0; pointer-events:none; transition:opacity .12s var(--ease-out);
}
.cmdk-overlay.open{ opacity:1; pointer-events:auto; }
.cmdk{
  width:min(600px,92vw); max-height:64vh; display:flex; flex-direction:column;
  background:var(--panel-glass); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--hair-lit); border-radius:16px; box-shadow:0 30px 80px rgba(0,0,0,.6); overflow:hidden;
  transform:scale(.97); opacity:0; transform-origin:center;
  transition:transform .12s var(--ease-out), opacity .12s var(--ease-out);
}
.cmdk-overlay.open .cmdk{ transform:none; opacity:1; }
.cmdk-input{ display:flex; align-items:center; gap:11px; padding:15px 16px; border-bottom:1px solid var(--hair); }
.cmdk-input .icon{ width:17px; height:17px; color:var(--dim); }
.cmdk-input input{ flex:1; background:none; border:none; outline:none; font-size:15px; color:var(--text); }
.cmdk-input input::placeholder{ color:var(--ghost); }
.cmdk-input .esc{ font-family:var(--mono); font-size:10.5px; color:var(--faint); border:1px solid var(--hair); border-radius:6px; padding:2px 6px; }
.cmdk-list{ overflow-y:auto; padding:8px; flex:1; scrollbar-width:thin; }
.cmdk-group{ font-size:9.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); padding:9px 9px 5px; }
.cmdk-item{ display:flex; align-items:center; gap:11px; width:100%; padding:9px 10px; border-radius:10px; font-size:13.5px; color:var(--text); text-align:left; }
.cmdk-item .icon, .cmdk-item > svg{ width:16px; height:16px; color:var(--dim); flex:none; }
.cmdk-item.sel{ background:rgba(94,234,212,.12); }
.cmdk-item.sel .icon, .cmdk-item.sel > svg{ color:var(--aqua); }
.cmdk-item .hint{ margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--faint); }
.cmdk-item.danger{ color:var(--danger); }
.cmdk-item.danger .icon, .cmdk-item.danger > svg, .cmdk-item.danger.sel .icon, .cmdk-item.danger.sel > svg{ color:var(--danger); }
.cmdk-item .av{ width:20px; height:20px; font-size:8.5px; }
.cmdk-empty{ padding:26px; text-align:center; color:var(--faint); font-size:13px; }

/* ============================================================================
   FUNCTIONAL EXTENSIONS — surfaces the demo did not mock (recorder, live view,
   processing, menus, modals, toasts, device rows, in-transcript notes), styled
   as quiet extensions of the same language. No converged rule is overridden.
   ========================================================================== */

/* quiet + primary buttons (auth modal, error card) */
.btn{ height:32px; padding:0 12px; display:inline-flex; align-items:center; gap:7px; border-radius:10px; font-size:12.5px; font-weight:500; border:1px solid var(--hair); background:rgba(255,255,255,.025); color:var(--text); transition:background .16s var(--ease), border-color .16s var(--ease); white-space:nowrap; }
.btn:hover{ background:rgba(255,255,255,.05); border-color:var(--hair-lit); }
.btn.primary{ background:linear-gradient(180deg,#7ff0dd,#4fd8c2); border-color:transparent; color:var(--aqua-ink); font-weight:600; box-shadow:0 0 18px rgba(94,234,212,.22), inset 0 1px 0 rgba(255,255,255,.32); }
.btn.primary:hover{ box-shadow:0 0 24px rgba(94,234,212,.4); }
.btn.icon{ width:32px; padding:0; justify-content:center; color:var(--dim); }
.btn.danger{ color:var(--danger); }
.btn:disabled{ opacity:.55; cursor:default; }
.btn.sync-on{ color:var(--aqua); border-color:var(--aqua-line); }

/* pane-top icon tools (Export / More cluster) */
.tool-btn{ width:34px; height:34px; display:grid; place-items:center; border-radius:10px; color:var(--dim); border:1px solid var(--hair); background:rgba(255,255,255,.025); flex:none; transition:background .16s var(--ease), color .16s var(--ease), border-color .16s var(--ease); }
.tool-btn:hover{ background:rgba(255,255,255,.06); color:var(--text); }
.tool-btn.open{ background:rgba(94,234,212,.1); color:#eafffb; border-color:var(--aqua-line); }
html[data-theme="light"] .tool-btn.open{ color:var(--text); }

/* floating menus — converged's .pop language, opening downward */
.menu-wrap{ position:relative; }
.menu{
  position:absolute; right:0; top:calc(100% + 8px); z-index:60; min-width:216px; padding:8px;
  background:var(--panel-glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--hair-lit); border-radius:12px; box-shadow:0 16px 40px rgba(0,0,0,.5);
  transform-origin:top right; animation:ms-pop .17s var(--ease-out);
}
@keyframes ms-pop{ from{ opacity:0; transform:scale(.96) translateY(-6px); } }
.menu-item{ display:flex; align-items:center; gap:9px; width:100%; padding:8px 9px; border-radius:8px; font-size:12.5px; text-align:left; color:var(--text); transition:background .14s var(--ease); }
.menu-item svg{ color:var(--dim); flex:none; }
.menu-item:hover{ background:rgba(94,234,212,.12); }
.menu-item.danger, .menu-item.danger svg{ color:var(--danger); }
.menu-item.danger:hover{ background:color-mix(in oklab, var(--danger) 12%, transparent); }
.menu-item:disabled{ opacity:.45; }
.menu-item.sync-on{ color:var(--aqua); }
.menu-sep{ height:1px; background:var(--hair); margin:6px 4px; }
.menu-note{ font-size:11px; color:var(--faint); padding:5px 9px 4px; line-height:1.5; }

/* meta notes under the chips (warnings / tidy report / errors) */
.rv-notes{ flex:none; display:flex; flex-direction:column; gap:4px; padding:0 28px 10px; }
.note{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim); }
.note .ic{ flex:none; display:grid; place-items:center; }
.note.warn .ic{ color:var(--warn); }
.note.err .ic{ color:var(--danger); }
.note.tidy .ic{ color:var(--aqua); }
.note .dismiss{ color:var(--faint); margin-left:2px; padding:2px; border-radius:4px; }
.note .dismiss:hover{ color:var(--text); background:rgba(255,255,255,.06); }

/* the user's notes standing in the transcript (a <details> disclosure) */
.tr-note{ margin:14px -14px 14px 58px; padding:10px 13px 11px; border-radius:var(--r-md);
  border:1px solid rgba(94,234,212,.24); border-left:2px solid var(--aqua);
  background:rgba(94,234,212,.06); }
.tr-note-head{ display:flex; align-items:center; gap:10px; cursor:pointer; list-style:none; -webkit-user-select:none; user-select:none; }
.tr-note-head::-webkit-details-marker{ display:none; }
.tr-note-head:focus-visible{ outline:2px solid var(--aqua); outline-offset:3px; border-radius:6px; }
.tr-note-kicker{ display:inline-flex; align-items:center; gap:6px; flex:1; min-width:0; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--aqua); }
html[data-theme="light"] .tr-note-kicker{ color:var(--accent); }
.tr-note-time{ font-family:var(--mono); font-size:11px; color:var(--faint); border-radius:4px; flex:none; }
button.tr-note-time:hover{ color:var(--aqua); }
.tr-note-chev{ flex:none; display:grid; place-items:center; color:var(--faint); transition:transform .18s var(--ease-out); }
.tr-note[open] .tr-note-chev{ transform:rotate(180deg); }
.tr-note-body{ margin-top:6px; white-space:pre-wrap; overflow-wrap:anywhere; font-size:var(--reader); line-height:1.64; color:rgba(231,233,242,.9); }
html[data-theme="light"] .tr-note-body{ color:var(--text); }
.tr-note-body.is-revealing{ animation:ms-note-open .2s var(--ease-out); }
@keyframes ms-note-open{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:none; } }
.tr-note.is-target{ animation:ms-note-flash 1.8s var(--ease-out) 1; }
@keyframes ms-note-flash{ 0%,45%{ box-shadow:0 0 0 3px rgba(94,234,212,.45); } 100%{ box-shadow:0 0 0 3px transparent; } }

/* spinner */
.spinner{ width:13px; height:13px; border-radius:50%; border:2px solid rgba(94,234,212,.3); border-top-color:var(--aqua); animation:ms-spin .7s linear infinite; flex:none; display:inline-block; }
@keyframes ms-spin{ to{ transform:rotate(360deg) } }
@keyframes ms-blink{ 0%,100%{ opacity:1 } 50%{ opacity:.25 } }

/* sidebar footer: devices, appearance, account, quit */
.sb-foot{ flex:none; border-top:1px solid var(--hair); padding:10px 14px 12px; display:flex; flex-direction:column; gap:7px; }
.sb-dev{ display:flex; align-items:center; gap:8px; font-size:11px; color:var(--dim); min-width:0; }
.sb-dev .dot{ width:6px; height:6px; border-radius:50%; background:var(--ok); flex:none; }
.sb-dev .dot.warn{ background:var(--warn); } .sb-dev .dot.err{ background:var(--danger); }
.sb-dev .dot.idle{ background:var(--faint); }
.sb-dev .dot.silent{ background:var(--danger); animation:ms-blink 1.4s ease-in-out infinite; }
.sb-dev .lbl{ color:var(--faint); flex:none; }
.sb-dev .val{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sb-alert{ display:flex; align-items:flex-start; gap:6px; font-size:11px; line-height:1.4; font-weight:600; color:var(--danger); }
.sb-alert .ic{ flex:none; padding-top:1px; }
.sb-appearance{ border-top:1px solid var(--hair); margin-top:3px; padding-top:9px; }
.sb-appear-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.sb-appear-label{ font-size:11.5px; color:var(--dim); }
.sb-swatches{ display:flex; align-items:center; gap:5px; }
.sb-sw{ width:20px; height:20px; border-radius:50%; flex:none; display:grid; place-items:center; border:1.5px solid transparent; transition:transform .12s var(--ease-out); }
.sb-sw:hover{ transform:scale(1.12); }
.sb-sw.on{ border-color:var(--accent); }
.sb-sw i{ display:block; width:14px; height:14px; border-radius:50%; }
.sb-appear-name{ margin-top:4px; text-align:right; font-size:10.5px; color:var(--faint); }
.sb-account{ display:flex; align-items:center; gap:7px; width:100%; padding:6px 8px; border-radius:10px; font-size:11.5px; color:var(--dim); }
.sb-account .val{ flex:1; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sb-account.as-btn:hover{ background:rgba(255,255,255,.045); color:var(--text); }
.sb-signout{ font-size:11px; color:var(--faint); }
.sb-signout:hover{ color:var(--danger); }
.sb-syncall{ display:flex; align-items:center; justify-content:center; gap:7px; width:100%; padding:7px 8px; font-size:11.5px; font-weight:600; color:var(--aqua); border:1px solid var(--aqua-line); border-radius:10px; background:var(--aqua-soft); transition:background .16s var(--ease); }
.sb-syncall:hover{ background:rgba(94,234,212,.18); }
.sb-syncall:disabled{ opacity:.7; }
html[data-theme="light"] .sb-syncall, html[data-theme="light"] .sb-sw.on{ color:var(--accent); border-color:color-mix(in oklab, var(--accent) 45%, transparent); }
.sb-quit{ font-size:11px; color:var(--faint); }
.sb-quit:hover{ color:var(--dim); }
.sb-foot-row{ display:flex; align-items:center; justify-content:space-between; margin-top:3px; }
.sb-more{ display:block; width:100%; text-align:center; padding:9px 8px; margin-top:6px; border-radius:10px; font-size:12px; color:var(--dim); border:1px dashed var(--hair); transition:background .16s var(--ease); }
.sb-more:hover{ background:rgba(255,255,255,.045); color:var(--text); }

/* recorder / processing stage inside the pane */
.rec-stage{ flex:1; min-height:0; display:grid; place-items:center; padding:32px; overflow-y:auto; scrollbar-width:thin; }
.rec-stage.has-notes{ place-items:start center; }
.rec-card{ width:480px; max-width:100%; }
.rec-kicker{ font-size:10.5px; font-weight:650; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-bottom:6px; }
.rec-h1{ font-family:var(--display); font-size:24px; font-weight:600; letter-spacing:-.02em; margin:0 0 22px; }
.field{ margin-bottom:18px; }
.field label{ display:block; font-size:12px; font-weight:600; color:var(--dim); margin-bottom:6px; }
.field input[type="text"]{ width:100%; height:38px; padding:0 11px; border-radius:11px; border:1px solid var(--hair); background:rgba(255,255,255,.02); outline:none; font-size:13px; color:var(--text); transition:border-color .18s var(--ease), background .18s var(--ease); }
.field input[type="text"]:focus{ border-color:var(--aqua-line); background:rgba(94,234,212,.04); }
.field input::placeholder{ color:var(--ghost); }
.field .hint{ font-size:11.5px; color:var(--faint); margin-top:6px; line-height:1.5; }
.cal-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.cal-chip{ display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; border:1px solid var(--hair); background:rgba(255,255,255,.02); font-size:11.5px; color:var(--dim); transition:border-color .14s var(--ease), color .14s var(--ease); }
.cal-chip:hover{ border-color:var(--aqua-line); color:var(--text); }
.cal-chip .when{ font-family:var(--mono); font-size:10.5px; color:var(--faint); }
.rec-seg{ display:flex; border:1px solid var(--hair); border-radius:11px; overflow:hidden; background:rgba(255,255,255,.02); }
.rec-seg button{ flex:1; padding:8px 0; font-size:12.5px; font-weight:500; color:var(--dim); display:flex; align-items:center; justify-content:center; gap:7px; transition:background .16s var(--ease), color .16s var(--ease); }
.rec-seg button + button{ border-left:1px solid var(--hair); }
.rec-seg button.on{ background:rgba(94,234,212,.13); color:#eafffb; box-shadow:inset 0 0 0 1px rgba(94,234,212,.24); }
html[data-theme="light"] .rec-seg button.on{ color:var(--text); }
.rec-lang{ width:100%; height:38px; padding:0 8px; border-radius:11px; border:1px solid var(--hair); background:rgba(255,255,255,.02); font-size:13px; outline:none; color:var(--text); }
.rec-devices{ border:1px solid var(--hair); border-radius:var(--r-md); background:rgba(255,255,255,.02); padding:4px 0; }
.rec-dev{ display:flex; align-items:center; gap:10px; padding:9px 13px; }
.rec-dev + .rec-dev{ border-top:1px solid var(--hair); }
.rec-dev .dot{ width:7px; height:7px; border-radius:50%; background:var(--ok); flex:none; }
.rec-dev .dot.warn{ background:var(--warn); } .rec-dev .dot.err{ background:var(--danger); }
.rec-dev .dot.idle{ background:var(--faint); }
.rec-dev .dot.silent{ background:var(--danger); animation:ms-blink 1.4s ease-in-out infinite; }
.rec-dev .name{ font-size:12.5px; font-weight:500; }
.rec-dev .role{ font-size:11px; color:var(--faint); margin-left:auto; text-align:right; }
.rec-dev .role.silent{ color:var(--danger); font-weight:650; }
.rec-alert{ display:flex; align-items:flex-start; gap:9px; margin-top:10px; padding:10px 12px; border-radius:var(--r-md); border:1px solid color-mix(in oklab, var(--danger) 55%, transparent); background:color-mix(in oklab, var(--danger) 12%, transparent); }
.rec-alert .ic{ flex:none; color:var(--danger); display:grid; place-items:center; padding-top:1px; }
.rec-alert b{ display:block; font-size:12.5px; font-weight:700; color:var(--danger); margin-bottom:2px; }
.rec-alert span{ font-size:11.5px; line-height:1.45; color:var(--dim); }
.rec-alert.warn{ border-color:color-mix(in oklab, var(--warn) 55%, transparent); background:color-mix(in oklab, var(--warn) 12%, transparent); }
.rec-alert.warn .ic, .rec-alert.warn b{ color:var(--warn); }
.rec-start{ width:100%; height:42px; border-radius:12px; background:linear-gradient(180deg,#7ff0dd,#4fd8c2); color:var(--aqua-ink); font-size:13.5px; font-weight:650; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:2px; box-shadow:0 0 18px rgba(94,234,212,.22), inset 0 1px 0 rgba(255,255,255,.32); transition:box-shadow .25s var(--ease), transform .12s var(--ease-out); }
.rec-start:hover{ box-shadow:0 0 24px rgba(94,234,212,.4); }
.rec-start:disabled{ opacity:.6; }
.rec-live{ text-align:center; }
.rec-timer{ font-family:var(--mono); font-size:44px; font-weight:300; letter-spacing:.02em; margin:6px 0 2px; font-variant-numeric:tabular-nums; }
.rec-live-title{ font-size:13px; color:var(--dim); }
.rec-pill{ display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:650; letter-spacing:.08em; text-transform:uppercase; color:var(--danger); margin-bottom:4px; }
.rec-pill .dot{ width:8px; height:8px; border-radius:50%; background:var(--danger); animation:ms-blink 1.4s ease-in-out infinite; }
.meters{ display:flex; flex-direction:column; gap:12px; margin:26px 0 28px; text-align:left; }
.meter .m-label{ display:flex; justify-content:space-between; font-size:11px; color:var(--dim); margin-bottom:5px; }
.meter .m-track{ height:6px; border-radius:3px; background:rgba(255,255,255,.06); overflow:hidden; }
.meter .m-fill{ height:100%; border-radius:3px; background:linear-gradient(90deg,var(--aqua),var(--aqua-2)); transition:width .12s linear; }
.rec-stop{ width:100%; height:42px; border-radius:12px; background:var(--danger); color:#fff; font-size:13.5px; font-weight:650; display:flex; align-items:center; justify-content:center; gap:8px; transition:filter .16s var(--ease); }
.rec-stop:hover{ filter:brightness(1.08); }
.live-pane{ text-align:left; border:1px solid var(--hair); border-radius:var(--r-md); background:rgba(255,255,255,.02); margin:0 0 22px; overflow:hidden; }
.live-head{ display:flex; align-items:center; gap:7px; padding:8px 12px; font-size:11px; font-weight:650; letter-spacing:.05em; text-transform:uppercase; color:var(--dim); border-bottom:1px solid var(--hair); }
.live-head .dot{ width:6px; height:6px; border-radius:50%; background:var(--danger); animation:ms-blink 1.6s ease infinite; }
.live-head .live-note{ font-weight:450; text-transform:none; letter-spacing:0; color:var(--faint); margin-left:auto; }
.live-body{ max-height:240px; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:7px; scrollbar-width:thin; }
.live-row{ display:flex; gap:8px; font-size:13px; line-height:1.5; }
.live-row .live-who{ flex:0 0 auto; font-weight:650; color:var(--dim); min-width:38px; }
.live-row .live-who.you{ color:var(--aqua); }
.live-row.is-partial{ opacity:.55; font-style:italic; }
.proc-steps{ display:flex; flex-direction:column; gap:2px; margin-top:18px; }
.proc-step{ display:flex; align-items:center; gap:11px; padding:9px 4px; font-size:13px; color:var(--faint); }
.proc-step.active{ color:var(--text); }
.proc-step.done{ color:var(--dim); }
.proc-ic{ width:18px; height:18px; flex:none; display:grid; place-items:center; }
.proc-step.done .proc-ic{ color:var(--ok); }
.proc-detail{ margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--faint); max-width:220px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* pre-meeting cues editor */
.cues-toggle{ display:flex; align-items:center; gap:9px; width:100%; padding:10px 12px; border:1px solid var(--hair); border-radius:11px; background:rgba(255,255,255,.02); font-size:12.5px; font-weight:500; color:var(--dim); text-align:left; transition:color .14s var(--ease), border-color .14s var(--ease); }
.cues-toggle:hover{ color:var(--text); border-color:var(--hair-lit); }
.cues-toggle .cues-ic{ flex:none; display:grid; place-items:center; color:var(--faint); }
.cues-toggle.on .cues-ic, .cues-toggle.on{ color:var(--text); }
.cues-toggle .cues-label{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cues-toggle .cues-count{ flex:none; font-family:var(--mono); font-size:10.5px; font-weight:650; color:var(--aqua); background:var(--aqua-soft); border-radius:999px; padding:1px 8px; }
.cues-toggle .cues-chev{ flex:none; display:grid; place-items:center; color:var(--faint); transition:transform .15s var(--ease-out); }
.cues-toggle.on .cues-chev{ transform:rotate(180deg); }
.cues-body{ margin-top:8px; }
.cues-body textarea{ display:block; width:100%; min-height:96px; max-height:220px; padding:10px 11px; border-radius:11px; border:1px solid var(--hair); background:rgba(255,255,255,.02); color:var(--text); outline:none; font-family:var(--sans); font-size:12.5px; line-height:1.65; resize:vertical; transition:border-color .18s var(--ease), background .18s var(--ease); }
.cues-body textarea:focus{ border-color:var(--aqua-line); background:rgba(94,234,212,.04); }
.cues-body textarea::placeholder{ color:var(--ghost); }
.cues-foot{ display:flex; align-items:center; gap:10px; margin-top:6px; }
.cues-foot .hint{ flex:1; min-width:0; margin-top:0; }
.cues-state{ flex:none; font-size:11px; color:var(--faint); }
.cues-state.ok{ color:var(--ok); }
.cues-state.local{ color:var(--warn); }
.cues-clear{ flex:none; font-size:11px; color:var(--faint); padding:2px 6px; border-radius:6px; }
.cues-clear:hover{ color:var(--danger); background:rgba(255,255,255,.06); }

/* standalone notes on the error / processing cards */
.ov-section{ margin-top:18px; }
.ov-section.is-standalone{ margin-top:26px; padding-top:22px; border-top:1px solid var(--hair); text-align:left; }
.section-heading{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:11px; }
.section-heading h3{ margin:4px 0 0; font-family:var(--display); font-size:16px; font-weight:600; letter-spacing:-.01em; }
.section-kicker{ display:inline-flex; align-items:center; gap:7px; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--aqua); }
html[data-theme="light"] .section-kicker{ color:var(--accent); }
.note-lede{ margin:-3px 0 10px; font-size:12px; line-height:1.5; color:var(--dim); }
.note-list{ display:flex; flex-direction:column; gap:7px; }
.note-row{ display:flex; align-items:flex-start; gap:12px; padding:11px 14px; background:rgba(255,255,255,.02); border:1px solid var(--hair); border-left:2px solid var(--aqua); border-radius:var(--r-md); }
.note-row .note-body{ font-size:13px; line-height:1.6; color:var(--text); }

/* auth modal */
.am-overlay{ position:fixed; inset:0; background:rgba(6,7,11,.55); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); display:grid; place-items:center; z-index:90; }
.am-card{ width:340px; background:var(--panel-glass); border:1px solid var(--hair-lit); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:10px; box-shadow:0 30px 80px rgba(0,0,0,.55); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }
.am-head{ display:flex; align-items:center; justify-content:space-between; }
.am-title{ display:flex; align-items:center; gap:7px; font-family:var(--display); font-size:14px; font-weight:700; }
.am-x{ color:var(--faint); padding:2px 6px; border-radius:6px; }
.am-x:hover{ background:rgba(255,255,255,.06); color:var(--text); }
.am-sub{ font-size:12px; color:var(--dim); line-height:1.5; margin:0; }
.am-card input{ height:36px; padding:0 10px; border-radius:10px; border:1px solid var(--hair); background:rgba(255,255,255,.03); font-size:13px; outline:none; color:var(--text); }
.am-card input:focus{ border-color:var(--aqua-line); }
.am-card .btn{ justify-content:center; height:36px; }
.am-google{ font-weight:650; }
.am-sep{ display:flex; align-items:center; gap:8px; color:var(--faint); font-size:11px; }
.am-sep::before, .am-sep::after{ content:""; flex:1; height:1px; background:var(--hair); }
.am-note{ font-size:12px; color:var(--dim); text-align:center; margin:0; }
.am-note a{ color:var(--aqua); text-decoration:none; }

/* toast + reconnect banner */
#toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:200;
  background:var(--panel-glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--hair-lit); border-radius:11px; padding:10px 15px; font-size:12.5px; color:var(--text);
  box-shadow:0 14px 34px rgba(0,0,0,.46); display:none; max-width:70vw;
  animation:ms-toast .22s var(--ease-out);
}
@keyframes ms-toast{ from{ opacity:0; transform:translate(-50%,10px) scale(.97); } to{ opacity:1; transform:translate(-50%,0) scale(1); } }
#connBanner{ position:fixed; top:0; left:0; right:0; z-index:210; display:flex; align-items:center; justify-content:center; gap:9px; padding:8px; background:var(--warn); color:#1a1205; font-size:12.5px; font-weight:600; }
#connBanner .spinner{ border-color:rgba(0,0,0,.3); border-top-color:#1a1205; }

/* ============================== RESPONSIVE ============================== */
@media (max-width:1180px){ :root{ --rail-w:320px; } }
@media (max-width:1040px){ :root{ --side-w:220px; --rail-w:300px; --seam-w:16px; } .title{ font-size:23px; } }
@media (max-width:900px){
  :root{ --side-w:0px; --seam-w:0px; }
  .seam{ display:none; }
  .side-toggle{ display:inline-flex; }
  .sidebar{
    position:fixed; left:0; top:0; bottom:0; width:274px; z-index:70;
    transform:translateX(-102%); transition:transform .32s var(--ease-drawer);
    border-right:1px solid var(--hair-lit);
  }
  .shell.side-open .sidebar{ transform:none; box-shadow:0 0 60px rgba(0,0,0,.6); }
  .shell.side-open .scrim{ opacity:1; pointer-events:auto; }
  .chips{ padding-left:24px; padding-right:24px; }
  .reader-inner{ padding-left:32px; padding-right:32px; }
  .rec-stage{ padding:24px 14px; } .rec-card{ width:100%; }
}
@media (max-width:640px){
  :root{ --rail-w:0px; }
  .rail{
    position:fixed; right:0; top:0; bottom:0; width:min(360px,88vw); z-index:70;
    transform:translateX(102%); transition:transform .32s var(--ease-drawer);
  }
  .shell:not(.rail-off) .rail{ transform:none; box-shadow:0 0 60px rgba(0,0,0,.6); }
  .shell:not(.rail-off) .scrim{ opacity:1; pointer-events:auto; }
  .rail.hiding{ transform:translateX(102%); opacity:1; }
  .title{ font-size:21px; max-width:52vw; }
  .chip:nth-child(n+4){ display:none; }
}
@media (max-width:420px){
  .tracks{ display:none; }
  .cmdk-pill{ padding:0 9px; }
}

/* ============================== REDUCED MOTION ============================== */
@media (prefers-reduced-motion:reduce){
  *{ scroll-behavior:auto !important; }
  .bg .blob{ animation:none !important; }
  .title{ animation:none; -webkit-text-fill-color:var(--text); background:none; }
  .beam::after,.turn.playing::after{ animation:none; background:conic-gradient(from 130deg, transparent 0 70%, var(--aqua) 82%, transparent 100%); }
  .seg .pill{ transition:opacity .15s var(--ease); }
  .spk-fill,.topic-fill{ transition:none; }
  .seg-block{ transition:opacity .15s var(--ease); }
  .reader.rf .turn{ opacity:1 !important; }
  .tldr.shimmer{ animation:none; -webkit-text-fill-color:var(--text); background:none; }
  .rpanel,.rpanel.active{ transition:opacity .18s var(--ease); transform:none !important; }
  .turn.flash{ animation:flash .6s var(--ease); }
  .findbar{ transition:opacity .15s var(--ease); }
  .sidebar,.rail{ transition:none; }
  button:active{ transform:none; }
  .tr-note-chev{ transition:none; }
  .tr-note-body.is-revealing{ animation:none; }
  .cmdk-overlay,.cmdk{ transition:opacity .12s var(--ease); }
  .cmdk{ transform:none; }
  #toast{ animation:none; }
  .menu{ animation:none; }
}
@media (hover:none){ .pencil{ opacity:1; } }

</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
</div>
<div class="shell" id="shell">
  <!-- ZONE 1 · MEETINGS SIDEBAR -->
  <aside class="sidebar" id="sidebar" aria-label="Meetings"></aside>
  <!-- ZONES 2–4 · pane / seam / rail (display:contents — children join the shell grid) -->
  <main id="main"></main>
  <div class="scrim" id="scrim" onclick="msScrimClick()"></div>
</div>
<div id="toast"></div>
<div id="modal"></div>

<!-- COMMAND PALETTE (Cmd-K). Static shell; contents + wiring live in the
     additive layer at the end of the main script, pointed at the REAL app functions. -->
<div class="cmdk-overlay" id="msCmdkOverlay">
  <div class="cmdk" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="cmdk-input">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.6" y1="16.6" x2="21" y2="21"/></svg></span>
      <label class="vh" for="msCmdkInput">Search or run a command</label>
      <input id="msCmdkInput" type="text" placeholder="Search transcript, jump to a speaker, or run a command…" autocomplete="off" spellcheck="false">
      <span class="esc">esc</span>
    </div>
    <div class="cmdk-list" id="msCmdkList"></div>
  </div>
</div>

<!-- Lenis smooth scroll (optional). Feature-detected in the additive script; if
     it fails to load the transcript keeps its native scrolling. -->
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.25/dist/lenis.min.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);

/* ---------------------------------------------------------------- icons -- */
const ICONS = {
  mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>',

  plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
  search: '<circle cx="11" cy="11" r="7"/><line x1="16.6" y1="16.6" x2="21" y2="21"/>',
