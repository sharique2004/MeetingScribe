  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',
  x: '<path d="M18 6L6 18"/><path d="M6 6l12 12"/>',
  trash: '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  textT: '<path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/>',
  refresh: '<path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10"/><path d="M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/>',
  play: '<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>',
  pause: '<g fill="currentColor" stroke="none"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></g>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/>',
  pencil: '<path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
  undo: '<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/>',
  folder: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  warn: '<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><circle cx="12" cy="16.6" r=".4" fill="currentColor"/>',
  monitor: '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
  person: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  wave: '<path d="M2 12h2M6 8v8M10 5v14M14 9v6M18 7v10M22 12h-2"/>',
  chat: '<path d="M21 11.5a8 8 0 0 1-11.6 7.2L3.5 20.5l1.8-5.9A8 8 0 1 1 21 11.5z"/>',
  send: '<path d="M12 20V5"/><path d="M5.5 11.5L12 5l6.5 6.5"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
  logo: '<path d="M4.5 4h15A2.5 2.5 0 0 1 22 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4 3.2V16H4.5A2.5 2.5 0 0 1 2 13.5v-7A2.5 2.5 0 0 1 4.5 4z"/><path d="M8.5 9v3M12 7.5v6M15.5 9v3"/>',
  panel: '<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M15 4v16"/>',
  menuBars: '<path d="M4 7h16M4 12h16M4 17h16"/>',
  collapse: '<path d="M11 7l-5 5 5 5"/><path d="M17 7l-5 5 5 5"/>',
};
function icon(name, size = 14, sw = 1.7) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ""}</svg>`;
}

/* ---------------------------------------------------------------- utils -- */
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtTs(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const ss = String(s).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
}
function toast(msg, ms = 3500) {
  const t = $("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(t._h);
  t._h = setTimeout(() => (t.style.display = "none"), ms);
}
async function api(path, opts) {
  const res = await fetch(path, opts);
  let body = null;
  try { body = await res.json(); } catch (e) { /* non-JSON */ }
  if (!res.ok) {
    const err = new Error((body && body.error) || res.statusText);
    err.data = body || {};
    throw err;
  }
  return body;
}
function postJSON(path, data) {
  return api(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(data)});
}
function speakerColor(meta, key) {
  if (key === "you") return "var(--accent)";
  const others = Object.keys(meta.speakers || {}).filter(k => k !== "you");
  return `var(--spk-${["a","b","c"][Math.max(0, others.indexOf(key)) % 3]})`;
}
function dateGroup(iso) {
  if (!iso) return "Earlier";
  const d = new Date(iso), now = new Date();
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 86400000);
  if (diff <= 0) return "Today";
  if (diff === 1) return "Yesterday";
  if (diff < 7) return "This week";
  return "Earlier";
}
function dateLabel(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const time = d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
  const g = dateGroup(iso);
  if (g === "Today") return "Today · " + time;
  if (g === "Yesterday") return "Yesterday · " + time;
  return d.toLocaleDateString([], {month: "short", day: "numeric"}) + " · " + time;
}

   the one that is active, so it cannot read the CSS variables. `name` is the
   label under the row; the id is what lands in localStorage and on <html>. */

  {id: "teal",     name: "Aurora",   bg: "#0a0a12", accent: "#5eead4", spk: "#c07af6"},
  {id: "graphite", name: "Graphite", bg: "#0b0d12", accent: "#7dd3fc", spk: "#c07af6"},

const TR_SIZE_MIN = 13, TR_SIZE_MAX = 18, TR_SIZE_DEFAULT = 14.5;

/* ------------------------------------------------------------- transport -- */
const AU = {mic: null, sys: null, offs: {mic: 0, system: 0}, dur: 0, track: "mix", peaks: null, playing: false, raf: 0};

function transportTeardown() {
  for (const a of [AU.mic, AU.sys]) if (a) { a.pause(); a.onended = null; a.src = ""; }
  cancelAnimationFrame(AU.raf);
  Object.assign(AU, {mic: null, sys: null, dur: 0, peaks: null, playing: false});
}
function transportSetup(meta) {
  transportTeardown();
  const tracks = meta.tracks || {};
  AU.dur = meta.duration || 0;
  AU.offs.mic = (tracks.mic && tracks.mic.start_offset) || 0;
  AU.offs.system = (tracks.system && tracks.system.start_offset) || 0;
  if (tracks.mic) { AU.mic = new Audio(`/api/meetings/${meta.id}/audio/mic`); AU.mic.preload = "metadata"; }
  if (tracks.system && tracks.system.seconds) { AU.sys = new Audio(`/api/meetings/${meta.id}/audio/system`); AU.sys.preload = "metadata"; }
  if (!AU.sys && AU.track === "sys") AU.track = "mix";
  if (!AU.mic && AU.track === "mic") AU.track = "mix";
  applyTrackMode();
  const onEnd = () => { if (!anyAudioActive()) { AU.playing = false; updateTransportUI(); } };
  for (const a of [AU.mic, AU.sys]) if (a) a.onended = onEnd;
  fetch(`/api/meetings/${meta.id}/waveform`).then(r => r.json()).then(w => {
    AU.peaks = w.tracks || {};
    drawWave();
  }).catch(() => {});
}
function anyAudioActive() {
  return [AU.mic, AU.sys].some(a => a && !a.paused && !a.ended);
}
function primaryAudio() {
  if (AU.track === "mic") return AU.mic || AU.sys;
  return AU.sys || AU.mic;
}
function transportTime() {
  const a = primaryAudio();
  if (!a) return 0;
  const off = a === AU.mic ? AU.offs.mic : AU.offs.system;
  return Math.min(AU.dur || a.duration || 0, a.currentTime + off);
}
function applyTrackMode() {
  if (AU.mic) AU.mic.muted = AU.track === "sys";
  if (AU.sys) AU.sys.muted = AU.track === "mic";
}
function setTrack(t) {
  AU.track = t;
  applyTrackMode();
  updateTransportUI();
}
function transportSeek(t) {
  t = Math.max(0, Math.min(AU.dur || 0, t));
  if (AU.mic) AU.mic.currentTime = Math.max(0, t - AU.offs.mic);
  if (AU.sys) AU.sys.currentTime = Math.max(0, t - AU.offs.system);
  drawWave();
  updateTransportUI();
}
function transportPlayPause(forcePlay) {
  if (AU.playing && !forcePlay) {
    for (const a of [AU.mic, AU.sys]) if (a) a.pause();
    AU.playing = false;
  } else {
    for (const a of [AU.mic, AU.sys]) if (a) a.play().catch(() => {});
    AU.playing = true;
    tickWave();
  }
  updateTransportUI();
}
function seekAndPlay(t) {
  transportSeek(t);
  if (!AU.playing) transportPlayPause(true);
}
/* Is there a player for a timestamp to drive? This is the ONE condition under
   which a timestamp may be offered as a seek, and renderReview() emits the
   transport bar under exactly the same test — deliberately the same call, so
   the two can never drift apart.

   Audio alone is not enough. The transport is only rendered for a meeting that
   also has speech, so in a meeting with notes but no detected speech a "jump"
   would start audio with no play/pause, no clock and no waveform anywhere on
   the page — invisible playback the user cannot stop. A timestamp with nothing
   to seek is plain text, here as everywhere else. */
function canSeek(meta) {
  return !!((AU.mic || AU.sys) && meta && (meta.turns || []).length);
}
function tickWave() {
  cancelAnimationFrame(AU.raf);
  const loop = () => {
    if (!AU.playing) return;
    drawWave();
    const el = $("tpClock");
    if (el) el.innerHTML = `<b>${fmtTs(transportTime())}</b> / ${fmtTs(AU.dur)}`;
    AU.raf = requestAnimationFrame(loop);
  };
  AU.raf = requestAnimationFrame(loop);
}
function drawWave() {
  // The seam's playhead follows the same clock as the waveform — one update
  // point, so the two can never disagree about where the audio is.
  const mh = $("miniHead");
  if (mh && AU.dur) mh.style.top = ((transportTime() / AU.dur) * 100).toFixed(3) + "%";
  const cv = $("tpCanvas");
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w) return;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  const cs = getComputedStyle(document.documentElement);
  const accent = cs.getPropertyValue("--accent").trim();
  const faint = cs.getPropertyValue("--text").trim();
  const key = AU.track === "mic" ? "mic" : AU.track === "sys" ? "system" : "mix";
  const peaks = (AU.peaks && (AU.peaks[key] || AU.peaks.mix || AU.peaks.mic)) || null;
  const barW = 2, gap = 1.5, n = Math.floor(w / (barW + gap));
  const playedX = AU.dur ? (transportTime() / AU.dur) * w : 0;
  for (let i = 0; i < n; i++) {
    const amp = peaks ? (peaks[Math.floor(i / n * peaks.length)] || 0.04) : 0.08;
    const bh = Math.max(2, amp * (h - 8));
    const x = i * (barW + gap);
    ctx.fillStyle = x <= playedX ? accent : faint;
    ctx.globalAlpha = x <= playedX ? 0.95 : 0.22;
    ctx.beginPath();
    ctx.roundRect(x, (h - bh) / 2, barW, bh, 1);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function waveClick(e) {
  const r = e.currentTarget.getBoundingClientRect();
  transportSeek(((e.clientX - r.left) / r.width) * AU.dur);
}
function updateTransportUI() {
  const btn = $("tpPlay");
  if (btn) {
    btn.innerHTML = icon(AU.playing ? "pause" : "play", 15);
    btn.classList.toggle("playing", !!AU.playing);
    btn.setAttribute("aria-label", AU.playing ? "Pause" : "Play");
  }
  const clock = $("tpClock");
  if (clock) clock.innerHTML = `<b>${fmtTs(transportTime())}</b> / ${fmtTs(AU.dur)}`;
  document.querySelectorAll(".tp-track button").forEach(b => b.classList.toggle("on", b.dataset.t === AU.track));
  drawWave();
}

/* Routing state for the "System" audio row — shared by the sidebar and the setup
   card so the two can never disagree.

   preflight() now computes this server-side and hands it over as
   sys.routing_alert / sys.routing_note. The inline expression below is only the
   fallback for a payload that carries no alert (older server, or a platform
   where macos_audio is unavailable), and it is the ORIGINAL condition verbatim,
   "&& !sys.auto_route" included: "not_routed" is the NORMAL idle state while
   auto-routing is on, because routing is applied when recording starts. Dropping
   that guard would paint a warning on every single session.

     "silent"      the Mac's own sound output is set to the loopback device, so
                   the call is captured but THE USER HEARS NOTHING. Always wrong,
                   auto-routing or not — rendered loud.
     "not_routed"  auto-routing is off and nothing feeds the loopback, so the
                   other participants will not be recorded.
     "no_loopback" the device the name points at is gone. The server reports no
                   alert for this one, but it is not healthy: nothing can feed a
                   device that does not exist, so auto-routing will fail at
                   record time and the other side is not captured.
     null          healthy, or genuinely unknown (see routingKnown). */
function routingAlert(sys) {
  if (!sys) return null;
  if (sys.routing_alert) return sys.routing_alert;
  if (sys.routing === "no_loopback") return "no_loopback";
  return (sys.routing === "not_routed" && !sys.auto_route) ? "not_routed" : null;
}
/* False only when the routing probe RAN AND FAILED — preflight writes
   routing:"unknown" when CoreAudio refuses to answer. A payload with no routing
   key at all is a platform that has no routing to do (Windows takes system audio
   straight off the WASAPI loopback), which is healthy, not unknown. The
   difference matters: "unknown" must not be painted as checked-and-fine. */
function routingKnown(sys) {
  return !!sys && sys.routing !== "unknown";
}
/* One reading of the System row, shared by the sidebar and the setup card. */
function routingDot(sys) {
  if (!sys) return "err";
  const alert = routingAlert(sys);
  if (alert === "silent") return "silent";
  if (alert) return "warn";
  return routingKnown(sys) ? "" : "idle";
}

/* -------------------------------------------------------------- sidebar -- */
function renderSidebar() {
  // The server already filters by S.q (titles + speaker names).
  const filtered = S.meetings;
  const groups = [];
  for (const m of filtered) {
    const label = dateGroup(m.created);
    let g = groups.find(x => x.label === label);
    if (!g) { g = {label, items: []}; groups.push(g); }
    g.items.push(m);
  }
  const ORDER = {"Today": 0, "Yesterday": 1, "This week": 2, "Earlier": 3};
  groups.sort((a, b) => (ORDER[a.label] ?? 9) - (ORDER[b.label] ?? 9));

  const dev = S.devices || {};
  const mic = dev.mic, sys = dev.system;
  const sysAlert = routingAlert(sys);
  const sysDot = routingDot(sys);
  // The note is the backend's own wording. Failing that, say what is actually
  // true of THIS setup rather than the old blanket "routes automatically":
  // with auto_route off nothing will route, and an already-routed output is
  // working without any help from us.
  const sysTitle = (sys && sys.routing_note)
    || (!sys ? "Not found — the other participants cannot be captured."
      : sysAlert === "no_loopback" ? "This device is no longer available, so the other participants will not be recorded."
      : !routingKnown(sys) ? "Captures the other participants. Its routing could not be checked just now."
      : sys.routing == null ? "Captures the other participants."   // platform with no routing to do
      : sys.routing === "routed" ? "Captures the other participants. Your output already feeds it."
      : sys.auto_route === false ? "Captures the other participants. Automatic routing is off, so route your output through it yourself."
      : "Captures the other participants. Routes automatically while you record.");
  let html = `
    <div class="side-head">
      <div class="logo" title="All processing happens on this Mac. Nothing is uploaded."><span class="icon">${icon("logo", 15, 1.5)}</span></div>
      <div class="brandname">MeetingScribe</div>
      <button class="side-collapse" onclick="msCloseSidebar()" aria-label="Collapse meetings sidebar"><span class="icon">${icon("collapse", 17, 1.5)}</span></button>
    </div>
    <div class="side-top">
      <button class="new-rec${S.view === "new" ? " is-active" : ""}" onclick="goNew()"><span class="icon">${icon("plus", 15, 2)}</span>New recording</button>
      <div class="side-search">
        <span class="icon">${icon("search", 14)}</span>
        <input type="text" id="sbSearch" placeholder="Search meetings" autocomplete="off" aria-label="Search meetings" value="${esc(S.q)}" oninput="sbSearch(this.value)">
      </div>
    </div>
    <nav class="meet-list">`;
  for (const g of groups) {
    html += `<div class="meet-group"><div class="glabel">${esc(g.label)}</div>`;
    for (const m of g.items) {
      const active = m.id === S.activeId && S.view === "meeting" && !S.rec.recording;
      const status = m.status === "processing" ? `<span class="st processing"><span class="dot"></span>processing</span>`
        : m.status === "error" ? `<span class="st error"><span class="dot"></span>failed</span>`
        : m.status === "recording" ? `<span class="st recording"><span class="dot"></span>recording</span>` : "";
      const when = m.created
        ? new Date(m.created).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"}) : "";
      const mm = [
        when,
        m.duration ? fmtTs(m.duration) : "",
        m.speakers ? `${m.speakers} speaker${m.speakers === 1 ? "" : "s"}` : (m.mode === "inperson" ? "In person" : "Online call"),
      ].filter(Boolean).join(" · ");
      html += `<button class="meet-item${active ? " active" : ""}" onclick="openMeeting('${m.id}')">
        <div class="mt"><span class="name">${esc(m.title || m.id)}</span><span class="adot" aria-hidden="true"></span></div>
        <div class="mm">${esc(mm)}${status ? ` · ${status}` : ""}</div>
      </button>`;
    }
    html += `</div>`;
  }
  if (!filtered.length) html += `<div class="tr-empty">${S.q.trim() ? `No meetings match “${esc(S.q)}”.` : "No meetings yet."}</div>`;
  if (S.meetings.length < S.total) {
    html += `<button class="sb-more" id="sbMore" onclick="loadMoreMeetings()">
      ${S.listLoading ? "Loading…" : `Show more (${S.total - S.meetings.length} older)`}</button>`;
  }
  const swatches = THEMES.map(t => `<button class="sb-sw${S.theme === t.id ? " on" : ""}"
    style="background:${t.bg}" title="${esc(t.name)}" onclick="setTheme('${t.id}')" aria-label="${esc(t.name)} appearance">
    <i style="background:linear-gradient(90deg, ${t.accent} 0 50%, ${t.spk} 50% 100%)"></i></button>`).join("");
  const themeName = (THEMES.find(t => t.id === S.theme) || THEMES[0]).name;
  html += `</nav>
    <div class="sb-foot">
      <div class="sb-dev" title="Records as “You”">
        <span class="dot ${mic ? "" : "err"}"></span><span class="lbl">Mic</span>
        <span class="val">${esc(mic ? mic.name : "Not found")}</span>
      </div>
      <div class="sb-dev" title="${esc(sysTitle)}">
        <span class="dot ${sysDot}"></span><span class="lbl">System</span>
        <span class="val">${esc(sys ? sys.name : "BlackHole not installed")}</span>
      </div>
      ${sysAlert === "silent" ? `<div class="sb-alert" title="${esc(sys.routing_note || "")}">
        <span class="ic">${icon("warn", 11)}</span>
        <span>You will hear nothing — your Mac's output is set to ${esc(sys.name)}.</span>
      </div>` : ""}
      <div class="sb-appearance">
        <div class="sb-appear-row">
          <span class="sb-appear-label">Appearance</span>
          <div class="sb-swatches">${swatches}</div>

      </div>

             ${icon("phone", 12)}<span class="val">${esc(S.auth.email || "Signed in")}</span>
             <button class="sb-signout" onclick="authSignOut()">Sign out</button></div>
           <button class="sb-syncall" onclick="syncAll()" ${S.syncAllBusy ? "disabled" : ""}
             title="Push every finished meeting to your phone at once">

             ${icon("phone", 12)}<span class="val">Sign in for phone sync</span></button>`}
      <div class="sb-foot-row">
        <button class="sb-quit" onclick="quitApp()">Quit MeetingScribe</button>
      </div>
    </div>`;
  // Re-rendering replaces the DOM: keep focus + caret in the search box.
  const hadFocus = document.activeElement && document.activeElement.id === "sbSearch";
  $("sidebar").innerHTML = html;
  if (hadFocus) {
    const n = $("sbSearch");
    n.focus();
    n.setSelectionRange(S.q.length, S.q.length);
  }
  watchListEnd();
}
// Auto-load older meetings when the "Show more" button scrolls into view.
let _listObserver = null;
function watchListEnd() {
  if (_listObserver) _listObserver.disconnect();
  const more = $("sbMore");
  if (!more) return;
  _listObserver = new IntersectionObserver((entries) => {
    if (entries.some(e => e.isIntersecting)) loadMoreMeetings();
  }, {root: more.closest(".meet-list"), rootMargin: "120px"});
  _listObserver.observe(more);
}
let _sbSearchTimer = 0;
function sbSearch(v) {
  S.q = v;
  clearTimeout(_sbSearchTimer);
  _sbSearchTimer = setTimeout(() => refreshList(), 250);
}

/* --------------------------------------------------- account & phone sync -- */
async function refreshAuth() {
  try {
    S.auth = await api("/api/auth/state");
    renderSidebar();
    if (S.detail && S.view === "meeting" && !S.rec.recording) renderMain();
  } catch (e) { /* transient */ }
}
function syncButton(meta) {
  const sync = meta.sync || {};
  const on = !!sync.enabled;
  const err = on && sync.error;
  const label = S.busySync ? `<span class="spinner"></span>Syncing…`
    : err ? `${icon("phone", 13)}Sync failed — retry`
    : on ? `${icon("phone", 13)}On phone ✓`
    : `${icon("phone", 13)}View on phone`;
  const title = on
    ? "This meeting's transcript + summary are readable on your phone. Click to remove the synced copy."
    : "Upload this meeting's transcript + summary (text only, never audio) to your private, "
      + "sign-in-protected space so you can read it on your phone.";
  return `<button class="menu-item${on && !err ? " sync-on" : ""}" id="syncBtn" ${S.busySync ? "disabled" : ""}
    onclick="toggleSync('${meta.id}', ${on && !err ? "false" : "true"})" title="${esc(title)}">${label}</button>`;
}
async function toggleSync(id, enable) {
  if (enable && !S.auth.signed_in) { openAuth("signin"); return; }
  if (!enable && !confirm("Remove this meeting from your phone?\n\nThe synced copy is deleted; the meeting stays on this Mac.")) return;
  S.busySync = true;
  renderMain();
  try {
    const meta = await postJSON(`/api/meetings/${id}/sync`, {enabled: enable});
    if (S.detail && S.detail.id === id) S.detail = meta;
    const err = meta.sync && meta.sync.error;
    if (enable && err) toast("⚠ " + err, 6000);
    else toast(enable ? "✅ On your phone — open the web app to read it" : "Removed from your phone", 4000);
    refreshList();
  } catch (e) {
    if (e.message && e.message.toLowerCase().includes("sign in")) openAuth("signin");
    else toast("⚠ " + e.message, 6000);
  } finally {
    S.busySync = false;
    renderMain();
  }
}
function openAuth(mode) { S.authModal = mode || "signin"; renderAuthModal(); }
function closeAuth() { S.authModal = null; renderAuthModal(); }
function renderAuthModal() {
  const m = S.authModal;
  if (!m) { $("modal").innerHTML = ""; return; }
  const google = (S.auth.providers || []).includes("google");
  let body = "";
  if (m === "waiting") {
    body = `<p class="am-note"><span class="spinner"></span> Finish signing in with Google in your browser…</p>
      <button class="btn" onclick="closeAuth()">Cancel</button>`;
  } else if (m === "verify") {
    body = `
      <p class="am-note">We emailed a 6-digit code to <b>${esc(S.authEmail)}</b>.</p>
      <input type="text" id="amCode" placeholder="123456" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
      <button class="btn primary" onclick="authVerify()">Verify & sign in</button>`;
  } else {
    const signup = m === "signup";
    body = `
      ${google ? `<button class="btn am-google" onclick="authGoogle()">Continue with Google</button>
      <div class="am-sep"><span>or</span></div>` : ""}
      <input type="email" id="amEmail" placeholder="Email" value="${esc(S.authEmail)}" autocomplete="username">
      <input type="password" id="amPass" placeholder="Password${signup ? " (6+ characters)" : ""}" autocomplete="${signup ? "new-password" : "current-password"}">
      <button class="btn primary" onclick="authSubmit(${signup})">${signup ? "Create account" : "Sign in"}</button>
      <div class="am-note">${signup
        ? `Already have an account? <a href="#" onclick="openAuth('signin');return false">Sign in</a>`
        : `New here? <a href="#" onclick="openAuth('signup');return false">Create an account</a>`}</div>`;
  }
  $("modal").innerHTML = `
    <div class="am-overlay" onclick="if(event.target===this)closeAuth()">
      <div class="am-card">
        <div class="am-head">
          <div class="am-title">${icon("phone", 15)} Read meetings on your phone</div>
          <button class="am-x" onclick="closeAuth()">✕</button>
        </div>
        <p class="am-sub">Meetings stay on this Mac unless you choose “View on phone” — then the
        transcript and summary (text only, never audio) sync to your private space.</p>
        ${body}
      </div>
    </div>`;
  const first = $("amEmail") || $("amCode");
  if (first) first.focus();
}
async function authSubmit(signup) {
  const email = ($("amEmail") || {}).value || "";
  const password = ($("amPass") || {}).value || "";
  if (!email || !password) { toast("⚠ Enter an email and password"); return; }
  S.authEmail = email;
  try {
    const r = await postJSON(signup ? "/api/auth/signup" : "/api/auth/signin", {email, password});
    if (r.needs_verification) { S.authModal = "verify"; renderAuthModal(); return; }
    S.auth = r;
    closeAuth();
    toast("✅ Signed in as " + (r.email || email));
    renderSidebar(); renderMain();
  } catch (e) { toast("⚠ " + e.message, 6000); }
}
async function authVerify() {
  const code = ($("amCode") || {}).value || "";
  try {
    const r = await postJSON("/api/auth/verify", {email: S.authEmail, code});
    S.auth = r;
    closeAuth();
    toast("✅ Signed in as " + (r.email || S.authEmail));
    renderSidebar(); renderMain();
  } catch (e) { toast("⚠ " + e.message, 6000); }
}
async function authGoogle() {
  try {
    await postJSON("/api/auth/oauth/google/start", {});
    S.authModal = "waiting"; renderAuthModal();
    const until = Date.now() + 180000;
    while (S.authModal === "waiting" && Date.now() < until) {
      await new Promise(r => setTimeout(r, 1500));
      const st = await api("/api/auth/state");
      if (st.signed_in) {
        S.auth = st;
        closeAuth();
        toast("✅ Signed in as " + (st.email || ""));
        renderSidebar(); renderMain();
        return;
      }
    }
    if (S.authModal === "waiting") { closeAuth(); toast("Sign-in timed out — try again."); }
  } catch (e) { toast("⚠ " + e.message, 6000); }
}
async function syncAll() {
  if (S.syncAllBusy) return;
  S.syncAllBusy = true; S.syncAllMsg = "Syncing…"; renderSidebar();
  try {
    const r = await postJSON("/api/sync/all", {});
    const poll = async () => {
      try {
        const st = await api("/api/sync/all");
        S.syncAllMsg = st.message || "Syncing…";
        if (st.state === "processing") { renderSidebar(); return setTimeout(poll, 1200); }
        S.syncAllBusy = false; renderSidebar(); refreshList();
        toast("✅ " + (st.message || "Synced to your phone"), 5000);
      } catch (e) { S.syncAllBusy = false; renderSidebar(); }
    };
    poll();
  } catch (e) {
    S.syncAllBusy = false; renderSidebar();
    if (e.data && e.data.needs_signin) openAuth("signin");
    else toast("⚠ " + e.message, 6000);
  }
}
async function authSignOut() {
  if (!confirm("Sign out?\n\nMeetings already synced stay readable on your phone; new syncs need a sign-in.")) return;
  try {
    S.auth = await postJSON("/api/auth/signout", {});
    renderSidebar(); renderMain();
  } catch (e) { toast("⚠ " + e.message); }
}
/* Appearance. Everything else is CSS-variable driven, so only the sidebar (the
   ring + the name label) has to re-render — and the waveform, which paints on a
   canvas from --accent / --text and cannot repaint itself. */
function setTheme(id) {
  if (!THEMES.some(t => t.id === id) || id === S.theme) return;
  S.theme = id;
  localStorage.setItem("msTheme", id);
  document.documentElement.dataset.theme = id;
  renderSidebar();
  drawWave();
}
function goNew() {
  S.view = "new";
  S.menu = null;
  renderSidebar();
  renderMain();
  pollCalendar();
}

/* --------------------------------------------------------------- review -- */
function noteRows(meta) {
  const rows = [];
  S._noteKeys = []; // dismiss buttons reference notes by index — titles and
                    // warning text can contain quotes, so never inline them
  for (const w of meta.warnings || []) {
    const key = meta.id + "|" + w;
    if (S.dismissed.has(key)) continue;
    const idx = S._noteKeys.push(key) - 1;
    const echo = w.match(/^Removed (\d+) mic segment/);
    const body = echo
      ? `Removed <b class="mono">${echo[1]}</b> mic segments that were echo of the meeting audio — headphones avoid this entirely.`
      : esc(w);
    rows.push(`<div class="note warn"><span class="ic">${icon("warn", 13)}</span><span>${body}</span>
      <button class="dismiss" onclick="dismissNote(${idx})" title="Dismiss">${icon("x", 11)}</button></div>`);
  }
  if (meta.tidied) {
    const td = meta.tidied;
    rows.push(`<div class="note tidy"><span class="ic">${icon("sparkle", 13)}</span>
      <span>Tidied on-device — ${td.dropped_turns || 0} echo turns removed, ${td.trimmed_turns || 0} trimmed, ${Object.keys(td.merged_speakers || {}).length} speaker labels merged. Validated locally; no words invented.</span></div>`);
  }
  return rows.length ? `<div class="rv-notes">${rows.join("")}</div>` : "";
}
function dismissNote(idx) {
  const key = (S._noteKeys || [])[idx];
  if (key) S.dismissed.add(key);
  renderMain();
}

/* notes.py writes {t, text} and freezes cues as plain strings. These readers
   accept a wider shape than that on purpose, and deliberately the SAME wider
   shape as summarize.py's _entry(): the summary and the review must never
   disagree about which cue went unasked because one of them could read a key
   the other could not. If the stored shape changes, change both.
   SAME means same: these two lists are summarize.py's _TEXT_KEYS and _TIME_KEYS
   verbatim, in order — "cue" and "title" included, which an earlier version of
   this list dropped while still claiming the shapes matched. A cue stored as
   {"cue": "…"} was then read by the summarizer, judged, and named in
   unaddressed_cues, while this file read no text for it at all and filtered it
   out of the rail: the verdict arrived about a cue the user could not see.
   entryText/entryTime below match _entry()'s scan rules for the same reason. */
const NOTE_TEXT_KEYS = ["text", "note", "cue", "body", "content", "value", "label", "title"];
const NOTE_TIME_KEYS = ["t", "time", "at", "ts", "start", "seconds", "offset", "elapsed"];
const CUE_COVERED_KEYS = ["covered", "answered", "asked", "used", "done", "checked",
                          "complete", "completed", "resolved", "addressed", "raised"];
const CUE_COVERED_WORDS = ["covered", "answered", "asked", "done", "used", "complete",
                           "completed", "resolved", "addressed", "raised"];
const CUE_OPEN_WORDS = ["open", "pending", "unasked", "unanswered", "todo", "new",
                        "not_asked", "not-asked", "unaddressed", "skipped", "missed"];
const DAY_SECONDS = 24 * 3600;

function entryText(item) {
  if (typeof item === "string") return item;
  if (!item || typeof item !== "object" || Array.isArray(item)) return "";
  for (const k of NOTE_TEXT_KEYS) if (typeof item[k] === "string" && item[k].trim()) return item[k];
  return "";
}
/* Seconds into the meeting, or null. Rejects epoch/millisecond stamps the same
   way the summarizer does — a note "at 1.7 billion seconds" is not a seek.

   null is UNTIMED, and that is a different fact from 0 — which means the note
   was typed in the first second of the meeting. This is the contract with
   notes.py: a timestamp it could not use comes back as null, never as 0.0,
   because a note coerced to 0.0 is indistinguishable from a real one and would
   be planted at the top of the transcript next to words the user was not
   writing about. Untimed notes are rendered as untimed (see notesSection) and
   left off the timeline (see timedNotes) — never silently moved to 0:00.

   The scan itself mirrors summarize.py's _entry(): a key whose value is not a
   number is skipped rather than believed, so {"t": "12", "time": 12} reads the
   same 12 here as it does there. The FIRST numeric key decides — including when
   it decides "unusable" (NaN, Infinity, negative, an epoch stamp): a later key
   does not get to overrule a real number that was simply out of range. */
function entryTime(item) {
  if (!item || typeof item !== "object") return null;
  for (const k of NOTE_TIME_KEYS) {
    const v = item[k];
    if (typeof v !== "number") continue;   // absent, null, a string, a bool
    return (isFinite(v) && v >= 0 && v < DAY_SECONDS) ? v : null;
  }
  return null;
}
/* Notes taken on the floating panel while the meeting was happening, in the
   order they were typed — which is the order notes.py appends them in, so it is
   also chronological. This order is what the Overview lists, and the index into
   it is the identity of a note everywhere else (jumpToNote, the transcript's
   element ids). */
function meetingNotes(meta) {
  const raw = (meta && meta.notes) || [];
  if (!Array.isArray(raw)) return [];
  return raw.map(n => ({t: entryTime(n), text: entryText(n)})).filter(n => n.text.trim());
}
/* The notes that can be placed on the transcript's timeline, oldest first, each
   carrying its meetingNotes() index so the Overview and the transcript point at
   the same note. Sorted rather than trusted: appends are chronological in
   practice, but the transcript is a timeline and one out-of-order note must not
   be able to land in the wrong conversation.
   A note whose timestamp is unusable (missing, null, a string, an epoch stamp —
   see entryTime) is deliberately dropped here: it still shows in the Overview,
   marked "—", but it has no moment to be shown AT, and inventing one would put
   words next to a part of the meeting the user was not writing about. */
function timedNotes(meta) {
  return meetingNotes(meta)
    .map((n, i) => ({t: n.t, text: n.text, i}))
    .filter(n => n.t !== null)
    .sort((a, b) => a.t - b.t);
}
/* The cues this meeting was started with. `covered` stays null unless something
   actually said — an unjudged cue must never be shown as one the user missed. */
function meetingCues(meta) {
  const raw = (meta && meta.cues) || [];
  if (!Array.isArray(raw)) return [];
  /* summarize.py omits `unaddressed_cues` ENTIRELY when no engine it trusts
     judged the cues, and includes it — possibly empty — when one did. So the
     array's PRESENCE is the verdict, not its length: an empty list is the
     positive claim "every cue came up", not an absence of information. */
  const flaggedList = ((meta.summary || {}).unaddressed_cues);
  const judged = Array.isArray(flaggedList);
  const flagged = new Set((judged ? flaggedList : [])
    .map(c => String(entryText(c) || c).trim().toLowerCase()));
  return raw.map(c => {
    const text = entryText(c);
    let covered = null;
    if (c && typeof c === "object" && !Array.isArray(c)) {
      for (const k of CUE_COVERED_KEYS) {
        if (k in c && (typeof c[k] === "boolean" || typeof c[k] === "number")) { covered = !!c[k]; break; }
      }
      if (covered === null) {
        const status = c.status || c.state;
        if (typeof status === "string") {
          const w = status.trim().toLowerCase().replace(/ /g, "_");
          if (CUE_COVERED_WORDS.includes(w)) covered = true;
          else if (CUE_OPEN_WORDS.includes(w)) covered = false;
        }
      }
    }
    if (covered === null && judged) covered = !flagged.has(text.trim().toLowerCase());
    return {text, covered};
  }).filter(c => c.text.trim());
}
/* Notes, in the main column: the human record of the meeting, sitting directly
   under the machine's — first thing after the brief, ahead of everything the
   summarizer produced, because this is the one part of the page the user wrote
   themselves. Each timestamp seeks the audio to that moment; "In transcript"
   takes them to the same note standing in the transcript. */
function notesSection(meta, opts) {
  const notes = meetingNotes(meta);
  if (!notes.length) return "";
  // `standalone` is the render used by the two screens that REPLACE the review —
  // a failed meeting and one still processing. The same notes, on a page with no
  // transcript to send anyone to and no player to seek.
  const standalone = !!(opts && opts.standalone);
  const seekable = !standalone && canSeek(meta);
  let anyPlaced = false;
  const rows = notes.map((n, i) => {
    // UNTIMED IS NOT 0:00. A note with no usable timestamp gets a dashed, dimmed
    // "—" that reads as an absence; a note genuinely typed in the first second
    // gets the solid mono "0:00" pill every other timestamp gets. They mean
    // different things — "we do not know when" against "at the very start" — so
    // they must never render alike. (entryTime keeps them apart upstream.)
    const stamp = n.t === null
      ? `<span class="note-time is-untimed" title="No timestamp — this note was saved without a position in the meeting, so it has no moment to jump to.">—</span>`
      : seekable
        ? `<button class="note-time" title="Jump audio to ${fmtTs(n.t)}" onclick="seekAndPlay(${n.t})">${fmtTs(n.t)}</button>`
        : `<span class="note-time" title="Written ${fmtTs(n.t)} into the meeting">${fmtTs(n.t)}</span>`;
    // Only offer the jump for a note that is actually down there. A timed note
    // always is, even in a meeting with no speech at all — the transcript falls
    // back to the notes alone. An untimed one never is: it has no place on the
    // timeline, so there is nothing to jump to. And on the standalone render
    // there is no transcript at all.
    const placed = n.t !== null;
    anyPlaced = anyPlaced || placed;
    const jump = placed && !standalone
      ? `<button class="note-jump" title="Show this note in the transcript, where you wrote it"
          onclick="jumpToNote(${i})">${icon("list", 12)}<span>In transcript</span></button>`
      : "";
    if (standalone) return `<div class="note-row">${stamp}<div class="note-body">${esc(n.text)}</div></div>`;
    return `<div class="rail-note">${stamp}<div class="note-body">${esc(n.text)}</div>${jump}</div>`;
  }).join("");
  if (standalone) {
    // The standalone caller says WHY this page is showing the notes on their own —
    // "the run failed" and "the run has not finished yet" are different things to
    // be told while you look for a note you typed.
    const ledeText = (opts && opts.lede) || "Written straight to disk as you typed them, so they are here whatever the audio does next.";
    return `<section class="ov-section is-standalone">
      <div class="section-heading"><div><span class="section-kicker">${icon("pencil", 12)} While it happened</span><h3>Your notes</h3></div><span class="count-badge">${notes.length}</span></div>
      <p class="note-lede">${esc(ledeText)}</p>
      <div class="note-list">${rows}</div>
    </section>`;
  }
  return `<div class="eyebrow-row"><div class="eyebrow">Your notes</div><span class="count-badge">${notes.length}</span></div>${rows}`;
}
/* Overview → the same note in the transcript. Any transcript search is cleared
   first: the user asked to see THIS note, and a filter left over from an earlier
   search is perfectly capable of hiding it. */
function jumpToNote(i) {
  S.tq = "";
  S.noteOpen.add(i);   // the user asked to see THIS note — land on it open, not collapsed
  if (S.tab === "transcript") renderMain();
  else setTab("transcript");   // setTab renders synchronously
  const el = $("trNote-" + i);
  if (!el) return;
  el.scrollIntoView({block: "center", behavior: "smooth"});
  el.classList.add("is-target");
  setTimeout(() => el.classList.remove("is-target"), 1800);
}
/* Cues, in the rail: what you meant to raise, and whether you got to it. */
function cuesCard(meta) {
  const cues = meetingCues(meta);
  if (!cues.length) return "";
  const judged = cues.some(c => c.covered !== null);
  const missed = cues.filter(c => c.covered === false).length;
  let body, foot = "", label = "";
  if (!judged) {
    body = `<ul class="q-list">${cues.map(c => `<li>${esc(c.text)}</li>`).join("")}</ul>`;
  } else {
    body = `<ul class="cue-list">${cues.map(c => `<li class="${c.covered === false ? "missed" : ""}">
      <span class="cue-mark">${icon(c.covered === false ? "warn" : "check", 11, 2.2)}</span>
      <span>${esc(c.text)}</span></li>`).join("")}</ul>`;
    label = missed
      ? `<span class="miss-label">${missed} not covered</span>`
      : `<span class="ready-label">All covered</span>`;
    foot = missed ? `<p class="cue-note">Judged from the transcript — worth a second look before you close this out.</p>` : "";
  }
  return `<div class="eyebrow-row"><div class="eyebrow">Your cues</div>${label}</div>${body}${foot}`;
}
/* Summary rail (converged's .brief-card / .decision / .action language),
   mapped entirely onto the real summary data. */
function overviewHTML(meta, busy) {
  const s = meta.summary;
  const hasTurns = (meta.turns || []).length > 0;

  let html;
  if (s) {
    html = briefHero(meta, busy);
  } else if (busy) {
    html = `<div class="brief-card"><div class="eyebrow">Brief</div>
      <p class="tldr" style="display:flex;align-items:center;gap:9px"><span class="spinner"></span>
      Reading the transcript and pulling out the outcome, decisions and next steps…</p></div>`;
  } else if (hasTurns) {
    html = `<div class="brief-card"><div class="eyebrow">Brief</div>
      <p class="tldr">The outcome, decisions, action items with owners, and a ready-to-send
      follow-up email — written by your own Claude. Transcript text only, never audio.</p>
      <button class="email-btn" onclick="summarizeMeeting('${meta.id}')"><span class="icon">${icon("sparkle", 15)}</span>Summarize meeting</button></div>`;
  } else {
    html = `<div class="tr-empty">No speech was detected in this recording.</div>`;
  }

  if (s && (s.decisions || []).length) {
    html += `<div class="eyebrow">Decisions</div>`
      + s.decisions.map(d => `<div class="decision"><span class="dot"></span><span>${esc(d)}</span></div>`).join("");
  }
  if (s && (s.action_items || []).length) {
    html += `<div class="eyebrow">Action items</div>`
      + s.action_items.map(a => {
        const you = (a.owner || "").toLowerCase() === "you";
        const col = you ? "var(--accent)" : "var(--spk-a)";
        return `<div class="action"><span class="av" style="background:${col}">${esc(initials(a.owner || "—"))}</span>
          <div class="body"><div class="task">${esc(a.task)}</div>
          <div class="due-line">${esc(a.owner || "—")}${a.due ? ` · ${esc(a.due)}` : ""}</div></div></div>`;
      }).join("");
  }
  if (s && (s.open_questions || []).length) {
    html += `<div class="eyebrow">Open questions</div>`
      + s.open_questions.map(q => `<div class="q-item"><span class="dot"></span><span>${esc(q)}</span></div>`).join("");
  }
  if (s && (s.key_points || []).length) {
    html += `<div class="eyebrow">Key points</div>`
      + s.key_points.map(x => `<div class="q-item"><span class="dot" style="background:var(--aqua-2)"></span><span>${esc(x)}</span></div>`).join("");
  }
  if (s && (s.follow_ups || []).length) {
    html += `<div class="eyebrow">Follow-ups</div>`
      + s.follow_ups.map(x => `<div class="q-item"><span class="dot" style="background:var(--v-vio)"></span><span>${esc(x)}</span></div>`).join("");
  }
  html += followupCard(meta);
  html += notesSection(meta);
  html += cuesCard(meta);
  html += askCard(meta);
  return html;
}
/* The brief, converged style: eyebrow + engine tag, then the TL;DR. */
function briefHero(meta, busy) {
  const s = meta.summary;
  const tldr = (s.tldr || "").trim();
  const headline = (s.headline || "").trim().replace(/[.]$/, "");
  let body;
  if (headline) {
    body = `<p class="tldr" style="font-weight:600">${esc(headline)}</p>`
      + (tldr ? `<p class="tldr" style="margin-top:8px">${esc(tldr)}</p>` : "");
  } else {
    body = `<p class="tldr" id="tldr">${esc(tldr || "Summary ready")}</p>`;
  }
  return `<div class="brief-card"><div class="head-row"><div class="eyebrow">Brief</div>
    <span class="brief-depth mono">${(s.engine === "claude" ? "Claude" : "On-device")}${busy ? " · updating…" : ""}</span></div>
    ${body}</div>`;
}
/* Badge initials: "Speaker 3" -> "3", "You" -> "Y", "Priya Sharma" -> "PS". */
function initials(name) {
  name = String(name || "").trim();
  const m = name.match(/(\d+)\s*$/);
  if (m) return m[1];
  const words = name.split(/\s+/).filter(Boolean);
  if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
  return (name.slice(0, 1) || "?").toUpperCase();
}

/* Follow-up draft, in the rail. */
function followupCard(meta) {
  const email = (meta.summary || {}).follow_up_email || {};
  if (!email.body) return "";
  return `<div class="eyebrow-row"><div class="eyebrow">Follow-up draft</div><span class="ready-label">Ready</span></div>
    <div class="email-preview">${email.subject ? `<b>${esc(email.subject)}</b>` : ""}<p>${esc(email.body)}</p></div>
    <button class="email-btn" onclick="copySummaryEmail('${meta.id}')"><span class="icon">${icon("copy", 15)}</span>Copy follow-up email</button>`;
}
/* Entry point into the Ask panel. Pointless without a transcript. */
function askCard(meta) {
  if (!(meta.turns || []).length) return "";
  return `<button class="email-btn" onclick="setTab('chat')"><span class="icon">${icon("chat", 15)}</span>Ask this meeting</button>`;
}
/* The rail's segmented control drives this with the SAME tab ids as ever:
   overview → Summary, insights → Speakers, chat → Ask. The transcript is no
   longer a tab — it is always on screen in the centre pane — so a request for
   the old "transcript" tab just re-renders and focuses the reader. */
const RAIL_VIEWS = ["summary", "speakers", "ask"];
function railViewOf(tab) {
  return tab === "insights" ? "speakers" : tab === "chat" ? "ask" : "summary";
}
function setTab(tab) {
  if (tab === "transcript") {
    renderMain();
    drawWave();
    const rd = document.querySelector(".reader");
    if (rd && rd.focus) rd.focus({preventScroll: true});
    return;
  }
  if (S.tab === tab) return;
  S.tab = tab;
  if (tab === "chat") _askAutoFocus = true;   // opening Ask puts the caret in the composer
  // All three rail panels are always in the DOM: switch them in place so the
  // converged panel motion (fade + lift, sliding pill) actually plays, and
  // fall back to a full render when the rail is not on screen.
  const view = railViewOf(tab);
  const panels = RAIL_VIEWS.map(v => $("p-" + v));
  if ($("railBody") && panels.every(Boolean)) {
    document.querySelectorAll("#seg button").forEach(b => {
      b.setAttribute("aria-selected", b.dataset.view === view ? "true" : "false");
    });
    RAIL_VIEWS.forEach((v, i) => panels[i].classList.toggle("active", v === view));
    slideTabPill(RAIL_VIEWS.indexOf(view));
    if (tab === "chat") bindChat(null);
    return;
  }
  renderMain();
}

/* Speaker cards for the context rail (converged's .spkcard language) + the
   re-cluster control. Same data, same wiring: editSpeaker() still swaps the
   name for an input inside #spkName-<key>, and the count <select> still posts
   to reclusterMeeting(). */
function speakerStrip(meta) {
  const stats = (meta.stats || {}).per_speaker || {};
  const entries = Object.entries(meta.speakers || {});
  let html = `<div class="eyebrow">Speakers${entries.length ? ` · ${entries.length} detected` : ""}</div>`;
  for (const [key, name] of entries) {
    const st = stats[key] || {};
    const c = speakerColor(meta, key);
    const share = st.share || 0;
    const pct = Math.round(share * 100);
    const meta2 = [
      st.words ? `${(st.words || 0).toLocaleString()} words` : "",
      st.wpm ? `${st.wpm} wpm` : "",
      st.questions ? `${st.questions} question${st.questions === 1 ? "" : "s"}` : "",
    ].filter(Boolean);
    html += `<div class="spkcard" data-key="${esc(key)}" style="--sp:${c}">
      <div class="spk-top"><span class="av" style="background:${c}">${esc(initials(name))}</span>
        <div class="spk-name-wrap" id="spkName-${esc(key)}"><span class="spk-name" style="color:${c}">${esc(name)}</span>
          <button class="pencil" title="Rename speaker" onclick="editSpeaker('${esc(key)}')" aria-label="Rename ${esc(name)}"><span class="icon">${icon("pencil", 13)}</span></button></div>
        <span class="spk-time">${fmtTs(st.seconds || 0)}</span></div>
      <div class="spk-stat"><span class="spk-pct">${pct}<span class="u">%</span></span>
        <span class="spk-sub">talk time</span></div>
      <div class="spk-bar"><span class="spk-fill" style="background:${c};transform:scaleX(${share.toFixed(4)})"></span></div>
      ${meta2.length ? `<div class="spk-meta">${meta2.map(x => `<span>${x}</span>`).join("")}</div>` : ""}
    </div>`;

  const sel = speakerCountValue(meta);
  const flash = S.reclusterFlash ? `<span class="spk-flash">re-clustered in ${S.reclusterFlash} s</span>` : "";

  // when the call-audio track came back silent): the mic carried BOTH sides, the
  // speaker map holds s1..sN and NONE of them is known to be the local user —
  // there is no "you" key at all. meta.mode is still "online" here, so it cannot
  // be used to tell this case apart; check diarization_mode first.
  const micFallback = meta.diarization_mode === "mic_fallback";
  // What the number in this control COUNTS — meta.speaker_count_basis states it

  // yours is in the count; "others" otherwise). These labels are the human form

  const countLabel = micFallback ? "Voices on the mic (you are one of them)"

  // for a count a PERSON picked and hands it to the mic clustering: a TOTAL of
  // 1 puts the meeting back on the ordinary "You" path and clears the fallback
  // marker, N > 1 forces N voices. (A calendar-derived count is deliberately
  // ignored there, which is why it is not preselected — see speakerCountValue.)
  const countTitle = micFallback
    ? "Wrong split? Set how many voices are on the mic — pick 1 if it was only you and the “You” label comes back."
    : sel === 0
    ? "You set this meeting to a single voice on the mic, so there is nobody besides you. Pick a number to split the mic into that many other voices."
    : "Wrong split? Set the real number — saved voice fingerprints re-cluster the whole meeting instantly.";

    <div class="spk-note">

      ${[1,2,3,4,5,6,7,8].map(n => `<option value="${n}" ${sel === n ? "selected" : ""}>${n}</option>`).join("")}

/* --- One control, two questions ------------------------------------------------
   The speaker-count control asks ONE of two things, and pipeline.py records
   which one the user was answering as meta.speaker_count_basis (see

     "others"  the number EXCLUDES you  — "Speakers besides you"
     "total"   the number INCLUDES you  — "Voices on the mic (you are one of them)"

   can change that mode underneath the number it has just stored. That is not a
   corner case, it is the fallback's advertised escape hatch: answer the
   mic-fallback control with 1 and the fallback reverts, so the meeting comes
   back carrying a "total"-basis 1 while the label has flipped to "Speakers
   besides you", where 1 reads as one OTHER person. Same digit, opposite
   meaning — and the next edit would then mean something different from the
   first.

   So both halves are re-derived from the meta as it stands on every render.
   The label follows the CURRENT mode, which is also the basis pipeline.py will
   stamp on the next pick, so what the user chooses means what the label says.
   The number is converted out of the basis it was stored in and into the basis

const COUNT_BASIS_TOTAL = "total", COUNT_BASIS_OTHERS = "others";

/* The question meta.expected_speakers was ANSWERING. A count nobody picked is
   app.py's calendar guess — invitees besides you, i.e. "others". A user-picked
   count with no basis is a meeting recorded before the key existed, when the
   only control that shipped asked "besides you": the same back-compat rule
   pipeline.py's _user_speaker_count() applies, so the two agree by
   construction. */
function storedSpeakerCountBasis(meta) {
  return meta.speaker_count_source === "user"
    ? (meta.speaker_count_basis || COUNT_BASIS_OTHERS) : COUNT_BASIS_OTHERS;
}
/* What the <select> should show, in the basis the label on screen is asking
   for. "" means Auto; 0 means "nobody besides you" and is shown read-only (see
   offList in speakerStrip).

   pipeline actually applies it. Under the mic-only fallback it applies only a
   count a person picked (meta.speaker_count_source === "user"); a calendar
   invitee count is ignored there, because it says how many people were invited
   to the call, not how many voices reached this microphone. Preselecting that
   number would show a setting that is not in effect — and hide the fact that
   "Auto" is what ran. */

  if (!count) return "";
  // In-person has only ever had one question — "People in the room (you
  // included)" — and app.py's calendar guess for it is already a room total, so
  // its number is in the displayed basis as it stands. pipeline.py stamps
  // in-person counts "others" and never reads that back (the basis is consumed
  // only by the online-only fallback), so converting on it would be acting on a
  // value that means nothing. Left exactly as it was.
  if (meta.mode === "inperson") return count;
  if (meta.diarization_mode === "mic_fallback" && meta.speaker_count_source !== "user") return "";
  const totalVoices = storedSpeakerCountBasis(meta) === COUNT_BASIS_TOTAL ? count : count + 1;
  return speakerCountBasis(meta) === COUNT_BASIS_TOTAL ? totalVoices : totalVoices - 1;
}

/* Meeting-level stats + per-speaker fillers, as converged rail cards

async function reclusterMeeting(id, value) {

function transcriptGroups(meta) {
  const groups = [];
  for (const turn of meta.turns || []) {
    const last = groups[groups.length - 1];
    if (last && last.spk === turn.speaker) last.parts.push(turn);
    else groups.push({spk: turn.speaker, t: turn.start, parts: [turn]});

}
/* Speaker groups and the user's notes as ONE chronological stream. Returns
   {spk, t, parts} for a run of speech and {note} for a note.

   WHERE A NOTE GOES. A note is emitted before the first turn that starts after
   it — i.e. after every turn that had already begun when it was typed. That
   single rule covers the two cases that matter:
     * a note in a gap between turns lands in that gap;
     * a note typed DURING a turn lands directly after that turn, not before it.
   The second is the important one, and it is why this cannot just interleave
   between groups. A group is a whole run of one person talking and can be
   minutes long; dropping the note before or after the run would put it next to
   something the user had not heard yet, or long after they reacted to it. A
   note written 40 seconds into a 60-second answer belongs at that answer, and
   "after the turn it fell inside" is the closest the transcript can honestly
   place it — there are no word-level timings to split a turn on.
   Ties (note.t exactly equal to a turn's start) resolve as speech-then-note:
   the words were on screen when the note was typed.
   A group is closed and reopened around a note it contains, so the second half
   of a long run comes back with its own speaker name and its own timestamp,
   rather than the note appearing to be part of what was said.

   were not, a note could be emitted a turn later than ideal — never lost, and
   never able to break the render. */

  const items = [];
  let open = null, ni = 0;
  const close = () => { if (open) { items.push(open); open = null; } };
  for (const g of groups) {
    for (const turn of g.parts) {
      const start = turn.start || 0;
      while (ni < notes.length && notes[ni].t < start) { close(); items.push({note: notes[ni++]}); }
      if (!open) open = {spk: g.spk, t: start, parts: []};
      open.parts.push(turn);
    }
    close();  // the next group is a different speaker
  }
  close();

  // past the end of the recording, which simply sits at the bottom.

}
function highlight(text, ql) {

  // n.t came through entryTime: a finite number in [0, 24h). Safe to inline.
  // `seekable` is canSeek(meta), passed down rather than re-derived: in a
  // meeting with notes but no speech there is no player on the page, and a
  // timestamp that cannot seek is text, not a button.

  const countEl = $("trCount");

  }

        ${AU.sys ? `<button data-t="sys" class="${AU.track === "sys" ? "on" : ""}" onclick="setTrack('sys')">Meeting</button>` : ""}
      </div>
      <button class="shield" onclick="toast('Audio never leaves this Mac. Only transcript text goes to your Claude account.')" aria-label="Privacy: audio stays on this Mac" title="Recording, transcription and speaker separation all run on this Mac. Only summaries and Ask questions use your Claude account — transcript text, never audio."><span class="icon">${icon("shield", 15)}</span></button>
    </div>`;
  }
  pane += `</section>`;

  /* ---- ZONE 3 · the seam: a vertical speaker timeline of the real turns ---- */
  let seam = "";
  if (showSeam) {
    const turns = meta.turns || [];
    let blocks = "";
    for (let i = 0; i < turns.length; i++) {
      const start = turns[i].start || 0;
      const end = i < turns.length - 1 ? (turns[i + 1].start || start) : dur;
      const topPct = Math.max(0, Math.min(100, (start / dur) * 100));
      const hPct = Math.max(0, Math.min(100 - topPct, ((end - start) / dur) * 100));
      blocks += `<div class="seg-block" style="top:${topPct.toFixed(3)}%;height:${hPct.toFixed(3)}%;background:${speakerColor(meta, turns[i].speaker)}"></div>`;
    }
    const headPct = AU.dur ? (transportTime() / AU.dur) * 100 : 0;
    seam = `
  <div class="seam" id="seam" role="slider" aria-label="Seek by speaker timeline" onpointerdown="msSeamDown(event)">
    <div class="mini" id="mini">${blocks}
      <div class="mini-read" id="miniRead"></div>
      <div class="mini-head" id="miniHead" style="top:${headPct.toFixed(3)}%"><div class="ln"></div><div class="dot"></div></div>
    </div>
  </div>`;
  }

  /* ---- ZONE 4 · the context rail: Summary / Speakers / Ask ---- */
  const rail = `
  <aside class="rail${railOff ? " hiding" : ""}" id="rail" aria-label="Context">
    <div class="seg" id="seg" role="tablist" aria-label="Context view">
      <span class="pill" id="segPill" style="transform:translateX(${_tabPill.x}px);width:${_tabPill.w}px"></span>
      <button role="tab" aria-selected="${railView === "summary"}" data-view="summary" onclick="setTab('overview')">Summary</button>
      <button role="tab" aria-selected="${railView === "speakers"}" data-view="speakers" onclick="setTab('insights')">Speakers</button>
      <button role="tab" aria-selected="${railView === "ask"}" data-view="ask" onclick="setTab('chat')">Ask</button>
    </div>
    <div class="rail-body" id="railBody">
      <div class="rpanel${railView === "summary" ? " active" : ""}" role="tabpanel" id="p-summary">${overviewHTML(meta, sumBusy)}</div>
      <div class="rpanel${railView === "speakers" ? " active" : ""}" role="tabpanel" id="p-speakers">${speakerStrip(meta)}${insightsTable(meta)}</div>
      <div class="rpanel${railView === "ask" ? " active" : ""}" role="tabpanel" id="p-ask" style="padding:0;display:flex;flex-direction:column">${renderChat(meta)}</div>
    </div>
  </aside>`;

  // Re-rendering replaces the DOM, and background polls land here several times
  // a minute: carry the composer's caret across (its TEXT is carried by
  // S.chatDraft — see askDraft) and put the reader back where it was scrolled.
  const composer = $("askInput");
  const caret = composer && document.activeElement === composer
    ? [composer.selectionStart, composer.selectionEnd] : null;
  const oldReader = $("trReader");
  const readerTop = oldReader ? oldReader.scrollTop : null;
  $("main").innerHTML = pane + seam + rail;
  if (readerTop) { const rd = $("trReader"); if (rd) rd.scrollTop = readerTop; }
  bindTitle(meta);
  slideTabPill(railIndex);
  bindChat(caret);
  drawWave();
}
function bindTitle(meta) {
  const h = $("rvTitle");
  if (!h) return;
  h.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); h.blur(); } };
  h.onblur = async () => {
    const title = h.textContent.trim();
    if (!title || title === meta.title) { h.textContent = meta.title; return; }
    try {
      await postJSON(`/api/meetings/${meta.id}/title`, {title});
      meta.title = title;
      refreshList();
    } catch (e) { toast("⚠ " + e.message); h.textContent = meta.title; }

/* ------------------------------------------------------------- recorder -- */
const PROC_STEPS = [
  {label: "Transcribing", match: /loading model|transcrib/i, detail: "Apple Speech · on-device"},
  {label: "Separating speakers", match: /identifying|analyzing|remote/i, detail: "voice fingerprints · GPU"},
  {label: "Building transcript", match: /building|tidying|applying/i, detail: "echo removal · stats"},
];
function procStepIndex(msg) {
  for (let i = PROC_STEPS.length - 1; i >= 0; i--) if (PROC_STEPS[i].match.test(msg || "")) return i;
  return 0;
}

/* Live captions: final lines + a dimmed in-progress line per track. */
function liveHTML() {
  const rows = S.live.turns.map(t =>
    `<div class="live-row"><span class="live-who ${t.track === "mic" ? "you" : ""}">${esc(t.who)}</span><span>${esc(t.text)}</span></div>`);
  for (const [track, p] of Object.entries(S.live.partials || {})) {
    if (p && p.text) rows.push(
      `<div class="live-row is-partial"><span class="live-who ${track === "mic" ? "you" : ""}">${esc(p.who || track)}</span><span>${esc(p.text)}</span></div>`);
  }
  return rows.length ? rows.join("") : `<div class="live-row is-partial"><span>Listening…</span></div>`;
}
function resetLive(meetingId) {
  S.live = {enabled: false, turns: [], partials: {}, seq: 0, meetingId};
}
async function pollLive() {
  try {
    if (S.rec.recording) {
      // A recording started elsewhere (menu bar / nudge) has a meeting_id we
      // haven't reset live state for — clear stale captions from the last one.
      if (S.rec.meeting_id && S.live.meetingId !== S.rec.meeting_id) {
        resetLive(S.rec.meeting_id);
      }
      const r = await api(`/api/live?since=${S.live.seq}`);
      const wasEnabled = S.live.enabled;
      S.live.enabled = !!r.enabled;
      if (r.enabled) {
        if (r.turns && r.turns.length) S.live.turns = S.live.turns.concat(r.turns).slice(-400);
        S.live.partials = r.partials || {};
        S.live.seq = r.seq || S.live.seq;
        const body = $("liveBody");
        if (body) {
          const stick = body.scrollHeight - body.scrollTop - body.clientHeight < 40;
          body.innerHTML = liveHTML();
          if (stick) body.scrollTop = body.scrollHeight;
        } else if (!wasEnabled) {
          renderMain();  // pane appears once the first helper spins up
        }
      }
    }
  } catch (e) { /* transient */ }
  setTimeout(pollLive, S.rec.recording ? 700 : 2000);
}
/* ------------------------------------------------------------------ cues -- */
/* Talking points and questions written BEFORE a meeting, so they are on hand
   while talking instead of buried in another tab. They live outside any meeting
   (GET/PUT /api/cues) and the backend copies them into a recording when it
   starts, which is what lets the summary flag the ones never addressed.
   localStorage is a cache, not the source of truth: it makes the editor usable
   the instant the screen paints and survives the backend being unreachable. */
const CUES_CACHE = "msCues";
let _cuesTimer = 0;

function cuesParse(text) {
  return String(text ?? "").split("\n").map(s => s.trim()).filter(Boolean);
}
/* The draft wins while the user is typing; otherwise the saved list. */
function cuesText() { return S.cuesDraft === null ? (S.cues || []).join("\n") : S.cuesDraft; }
function cuesList() { return S.cuesDraft === null ? (S.cues || []) : cuesParse(S.cuesDraft); }

async function loadCues() {
  try {
    const cached = JSON.parse(localStorage.getItem(CUES_CACHE) || "[]");
    if (Array.isArray(cached)) S.cues = cached.filter(c => typeof c === "string");
  } catch (e) { /* corrupt cache — the server copy below is authoritative */ }
  try {
    const r = await api("/api/cues");
    S.cues = (r && Array.isArray(r.cues) ? r.cues : []).map(c => String(c));
    try { localStorage.setItem(CUES_CACHE, JSON.stringify(S.cues)); } catch (e) {}
    S.cuesState = "";
  } catch (e) {
    // No backend for cues (older build, or restarting): keep the local copy and
    // say so, rather than pretending the list is empty and losing the user's work.
    S.cuesState = S.cues.length ? "local" : "";
  }
  if (S.cues.length) S.cuesOpen = true;   // they wrote these for a reason
  if (S.view === "new" && !S.rec.recording && S.cuesDraft === null) renderRecorder();
}
/* Status is painted in place — never re-render the form under a live caret. */
function cuesStatus(state) {
  S.cuesState = state;
  const el = $("cuesState");
  if (!el) return;
  el.className = "cues-state" + (state === "saved" ? " ok" : state === "local" ? " local" : "");
  el.textContent = state === "saving" ? "Saving…"
    : state === "saved" ? "Saved"
    : state === "local" ? "Saved on this Mac only" : "";
}
/* Everything in the open editor that depends on HOW MANY cues there are, moved
   in place. Typing must never re-render the field — that would rebuild the
   textarea under the caret — so the count badge and the Clear button are both
   updated by hand here. They are rendered into the DOM either way and toggled
   with `display`, because a Clear button that only appeared on the next full
   render left someone who had just typed their first cue with no way to drop
   them again.

   Not named cuesCount: the badge's own id is "cuesCount", and an element id is
   published as a global, so that name would collide with the very node this
   updates. */
function syncCuesCount(n) {
  const badge = $("cuesCount");
  if (badge) {
    badge.textContent = n ? String(n) : "";
    badge.style.display = n ? "" : "none";
  }
  const clear = $("cuesClear");
  if (clear) clear.style.display = n ? "" : "none";
}
function cuesInput(ta) {
  S.cuesDraft = ta.value;
  cuesStatus("saving");
  syncCuesCount(cuesList().length);
  clearTimeout(_cuesTimer);
  _cuesTimer = setTimeout(flushCues, 700);
}
async function flushCues() {
  clearTimeout(_cuesTimer);
  const list = cuesList();
  const unchanged = JSON.stringify(list) === JSON.stringify(S.cues || []);
  S.cues = list;
  try { localStorage.setItem(CUES_CACHE, JSON.stringify(list)); } catch (e) {}
  if (unchanged && S.cuesState !== "saving") return;
  try {
    await api("/api/cues", {method: "PUT", headers: {"Content-Type": "application/json"},
                            body: JSON.stringify({cues: list})});
    cuesStatus("saved");
  } catch (e) { cuesStatus("local"); }
}
function toggleCues() {
  S.cuesOpen = !S.cuesOpen;
  S.pendingTitle = ($("recTitle") || {}).value ?? S.pendingTitle;
  renderRecorder();
  if (S.cuesOpen) {
    const ta = $("cuesBox");
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
}
function clearCues() {
  S.cuesDraft = "";
  S.pendingTitle = ($("recTitle") || {}).value ?? S.pendingTitle;

  const now = Date.now() / 1000;

      ${icon("calendar", 11)}<span>${esc(ev.title)}</span><span class="when">${esc(when)}</span></button>`;
  }).join("");
  $("main").innerHTML = `
  <section class="pane full" aria-label="New recording">
