}

/* --------------------------------------------------------------- review -- */
function noteRows(meta) {
  const rows = [];
  S._noteKeys = []; // dismiss buttons reference notes by index — titles and
                    // warning text can contain quotes, so never inline them
  for (const w of meta.warnings || []) {
    const key = meta.id + "|" + w;
    if (S.dismissed.has(key)) continue;
    const idx = S._noteKeys.push(key) - 1;
    const echo = w.match(/^Removed (\d+) mic segment/);
    const body = echo
      ? `Removed <b class="mono">${echo[1]}</b> mic segments that were echo of the meeting audio — headphones avoid this entirely.`
      : esc(w);
    rows.push(`<div class="note warn"><span class="ic">${icon("warn", 13)}</span><span>${body}</span>
      <button class="dismiss" onclick="dismissNote(${idx})" title="Dismiss">${icon("x", 11)}</button></div>`);
  }
  if (meta.tidied) {
    const td = meta.tidied;
    rows.push(`<div class="note tidy"><span class="ic">${icon("sparkle", 13)}</span>
      <span>Tidied on-device — ${td.dropped_turns || 0} echo turns removed, ${td.trimmed_turns || 0} trimmed, ${Object.keys(td.merged_speakers || {}).length} speaker labels merged. Validated locally; no words invented.</span></div>`);
  }
  return rows.length ? `<div class="rv-notes">${rows.join("")}</div>` : "";
}
function dismissNote(idx) {
  const key = (S._noteKeys || [])[idx];
  if (key) S.dismissed.add(key);
  renderMain();
}

/* Overview tab: privacy strip + Meeting Brief hero (or Summarize CTA), action
   items, decisions/open-questions, and the right conversation + follow-up rail.
   Maps entirely onto the real summary data. */
function overviewHTML(meta, busy) {
  const s = meta.summary;
  const hasTurns = (meta.turns || []).length > 0;

  let lead;
  if (s) {
    lead = briefHero(meta, busy);
  } else if (busy) {
    lead = `<section class="brief brief-loading"><div class="section-kicker">${icon("sparkle", 14)} Meeting brief</div>
      <div class="brief-load"><span class="spinner"></span> Reading the transcript and pulling out the outcome, decisions and next steps…</div></section>`;
  } else if (hasTurns) {
    lead = `<section class="brief brief-cta">
      <div class="brief-cta-ic">${icon("sparkle", 22)}</div>
      <div class="brief-cta-text">
        <h2>Turn this into a decision brief</h2>
        <p>The outcome, decisions, action items with owners, and a ready-to-send follow-up email — written by your own Claude. Transcript text only, never audio.</p>
      </div>
      <button class="btn primary" onclick="summarizeMeeting('${meta.id}')">${icon("sparkle", 13)} Summarize</button>
    </section>`;
  } else {
    lead = `<div class="tr-empty">No speech was detected in this recording.</div>`;
  }

  // Action items as owner-badged rows.
  let actions = "";
  if (s && (s.action_items || []).length) {
    const rows = s.action_items.map(a => {
      const you = (a.owner || "").toLowerCase() === "you";
      return `<div class="action-row">
        <span class="person-badge${you ? " me" : ""}">${esc(initials(a.owner || "—"))}</span>
        <span class="action-task"><b>${esc(a.task)}</b><small>${esc(a.owner || "—")}</small></span>
        ${a.due ? `<span class="due-chip">${icon("calendar", 12)} ${esc(a.due)}</span>` : ""}
      </div>`;
    }).join("");
    actions = `<section class="ov-section">
      <div class="section-heading"><div><span class="section-kicker">What happens next</span><h3>Action items</h3></div></div>
      <div class="action-list">${rows}</div>
    </section>`;
  }

  // Decisions + open questions, side by side.
  let two = "";
  if (s && ((s.decisions || []).length || (s.open_questions || []).length)) {
    const dec = (s.decisions || []).length ? `<article class="ov-card">
      <div class="section-heading compact"><div><span class="section-kicker">Locked in</span><h3>Decisions</h3></div><span class="count-badge">${s.decisions.length}</span></div>
      <ul class="decision-list">${s.decisions.map(d => `<li><span class="decision-mark">${icon("check", 12)}</span><span>${esc(d)}</span></li>`).join("")}</ul>
    </article>` : "";
    const oq = (s.open_questions || []).length ? `<article class="ov-card">
      <div class="section-heading compact"><div><span class="section-kicker">Needs an answer</span><h3>Open questions</h3></div></div>
      <ul class="q-list">${s.open_questions.map(q => `<li>${esc(q)}</li>`).join("")}</ul>
    </article>` : "";
    two = `<section class="ov-two">${dec}${oq}</section>`;
  }

  // Key points + follow-ups, if present.
  let more = "";
  const kp = (s && (s.key_points || []).length) ? `<article class="ov-card">
    <div class="section-heading compact"><div><span class="section-kicker">Discussed</span><h3>Key points</h3></div></div>
    <ul class="q-list">${s.key_points.map(x => `<li>${esc(x)}</li>`).join("")}</ul></article>` : "";
  const fu = (s && (s.follow_ups || []).length) ? `<article class="ov-card">
    <div class="section-heading compact"><div><span class="section-kicker">Later</span><h3>Follow-ups</h3></div></div>
    <ul class="q-list">${s.follow_ups.map(x => `<li>${esc(x)}</li>`).join("")}</ul></article>` : "";
  if (kp || fu) more = `<section class="ov-two">${kp}${fu}</section>`;

  // The privacy claim moved to the tab row (.privacy-pill) — it belongs to the
  // whole meeting, not to the Overview body.
  const mainCol = `<div class="ov-main">${lead}${actions}${two}${more}</div>`;

  const aside = `<aside class="ov-aside">${conversationAside(meta)}${followupCard(meta)}${askCard(meta)}</aside>`;
  return `<div class="ov-grid">${mainCol}${aside}</div>`;
}

/* The editorial "Meeting brief" hero: TL;DR as a bold headline + a signal grid
   built from real meeting facts. */
function briefHero(meta, busy) {
  const s = meta.summary;
  const tldr = (s.tldr || "").trim();
  let headline, narrative, sizeClass;
  if (s.headline && s.headline.trim()) {
    // A real punchy headline: show it big, full tldr as the narrative.
    headline = s.headline.trim().replace(/[.]$/, "");
    narrative = tldr;
    sizeClass = "";
  } else {
    // Older summaries have no headline: present the whole TL;DR as one clean
    // lead paragraph rather than blowing up a long first sentence.
    headline = tldr;
    narrative = "";
    sizeClass = " brief-lead";
  }
  const speakers = Object.keys(meta.speakers || {}).length;
  const signals = [
    ["Length", meta.duration ? fmtTs(meta.duration) : "—"],
    ["Speakers", String(speakers || "—")],
    ["Decisions", String((s.decisions || []).length)],
    ["Action items", String((s.action_items || []).length)],
  ];
  return `<section class="brief">
    <div class="brief-top"><span class="section-kicker">${icon("sparkle", 14)} Meeting brief</span>
      <span class="brief-depth mono">${(s.engine === "claude" ? "Claude" : "On-device")}${busy ? " · updating…" : ""}</span></div>
    <h2 class="brief-headline${sizeClass}">${esc(headline || "Summary ready")}</h2>
    ${narrative ? `<p>${esc(narrative)}</p>` : ""}
    <div class="brief-signals">${signals.map(([k, v]) =>
      `<article><span>${k}</span><strong>${esc(v)}</strong></article>`).join("")}</div>
  </section>`;
}

/* Badge initials: "Speaker 3" -> "3", "You" -> "Y", "Priya Sharma" -> "PS". */
function initials(name) {
  name = String(name || "").trim();
  const m = name.match(/(\d+)\s*$/);
  if (m) return m[1];
  const words = name.split(/\s+/).filter(Boolean);
  if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
  return (name.slice(0, 1) || "?").toUpperCase();
}

/* Right-rail follow-up draft card. */
function followupCard(meta) {
  const email = (meta.summary || {}).follow_up_email || {};
  if (!email.body) return "";
  return `<section class="aside-card followup-card">
    <div class="aside-head"><span>Follow-up draft</span><span class="ready-label">Ready</span></div>
    <div class="email-preview">${email.subject ? `<b>${esc(email.subject)}</b>` : ""}<p>${esc(email.body)}</p></div>
    <button class="quiet-btn" onclick="copySummaryEmail('${meta.id}')">${icon("copy", 13)} Copy email</button>
  </section>`;
}
/* Right-rail entry point into the Ask tab. Pointless without a transcript. */
function askCard(meta) {
  if (!(meta.turns || []).length) return "";
  return `<section class="aside-card">
    <div class="aside-head"><span>Ask this meeting</span></div>
    <p class="aside-p">Put a question to the transcript — “what did I promise?”, “where did we land on pricing?”. Answers link back to the moment it was said.</p>
    <button class="btn primary aside-btn" onclick="setTab('chat')">${icon("chat", 13)} Ask a question</button>
  </section>`;
}
function setTab(tab) {
  if (S.tab === tab) return;
  S.tab = tab;
  if (tab === "chat") _askAutoFocus = true;   // opening Ask puts the caret in the composer
  renderMain();
  if (tab === "transcript") drawWave();
}

/* Compact speaker chips + the re-cluster control (Transcript tab). */
function speakerStrip(meta) {
  const stats = (meta.stats || {}).per_speaker || {};
  let chips = "";
  for (const [key, name] of Object.entries(meta.speakers || {})) {
    const st = stats[key] || {};
    const c = speakerColor(meta, key);
    const pct = Math.round((st.share || 0) * 100);
    chips += `<div class="spk-chip">
      <div class="spk-avatar" style="background:${c}">${esc(initials(name))}</div>
      <div class="spk-info">
        <div class="spk-name" id="spkName-${esc(key)}">
          <span style="color:${c}">${esc(name)}</span>
          <button title="Rename speaker" onclick="editSpeaker('${esc(key)}')">${icon("pencil", 11)}</button>
        </div>
        <div class="spk-sub">
          <span class="mono">${fmtTs(st.seconds || 0)}</span>
          <span class="spk-bar"><i style="width:${pct}%;background:${c}"></i></span>
          <span class="mono">${pct}%</span>
        </div>
      </div>
    </div>`;
  }
  const sel = speakerCountValue(meta);
  const flash = S.reclusterFlash ? `<span class="spk-flash">re-clustered in ${S.reclusterFlash} s</span>` : "";
  // The mic-only fallback (pipeline.py sets meta.diarization_mode = "mic_fallback"
  // when the call-audio track came back silent): the mic carried BOTH sides, the
  // speaker map holds s1..sN and NONE of them is known to be the local user —
  // there is no "you" key at all. meta.mode is still "online" here, so it cannot
  // be used to tell this case apart; check diarization_mode first.
  const micFallback = meta.diarization_mode === "mic_fallback";
  // What the number in this control COUNTS — meta.speaker_count_basis states it
  // outright ("total" under the fallback, where every voice on the mic including
  // yours is in the count; "others" otherwise). These labels are the human form
  // of that, and in-person has always counted the whole room because everyone
  // shares the one mic.
  const countLabel = micFallback ? "Voices on the mic (you are one of them)"
    : meta.mode === "inperson" ? "People in the room (you included)"

  // is rendered as a disabled option rather than hidden, because falling back
  // to "Auto" would claim a meeting is on auto-detection when a count a person
  // chose is still being applied to it. Disabled because re-picking it is
  // meaningless: 0 reaches the server as "no count" (recluster_meeting's
  // `if expected_speakers:`) and would silently undo the very revert it
  // describes.
  const offList = typeof sel === "number" && (sel < 1 || sel > 8);
  // The dropdown is LIVE under the fallback — it is the only way back from a
  // wrong verdict. pipeline.py's _label_and_assemble asks _user_speaker_count()
  // for a count a PERSON picked and hands it to the mic clustering: a TOTAL of
  // 1 puts the meeting back on the ordinary "You" path and clears the fallback
  // marker, N > 1 forces N voices. (A calendar-derived count is deliberately
  // ignored there, which is why it is not preselected — see speakerCountValue.)
  const countTitle = micFallback
    ? "Wrong split? Set how many voices are on the mic — pick 1 if it was only you and the “You” label comes back."
    : sel === 0
    ? "You set this meeting to a single voice on the mic, so there is nobody besides you. Pick a number to split the mic into that many other voices."
    : "Wrong split? Set the real number — saved voice fingerprints re-cluster the whole meeting instantly.";
  const fallbackNote = !micFallback ? "" : `
    <div class="spk-note">
      <span class="ic">${icon("warn", 12)}</span>
      <span>The call audio wasn't captured, so everyone — including you — was recorded on
        the microphone. We can't tell which of these voices is yours, so rename them above.
        If it was only you on the mic, set the count to 1 and the “You” label comes back —
        or re-record with audio routing fixed.</span>
    </div>`;
  return `<div class="spk-strip">
    <div class="spk-row">${chips}
      <div class="spk-tools">
        <div class="spk-count" title="${esc(countTitle)}">
          <span>${countLabel}</span>
          <select id="spkSelect" onchange="reclusterMeeting('${meta.id}', this.value)">
            <option value="" ${sel === "" ? "selected" : ""}>Auto</option>
            ${offList ? `<option value="${sel}" disabled selected>${sel}${sel === 0 ? " (just you)" : ""}</option>` : ""}
            ${[1,2,3,4,5,6,7,8].map(n => `<option value="${n}" ${sel === n ? "selected" : ""}>${n}</option>`).join("")}

          ${flash}

      </div>
    </div>${fallbackNote}</div>`;
}
/* --- One control, two questions ------------------------------------------------
   The speaker-count control asks ONE of two things, and pipeline.py records
   which one the user was answering as meta.speaker_count_basis (see
   _speaker_count_basis / SPEAKER_COUNT_OTHERS there):

     "others"  the number EXCLUDES you  — "Speakers besides you"
     "total"   the number INCLUDES you  — "Voices on the mic (you are one of them)"

   Which question is on screen follows meta.diarization_mode — and a re-cluster
   can change that mode underneath the number it has just stored. That is not a
   corner case, it is the fallback's advertised escape hatch: answer the
   mic-fallback control with 1 and the fallback reverts, so the meeting comes
   back carrying a "total"-basis 1 while the label has flipped to "Speakers
   besides you", where 1 reads as one OTHER person. Same digit, opposite
   meaning — and the next edit would then mean something different from the
   first.

   So both halves are re-derived from the meta as it stands on every render.
   The label follows the CURRENT mode, which is also the basis pipeline.py will
   stamp on the next pick, so what the user chooses means what the label says.
   The number is converted out of the basis it was stored in and into the basis
   on screen, with total-voices-on-the-mic as the common currency. */
const COUNT_BASIS_TOTAL = "total", COUNT_BASIS_OTHERS = "others";

/* The question the control is asking right now — the JS mirror of pipeline.py's
   _speaker_count_basis(), i.e. what the next pick will be stamped with. */
function speakerCountBasis(meta) {
  return meta.diarization_mode === "mic_fallback" ? COUNT_BASIS_TOTAL : COUNT_BASIS_OTHERS;
}
/* The question meta.expected_speakers was ANSWERING. A count nobody picked is
   app.py's calendar guess — invitees besides you, i.e. "others". A user-picked
   count with no basis is a meeting recorded before the key existed, when the
   only control that shipped asked "besides you": the same back-compat rule
   pipeline.py's _user_speaker_count() applies, so the two agree by
   construction. */
function storedSpeakerCountBasis(meta) {
  return meta.speaker_count_source === "user"
    ? (meta.speaker_count_basis || COUNT_BASIS_OTHERS) : COUNT_BASIS_OTHERS;
}
/* What the <select> should show, in the basis the label on screen is asking
   for. "" means Auto; 0 means "nobody besides you" and is shown read-only (see
   offList in speakerStrip).

   meta.expected_speakers is only a claim that a count is IN FORCE where the
   pipeline actually applies it. Under the mic-only fallback it applies only a
   count a person picked (meta.speaker_count_source === "user"); a calendar
   invitee count is ignored there, because it says how many people were invited
   to the call, not how many voices reached this microphone. Preselecting that
   number would show a setting that is not in effect — and hide the fact that
   "Auto" is what ran. */
function speakerCountValue(meta) {
  if (!meta) return "";
  const count = meta.expected_speakers || 0;
  if (!count) return "";
  // In-person has only ever had one question — "People in the room (you
  // included)" — and app.py's calendar guess for it is already a room total, so
  // its number is in the displayed basis as it stands. pipeline.py stamps
  // in-person counts "others" and never reads that back (the basis is consumed
  // only by the online-only fallback), so converting on it would be acting on a
  // value that means nothing. Left exactly as it was.
  if (meta.mode === "inperson") return count;
  if (meta.diarization_mode === "mic_fallback" && meta.speaker_count_source !== "user") return "";
  const totalVoices = storedSpeakerCountBasis(meta) === COUNT_BASIS_TOTAL ? count : count + 1;
  return speakerCountBasis(meta) === COUNT_BASIS_TOTAL ? totalVoices : totalVoices - 1;
}

function editSpeaker(key) {
  const meta = S.detail;

  const meetingId = meta.id; // pin the id — S.detail may change before commit
  const current = meta.speakers[key] || key;
  holder.innerHTML = `<input value="${esc(current)}">`;
  const input = holder.querySelector("input");
  input.focus();
  input.select();
  const commit = async () => {
    const name = input.value.trim();
    if (!name || name === current) { renderMain(); return; }
    try {
      await postJSON(`/api/meetings/${meetingId}/speakers`, {key, name});
      await openMeeting(meetingId);
    } catch (e) { toast("⚠ " + e.message); renderMain(); }
  };
  input.onblur = commit;

async function reclusterMeeting(id, value) {
  try {

    const t0 = performance.now();
    const meta = await postJSON(`/api/meetings/${id}/recluster`, {speakers: value ? parseInt(value, 10) : null});
    S.detail = meta;
    S.reclusterFlash = ((performance.now() - t0) / 1000).toFixed(2);
    setTimeout(() => { S.reclusterFlash = null; renderMain(); }, 2600);

function transcriptGroups(meta) {
  const groups = [];
  for (const turn of meta.turns || []) {
    const last = groups[groups.length - 1];
    if (last && last.spk === turn.speaker) last.parts.push(turn);
    else groups.push({spk: turn.speaker, t: turn.start, parts: [turn]});
  }

}
function highlight(text, ql) {

  let out = "", pos = 0, i;
  while ((i = low.indexOf(ql, pos)) !== -1) {
    out += esc(text.slice(pos, i)) + "<mark>" + esc(text.slice(i, i + ql.length)) + "</mark>";
    pos = i + ql.length;
  }
  return out + esc(text.slice(pos));
}
function transcriptHTML(meta) {
  const ql = S.tq.trim().toLowerCase();
  const groups = transcriptGroups(meta);
  const visible = ql ? groups.filter(g => g.parts.some(p => p.text.toLowerCase().includes(ql))) : groups;
  let html = "";
  for (const g of visible) {
    const c = speakerColor(meta, g.spk);
    const name = meta.speakers[g.spk] || g.spk;
    html += `<div class="tr-group">
      <div class="tr-ava"><i style="background:${c}">${esc(initials(name))}</i></div>
      <div class="tr-head">
        <span class="tr-spk" style="color:${c}">${esc(name)}</span>
        <button class="tr-time" title="Jump audio here" onclick="seekAndPlay(${g.t})">${fmtTs(g.t)}</button>
      </div>
      <div class="tr-text" style="font-size:${S.trSize}px">${g.parts.map(p => `<p>${highlight(p.text, ql)}</p>`).join("")}</div>
    </div>`;
  }
  if (!visible.length) html = `<div class="tr-empty">${(meta.turns || []).length ? `Nothing in this transcript matches “${esc(S.tq)}”.` : "No speech was detected in this recording."}</div>`;

}
/* Reading size. Applied straight to the live nodes so the scroll position

function setTrSize(delta) {
  const next = clampTrSize(S.trSize + delta);
  if (next === S.trSize) return;
  S.trSize = next;
  localStorage.setItem("msTrSize", String(next));
  document.querySelectorAll(".tr-text").forEach(el => { el.style.fontSize = next + "px"; });
  const dec = $("trSizeDown"), inc = $("trSizeUp");

  S.tq = v;

  $("trInner").innerHTML = transcriptHTML(meta);
  const ql = v.trim().toLowerCase();
  const count = ql ? (meta.turns || []).filter(t => t.text.toLowerCase().includes(ql)).length : 0;

/* ------------------------------------------------------------------ ask -- */
/* A conversation with one meeting. The transcript TEXT goes to the user's own
   Claude (same account as summaries, same failure path); the audio never moves.
   Answers come back with citations whose "t" is a real turn start time, so each
   chip is a seek button. Threads live in S.chat for this session only. */
const ASK_CHIPS = [
  ["What should I send him?", "What should I send him?"],
  ["Where did I ramble?", "Where did I ramble?"],
  // Open-ended: prefill and let the user name the topic, so don't auto-send.
  ["Every mention of <topic>", "Every mention of "],

let _askAutoFocus = false;   // focus the composer only after a real user action

   Number(false) and Number([]) are all 0, so a citation carrying any of them
   would render a confident "0:00" chip that seeks to the top of the meeting. A
   timestamp is a number, or a string that is entirely a number — nothing else. */
function citeSeconds(raw) {
  if (typeof raw === "string" && raw.trim() !== "") raw = Number(raw);
  if (typeof raw !== "number" || !Number.isFinite(raw) || raw < 0) return null;
  return raw;
}
function chatThread(id) {
  if (!S.chat[id]) S.chat[id] = [];
  return S.chat[id];
}
function askMessageHTML(m) {
  if (m.role === "user") return `<div class="ask-msg user"><div class="ask-bubble">${esc(m.text)}</div></div>`;
  // Waiting and writing are ONE bubble in two states, so the first token lands
  // by adding a class and setting a text node — see askSend's onDelta. Built
  // from m.text either way, so a re-render that arrives mid-answer (a status
  // poll, a menu) rebuilds exactly what was on screen instead of dropping back
  // to the spinner. Note m.streaming implies m.pending is false.
  if (m.pending || m.streaming) return `<div class="ask-msg assistant">
    <div class="ask-bubble is-pending${m.streaming ? " is-streaming" : ""}" id="askStreamBubble"><span
      class="spinner"></span><span class="ask-wait">Reading the transcript…</span><span
      class="ask-stream" id="askStream">${esc(m.text || "")}</span></div></div>`;
  const cites = (m.citations || [])
    .map(c => (c ? citeSeconds(c.t) : null))
    .map((t, i) => t === null ? "" : `<button class="ask-cite" title="Jump audio to ${fmtTs(t)}" onclick="seekAndPlay(${t})">
      <span class="t">${fmtTs(t)}</span><span class="q">${esc((m.citations[i] || {}).quote || "")}</span></button>`).join("");
  return `<div class="ask-msg assistant">
    <div class="ask-bubble">${esc(m.text || "No answer came back — try asking again.")}</div>
    ${cites ? `<div class="ask-cites">${cites}</div>` : ""}
  </div>`;
}
function renderChat(meta) {
  if (!(meta.turns || []).length) {
    return `<div class="ask-wrap"><div class="ask-scroll"><div class="ask-inner">
      <div class="tr-empty">No speech was detected in this recording, so there is nothing to ask about.</div>
    </div></div></div>`;
  }
  const thread = chatThread(meta.id);
  const body = thread.length ? thread.map(askMessageHTML).join("") : `
    <div class="ask-start">
      <h3>Ask this meeting anything</h3>
      <p>Questions are answered from this transcript alone — and every answer points back at the
         moment it was said, so you can hear it for yourself.</p>
      <div class="ask-chips">${ASK_CHIPS.map(([label], i) =>
        `<button class="ask-chip" onclick="askUse(${i})">${esc(label)}</button>`).join("")}</div>
    </div>`;
  return `<div class="ask-wrap">
    <div class="ask-privacy">${icon("shield", 13)}

function askGrow(ta) {
  ta.style.height = "auto";
  ta.style.height = Math.min(132, ta.scrollHeight) + "px";
}
/* Every keystroke goes into state, so the composer round-trips through a
   re-render like every other field in the app. Without this the draft lived
   ONLY in the DOM node, and any renderMain() — a poll, a menu toggle, an answer
   landing for another meeting — silently threw it away. Keyed by meeting, so
   two half-written questions never collide. */
function askDraft(ta) {
  const meta = S.detail;
  if (meta) S.chatDraft[meta.id] = ta.value;
  askGrow(ta);
}
/* `caret` is [start, end] captured just before the re-render that replaced this
   textarea, and only when it held the caret — restoring it is what makes a
   background re-render invisible to someone mid-sentence. */
function bindChat(caret) {
  const sc = $("askScroll");
  if (sc) sc.scrollTop = sc.scrollHeight;
  const ta = $("askInput");
  if (!ta) return;
  ta.onkeydown = (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); askSend(); }
  };
  askGrow(ta);
  if (caret) {
    ta.focus();
    ta.setSelectionRange(Math.min(caret[0], ta.value.length), Math.min(caret[1], ta.value.length));
  } else if (_askAutoFocus) {
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  }
  _askAutoFocus = false;
}

  const chip = ASK_CHIPS[i];
  const ta = $("askInput");
  if (!chip || !ta) return;
  ta.value = chip[1];
  askDraft(ta);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
  if (chip[0] === chip[1]) askSend();   // a complete question — just ask it
}
/* --- Reading the answer as it is written --------------------------------------
   app.py answers /ask two ways and the second is opt-in, so nothing breaks if
   this file and that one are ever out of step:

     * any non-200  -> ONE JSON object with an `error` key (and `needs_claude`
       where it applies). Every check that can fail before the model writes a
       word still comes back like this, so the payload claudeSetupPrompt() keys
       on is the one it has always been.
     * 200 as application/x-ndjson -> one JSON object per line:
         {"type":"delta","text":"…"}   zero or more, plain answer text
         {"type":"done","answer":"…","citations":[…]}   ends it
         {"type":"error","error":"…"}  ends it, if it broke after some text
     * 200 as anything else -> the whole answer in one object, the way this UI
       has always read it. A server that does not know the flag simply ignores
       it and lands here, which is why there is no version check anywhere.

   "done" is the authority: the deltas are a preview and only "done" carries
   citations validated against the turns the model was actually shown. So the
   deltas are shown but never kept — the returned answer is always the one the
   server settled on. */
const ASK_STREAM_MIME = "application/x-ndjson";
async function askAnswer(id, question, history, onDelta) {
  const res = await fetch(`/api/meetings/${id}/ask`, {
    method: "POST",
    headers: {"Content-Type": "application/json", "Accept": ASK_STREAM_MIME},
    body: JSON.stringify({question, history, stream: true}),
  });
  if (!res.ok) {                       // identical to api()'s failure, on purpose
    let body = null;
    try { body = await res.json(); } catch (e) { /* non-JSON */ }
    const err = new Error((body && body.error) || res.statusText);
    err.data = body || {};
    throw err;
  }
  if (!res.body || !(res.headers.get("Content-Type") || "").includes(ASK_STREAM_MIME)) {
    return await res.json();
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", last = null;
  const take = (line) => {
    line = line.trim();
    if (!line) return;
    let ev;
    // One unparseable line must not cost the user an answer that is otherwise
    // arriving: the "done" event is what the result is built from, and it is
    // read on its own line like every other.
    try { ev = JSON.parse(line); } catch (e) { return; }
    if (ev.type === "delta") onDelta(String(ev.text == null ? "" : ev.text));
    else if (ev.type) last = ev;
  };
  for (;;) {
    const {value, done} = await reader.read();
    if (done) break;
    // stream: true — a multi-byte character split across two chunks is held
    // back rather than decoded into U+FFFD.
    buf += dec.decode(value, {stream: true});
    let nl;
    while ((nl = buf.indexOf("\n")) >= 0) { take(buf.slice(0, nl)); buf = buf.slice(nl + 1); }
  }
  take(buf + dec.decode());
  // The connection dropped between the last delta and the "done" that carries
  // the citations. There is no answer to keep, so this joins the ordinary
  // failure path: the exchange rolls back and the question comes back.
  if (!last) throw new Error("The answer stopped part-way through — ask again.");
  if (last.type === "error") {
    const err = new Error(last.error || "Could not answer that question");
    err.data = last;                   // carries needs_claude, so the setup prompt still fires
    throw err;
  }
  return {answer: last.answer || "", citations: last.citations || []};
}
/* Follow a growing answer only for someone already at the bottom — never yank
   the view back from a user who has scrolled up to read something. */
function stickAskScroll() {
  const sc = $("askScroll");
  if (sc && sc.scrollHeight - sc.scrollTop - sc.clientHeight < 80) sc.scrollTop = sc.scrollHeight;

async function askSend() {
  if (S.chatBusy) return;
  const meta = S.detail, ta = $("askInput");
  if (!meta || !ta) return;
  const question = ta.value.trim();
  if (!question) return;
  const id = meta.id;                    // pin it: the user may switch meetings mid-answer
  const thread = chatThread(id);
  // History is the exchange BEFORE this question — a pending row has no text
  // yet and a streaming one has only a preview of an answer the server has not
  // settled, so neither is history.
  const history = thread.filter(m => !m.pending && !m.streaming && m.text)
    .map(m => ({role: m.role, text: m.text}));
  thread.push({role: "user", text: question});
  thread.push({role: "assistant", text: "", citations: [], pending: true});
  S.chatBusy = true;
  ta.value = "";
  S.chatDraft[id] = "";
  _askAutoFocus = true;
  renderMain();
  let restore = null;
  // Each piece of the answer as the model writes it. The text goes into state
  // first — so a re-render arriving mid-answer rebuilds what is on screen —
  // and then straight into the bubble's own text node. NOT renderMain(): a
  // re-render per token would rebuild the composer under the user's fingers
  // and throw away the caret and any draft typed while they wait.
  const onDelta = (chunk) => {
    if (!chunk) return;
    const t = chatThread(id), m = t.find(x => x.pending || x.streaming);
    if (!m) return;                       // rolled back already — nothing to write into
    m.text = (m.text || "") + chunk;
    m.pending = false;
    m.streaming = true;
    if (!(S.detail && S.detail.id === id)) return;   // they walked away; state is enough
    const bubble = $("askStreamBubble"), node = $("askStream");
    if (!bubble || !node) return;         // not on the Ask tab — it renders from m.text
    bubble.classList.add("is-streaming"); // first token: the spinner has done its job
    node.textContent = m.text;
    stickAskScroll();
  };
  try {
    const r = await askAnswer(id, question, history, onDelta);
    const t = chatThread(id), i = t.findIndex(m => m.pending || m.streaming);
    // The server's answer replaces whatever the deltas drew: only this one has
    // citations validated against the turns the model was actually shown.
    const answer = {role: "assistant", text: (r && r.answer) || "", citations: (r && r.citations) || []};
    if (i >= 0) t[i] = answer; else t.push(answer);
  } catch (e) {
    // Roll the exchange back so the thread (and the history we send next time)
    // stays consistent, and hand the question back to the composer to retry.
    // Partial text is dropped with it: it is a preview of an answer that never
    // landed, with no citations, and keeping it would put words in the model's
    // mouth — and into the history of the next question.
    const t = chatThread(id), i = t.findIndex(m => m.pending || m.streaming);
    if (i >= 0) {
      t.splice(i, 1);
      if (i > 0 && t[i - 1] && t[i - 1].role === "user") t.splice(i - 1, 1);
    }
    restore = question;
    // Same failure shape as summarize/tidy: the user has no Claude login yet.
    if (e.data && e.data.needs_claude) claudeSetupPrompt(e.message);
    else toast("⚠ " + e.message, 6000);
  } finally {
    S.chatBusy = false;
    // Whose composer is on screen right now? The answer arrived for `id`, but
    // the user may have walked to another meeting while we waited.
    const stillOpen = S.detail && S.detail.id === id;
    // A draft typed while the answer was in flight is the newer intent and wins
    // over a rolled-back question; failing that, hand the failed question back
    // so it can be retried. Either way it goes to `id`'s draft slot, never the
    // open meeting's.
    const live = stillOpen ? (($("askInput") || {}).value || "") : (S.chatDraft[id] || "");
    S.chatDraft[id] = live || restore || "";
    if (stillOpen) {
      _askAutoFocus = true;
      renderMain();
    } else {
      // DO NOT re-render for a meeting the user has left: renderMain() would
      // rebuild the meeting they are looking at — and if they are mid-question
      // in ITS composer, replace the textarea under their fingers. The only
      // thing that visibly changed for them is the shared busy flag, so undo
      // exactly that, in place.
      const btn = $("askSend");
      if (btn) btn.disabled = false;
    }
  }
}

/* Tab order drives both the button row and the pill offset — keep them in sync. */
const TABS = [["overview", "Overview"], ["transcript", "Transcript"], ["insights", "Insights"], ["chat", "Ask"]];
/* Where the pill is parked, in real pixels. Slot width is no longer the 104px
   constant — the control shrinks on a narrow window — so the parked position is
   MEASURED off the buttons rather than computed from the index, and carried
   across renders so a freshly parsed pill starts exactly where the old one sat. */
let _tabPill = {index: 0, x: 0, w: 104};
function measureTabPill(index) {
  const seg = document.querySelector(".rv-seg");
  const btn = seg && seg.querySelectorAll(".rv-tab")[index];
  if (!btn) return null;
  // .rv-seg is the offset parent (position:relative) and the pill sits at
  // left:2px, so the transform is the button's offset minus that.
  return {index, x: Math.round(btn.offsetLeft - 2), w: Math.round(btn.offsetWidth)};
}
/* renderReview() emits the pill where it already sits, then this moves it: a
   just-parsed element has no previous computed transform to animate from.
   Reading offsetWidth commits the start position synchronously — doing this in
   requestAnimationFrame instead would silently no-op in a background tab and
   leave the pill under the wrong label. */
function slideTabPill(index) {
  const pill = document.querySelector(".rv-seg-pill");
  const at = measureTabPill(index);
  if (!pill || !at) { _tabPill = Object.assign({}, _tabPill, {index}); return; }
  if (_tabPill.index !== index || _tabPill.x !== at.x || _tabPill.w !== at.w) {
    void pill.offsetWidth;
    pill.style.transform = `translateX(${at.x}px)`;
    pill.style.width = at.w + "px";
  }
  _tabPill = at;
}
/* Opening a different meeting resets the tab to Overview, so the pill has to be
   parked back at slot 0 too — otherwise it is emitted under the tab the PREVIOUS
   meeting was on and slides across for 240ms on every switch. Slot width is kept:
   it only changes when the window does. */
function resetTabPill() {
  _tabPill = {index: 0, x: 0, w: _tabPill.w};
}
/* A resize changes the slot width under a pill that is already parked. Re-park
   it silently — sliding would be a transition nobody asked for. */
addEventListener("resize", () => {
  const pill = document.querySelector(".rv-seg-pill");
  const at = measureTabPill(_tabPill.index);
  if (!pill || !at || (at.x === _tabPill.x && at.w === _tabPill.w)) return;
  const prev = pill.style.transition;
  pill.style.transition = "none";
  pill.style.transform = `translateX(${at.x}px)`;
  pill.style.width = at.w + "px";

  pill.style.transition = prev;

});

        <div class="meter">
          <div class="m-label"><span>Meeting audio</span><span class="mono">${esc((S.devices && S.devices.system && S.devices.system.name) || "")}</span></div>
          <div class="m-track"><div class="m-fill" id="lvlSys" style="width:0%"></div></div>
        </div>
      </div>
      ${S.live.enabled ? `
      <div class="live-pane">
        <div class="live-head"><span class="dot"></span>Live captions <span class="live-note">on-device · draft — the full transcript is built when you stop</span></div>
        <div class="live-body" id="liveBody">${liveHTML()}</div>
      </div>` : ""}
      <button class="rec-stop" id="stopBtn" onclick="stopRecording()">${icon("stop", 14)}Stop &amp; transcribe</button>
      <div class="hint" style="font-size:11.5px;color:var(--text-faint);margin-top:12px">
        Both tracks stay on this Mac. Remember to tell people you're recording.
      </div>
    </div></div>`;
    const lb = $("liveBody");
    if (lb) lb.scrollTop = lb.scrollHeight;
    return;
  }

  // Setup phase
  const dev = S.devices || {};
  const sys = dev.system;
  const sysAlert = routingAlert(sys);
  const sysDot = routingDot(sys);
  // Each state says what is true of it, and nothing more. "silent" overrides
  // everything: auto-routing may well be on and working, but saying "routes
  // automatically" next to a green-ish row while the user is about to sit
  // through a meeting in silence is the whole bug. "routed" with auto-routing
  // OFF is healthy — the user wired it up themselves — and used to read as the
  // bare "other participants", indistinguishable from not-routed-yet. And a
  // routing state we could not read is not a routing state we can vouch for.
  const sysRole = !sys ? "install BlackHole to capture the other side"
    : sysAlert === "silent" ? "you will hear nothing"
    : sysAlert === "no_loopback" ? "device unavailable"
    : sysAlert === "not_routed" ? "other participants · not routed"
    : !routingKnown(sys) ? "other participants · routing not checked"
    : sys.routing === "routed" ? `other participants · routed${sys.auto_route ? "" : " manually"}`
    : sys.auto_route ? "other participants · routes automatically"
    : "other participants";
  const sysAlertBox = !sysAlert ? "" : `
      <div class="rec-alert${sysAlert === "silent" ? "" : " warn"}">
        <span class="ic">${icon("warn", 15)}</span>
        <div>
          <b>${sysAlert === "silent"
            ? "You will not hear this meeting"
            : "The other participants will not be recorded"}</b>
          <span>${esc(sys.routing_note || (sysAlert === "silent"
            ? `Your Mac's sound output is set to ${sys.name} itself. Switch it back to your speakers or headphones in Sound settings before you start.`
            : sysAlert === "no_loopback"
            ? `${sys.name} is no longer available on this Mac. Reconnect or reinstall it, then reopen this screen.`
            : `Automatic audio routing is off, so nothing feeds ${sys.name}.`))}</span>
        </div>
      </div>`;
  const now = Date.now() / 1000;
  const chips = (S.calendar || []).filter(ev => ev.end > now - 300).slice(0, 3).map(ev => {
    const when = ev.start <= now && ev.end >= now ? "now"
      : new Date(ev.start * 1000).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
    return `<button class="cal-chip" onclick="useEvent(this)" data-title="${esc(ev.title)}">
      ${icon("calendar", 11)}<span>${esc(ev.title)}</span><span class="when">${esc(when)}</span></button>`;
  }).join("");
  $("main").innerHTML = `
  <div class="rec-stage"><div class="rec-card">
    <div class="rec-kicker">New recording</div>
    <h1 class="rec-h1">Set up your meeting</h1>
    <div class="field">
      <label>Meeting title</label>
      <input type="text" id="recTitle" placeholder="Auto-detected from your calendar" value="${esc(S.pendingTitle)}"
        oninput="S.pendingTitle = this.value">
      ${chips ? `<div class="cal-chips">${chips}</div>` : ""}
      <div class="hint">${icon("calendar", 11)} Left blank, the name comes from your calendar — read locally, never from a cloud API.</div>
    </div>
    <div class="field">
      <label>Meeting type</label>
      <div class="seg">
        <button class="${S.recType === "online" ? "on" : ""}" onclick="setRecType('online')">${icon("monitor", 13)}Online call</button>
        <button class="${S.recType === "inperson" ? "on" : ""}" onclick="setRecType('inperson')">${icon("person", 13)}In person</button>
      </div>
      <div class="hint">${S.recType === "online"
        ? "Your mic is recorded as “You”; the meeting audio (Zoom / Meet / Teams — anything that makes sound) becomes the other speakers. Headphones recommended."
        : "Everyone shares this Mac's microphone and voices are told apart automatically. Place the laptop near the centre of the table."}</div>
    </div>
    <div class="field">
      <label>Language</label>
      <select class="rec-lang" onchange="S.recLang = this.value">
        ${[["auto", "Auto-detect"], ["en", "English"], ["hi", "Hindi"], ["es", "Spanish"],
           ["fr", "French"], ["de", "German"], ["it", "Italian"], ["pt", "Portuguese"],
           ["ja", "Japanese"], ["ko", "Korean"], ["zh", "Chinese"], ["ar", "Arabic"], ["ru", "Russian"]]
          .map(([v, n]) => `<option value="${v}"${S.recLang === v ? " selected" : ""}>${n}</option>`).join("")}
      </select>
      <div class="hint">Locks speech recognition to one language for better accuracy. Live captions always need a chosen or default language.</div>
    </div>
    <div class="field">
      <label>Audio devices</label>
      <div class="rec-devices">
        <div class="rec-dev">
          <span class="dot ${dev.mic ? "" : "err"}"></span>
          <span class="name">${esc(dev.mic ? dev.mic.name : "No microphone found")}</span>
          <span class="role">you</span>
        </div>
        <div class="rec-dev">
          <span class="dot ${sysDot}"></span>
          <span class="name">${esc(sys ? sys.name : "BlackHole 2ch")}</span>
          <span class="role${sysAlert === "silent" ? " silent" : ""}">${esc(sysRole)}</span>
        </div>
      </div>
      ${sysAlertBox}
    </div>
    <button class="rec-start" id="startBtn" onclick="startRecording()">${icon("mic", 14, 2)}Start recording</button>
  </div></div>`;
}
function setRecType(t) {
  S.recType = t;
  S.pendingTitle = ($("recTitle") || {}).value || S.pendingTitle;
  renderRecorder();
}
function useEvent(el) {
  S.pendingTitle = el.dataset.title;
  const input = $("recTitle");
  if (input) input.value = S.pendingTitle;
}
async function startRecording() {
  const btn = $("startBtn");
  btn.disabled = true;
  S.pendingTitle = ($("recTitle") || {}).value || "";
  try {
    const meta = await postJSON("/api/record/start",
      {title: S.pendingTitle, mode: S.recType, language: S.recLang});
    (meta.warnings || []).forEach(w => toast("⚠ " + w, 6000));
    resetLive(meta.id);
    S.activeId = meta.id;
    await refreshList();
    // Don't call pollStatus() here — it self-reschedules via setTimeout, so
    // invoking it directly would spawn a second permanent polling loop each
    // time we record. The existing loop picks up the new state on its next tick.
    renderMain();
  } catch (e) {
    toast("⚠ " + e.message, 6000);
    btn.disabled = false;
  }
}
async function stopRecording() {
  const btn = $("stopBtn");
  if (btn) btn.disabled = true;
  try {
    const meta = await postJSON("/api/record/stop", {});
    S.view = "meeting";
    S.pendingTitle = "";
    await refreshList();
    openMeeting(meta.id);
  } catch (e) {
    toast("⚠ " + e.message, 6000);
    if (btn) btn.disabled = false;
  }
}
function renderProcessing(meta) {
  const job = S.jobs[meta.id] || {};
  const idx = procStepIndex(job.message);
  const steps = PROC_STEPS.map((s, i) => `
    <div class="proc-step${i < idx ? " done" : i === idx ? " active" : ""}">
      <span class="proc-ic">${i < idx ? icon("check", 14, 2.2) : i === idx ? '<span class="spinner"></span>' : '<span style="width:5px;height:5px;border-radius:50%;background:var(--text-faint);display:block"></span>'}</span>
      <span>${s.label}</span>
      <span class="proc-detail" id="${i === idx ? "procMsg" : ""}">${i === idx ? esc(job.message || "Working…") : s.detail}</span>
    </div>`).join("");
  // Live captions captured during the recording stay readable while the
  // full-quality transcript is being built.
  const capturedRows = (S.live.turns || []).map(t =>
    `<div class="live-row"><span class="live-who ${t.track === "mic" ? "you" : ""}">${esc(t.who)}</span><span>${esc(t.text)}</span></div>`).join("");
  $("main").innerHTML = `
  <div class="rec-stage"><div class="rec-card">
    <div class="rec-kicker">Processing on-device</div>
    <h1 class="rec-h1" style="margin-bottom:4px">${esc(meta.title)}</h1>
    <div class="mono" style="font-size:12px;color:var(--text-dim)">${meta.duration ? fmtTs(meta.duration) + " recorded · " : ""}~90 s for a 45-min call</div>
    <div class="proc-steps">${steps}</div>
    ${capturedRows ? `<div class="live-pane" style="margin-top:14px">
      <div class="live-head">Live captions from the recording <span class="live-note">draft — being replaced by the full transcript</span></div>
      <div class="live-body" style="max-height:180px">${capturedRows}</div>
    </div>` : ""}
  </div></div>`;
}

/* ----------------------------------------------------------- main router -- */
function renderMain() {
  if (S.rec.recording) { renderRecorder(); return; }
  if (S.view === "new" || (!S.activeId && !S.meetings.length)) { renderRecorder(); return; }
  const meta = S.detail;
  if (!meta) { $("main").innerHTML = ""; return; }
  if (meta.status === "processing") { renderProcessing(meta); return; }
  renderReview(meta);
}

/* ------------------------------------------------------------ data flow -- */
const PAGE_SIZE = 40;
// Every list fetch is tagged with the query it was for. A response is applied
// only if the query hasn't changed since — so a slow page-1 "demo" response
// can't overwrite a newer empty-query list, and load-more can't append rows
// from a stale search.
let _listToken = 0;
async function refreshList() {
  const q = S.q.trim();
  const token = ++_listToken;
  try {
    const limit = Math.max(PAGE_SIZE, S.meetings.length);
    const r = await api(`/api/meetings?limit=${limit}&offset=0&q=${encodeURIComponent(q)}`);
    if (token !== _listToken) return;  // a newer query superseded this one
    S.meetings = r.items;
    S.total = r.total;
    if (!S.activeId && S.meetings.length) S.activeId = S.meetings[0].id;
    renderSidebar();
  } catch (e) { /* transient */ }
}
async function loadMoreMeetings() {
  if (S.listLoading || S.meetings.length >= S.total) return;
  S.listLoading = true;
  const q = S.q.trim();
  const token = _listToken;
  const more = $("sbMore");
  if (more) more.textContent = "Loading…";
  try {
    const r = await api(`/api/meetings?limit=${PAGE_SIZE}&offset=${S.meetings.length}&q=${encodeURIComponent(q)}`);
    if (token !== _listToken) return;  // the query changed while we fetched
    const known = new Set(S.meetings.map(m => m.id));
    S.meetings = S.meetings.concat(r.items.filter(m => !known.has(m.id)));
    S.total = r.total;
    renderSidebar();
  } catch (e) { /* transient */ }
  finally { S.listLoading = false; }
}
async function openMeeting(id) {
  const switching = !S.detail || S.detail.id !== id;
  S.activeId = id;
  S.view = "meeting";
  S.menu = null;
  if (switching) { S.tq = ""; S.busySummary = false; }  // keep search/spinner on same-meeting reloads
  try {
    const meta = await api("/api/meetings/" + id);
    const switched = !S.detail || S.detail.id !== id;
    S.detail = meta;
    if (switched) { S.tab = "overview"; resetTabPill(); transportTeardown(); }
    if (meta.status === "done" && (switched || !(AU.mic || AU.sys))) transportSetup(meta);
    renderSidebar();
    renderMain();
  } catch (e) { toast("⚠ " + e.message); }
}

/* polling: drives recording state, job transitions, live progress */
let wasRecording = false;
function setConnected(ok) {
  if (S.connected === ok) return;
  S.connected = ok;
  let banner = $("connBanner");
  if (!ok) {
    if (!banner) {
      banner = document.createElement("div");
      banner.id = "connBanner";
      banner.innerHTML = `<span class="spinner"></span> Reconnecting to MeetingScribe…`;
      document.body.appendChild(banner);
    }
  } else if (banner) {
    banner.remove();
    // The backend just came back (e.g. it was restarted) — resync everything.
    refreshList(); if (S.activeId) openMeeting(S.activeId);
  }
}
async function pollStatus() {
  try {
    const st = await api("/api/status");
    setConnected(true);
    const rec = st.recorder || {};
    S.jobs = st.jobs || {};
    S.summaryJobs = st.summary_jobs || {};
    const startedRec = rec.recording && !S.rec.recording;
    const stoppedRec = !rec.recording && S.rec.recording;
    S.rec = rec;

    if (startedRec || stoppedRec) { renderMain(); refreshList(); }
    if (rec.recording) {
      const t = $("recTimer");
      if (t) t.textContent = fmtTs(rec.elapsed || 0);
      else renderMain();
      const lv = rec.levels || {};
      const m = $("lvlMic"), s = $("lvlSys");
      if (m) m.style.width = Math.round((lv.mic || 0) * 100) + "%";
      if (s) s.style.width = Math.round((lv.system || 0) * 100) + "%";
      for (const [k, tr] of Object.entries(rec.tracks || {})) {
        if (tr.error) toast(`⚠ ${k} track failed: ${tr.error}`, 8000);
      }
    }
    // Never replace the main view under the user's cursor: if they are
    // typing in the title, a rename field, a search box or the Ask composer,
    // defer the re-render to a later poll tick.
    const editing = document.activeElement
      && $("main").contains(document.activeElement)
      && (document.activeElement.isContentEditable
          || document.activeElement.tagName === "INPUT"
          || document.activeElement.tagName === "TEXTAREA");
    // live processing updates for the open meeting
    if (S.detail && S.jobs[S.detail.id] && S.jobs[S.detail.id].state === "processing") {
      if (S.detail.status !== "processing" && !editing) { S.detail.status = "processing"; renderMain(); }
      const el = $("procMsg");
      const msg = S.jobs[S.detail.id].message || "Working…";
      if (el && el.textContent !== msg) {
        const idx = procStepIndex(msg);
        if (document.querySelectorAll(".proc-step.done").length !== idx) renderProcessing(S.detail);
        else el.textContent = msg;
      }
    }
    // finished jobs -> refresh (deferred while editing; re-runs next tick)
    if (!editing) {
      for (const [id, job] of Object.entries(S.jobs)) {
        const prev = S.lastJobs[id];
        if (prev && prev.state === "processing" && job.state !== "processing") {
          refreshList();
          if (id === S.activeId) openMeeting(id);
          toast(job.state === "done" ? "✅ Transcript ready" : "⚠ Processing failed", 5000);
        }
      }
      S.lastJobs = JSON.parse(JSON.stringify(S.jobs));

      // finished summary jobs -> load the summary into the open meeting
      for (const [id, job] of Object.entries(S.summaryJobs)) {
        const prev = S.lastSummaryJobs[id];
        if (prev && prev.state === "processing" && job.state !== "processing") {
          S.busySummary = false;
          if (id === S.activeId) openMeeting(id);
          if (job.state === "done") toast("✅ Summary ready", 6000);
          else if (job.needs_claude) claudeSetupPrompt(job.message);
          else toast("⚠ Summary failed: " + (job.message || ""), 6000);
        }
      }
      // keep the button spinner live while the open meeting's summary runs
      const mine = S.detail && S.summaryJobs[S.detail.id];
      if (mine && mine.state === "processing" && !S.busySummary && !$("sumBtn")?.disabled) renderMain();
      S.lastSummaryJobs = JSON.parse(JSON.stringify(S.summaryJobs));
    }
  } catch (e) { setConnected(false); }  // backend restarting — banner + auto-resync
  setTimeout(pollStatus, S.rec.recording ? 700 : 1200);
}
async function pollDevices() {
  try {
    const d = await api("/api/devices");
    if (!d.recording) {
      const before = JSON.stringify(S.devices);
      S.devices = d;
      if (JSON.stringify(d) !== before) {
        renderSidebar();
        if (S.view === "new" && !S.rec.recording) renderRecorder();
      }
    }
  } catch (e) { /* keep last known */ }
  setTimeout(pollDevices, S.rec.recording ? 10000 : 5000);
}
async function pollCalendar() {
  try {
    const c = await api("/api/calendar/today");
    S.calendar = (c && c.events) || [];
    if (S.view === "new" && !S.rec.recording) renderRecorder();
  } catch (e) { /* not available */ }
}

/* ----------------------------------------------------------------- boot -- */
(async function boot() {
  await refreshList();
  if (S.meetings.length) await openMeeting(S.meetings[0].id);
  else { S.view = "new"; renderMain(); }
  pollStatus();
  pollDevices();
  pollCalendar();
  pollLive();
  refreshAuth();
  setInterval(pollCalendar, 300000);
})();
</script>
</body>
</html>
