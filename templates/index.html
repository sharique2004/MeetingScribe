function icon(name, size = 14, sw = 1.7) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ""}</svg>`;
}

/* ---------------------------------------------------------------- utils -- */
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtTs(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const ss = String(s).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
}
function toast(msg, ms = 3500) {
  const t = $("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(t._h);
  t._h = setTimeout(() => (t.style.display = "none"), ms);
}
async function api(path, opts) {
  const res = await fetch(path, opts);
  let body = null;
  try { body = await res.json(); } catch (e) { /* non-JSON */ }
  if (!res.ok) {
    const err = new Error((body && body.error) || res.statusText);
    err.data = body || {};
    throw err;
  }
  return body;
}
function postJSON(path, data) {
  return api(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(data)});
}
function speakerColor(meta, key) {
  if (key === "you") return "var(--accent)";
  const others = Object.keys(meta.speakers || {}).filter(k => k !== "you");
  return `var(--spk-${["a","b","c"][Math.max(0, others.indexOf(key)) % 3]})`;
}
function dateGroup(iso) {
  if (!iso) return "Earlier";
  const d = new Date(iso), now = new Date();
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 86400000);
  if (diff <= 0) return "Today";
  if (diff === 1) return "Yesterday";
  if (diff < 7) return "This week";
  return "Earlier";
}
function dateLabel(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const time = d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
  const g = dateGroup(iso);
  if (g === "Today") return "Today · " + time;
  if (g === "Yesterday") return "Yesterday · " + time;
  return d.toLocaleDateString([], {month: "short", day: "numeric"}) + " · " + time;
}

/* ---------------------------------------------------------------- state -- */
/* The five palettes, in picker order. `accent` and `spk` are copies of each
   palette's --accent / --spk-a: a swatch has to paint the theme it OFFERS, not
   the one that is active, so it cannot read the CSS variables. `name` is the
   label under the row; the id is what lands in localStorage and on <html>. */
const THEMES = [
  {id: "teal",     name: "Aurora",   bg: "#0a0a12", accent: "#5eead4", spk: "#c07af6"},
  {id: "graphite", name: "Graphite", bg: "#0b0d12", accent: "#7dd3fc", spk: "#c07af6"},
  {id: "indigo",   name: "Indigo",   bg: "#0c0c1a", accent: "#a5b4fc", spk: "#7dd3fc"},
  {id: "ember",    name: "Ember",    bg: "#12100c", accent: "#f6a54f", spk: "#7dd3fc"},
  {id: "light",    name: "Daylight", bg: "#f4f5f8", accent: "#0d9488", spk: "#7c3aed"},
];
/* Stored themes predate the palettes: the old toggle wrote "dark" or "light".
   "light" still exists, "dark" became "teal"; anything else falls back. */
function storedTheme() {
  let id = localStorage.getItem("msTheme");
  if (id === "dark") id = "teal";
  return THEMES.some(t => t.id === id) ? id : "teal";
}
const TR_SIZE_MIN = 13, TR_SIZE_MAX = 18, TR_SIZE_DEFAULT = 14.5;
function clampTrSize(px) {
  if (!isFinite(px)) return TR_SIZE_DEFAULT;
  return Math.min(TR_SIZE_MAX, Math.max(TR_SIZE_MIN, Math.round(px * 2) / 2));
}
const S = {
  theme: storedTheme(),
  trSize: clampTrSize(parseFloat(localStorage.getItem("msTrSize")) || TR_SIZE_DEFAULT),
  connected: true,          // backend reachable? drives the reconnect banner
  meetings: [],
  total: 0,                 // total meetings on disk matching the search
  listLoading: false,       // a page fetch is in flight
  activeId: null,
  view: "meeting",          // meeting | new
  detail: null,             // full meta of the open meeting
  q: "",                    // sidebar search
  tq: "",                   // transcript search
  tab: "overview",          // meeting view tab: overview | transcript | insights | chat
  chat: {},                 // meeting id -> [{role, text, citations, pending}] (this session only)
  chatDraft: {},            // meeting id -> half-typed question (survives re-renders)
  chatBusy: false,          // an /ask request is in flight
  devices: null,
  calendar: [],
  rec: {recording: false},
  jobs: {},
  lastJobs: {},
  summaryJobs: {},
  lastSummaryJobs: {},
  dismissed: new Set(),     // per-session dismissed notes
  noteOpen: new Set(),      // ids of transcript notes expanded this session (survives re-renders)
  insightsOpen: false,
  menu: null,               // 'export' | 'more'
  reclusterFlash: null,
  recType: "online",
  recLang: "auto",          // per-meeting language for speech recognition
  live: {enabled: false, turns: [], partials: {}, seq: 0},
  auth: {signed_in: false, email: null, providers: []},
  authModal: null,          // null | 'signin' | 'signup' | 'verify' | 'waiting'
  authEmail: "",            // carried between signup -> verify steps
  busySync: false,
  pendingTitle: "",
  busyTidy: false,
  busySummary: false,
  cues: [],                 // saved talking points / questions, server-owned
  cuesOpen: false,          // the pre-meeting editor starts collapsed
  cuesDraft: null,          // textarea text mid-edit (null = mirror S.cues)
  cuesState: "",            // "" | "saving" | "saved" | "local"
};
document.documentElement.setAttribute("data-theme", S.theme);

/* ------------------------------------------------------------- transport -- */
const AU = {mic: null, sys: null, offs: {mic: 0, system: 0}, dur: 0, track: "mix", peaks: null, playing: false, raf: 0};

function transportTeardown() {
  for (const a of [AU.mic, AU.sys]) if (a) { a.pause(); a.onended = null; a.src = ""; }
  cancelAnimationFrame(AU.raf);
  Object.assign(AU, {mic: null, sys: null, dur: 0, peaks: null, playing: false});
}
function transportSetup(meta) {
  transportTeardown();
  const tracks = meta.tracks || {};
  AU.dur = meta.duration || 0;
  AU.offs.mic = (tracks.mic && tracks.mic.start_offset) || 0;
  AU.offs.system = (tracks.system && tracks.system.start_offset) || 0;
  if (tracks.mic) { AU.mic = new Audio(`/api/meetings/${meta.id}/audio/mic`); AU.mic.preload = "metadata"; }
  if (tracks.system && tracks.system.seconds) { AU.sys = new Audio(`/api/meetings/${meta.id}/audio/system`); AU.sys.preload = "metadata"; }
  if (!AU.sys && AU.track === "sys") AU.track = "mix";
  if (!AU.mic && AU.track === "mic") AU.track = "mix";
  applyTrackMode();
  const onEnd = () => { if (!anyAudioActive()) { AU.playing = false; updateTransportUI(); } };
  for (const a of [AU.mic, AU.sys]) if (a) a.onended = onEnd;
  fetch(`/api/meetings/${meta.id}/waveform`).then(r => r.json()).then(w => {
    AU.peaks = w.tracks || {};
    drawWave();
  }).catch(() => {});
}
function anyAudioActive() {
  return [AU.mic, AU.sys].some(a => a && !a.paused && !a.ended);
}
function primaryAudio() {
  if (AU.track === "mic") return AU.mic || AU.sys;
  return AU.sys || AU.mic;
}
function transportTime() {
  const a = primaryAudio();
  if (!a) return 0;
  const off = a === AU.mic ? AU.offs.mic : AU.offs.system;
  return Math.min(AU.dur || a.duration || 0, a.currentTime + off);
}
function applyTrackMode() {
  if (AU.mic) AU.mic.muted = AU.track === "sys";
  if (AU.sys) AU.sys.muted = AU.track === "mic";
}
function setTrack(t) {
  AU.track = t;
  applyTrackMode();
  updateTransportUI();
}
function transportSeek(t) {
  t = Math.max(0, Math.min(AU.dur || 0, t));
  if (AU.mic) AU.mic.currentTime = Math.max(0, t - AU.offs.mic);
  if (AU.sys) AU.sys.currentTime = Math.max(0, t - AU.offs.system);
  drawWave();
  updateTransportUI();
}
function transportPlayPause(forcePlay) {
  if (AU.playing && !forcePlay) {
    for (const a of [AU.mic, AU.sys]) if (a) a.pause();
    AU.playing = false;
  } else {
    for (const a of [AU.mic, AU.sys]) if (a) a.play().catch(() => {});
    AU.playing = true;
    tickWave();
  }
  updateTransportUI();
}
function seekAndPlay(t) {
  transportSeek(t);
  if (!AU.playing) transportPlayPause(true);
}
/* Is there a player for a timestamp to drive? This is the ONE condition under
   which a timestamp may be offered as a seek, and renderReview() emits the
   transport bar under exactly the same test — deliberately the same call, so
   the two can never drift apart.

   Audio alone is not enough. The transport is only rendered for a meeting that
   also has speech, so in a meeting with notes but no detected speech a "jump"
   would start audio with no play/pause, no clock and no waveform anywhere on
   the page — invisible playback the user cannot stop. A timestamp with nothing
   to seek is plain text, here as everywhere else. */
function canSeek(meta) {
  return !!((AU.mic || AU.sys) && meta && (meta.turns || []).length);

function tickWave() {
  cancelAnimationFrame(AU.raf);
  const loop = () => {
    if (!AU.playing) return;
    drawWave();
    const el = $("tpClock");
    if (el) el.innerHTML = `<b>${fmtTs(transportTime())}</b> / ${fmtTs(AU.dur)}`;
    AU.raf = requestAnimationFrame(loop);
  };
  AU.raf = requestAnimationFrame(loop);
}
function drawWave() {
  const cv = $("tpCanvas");
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w) return;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  const cs = getComputedStyle(document.documentElement);
  const accent = cs.getPropertyValue("--accent").trim();
  const faint = cs.getPropertyValue("--text").trim();
  const key = AU.track === "mic" ? "mic" : AU.track === "sys" ? "system" : "mix";
  const peaks = (AU.peaks && (AU.peaks[key] || AU.peaks.mix || AU.peaks.mic)) || null;
  const barW = 2, gap = 1.5, n = Math.floor(w / (barW + gap));
  const playedX = AU.dur ? (transportTime() / AU.dur) * w : 0;
  for (let i = 0; i < n; i++) {
    const amp = peaks ? (peaks[Math.floor(i / n * peaks.length)] || 0.04) : 0.08;
    const bh = Math.max(2, amp * (h - 8));
    const x = i * (barW + gap);
    ctx.fillStyle = x <= playedX ? accent : faint;
    ctx.globalAlpha = x <= playedX ? 0.95 : 0.22;
    ctx.beginPath();
    ctx.roundRect(x, (h - bh) / 2, barW, bh, 1);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function waveClick(e) {
  const r = e.currentTarget.getBoundingClientRect();
  transportSeek(((e.clientX - r.left) / r.width) * AU.dur);
}
function updateTransportUI() {

/* Routing state for the "System" audio row — shared by the sidebar and the setup
   card so the two can never disagree.

   preflight() now computes this server-side and hands it over as
   sys.routing_alert / sys.routing_note. The inline expression below is only the
   fallback for a payload that carries no alert (older server, or a platform
   where macos_audio is unavailable), and it is the ORIGINAL condition verbatim,
   "&& !sys.auto_route" included: "not_routed" is the NORMAL idle state while
   auto-routing is on, because routing is applied when recording starts. Dropping
   that guard would paint a warning on every single session.

     "silent"      the Mac's own sound output is set to the loopback device, so
                   the call is captured but THE USER HEARS NOTHING. Always wrong,
                   auto-routing or not — rendered loud.
     "not_routed"  auto-routing is off and nothing feeds the loopback, so the
                   other participants will not be recorded.
     "no_loopback" the device the name points at is gone. The server reports no
                   alert for this one, but it is not healthy: nothing can feed a
                   device that does not exist, so auto-routing will fail at
                   record time and the other side is not captured.
     null          healthy, or genuinely unknown (see routingKnown). */
function routingAlert(sys) {
  if (!sys) return null;
  if (sys.routing_alert) return sys.routing_alert;
  if (sys.routing === "no_loopback") return "no_loopback";
  return (sys.routing === "not_routed" && !sys.auto_route) ? "not_routed" : null;
}
/* False only when the routing probe RAN AND FAILED — preflight writes
   routing:"unknown" when CoreAudio refuses to answer. A payload with no routing
   key at all is a platform that has no routing to do (Windows takes system audio
   straight off the WASAPI loopback), which is healthy, not unknown. The
   difference matters: "unknown" must not be painted as checked-and-fine. */
function routingKnown(sys) {
  return !!sys && sys.routing !== "unknown";
}
/* One reading of the System row, shared by the sidebar and the setup card. */
function routingDot(sys) {
  if (!sys) return "err";
  const alert = routingAlert(sys);
  if (alert === "silent") return "silent";
  if (alert) return "warn";
  return routingKnown(sys) ? "" : "idle";
}

  if (S.meetings.length < S.total) {

// Auto-load older meetings when the "Show more" button scrolls into view.
let _listObserver = null;
function watchListEnd() {
  if (_listObserver) _listObserver.disconnect();
  const more = $("sbMore");
  if (!more) return;
  _listObserver = new IntersectionObserver((entries) => {
    if (entries.some(e => e.isIntersecting)) loadMoreMeetings();

  _listObserver.observe(more);
}

async function toggleSync(id, enable) {

  S.busySync = true;
  renderMain();
  try {
    const meta = await postJSON(`/api/meetings/${id}/sync`, {enabled: enable});
    if (S.detail && S.detail.id === id) S.detail = meta;
    const err = meta.sync && meta.sync.error;

/* notes.py writes {t, text} and freezes cues as plain strings. These readers
   accept a wider shape than that on purpose, and deliberately the SAME wider
   shape as summarize.py's _entry(): the summary and the review must never
   disagree about which cue went unasked because one of them could read a key
   the other could not. If the stored shape changes, change both.
   SAME means same: these two lists are summarize.py's _TEXT_KEYS and _TIME_KEYS
   verbatim, in order — "cue" and "title" included, which an earlier version of
   this list dropped while still claiming the shapes matched. A cue stored as
   {"cue": "…"} was then read by the summarizer, judged, and named in
   unaddressed_cues, while this file read no text for it at all and filtered it
   out of the rail: the verdict arrived about a cue the user could not see.
   entryText/entryTime below match _entry()'s scan rules for the same reason. */
const NOTE_TEXT_KEYS = ["text", "note", "cue", "body", "content", "value", "label", "title"];
const NOTE_TIME_KEYS = ["t", "time", "at", "ts", "start", "seconds", "offset", "elapsed"];
const CUE_COVERED_KEYS = ["covered", "answered", "asked", "used", "done", "checked",
                          "complete", "completed", "resolved", "addressed", "raised"];
const CUE_COVERED_WORDS = ["covered", "answered", "asked", "done", "used", "complete",
                           "completed", "resolved", "addressed", "raised"];
const CUE_OPEN_WORDS = ["open", "pending", "unasked", "unanswered", "todo", "new",
                        "not_asked", "not-asked", "unaddressed", "skipped", "missed"];
const DAY_SECONDS = 24 * 3600;

function entryText(item) {
  if (typeof item === "string") return item;
  if (!item || typeof item !== "object" || Array.isArray(item)) return "";
  for (const k of NOTE_TEXT_KEYS) if (typeof item[k] === "string" && item[k].trim()) return item[k];
  return "";
}
/* Seconds into the meeting, or null. Rejects epoch/millisecond stamps the same
   way the summarizer does — a note "at 1.7 billion seconds" is not a seek.

   null is UNTIMED, and that is a different fact from 0 — which means the note
   was typed in the first second of the meeting. This is the contract with
   notes.py: a timestamp it could not use comes back as null, never as 0.0,
   because a note coerced to 0.0 is indistinguishable from a real one and would
   be planted at the top of the transcript next to words the user was not
   writing about. Untimed notes are rendered as untimed (see notesSection) and
   left off the timeline (see timedNotes) — never silently moved to 0:00.

   The scan itself mirrors summarize.py's _entry(): a key whose value is not a
   number is skipped rather than believed, so {"t": "12", "time": 12} reads the
   same 12 here as it does there. The FIRST numeric key decides — including when
   it decides "unusable" (NaN, Infinity, negative, an epoch stamp): a later key
   does not get to overrule a real number that was simply out of range. */
function entryTime(item) {
  if (!item || typeof item !== "object") return null;
  for (const k of NOTE_TIME_KEYS) {
    const v = item[k];
    if (typeof v !== "number") continue;   // absent, null, a string, a bool
    return (isFinite(v) && v >= 0 && v < DAY_SECONDS) ? v : null;
  }
  return null;
}
/* Notes taken on the floating panel while the meeting was happening, in the
   order they were typed — which is the order notes.py appends them in, so it is
   also chronological. This order is what the Overview lists, and the index into
   it is the identity of a note everywhere else (jumpToNote, the transcript's
   element ids). */
function meetingNotes(meta) {
  const raw = (meta && meta.notes) || [];
  if (!Array.isArray(raw)) return [];
  return raw.map(n => ({t: entryTime(n), text: entryText(n)})).filter(n => n.text.trim());
}
/* The notes that can be placed on the transcript's timeline, oldest first, each
   carrying its meetingNotes() index so the Overview and the transcript point at
   the same note. Sorted rather than trusted: appends are chronological in
   practice, but the transcript is a timeline and one out-of-order note must not
   be able to land in the wrong conversation.
   A note whose timestamp is unusable (missing, null, a string, an epoch stamp —
   see entryTime) is deliberately dropped here: it still shows in the Overview,
   marked "—", but it has no moment to be shown AT, and inventing one would put
   words next to a part of the meeting the user was not writing about. */
function timedNotes(meta) {
  return meetingNotes(meta)
    .map((n, i) => ({t: n.t, text: n.text, i}))
    .filter(n => n.t !== null)
    .sort((a, b) => a.t - b.t);
}
/* The cues this meeting was started with. `covered` stays null unless something
   actually said — an unjudged cue must never be shown as one the user missed. */
function meetingCues(meta) {
  const raw = (meta && meta.cues) || [];
  if (!Array.isArray(raw)) return [];
  /* summarize.py omits `unaddressed_cues` ENTIRELY when no engine it trusts
     judged the cues, and includes it — possibly empty — when one did. So the
     array's PRESENCE is the verdict, not its length: an empty list is the
     positive claim "every cue came up", not an absence of information. */
  const flaggedList = ((meta.summary || {}).unaddressed_cues);
  const judged = Array.isArray(flaggedList);
  const flagged = new Set((judged ? flaggedList : [])
    .map(c => String(entryText(c) || c).trim().toLowerCase()));
  return raw.map(c => {
    const text = entryText(c);
    let covered = null;
    if (c && typeof c === "object" && !Array.isArray(c)) {
      for (const k of CUE_COVERED_KEYS) {
        if (k in c && (typeof c[k] === "boolean" || typeof c[k] === "number")) { covered = !!c[k]; break; }
      }
      if (covered === null) {
        const status = c.status || c.state;
        if (typeof status === "string") {
          const w = status.trim().toLowerCase().replace(/ /g, "_");
          if (CUE_COVERED_WORDS.includes(w)) covered = true;
          else if (CUE_OPEN_WORDS.includes(w)) covered = false;
        }
      }
    }
    if (covered === null && judged) covered = !flagged.has(text.trim().toLowerCase());
    return {text, covered};
  }).filter(c => c.text.trim());
}
/* Notes, in the main column: the human record of the meeting, sitting directly
   under the machine's — first thing after the brief, ahead of everything the
   summarizer produced, because this is the one part of the page the user wrote
   themselves. Each timestamp seeks the audio to that moment; "In transcript"
   takes them to the same note standing in the transcript. */
function notesSection(meta, opts) {
  const notes = meetingNotes(meta);
  if (!notes.length) return "";
  // `standalone` is the render used by the two screens that REPLACE the review —
  // a failed meeting and one still processing. The same notes, on a page with no
  // tabs: no transcript to send anyone to and no player to seek.
  const standalone = !!(opts && opts.standalone);
  const seekable = !standalone && canSeek(meta);
  let anyPlaced = false;
  const rows = notes.map((n, i) => {
    // UNTIMED IS NOT 0:00. A note with no usable timestamp gets a dashed, dimmed
    // "—" that reads as an absence; a note genuinely typed in the first second
    // gets the solid mono "0:00" pill every other timestamp gets. They mean
    // different things — "we do not know when" against "at the very start" — so
    // they must never render alike. (entryTime keeps them apart upstream.)
    const stamp = n.t === null
      ? `<span class="note-time is-untimed" title="No timestamp — this note was saved without a position in the meeting, so it has no moment to jump to.">—</span>`
      : seekable
        ? `<button class="note-time" title="Jump audio to ${fmtTs(n.t)}" onclick="seekAndPlay(${n.t})">${fmtTs(n.t)}</button>`
        : `<span class="note-time" title="Written ${fmtTs(n.t)} into the meeting">${fmtTs(n.t)}</span>`;
    // Only offer the jump for a note that is actually down there. A timed note
    // always is, even in a meeting with no speech at all — the transcript falls
    // back to the notes alone. An untimed one never is: it has no place on the
    // timeline, so there is nothing to jump to. And on the standalone render
    // there is no transcript tab at all.
    const placed = n.t !== null;
    anyPlaced = anyPlaced || placed;
    const jump = placed && !standalone
      ? `<button class="note-jump" title="Show this note in the transcript, where you wrote it"
          onclick="jumpToNote(${i})">${icon("list", 12)}<span>In transcript</span></button>`
      : "";
    return `<div class="note-row">${stamp}<div class="note-body">${esc(n.text)}</div>${jump}</div>`;
  }).join("");
  // The standalone caller says WHY this page is showing the notes on their own —
  // "the run failed" and "the run has not finished yet" are different things to
  // be told while you look for a note you typed.
  const ledeText = standalone
    ? ((opts && opts.lede) || "Written straight to disk as you typed them, so they are here whatever the audio does next.")
    : anyPlaced ? "Yours, not the summarizer's — each one also stands in the transcript at the moment you typed it." : "";
  const lede = ledeText ? `<p class="note-lede">${esc(ledeText)}</p>` : "";
  return `<section class="ov-section${standalone ? " is-standalone" : ""}">
    <div class="section-heading"><div><span class="section-kicker">${icon("pencil", 12)} While it happened</span><h3>Your notes</h3></div><span class="count-badge">${notes.length}</span></div>
    ${lede}
    <div class="note-list">${rows}</div>
  </section>`;
}
/* Overview → the same note in the transcript. Any transcript search is cleared
   first: the user asked to see THIS note, and a filter left over from an earlier
   search is perfectly capable of hiding it. */
function jumpToNote(i) {
  S.tq = "";
  S.noteOpen.add(i);   // the user asked to see THIS note — land on it open, not collapsed
  if (S.tab === "transcript") renderMain();
  else setTab("transcript");   // setTab renders synchronously
  const el = $("trNote-" + i);
  if (!el) return;
  el.scrollIntoView({block: "center", behavior: "smooth"});
  el.classList.add("is-target");
  setTimeout(() => el.classList.remove("is-target"), 1800);
}
/* Cues, in the right rail: what you meant to raise, and whether you got to it. */
function cuesCard(meta) {
  const cues = meetingCues(meta);
  if (!cues.length) return "";
  const judged = cues.some(c => c.covered !== null);
  const missed = cues.filter(c => c.covered === false).length;
  let body, foot = "", label = "";
  if (!judged) {
    body = `<ul class="q-list">${cues.map(c => `<li>${esc(c.text)}</li>`).join("")}</ul>`;
  } else {
    body = `<ul class="cue-list">${cues.map(c => `<li class="${c.covered === false ? "missed" : ""}">
      <span class="cue-mark">${icon(c.covered === false ? "warn" : "check", 11, 2.2)}</span>
      <span>${esc(c.text)}</span></li>`).join("")}</ul>`;
    label = missed
      ? `<span class="miss-label">${missed} not covered</span>`
      : `<span class="ready-label">All covered</span>`;
    foot = missed ? `<p class="cue-note">Judged from the transcript — worth a second look before you close this out.</p>` : "";
  }
  return `<section class="aside-card">
    <div class="aside-head"><span>Your cues</span>${label}</div>
    ${body}${foot}
  </section>`;
}

/* Overview tab: privacy strip + Meeting Brief hero (or Summarize CTA), action
   items, decisions/open-questions, and the right conversation + follow-up rail.
   Maps entirely onto the real summary data. */
function overviewHTML(meta, busy) {
  const s = meta.summary;
  const hasTurns = (meta.turns || []).length > 0;

  let lead;
  if (s) {
    lead = briefHero(meta, busy);
  } else if (busy) {
    lead = `<section class="brief brief-loading"><div class="section-kicker">${icon("sparkle", 14)} Meeting brief</div>
      <div class="brief-load"><span class="spinner"></span> Reading the transcript and pulling out the outcome, decisions and next steps…</div></section>`;
  } else if (hasTurns) {
    lead = `<section class="brief brief-cta">
      <div class="brief-cta-ic">${icon("sparkle", 22)}</div>
      <div class="brief-cta-text">
        <h2>Turn this into a decision brief</h2>
        <p>The outcome, decisions, action items with owners, and a ready-to-send follow-up email — written by your own Claude. Transcript text only, never audio.</p>
      </div>
      <button class="btn primary" onclick="summarizeMeeting('${meta.id}')">${icon("sparkle", 13)} Summarize</button>
    </section>`;
  } else {
    lead = `<div class="tr-empty">No speech was detected in this recording.</div>`;
  }

  // Action items as owner-badged rows.
  let actions = "";
  if (s && (s.action_items || []).length) {
    const rows = s.action_items.map(a => {
      const you = (a.owner || "").toLowerCase() === "you";
      return `<div class="action-row">
        <span class="person-badge${you ? " me" : ""}">${esc(initials(a.owner || "—"))}</span>
        <span class="action-task"><b>${esc(a.task)}</b><small>${esc(a.owner || "—")}</small></span>
        ${a.due ? `<span class="due-chip">${icon("calendar", 12)} ${esc(a.due)}</span>` : ""}
      </div>`;
    }).join("");
    actions = `<section class="ov-section">
      <div class="section-heading"><div><span class="section-kicker">What happens next</span><h3>Action items</h3></div></div>
      <div class="action-list">${rows}</div>
    </section>`;
  }

  // Decisions + open questions, side by side.
  let two = "";
  if (s && ((s.decisions || []).length || (s.open_questions || []).length)) {
    const dec = (s.decisions || []).length ? `<article class="ov-card">
      <div class="section-heading compact"><div><span class="section-kicker">Locked in</span><h3>Decisions</h3></div><span class="count-badge">${s.decisions.length}</span></div>
      <ul class="decision-list">${s.decisions.map(d => `<li><span class="decision-mark">${icon("check", 12)}</span><span>${esc(d)}</span></li>`).join("")}</ul>
    </article>` : "";
    const oq = (s.open_questions || []).length ? `<article class="ov-card">
      <div class="section-heading compact"><div><span class="section-kicker">Needs an answer</span><h3>Open questions</h3></div></div>
      <ul class="q-list">${s.open_questions.map(q => `<li>${esc(q)}</li>`).join("")}</ul>
    </article>` : "";
    two = `<section class="ov-two">${dec}${oq}</section>`;
  }

  // Key points + follow-ups, if present.
  let more = "";
  const kp = (s && (s.key_points || []).length) ? `<article class="ov-card">
    <div class="section-heading compact"><div><span class="section-kicker">Discussed</span><h3>Key points</h3></div></div>
    <ul class="q-list">${s.key_points.map(x => `<li>${esc(x)}</li>`).join("")}</ul></article>` : "";
  const fu = (s && (s.follow_ups || []).length) ? `<article class="ov-card">
    <div class="section-heading compact"><div><span class="section-kicker">Later</span><h3>Follow-ups</h3></div></div>
    <ul class="q-list">${s.follow_ups.map(x => `<li>${esc(x)}</li>`).join("")}</ul></article>` : "";
  if (kp || fu) more = `<section class="ov-two">${kp}${fu}</section>`;

  // The privacy claim moved to the tab row (.privacy-pill) — it belongs to the
  // whole meeting, not to the Overview body.
  const mainCol = `<div class="ov-main">${lead}${notesSection(meta)}${actions}${two}${more}</div>`;

  const aside = `<aside class="ov-aside">${conversationAside(meta)}${cuesCard(meta)}${followupCard(meta)}${askCard(meta)}</aside>`;
  return `<div class="ov-grid">${mainCol}${aside}</div>`;
}

/* The editorial "Meeting brief" hero: TL;DR as a bold headline + a signal grid
   built from real meeting facts. */
function briefHero(meta, busy) {
  const s = meta.summary;
  const tldr = (s.tldr || "").trim();
  let headline, narrative, sizeClass;
  if (s.headline && s.headline.trim()) {
    // A real punchy headline: show it big, full tldr as the narrative.
    headline = s.headline.trim().replace(/[.]$/, "");
    narrative = tldr;
    sizeClass = "";
  } else {
    // Older summaries have no headline: present the whole TL;DR as one clean
    // lead paragraph rather than blowing up a long first sentence.
    headline = tldr;
    narrative = "";
    sizeClass = " brief-lead";
  }
  const speakers = Object.keys(meta.speakers || {}).length;
  const signals = [
    ["Length", meta.duration ? fmtTs(meta.duration) : "—"],
    ["Speakers", String(speakers || "—")],
    ["Decisions", String((s.decisions || []).length)],
    ["Action items", String((s.action_items || []).length)],
  ];
  return `<section class="brief">
    <div class="brief-top"><span class="section-kicker">${icon("sparkle", 14)} Meeting brief</span>
      <span class="brief-depth mono">${(s.engine === "claude" ? "Claude" : "On-device")}${busy ? " · updating…" : ""}</span></div>
    <h2 class="brief-headline${sizeClass}">${esc(headline || "Summary ready")}</h2>
    ${narrative ? `<p>${esc(narrative)}</p>` : ""}
    <div class="brief-signals">${signals.map(([k, v]) =>
      `<article><span>${k}</span><strong>${esc(v)}</strong></article>`).join("")}</div>
  </section>`;
}

/* Badge initials: "Speaker 3" -> "3", "You" -> "Y", "Priya Sharma" -> "PS". */
function initials(name) {
  name = String(name || "").trim();
  const m = name.match(/(\d+)\s*$/);
  if (m) return m[1];
  const words = name.split(/\s+/).filter(Boolean);
  if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
  return (name.slice(0, 1) || "?").toUpperCase();
}

/* Right-rail follow-up draft card. */
function followupCard(meta) {
  const email = (meta.summary || {}).follow_up_email || {};
  if (!email.body) return "";
  return `<section class="aside-card followup-card">
    <div class="aside-head"><span>Follow-up draft</span><span class="ready-label">Ready</span></div>
    <div class="email-preview">${email.subject ? `<b>${esc(email.subject)}</b>` : ""}<p>${esc(email.body)}</p></div>
    <button class="quiet-btn" onclick="copySummaryEmail('${meta.id}')">${icon("copy", 13)} Copy email</button>
  </section>`;
}
/* Right-rail entry point into the Ask tab. Pointless without a transcript. */
function askCard(meta) {
  if (!(meta.turns || []).length) return "";
  return `<section class="aside-card">
    <div class="aside-head"><span>Ask this meeting</span></div>
    <p class="aside-p">Put a question to the transcript — “what did I promise?”, “where did we land on pricing?”. Answers link back to the moment it was said.</p>
    <button class="btn primary aside-btn" onclick="setTab('chat')">${icon("chat", 13)} Ask a question</button>
  </section>`;
}
function setTab(tab) {
  if (S.tab === tab) return;
  S.tab = tab;
  if (tab === "chat") _askAutoFocus = true;   // opening Ask puts the caret in the composer
  renderMain();
  if (tab === "transcript") drawWave();
}

/* Compact speaker chips + the re-cluster control (Transcript tab). */
function speakerStrip(meta) {
  const stats = (meta.stats || {}).per_speaker || {};
  let chips = "";
  for (const [key, name] of Object.entries(meta.speakers || {})) {
    const st = stats[key] || {};
    const c = speakerColor(meta, key);
    const pct = Math.round((st.share || 0) * 100);
    chips += `<div class="spk-chip">
      <div class="spk-avatar" style="background:${c}">${esc(initials(name))}</div>
      <div class="spk-info">
        <div class="spk-name" id="spkName-${esc(key)}">
          <span style="color:${c}">${esc(name)}</span>
          <button title="Rename speaker" onclick="editSpeaker('${esc(key)}')">${icon("pencil", 11)}</button>
        </div>
        <div class="spk-sub">
          <span class="mono">${fmtTs(st.seconds || 0)}</span>
          <span class="spk-bar"><i style="width:${pct}%;background:${c}"></i></span>
          <span class="mono">${pct}%</span>
        </div>
      </div>
    </div>`;
  }
  const sel = speakerCountValue(meta);
  const flash = S.reclusterFlash ? `<span class="spk-flash">re-clustered in ${S.reclusterFlash} s</span>` : "";
  // The mic-only fallback (pipeline.py sets meta.diarization_mode = "mic_fallback"
  // when the call-audio track came back silent): the mic carried BOTH sides, the
  // speaker map holds s1..sN and NONE of them is known to be the local user —
  // there is no "you" key at all. meta.mode is still "online" here, so it cannot
  // be used to tell this case apart; check diarization_mode first.
  const micFallback = meta.diarization_mode === "mic_fallback";
  // What the number in this control COUNTS — meta.speaker_count_basis states it
  // outright ("total" under the fallback, where every voice on the mic including
  // yours is in the count; "others" otherwise). These labels are the human form
  // of that, and in-person has always counted the whole room because everyone
  // shares the one mic.
  const countLabel = micFallback ? "Voices on the mic (you are one of them)"
    : meta.mode === "inperson" ? "People in the room (you included)"
    : "Speakers besides you";
  // A number this control cannot SEND, yet which is the setting in force: 0
  // ("just you" — what a mic-fallback revert leaves behind, see
  // speakerCountValue) or a converted total past the end of the 1..8 list. It
  // is rendered as a disabled option rather than hidden, because falling back
  // to "Auto" would claim a meeting is on auto-detection when a count a person
  // chose is still being applied to it. Disabled because re-picking it is
  // meaningless: 0 reaches the server as "no count" (recluster_meeting's
  // `if expected_speakers:`) and would silently undo the very revert it
  // describes.
  const offList = typeof sel === "number" && (sel < 1 || sel > 8);
  // The dropdown is LIVE under the fallback — it is the only way back from a
  // wrong verdict. pipeline.py's _label_and_assemble asks _user_speaker_count()
  // for a count a PERSON picked and hands it to the mic clustering: a TOTAL of
  // 1 puts the meeting back on the ordinary "You" path and clears the fallback
  // marker, N > 1 forces N voices. (A calendar-derived count is deliberately
  // ignored there, which is why it is not preselected — see speakerCountValue.)
  const countTitle = micFallback
    ? "Wrong split? Set how many voices are on the mic — pick 1 if it was only you and the “You” label comes back."
    : sel === 0
    ? "You set this meeting to a single voice on the mic, so there is nobody besides you. Pick a number to split the mic into that many other voices."
    : "Wrong split? Set the real number — saved voice fingerprints re-cluster the whole meeting instantly.";
  const fallbackNote = !micFallback ? "" : `
    <div class="spk-note">
      <span class="ic">${icon("warn", 12)}</span>
      <span>The call audio wasn't captured, so everyone — including you — was recorded on
        the microphone. We can't tell which of these voices is yours, so rename them above.
        If it was only you on the mic, set the count to 1 and the “You” label comes back —
        or re-record with audio routing fixed.</span>
    </div>`;
  return `<div class="spk-strip">
    <div class="spk-row">${chips}
      <div class="spk-tools">
        <div class="spk-count" title="${esc(countTitle)}">
          <span>${countLabel}</span>
          <select id="spkSelect" onchange="reclusterMeeting('${meta.id}', this.value)">
            <option value="" ${sel === "" ? "selected" : ""}>Auto</option>
            ${offList ? `<option value="${sel}" disabled selected>${sel}${sel === 0 ? " (just you)" : ""}</option>` : ""}
            ${[1,2,3,4,5,6,7,8].map(n => `<option value="${n}" ${sel === n ? "selected" : ""}>${n}</option>`).join("")}
          </select>
          ${flash}
        </div>
      </div>
    </div>${fallbackNote}</div>`;
}
/* --- One control, two questions ------------------------------------------------
   The speaker-count control asks ONE of two things, and pipeline.py records
   which one the user was answering as meta.speaker_count_basis (see
   _speaker_count_basis / SPEAKER_COUNT_OTHERS there):

     "others"  the number EXCLUDES you  — "Speakers besides you"
     "total"   the number INCLUDES you  — "Voices on the mic (you are one of them)"

   Which question is on screen follows meta.diarization_mode — and a re-cluster
   can change that mode underneath the number it has just stored. That is not a
   corner case, it is the fallback's advertised escape hatch: answer the
   mic-fallback control with 1 and the fallback reverts, so the meeting comes
   back carrying a "total"-basis 1 while the label has flipped to "Speakers
   besides you", where 1 reads as one OTHER person. Same digit, opposite
   meaning — and the next edit would then mean something different from the
   first.

   So both halves are re-derived from the meta as it stands on every render.
   The label follows the CURRENT mode, which is also the basis pipeline.py will
   stamp on the next pick, so what the user chooses means what the label says.
   The number is converted out of the basis it was stored in and into the basis
   on screen, with total-voices-on-the-mic as the common currency. */
const COUNT_BASIS_TOTAL = "total", COUNT_BASIS_OTHERS = "others";

/* The question the control is asking right now — the JS mirror of pipeline.py's
   _speaker_count_basis(), i.e. what the next pick will be stamped with. */
function speakerCountBasis(meta) {
  return meta.diarization_mode === "mic_fallback" ? COUNT_BASIS_TOTAL : COUNT_BASIS_OTHERS;
}
/* The question meta.expected_speakers was ANSWERING. A count nobody picked is
   app.py's calendar guess — invitees besides you, i.e. "others". A user-picked
   count with no basis is a meeting recorded before the key existed, when the
   only control that shipped asked "besides you": the same back-compat rule
   pipeline.py's _user_speaker_count() applies, so the two agree by
   construction. */
function storedSpeakerCountBasis(meta) {
  return meta.speaker_count_source === "user"
    ? (meta.speaker_count_basis || COUNT_BASIS_OTHERS) : COUNT_BASIS_OTHERS;
}
/* What the <select> should show, in the basis the label on screen is asking
   for. "" means Auto; 0 means "nobody besides you" and is shown read-only (see
   offList in speakerStrip).

   meta.expected_speakers is only a claim that a count is IN FORCE where the
   pipeline actually applies it. Under the mic-only fallback it applies only a
   count a person picked (meta.speaker_count_source === "user"); a calendar
   invitee count is ignored there, because it says how many people were invited
   to the call, not how many voices reached this microphone. Preselecting that
   number would show a setting that is not in effect — and hide the fact that
   "Auto" is what ran. */
function speakerCountValue(meta) {
  if (!meta) return "";
  const count = meta.expected_speakers || 0;
  if (!count) return "";
  // In-person has only ever had one question — "People in the room (you
  // included)" — and app.py's calendar guess for it is already a room total, so
  // its number is in the displayed basis as it stands. pipeline.py stamps
  // in-person counts "others" and never reads that back (the basis is consumed
  // only by the online-only fallback), so converting on it would be acting on a
  // value that means nothing. Left exactly as it was.
  if (meta.mode === "inperson") return count;
  if (meta.diarization_mode === "mic_fallback" && meta.speaker_count_source !== "user") return "";
  const totalVoices = storedSpeakerCountBasis(meta) === COUNT_BASIS_TOTAL ? count : count + 1;
  return speakerCountBasis(meta) === COUNT_BASIS_TOTAL ? totalVoices : totalVoices - 1;
}

/* Full conversation stats table (Insights tab). */
function insightsTable(meta) {
  const stats = (meta.stats || {}).per_speaker || {};
  if (!Object.keys(stats).length) return `<div class="tr-empty">No conversation stats for this meeting.</div>`;
  let rows = "";
  for (const [key, name] of Object.entries(meta.speakers || {})) {
    const st = stats[key] || {};
    const fillers = Object.entries(st.fillers || {}).slice(0, 3).map(([w, c]) => `${esc(w)} ×${c}`).join(" · ") || "—";
    rows += `<tr>
      <td class="who" style="color:${speakerColor(meta, key)}">${esc(name)}</td>
      <td><span class="num mono">${fmtTs(st.seconds || 0)}</span> (${Math.round((st.share || 0) * 100)}%)</td>
      <td><span class="num mono">${(st.words || 0).toLocaleString()}</span> · <span class="num mono">${st.wpm || 0}</span> wpm</td>
      <td class="num mono">${st.questions || 0}</td>
      <td class="num mono">${fmtTs(st.longest_turn_seconds || 0)}</td>
      <td>${fillers}</td>
    </tr>`;
  }
  return `<div class="ov-pad"><div class="section-kicker">${icon("wave", 13)} Conversation insights</div>
    <div class="spk-stats"><table>
      <thead><tr><th></th><th>Talk time</th><th>Words · pace</th><th>Questions</th><th>Longest turn</th><th>Fillers</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>`;
}

/* Right-rail conversation card (Overview): talk balance + per-speaker pace. */
function conversationAside(meta) {
  const stats = (meta.stats || {}).per_speaker || {};
  const entries = Object.entries(meta.speakers || {});
  if (!entries.length) return "";
  const bar = entries.map(([key]) => {
    const pct = Math.round(((stats[key] || {}).share || 0) * 100);
    return `<span style="width:${pct}%;background:${speakerColor(meta, key)}"></span>`;
  }).join("");
  const rows = entries.map(([key, name]) => {
    const st = stats[key] || {};
    const c = speakerColor(meta, key);
    return `<div class="cv-row">
      <span class="person-badge" style="background:${c}">${esc(initials(name))}</span>
      <span class="cv-name"><b style="color:${c}">${esc(name)}</b><small>${fmtTs(st.seconds || 0)} · ${st.wpm || 0} wpm</small></span>
      <span class="cv-pct mono">${Math.round((st.share || 0) * 100)}%</span>
    </div>`;

     * a note typed DURING a turn lands directly after that turn, not before it.

/* Tab order drives both the button row and the pill offset — keep them in sync. */
const TABS = [["overview", "Overview"], ["transcript", "Transcript"], ["insights", "Insights"], ["chat", "Ask"]];
/* Where the pill is parked, in real pixels. Slot width is no longer the 104px
   constant — the control shrinks on a narrow window — so the parked position is
   MEASURED off the buttons rather than computed from the index, and carried
   across renders so a freshly parsed pill starts exactly where the old one sat. */
let _tabPill = {index: 0, x: 0, w: 104};
function measureTabPill(index) {
  const seg = document.querySelector(".rv-seg");
  const btn = seg && seg.querySelectorAll(".rv-tab")[index];
  if (!btn) return null;
  // .rv-seg is the offset parent (position:relative) and the pill sits at
  // left:2px, so the transform is the button's offset minus that.
  return {index, x: Math.round(btn.offsetLeft - 2), w: Math.round(btn.offsetWidth)};
}
/* renderReview() emits the pill where it already sits, then this moves it: a
   just-parsed element has no previous computed transform to animate from.
   Reading offsetWidth commits the start position synchronously — doing this in
   requestAnimationFrame instead would silently no-op in a background tab and
   leave the pill under the wrong label. */
function slideTabPill(index) {
  const pill = document.querySelector(".rv-seg-pill");
  const at = measureTabPill(index);
  if (!pill || !at) { _tabPill = Object.assign({}, _tabPill, {index}); return; }
  if (_tabPill.index !== index || _tabPill.x !== at.x || _tabPill.w !== at.w) {
    void pill.offsetWidth;
    pill.style.transform = `translateX(${at.x}px)`;
    pill.style.width = at.w + "px";
  }
  _tabPill = at;
}
/* Opening a different meeting resets the tab to Overview, so the pill has to be
   parked back at slot 0 too — otherwise it is emitted under the tab the PREVIOUS
   meeting was on and slides across for 240ms on every switch. Slot width is kept:
   it only changes when the window does. */
function resetTabPill() {
  _tabPill = {index: 0, x: 0, w: _tabPill.w};
}
/* A resize changes the slot width under a pill that is already parked. Re-park

addEventListener("resize", () => {

  const at = measureTabPill(_tabPill.index);
  if (!pill || !at || (at.x === _tabPill.x && at.w === _tabPill.w)) return;
  const prev = pill.style.transition;
  pill.style.transition = "none";
  pill.style.transform = `translateX(${at.x}px)`;
  pill.style.width = at.w + "px";
  void pill.offsetWidth;
  pill.style.transition = prev;
  _tabPill = at;
});

const PROC_STEPS = [
  {label: "Transcribing", match: /loading model|transcrib/i, detail: "Apple Speech · on-device"},
  {label: "Separating speakers", match: /identifying|analyzing|remote/i, detail: "voice fingerprints · GPU"},
  {label: "Building transcript", match: /building|tidying|applying/i, detail: "echo removal · stats"},
];
function procStepIndex(msg) {
  for (let i = PROC_STEPS.length - 1; i >= 0; i--) if (PROC_STEPS[i].match.test(msg || "")) return i;
  return 0;
}

/* Live captions: final lines + a dimmed in-progress line per track. */
function liveHTML() {
  const rows = S.live.turns.map(t =>
    `<div class="live-row"><span class="live-who ${t.track === "mic" ? "you" : ""}">${esc(t.who)}</span><span>${esc(t.text)}</span></div>`);
  for (const [track, p] of Object.entries(S.live.partials || {})) {
    if (p && p.text) rows.push(
      `<div class="live-row is-partial"><span class="live-who ${track === "mic" ? "you" : ""}">${esc(p.who || track)}</span><span>${esc(p.text)}</span></div>`);
  }
  return rows.length ? rows.join("") : `<div class="live-row is-partial"><span>Listening…</span></div>`;
}
function resetLive(meetingId) {
  S.live = {enabled: false, turns: [], partials: {}, seq: 0, meetingId};
}
async function pollLive() {
  try {
    if (S.rec.recording) {
      // A recording started elsewhere (menu bar / nudge) has a meeting_id we
      // haven't reset live state for — clear stale captions from the last one.
      if (S.rec.meeting_id && S.live.meetingId !== S.rec.meeting_id) {
        resetLive(S.rec.meeting_id);
      }
      const r = await api(`/api/live?since=${S.live.seq}`);
      const wasEnabled = S.live.enabled;
      S.live.enabled = !!r.enabled;
      if (r.enabled) {
        if (r.turns && r.turns.length) S.live.turns = S.live.turns.concat(r.turns).slice(-400);
        S.live.partials = r.partials || {};
        S.live.seq = r.seq || S.live.seq;
        const body = $("liveBody");
        if (body) {
          const stick = body.scrollHeight - body.scrollTop - body.clientHeight < 40;
          body.innerHTML = liveHTML();
          if (stick) body.scrollTop = body.scrollHeight;
        } else if (!wasEnabled) {
          renderMain();  // pane appears once the first helper spins up
        }
      }
    }
  } catch (e) { /* transient */ }
  setTimeout(pollLive, S.rec.recording ? 700 : 2000);
}
/* ------------------------------------------------------------------ cues -- */
/* Talking points and questions written BEFORE a meeting, so they are on hand
   while talking instead of buried in another tab. They live outside any meeting
   (GET/PUT /api/cues) and the backend copies them into a recording when it
   starts, which is what lets the summary flag the ones never addressed.
   localStorage is a cache, not the source of truth: it makes the editor usable
   the instant the screen paints and survives the backend being unreachable. */
const CUES_CACHE = "msCues";
let _cuesTimer = 0;

function cuesParse(text) {
  return String(text ?? "").split("\n").map(s => s.trim()).filter(Boolean);
}
/* The draft wins while the user is typing; otherwise the saved list. */
function cuesText() { return S.cuesDraft === null ? (S.cues || []).join("\n") : S.cuesDraft; }
function cuesList() { return S.cuesDraft === null ? (S.cues || []) : cuesParse(S.cuesDraft); }

async function loadCues() {
  try {
    const cached = JSON.parse(localStorage.getItem(CUES_CACHE) || "[]");
    if (Array.isArray(cached)) S.cues = cached.filter(c => typeof c === "string");
  } catch (e) { /* corrupt cache — the server copy below is authoritative */ }
  try {
    const r = await api("/api/cues");
    S.cues = (r && Array.isArray(r.cues) ? r.cues : []).map(c => String(c));
    try { localStorage.setItem(CUES_CACHE, JSON.stringify(S.cues)); } catch (e) {}
    S.cuesState = "";
  } catch (e) {
    // No backend for cues (older build, or restarting): keep the local copy and
    // say so, rather than pretending the list is empty and losing the user's work.
    S.cuesState = S.cues.length ? "local" : "";
  }
  if (S.cues.length) S.cuesOpen = true;   // they wrote these for a reason
  if (S.view === "new" && !S.rec.recording && S.cuesDraft === null) renderRecorder();
}
/* Status is painted in place — never re-render the form under a live caret. */
function cuesStatus(state) {
  S.cuesState = state;
  const el = $("cuesState");
  if (!el) return;
  el.className = "cues-state" + (state === "saved" ? " ok" : state === "local" ? " local" : "");
  el.textContent = state === "saving" ? "Saving…"
    : state === "saved" ? "Saved"
    : state === "local" ? "Saved on this Mac only" : "";
}
/* Everything in the open editor that depends on HOW MANY cues there are, moved
   in place. Typing must never re-render the field — that would rebuild the
   textarea under the caret — so the count badge and the Clear button are both
   updated by hand here. They are rendered into the DOM either way and toggled
   with `display`, because a Clear button that only appeared on the next full
   render left someone who had just typed their first cue with no way to drop
   them again.

   Not named cuesCount: the badge's own id is "cuesCount", and an element id is
   published as a global, so that name would collide with the very node this
   updates. */
function syncCuesCount(n) {
  const badge = $("cuesCount");
  if (badge) {
    badge.textContent = n ? String(n) : "";
    badge.style.display = n ? "" : "none";
  }
  const clear = $("cuesClear");
  if (clear) clear.style.display = n ? "" : "none";
}
function cuesInput(ta) {
  S.cuesDraft = ta.value;
  cuesStatus("saving");
  syncCuesCount(cuesList().length);
  clearTimeout(_cuesTimer);
  _cuesTimer = setTimeout(flushCues, 700);
}
async function flushCues() {
  clearTimeout(_cuesTimer);
  const list = cuesList();
  const unchanged = JSON.stringify(list) === JSON.stringify(S.cues || []);
  S.cues = list;
  try { localStorage.setItem(CUES_CACHE, JSON.stringify(list)); } catch (e) {}
  if (unchanged && S.cuesState !== "saving") return;
  try {
    await api("/api/cues", {method: "PUT", headers: {"Content-Type": "application/json"},
                            body: JSON.stringify({cues: list})});
    cuesStatus("saved");

    <div class="proc-step${i < idx ? " done" : i === idx ? " active" : ""}">
      <span class="proc-ic">${i < idx ? icon("check", 14, 2.2) : i === idx ? '<span class="spinner"></span>' : '<span style="width:5px;height:5px;border-radius:50%;background:var(--text-faint);display:block"></span>'}</span>

  // no reason for what the user typed to be unreachable while they wait.

/* ----------------------------------------------------------- main router -- */
function renderMain() {
  if (S.rec.recording) { renderRecorder(); return; }
  if (S.view === "new" || (!S.activeId && !S.meetings.length)) { renderRecorder(); return; }
  const meta = S.detail;
  if (!meta) { $("main").innerHTML = ""; return; }
  if (meta.status === "processing") { renderProcessing(meta); return; }
  renderReview(meta);

/* ------------------------------------------------------------ data flow -- */
const PAGE_SIZE = 40;
// Every list fetch is tagged with the query it was for. A response is applied
// only if the query hasn't changed since — so a slow page-1 "demo" response
// can't overwrite a newer empty-query list, and load-more can't append rows
// from a stale search.
let _listToken = 0;
async function refreshList() {
  const q = S.q.trim();
  const token = ++_listToken;
  try {
    const limit = Math.max(PAGE_SIZE, S.meetings.length);
    const r = await api(`/api/meetings?limit=${limit}&offset=0&q=${encodeURIComponent(q)}`);
    if (token !== _listToken) return;  // a newer query superseded this one
    S.meetings = r.items;
    S.total = r.total;
    if (!S.activeId && S.meetings.length) S.activeId = S.meetings[0].id;
    renderSidebar();
  } catch (e) { /* transient */ }
}
async function loadMoreMeetings() {
  if (S.listLoading || S.meetings.length >= S.total) return;
  S.listLoading = true;
  const q = S.q.trim();
  const token = _listToken;
  const more = $("sbMore");
  if (more) more.textContent = "Loading…";
  try {
    const r = await api(`/api/meetings?limit=${PAGE_SIZE}&offset=${S.meetings.length}&q=${encodeURIComponent(q)}`);
    if (token !== _listToken) return;  // the query changed while we fetched
    const known = new Set(S.meetings.map(m => m.id));
    S.meetings = S.meetings.concat(r.items.filter(m => !known.has(m.id)));
    S.total = r.total;
    renderSidebar();
  } catch (e) { /* transient */ }
  finally { S.listLoading = false; }
}
async function openMeeting(id) {
  const switching = !S.detail || S.detail.id !== id;
  S.activeId = id;
  S.view = "meeting";
  S.menu = null;
  if (switching) { S.tq = ""; S.busySummary = false; }  // keep search/spinner on same-meeting reloads
  try {
    const meta = await api("/api/meetings/" + id);
    const switched = !S.detail || S.detail.id !== id;
    S.detail = meta;
    if (switched) { S.tab = "overview"; resetTabPill(); transportTeardown(); }
    if (meta.status === "done" && (switched || !(AU.mic || AU.sys))) transportSetup(meta);
    renderSidebar();
    renderMain();
  } catch (e) { toast("⚠ " + e.message); }
}

/* polling: drives recording state, job transitions, live progress */
let wasRecording = false;
function setConnected(ok) {
  if (S.connected === ok) return;
  S.connected = ok;
  let banner = $("connBanner");
  if (!ok) {
    if (!banner) {
      banner = document.createElement("div");
      banner.id = "connBanner";
      banner.innerHTML = `<span class="spinner"></span> Reconnecting to MeetingScribe…`;
      document.body.appendChild(banner);
    }
  } else if (banner) {
    banner.remove();
    // The backend just came back (e.g. it was restarted) — resync everything.
    refreshList(); if (S.activeId) openMeeting(S.activeId);
  }
}
/* True while the user is typing somewhere in the main pane. Background polls
   must never replace the DOM under a live caret — the recorder form (title,
   cues) and the review pane are all rebuilt wholesale on render. */
function mainEditing() {
  const el = document.activeElement;
  return !!(el && $("main").contains(el)
    && (el.isContentEditable || el.tagName === "INPUT" || el.tagName === "TEXTAREA"));
}
async function pollStatus() {
  try {
    const st = await api("/api/status");
    setConnected(true);
    const rec = st.recorder || {};
    S.jobs = st.jobs || {};
    S.summaryJobs = st.summary_jobs || {};
    const startedRec = rec.recording && !S.rec.recording;
    const stoppedRec = !rec.recording && S.rec.recording;
    S.rec = rec;

    if (startedRec || stoppedRec) { renderMain(); refreshList(); }
    if (rec.recording) {
      const t = $("recTimer");
      if (t) t.textContent = fmtTs(rec.elapsed || 0);
      else renderMain();
      const lv = rec.levels || {};
      const m = $("lvlMic"), s = $("lvlSys");
      if (m) m.style.width = Math.round((lv.mic || 0) * 100) + "%";
      if (s) s.style.width = Math.round((lv.system || 0) * 100) + "%";
      for (const [k, tr] of Object.entries(rec.tracks || {})) {
        if (tr.error) toast(`⚠ ${k} track failed: ${tr.error}`, 8000);
      }
    }
    // Never replace the main view under the user's cursor: if they are
    // typing in the title, a rename field, a search box or the Ask composer,
    // defer the re-render to a later poll tick.
    const editing = mainEditing();
    // live processing updates for the open meeting
    if (S.detail && S.jobs[S.detail.id] && S.jobs[S.detail.id].state === "processing") {
      if (S.detail.status !== "processing" && !editing) { S.detail.status = "processing"; renderMain(); }
      const el = $("procMsg");
      const msg = S.jobs[S.detail.id].message || "Working…";
      if (el && el.textContent !== msg) {
        const idx = procStepIndex(msg);
        if (document.querySelectorAll(".proc-step.done").length !== idx) renderProcessing(S.detail);
        else el.textContent = msg;
      }
    }
    // finished jobs -> refresh (deferred while editing; re-runs next tick)
    if (!editing) {
      for (const [id, job] of Object.entries(S.jobs)) {
        const prev = S.lastJobs[id];
        if (prev && prev.state === "processing" && job.state !== "processing") {
          refreshList();
          if (id === S.activeId) openMeeting(id);
          toast(job.state === "done" ? "✅ Transcript ready" : "⚠ Processing failed", 5000);
        }
      }
      S.lastJobs = JSON.parse(JSON.stringify(S.jobs));

      // finished summary jobs -> load the summary into the open meeting
      for (const [id, job] of Object.entries(S.summaryJobs)) {
        const prev = S.lastSummaryJobs[id];
        if (prev && prev.state === "processing" && job.state !== "processing") {
          S.busySummary = false;
          if (id === S.activeId) openMeeting(id);
          if (job.state === "done") toast("✅ Summary ready", 6000);
          else if (job.needs_claude) claudeSetupPrompt(job.message);
          else toast("⚠ Summary failed: " + (job.message || ""), 6000);
        }
      }
      // keep the button spinner live while the open meeting's summary runs
      const mine = S.detail && S.summaryJobs[S.detail.id];
      if (mine && mine.state === "processing" && !S.busySummary && !$("sumBtn")?.disabled) renderMain();
      S.lastSummaryJobs = JSON.parse(JSON.stringify(S.summaryJobs));
    }
  } catch (e) { setConnected(false); }  // backend restarting — banner + auto-resync
  setTimeout(pollStatus, S.rec.recording ? 700 : 1200);
}
async function pollDevices() {
  try {
    const d = await api("/api/devices");
    if (!d.recording) {
      const before = JSON.stringify(S.devices);
      S.devices = d;
      if (JSON.stringify(d) !== before) {
        renderSidebar();
        if (S.view === "new" && !S.rec.recording && !mainEditing()) renderRecorder();

  setTimeout(pollDevices, S.rec.recording ? 10000 : 5000);

async function pollCalendar() {
  try {

/* ----------------------------------------------------------------- boot -- */
(async function boot() {
  await refreshList();
  if (S.meetings.length) await openMeeting(S.meetings[0].id);
  else { S.view = "new"; renderMain(); }
  pollStatus();
  pollDevices();

/* ============================================================================

    // no IntersectionObserver or under reduced motion the class is absent and
    // every turn stays at full contrast (the CSS fallback).

      teardownLenis();
    }
  }
  // Re-wire whenever the main pane re-renders (renderMain replaces #main; a
  // search replaces only #trInner). Coalesced to once per frame.
  const mainEl = document.getElementById("main");
  if (mainEl && "MutationObserver" in window) {
    let pending = false;
    new MutationObserver(() => {
      if (pending) return;
      pending = true;
      requestAnimationFrame(() => { pending = false; wireTranscript(); });
    }).observe(mainEl, { childList: true, subtree: true });
  }
  wireTranscript();

  /* -------------------------------------------------- playing-line halo -- */
  // While audio plays, mark the turn under the playhead so the border-beam halo
  // traces it. Reads transportTime() + the data-t on each group. A cheap poll,
  // not a rAF, and a no-op whenever nothing is playing or the tab isn't open.
  setInterval(() => {
    if (!AU || !AU.playing) return;
    const scroll = document.querySelector(".tr-scroll");
    if (!scroll) return;
    const groups = scroll.querySelectorAll(".tr-group[data-t]");
    if (!groups.length) return;
    const t = (typeof transportTime === "function") ? transportTime() : 0;
    let active = null;
    for (let i = 0; i < groups.length; i++) {
      if (parseFloat(groups[i].getAttribute("data-t")) <= t + 0.001) active = groups[i];
      else break;
    }
    for (let j = 0; j < groups.length; j++) groups[j].classList.toggle("is-playing", groups[j] === active);
  }, 250);

  /* ----------------------------------------------------- command palette -- */
  const overlay = document.getElementById("msCmdkOverlay");
  const input = document.getElementById("msCmdkInput");
  const listEl = document.getElementById("msCmdkList");
  let flat = [], sel = 0, isOpen = false;
  const ic = (name) => icon(name, 16, 1.7);

  function fuzzy(q, s) {
    q = q.toLowerCase(); s = s.toLowerCase();
    if (s.indexOf(q) >= 0) return true;
    let i = 0;
    for (let j = 0; j < s.length && i < q.length; j++) if (s[j] === q[i]) i++;
    return i === q.length;
  }

  function paletteSearch(q) {
    closePalette();
    const m = S.detail;
    if (!m || !(m.turns || []).length) return;
    if (S.tab !== "transcript") setTab("transcript");   // renders synchronously
    const el = document.getElementById("trSearch");
    if (el) el.value = q;
    if (typeof trSearch === "function") trSearch(q);
    if (el) { el.focus(); try { el.setSelectionRange(q.length, q.length); } catch (e) {} }
  }
  function jumpToSpeaker(key, name) {
    closePalette();
    const m = S.detail; if (!m) return;
    if (S.tab !== "transcript") setTab("transcript");
    const scroll = document.querySelector(".tr-scroll");
    const groups = scroll ? scroll.querySelectorAll(".tr-group") : [];
    for (let i = 0; i < groups.length; i++) {
      const spk = groups[i].querySelector(".tr-spk");
      if (spk && spk.textContent.trim() === String(name).trim()) {
        groups[i].scrollIntoView({ block: "center", behavior: RM ? "auto" : "smooth" });
        break;
      }
    }
  }
  function jumpTranscript(toEnd) {
    closePalette();
    if (S.tab !== "transcript" && S.detail) setTab("transcript");
    const scroll = document.querySelector(".tr-scroll");
    if (scroll) scroll.scrollTo({ top: toEnd ? scroll.scrollHeight : 0, behavior: RM ? "auto" : "smooth" });
  }

  function buildGroups() {
    const q = input.value.trim();
    const m = S.detail;
    const hasTurns = !!(m && (m.turns || []).length);
    const open = !!(m && S.view === "meeting" && m.status !== "processing");
    const tabbed = open && m.status !== "error";
    const out = [];
    const push = (name, items) => { items = items.filter(Boolean); if (items.length) out.push({ name, items }); };

    if (q && hasTurns) {
      const rx = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig");
      const hits = (m.turns || []).reduce((a, t) => a + ((t.text || "").match(rx) || []).length, 0);
      push("Search", [{ label: 'Search transcript for "' + q + '"', icon: "search",
        hint: hits + (hits === 1 ? " hit" : " hits"), run: () => paletteSearch(q) }]);
    }

    push("Suggested", [
      hasTurns ? { label: m.summary ? "Re-summarize meeting" : "Summarize meeting", icon: "sparkle",
        primary: true, run: () => summarizeMeeting(m.id) } : null,
    ]);

    const nav = [];
    if (tabbed) {
      nav.push({ label: "Go to Overview", icon: "list", run: () => setTab("overview") });
      if (hasTurns) {
        nav.push({ label: "Go to Transcript", icon: "wave", run: () => setTab("transcript") });
        nav.push({ label: "Go to Insights", icon: "wave", run: () => setTab("insights") });
        nav.push({ label: "Ask this meeting", icon: "chat", run: () => setTab("chat") });
        nav.push({ label: "Jump to start of transcript", icon: "list", run: () => jumpTranscript(false) });
        nav.push({ label: "Jump to end of transcript", icon: "list", run: () => jumpTranscript(true) });
      }
    }
    if (hasTurns) {
      Object.keys(m.speakers || {}).forEach((key) => {
        const name = m.speakers[key] || key;
        nav.push({ label: "Jump to " + name, spk: key, spkName: name, run: () => jumpToSpeaker(key, name) });
      });
    }
    push("Navigate", nav);

    if (hasTurns) {
      const email = (m.summary || {}).follow_up_email || {};
      push("Actions", [
        { label: "Tidy transcript", icon: "wave", run: () => tidyMeeting(m.id) },
        { label: "Sync to phone", icon: "phone", run: () => toggleSync(m.id, true) },
        { label: "Copy transcript", icon: "copy", run: () => copyTranscript(m.id) },
        email.body ? { label: "Copy follow-up email", icon: "copy", run: () => copySummaryEmail(m.id) } : null,
        { label: "Save as Markdown", icon: "doc", run: () => { location.href = "/api/meetings/" + m.id + "/export?fmt=md"; } },
        { label: "Save as plain text", icon: "textT", run: () => { location.href = "/api/meetings/" + m.id + "/export?fmt=txt"; } },
        { label: "Reveal folder in Finder", icon: "folder", run: () => revealMd(m.id) },
        m.tidied ? { label: "Undo tidy", icon: "undo", run: () => undoTidy(m.id) } : null,
        { label: "Reprocess audio", icon: "refresh", run: () => reprocess(m.id) },
        { label: "Delete recording…", icon: "trash", danger: true, run: () => delMeeting(m.id) },
      ]);
    }

    push("App", [
      { label: "New recording", icon: "plus", run: () => goNew() },
      (S.auth && S.auth.signed_in) ? { label: "Sync all to phone", icon: "cloud", run: () => syncAll() } : null,
      hasTurns ? { label: "Increase transcript text size", icon: "textT", keepOpen: true, run: () => setTrSize(0.5) } : null,
      hasTurns ? { label: "Decrease transcript text size", icon: "textT", keepOpen: true, run: () => setTrSize(-0.5) } : null,
    ]);

    push("Appearance", THEMES.map((t) => ({ label: "Theme: " + t.name, theme: t, run: () => setTheme(t.id) })));

    return { q, groups: out };
  }

  function render() {
    const built = buildGroups();
    const q = built.q;
    listEl.innerHTML = ""; flat = [];
    const shown = [];
    built.groups.forEach((gr) => {
      const items = gr.name === "Search" ? gr.items : gr.items.filter((it) => !q || fuzzy(q, it.label));
      if (items.length) shown.push({ name: gr.name, items });
    });
    if (!shown.length) { listEl.innerHTML = '<div class="ms-cmdk-empty">No commands match.</div>'; return; }
    shown.forEach((gr) => {
      const gl = document.createElement("div");
      gl.className = "ms-cmdk-group"; gl.textContent = gr.name;
      listEl.appendChild(gl);
      gr.items.forEach((it) => {
        const idx = flat.length;
        const b = document.createElement("button");
        b.className = "ms-cmdk-item" + (it.danger ? " danger" : "");
        let lead;
        if (it.spk) lead = '<span class="av" style="background:' + speakerColor(S.detail, it.spk) + '">' + esc(initials(it.spkName)) + '</span>';
        else if (it.theme) lead = '<span class="av" style="background:' + it.theme.accent + '"></span>';
        else lead = ic(it.icon || "list");
        const hint = it.hint ? '<span class="hint">' + esc(it.hint) + '</span>' : (it.primary ? '<span class="hint">⏎</span>' : '');
        b.innerHTML = lead + "<span>" + esc(it.label) + "</span>" + hint;
        b.addEventListener("mousemove", () => setSel(idx));
        b.addEventListener("click", () => runItem(idx));
        listEl.appendChild(b);
        flat.push({ el: b, run: it.run, keepOpen: !!it.keepOpen });
      });
    });
    setSel(0);
  }
  function setSel(i) {
    if (!flat.length) return;
    sel = Math.max(0, Math.min(flat.length - 1, i));
    flat.forEach((c, j) => c.el.classList.toggle("sel", j === sel));
    const el = flat[sel].el, lr = el.getBoundingClientRect(), pr = listEl.getBoundingClientRect();
    if (lr.bottom > pr.bottom) listEl.scrollTop += lr.bottom - pr.bottom + 8;
    else if (lr.top < pr.top) listEl.scrollTop -= pr.top - lr.top + 8;
  }
  function runItem(i) {
    const c = flat[i]; if (!c) return;
    try { c.run(); } catch (e) {}
    if (!c.keepOpen) closePalette();
  }
  function openPalette() {
    if (!overlay) return;
    isOpen = true;
    overlay.classList.add("open");
    input.value = ""; render();
    setTimeout(() => input.focus(), 20);
  }
  function closePalette() { isOpen = false; if (overlay) overlay.classList.remove("open"); }
  window.msOpenPalette = openPalette;

  if (overlay && input && listEl) {
    input.addEventListener("input", render);
    input.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { setSel(sel + 1); e.preventDefault(); }
      else if (e.key === "ArrowUp") { setSel(sel - 1); e.preventDefault(); }
      else if (e.key === "Enter") { runItem(sel); e.preventDefault(); }
      else if (e.key === "Escape") { closePalette(); }
    });
    overlay.addEventListener("mousedown", (e) => { if (e.target === overlay) closePalette(); });
    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")) { e.preventDefault(); isOpen ? closePalette() : openPalette(); }
      else if (e.key === "Escape" && isOpen) closePalette();
    });
  }
})();
</script>
</body>
</html>
