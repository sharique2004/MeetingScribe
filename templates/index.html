          .map(([v, n]) => `<option value="${v}"${S.recLang === v ? " selected" : ""}>${n}</option>`).join("")}
      </select>
      <div class="hint">Locks speech recognition to one language for better accuracy. Live captions always need a chosen or default language.</div>
    </div>
    ${cuesField()}
    <div class="field">
      <label>Audio devices</label>
      <div class="rec-devices">
        <div class="rec-dev">
          <span class="dot ${dev.mic ? "" : "err"}"></span>
          <span class="name">${esc(dev.mic ? dev.mic.name : "No microphone found")}</span>
          <span class="role">you</span>
        </div>
        <div class="rec-dev">
          <span class="dot ${sysDot}"></span>
          <span class="name">${esc(sys ? sys.name : "BlackHole 2ch")}</span>
          <span class="role${sysAlert === "silent" ? " silent" : ""}">${esc(sysRole)}</span>
        </div>
      </div>
      ${sysAlertBox}
    </div>
    <button class="rec-start" id="startBtn" onclick="startRecording()">${icon("mic", 14, 2)}Start recording</button>
  </div></div>
  </section>`;
}
function setRecType(t) {
  S.recType = t;
  S.pendingTitle = ($("recTitle") || {}).value || S.pendingTitle;
  renderRecorder();
}
function useEvent(el) {
  S.pendingTitle = el.dataset.title;
  const input = $("recTitle");
  if (input) input.value = S.pendingTitle;
}
async function startRecording() {
  const btn = $("startBtn");
  btn.disabled = true;
  S.pendingTitle = ($("recTitle") || {}).value || "";
  // Land any half-typed cue before the backend snapshots them into the meeting.
  await flushCues();
  try {
    const meta = await postJSON("/api/record/start",
      {title: S.pendingTitle, mode: S.recType, language: S.recLang});
    (meta.warnings || []).forEach(w => toast("⚠ " + w, 6000));
    resetLive(meta.id);
    S.activeId = meta.id;
    await refreshList();
    // Don't call pollStatus() here — it self-reschedules via setTimeout, so
    // invoking it directly would spawn a second permanent polling loop each
    // time we record. The existing loop picks up the new state on its next tick.
    renderMain();
  } catch (e) {
    toast("⚠ " + e.message, 6000);
    btn.disabled = false;
  }
}
async function stopRecording() {
  const btn = $("stopBtn");
  if (btn) btn.disabled = true;
  try {
    const meta = await postJSON("/api/record/stop", {});
    S.view = "meeting";
    S.pendingTitle = "";
    await refreshList();
    openMeeting(meta.id);
  } catch (e) {
    toast("⚠ " + e.message, 6000);
    if (btn) btn.disabled = false;
  }
}
function renderProcessing(meta) {
  const job = S.jobs[meta.id] || {};
  const idx = procStepIndex(job.message);
  const steps = PROC_STEPS.map((s, i) => `
    <div class="proc-step${i < idx ? " done" : i === idx ? " active" : ""}">
      <span class="proc-ic">${i < idx ? icon("check", 14, 2.2) : i === idx ? '<span class="spinner"></span>' : '<span style="width:5px;height:5px;border-radius:50%;background:var(--text-faint);display:block"></span>'}</span>
      <span>${s.label}</span>
      <span class="proc-detail" id="${i === idx ? "procMsg" : ""}">${i === idx ? esc(job.message || "Working…") : s.detail}</span>
    </div>`).join("");
  // Live captions captured during the recording stay readable while the
  // full-quality transcript is being built.
  const capturedRows = (S.live.turns || []).map(t =>
    `<div class="live-row"><span class="live-who ${t.track === "mic" ? "you" : ""}">${esc(t.who)}</span><span>${esc(t.text)}</span></div>`).join("");
  // The notes come too. Processing is the other status whose screen replaces the
  // whole review, and it can sit here for minutes — or forever, if the run that
  // is meant to finish it dies. The same standalone render as the error page:
  // there is no transcript to jump into and no player to seek yet, but there is
  // no reason for what the user typed to be unreachable while they wait.
  const written = notesSection(meta, {standalone: true,
    lede: "Already saved — they were written to disk as you typed them. They will move into the meeting when the transcript lands."});
  $("main").innerHTML = `
  <section class="pane full" aria-label="Processing">
  <div class="rec-stage${written ? " has-notes" : ""}"><div class="rec-card">
    <div class="rec-kicker">Processing on-device</div>
    <h1 class="rec-h1" style="margin-bottom:4px">${esc(meta.title)}</h1>
    <div class="mono" style="font-size:12px;color:var(--text-dim)">${meta.duration ? fmtTs(meta.duration) + " recorded · " : ""}~90 s for a 45-min call</div>
    <div class="proc-steps">${steps}</div>
    ${capturedRows ? `<div class="live-pane" style="margin-top:14px">
      <div class="live-head">Live captions from the recording <span class="live-note">draft — being replaced by the full transcript</span></div>
      <div class="live-body" style="max-height:180px">${capturedRows}</div>
    </div>` : ""}
    ${written}
  </div></div>
  </section>`;
}

/* ----------------------------------------------------------- main router -- */
function renderMain() {
  if (S.rec.recording) { renderRecorder(); return; }
  if (S.view === "new" || (!S.activeId && !S.meetings.length)) { renderRecorder(); return; }
  const meta = S.detail;
  if (!meta) { $("main").innerHTML = ""; return; }
  if (meta.status === "processing") { renderProcessing(meta); return; }
  renderReview(meta);
}

/* ------------------------------------------------------------ data flow -- */
const PAGE_SIZE = 40;
// Every list fetch is tagged with the query it was for. A response is applied
// only if the query hasn't changed since — so a slow page-1 "demo" response
// can't overwrite a newer empty-query list, and load-more can't append rows
// from a stale search.
let _listToken = 0;
async function refreshList() {
  const q = S.q.trim();
  const token = ++_listToken;
  try {
    const limit = Math.max(PAGE_SIZE, S.meetings.length);
    const r = await api(`/api/meetings?limit=${limit}&offset=0&q=${encodeURIComponent(q)}`);
    if (token !== _listToken) return;  // a newer query superseded this one
    S.meetings = r.items;
    S.total = r.total;
    if (!S.activeId && S.meetings.length) S.activeId = S.meetings[0].id;
    renderSidebar();
  } catch (e) { /* transient */ }
}
async function loadMoreMeetings() {
  if (S.listLoading || S.meetings.length >= S.total) return;
  S.listLoading = true;
  const q = S.q.trim();
  const token = _listToken;
  const more = $("sbMore");
  if (more) more.textContent = "Loading…";
  try {
    const r = await api(`/api/meetings?limit=${PAGE_SIZE}&offset=${S.meetings.length}&q=${encodeURIComponent(q)}`);
    if (token !== _listToken) return;  // the query changed while we fetched
    const known = new Set(S.meetings.map(m => m.id));
    S.meetings = S.meetings.concat(r.items.filter(m => !known.has(m.id)));
    S.total = r.total;
    renderSidebar();
  } catch (e) { /* transient */ }
  finally { S.listLoading = false; }
}
async function openMeeting(id) {
  const switching = !S.detail || S.detail.id !== id;
  S.activeId = id;
  S.view = "meeting";
  S.menu = null;
  if (switching) { S.tq = ""; S.busySummary = false; }  // keep search/spinner on same-meeting reloads
  try {
    const meta = await api("/api/meetings/" + id);
    const switched = !S.detail || S.detail.id !== id;
    S.detail = meta;
    if (switched) { S.tab = "overview"; resetTabPill(); transportTeardown(); }
    if (meta.status === "done" && (switched || !(AU.mic || AU.sys))) transportSetup(meta);
    renderSidebar();
    renderMain();
  } catch (e) { toast("⚠ " + e.message); }
}

/* polling: drives recording state, job transitions, live progress */
let wasRecording = false;
function setConnected(ok) {
  if (S.connected === ok) return;
  S.connected = ok;
  let banner = $("connBanner");
  if (!ok) {
    if (!banner) {
      banner = document.createElement("div");
      banner.id = "connBanner";
      banner.innerHTML = `<span class="spinner"></span> Reconnecting to MeetingScribe…`;
      document.body.appendChild(banner);
    }
  } else if (banner) {
    banner.remove();
    // The backend just came back (e.g. it was restarted) — resync everything.
    refreshList(); if (S.activeId) openMeeting(S.activeId);
  }
}
/* True while the user is typing somewhere in the main pane. Background polls
   must never replace the DOM under a live caret — the recorder form (title,
   cues) and the review pane are all rebuilt wholesale on render. */
function mainEditing() {
  const el = document.activeElement;
  return !!(el && $("main").contains(el)
    && (el.isContentEditable || el.tagName === "INPUT" || el.tagName === "TEXTAREA"));
}
async function pollStatus() {
  try {
    const st = await api("/api/status");
    setConnected(true);
    const rec = st.recorder || {};
    S.jobs = st.jobs || {};
    S.summaryJobs = st.summary_jobs || {};
    const startedRec = rec.recording && !S.rec.recording;
    const stoppedRec = !rec.recording && S.rec.recording;
    S.rec = rec;

    if (startedRec || stoppedRec) { renderMain(); refreshList(); }
    if (rec.recording) {
      const t = $("recTimer");
      if (t) t.textContent = fmtTs(rec.elapsed || 0);
      else renderMain();
      const lv = rec.levels || {};
      const m = $("lvlMic"), s = $("lvlSys");
      if (m) m.style.width = Math.round((lv.mic || 0) * 100) + "%";
      if (s) s.style.width = Math.round((lv.system || 0) * 100) + "%";
      for (const [k, tr] of Object.entries(rec.tracks || {})) {
        if (tr.error) toast(`⚠ ${k} track failed: ${tr.error}`, 8000);
      }
    }
    // Never replace the main view under the user's cursor: if they are
    // typing in the title, a rename field, a search box or the Ask composer,
    // defer the re-render to a later poll tick.
    const editing = mainEditing();
    // live processing updates for the open meeting
    if (S.detail && S.jobs[S.detail.id] && S.jobs[S.detail.id].state === "processing") {
      if (S.detail.status !== "processing" && !editing) { S.detail.status = "processing"; renderMain(); }
      const el = $("procMsg");
      const msg = S.jobs[S.detail.id].message || "Working…";
      if (el && el.textContent !== msg) {
        const idx = procStepIndex(msg);
        if (document.querySelectorAll(".proc-step.done").length !== idx) renderProcessing(S.detail);
        else el.textContent = msg;
      }
    }
    // finished jobs -> refresh (deferred while editing; re-runs next tick)
    if (!editing) {
      for (const [id, job] of Object.entries(S.jobs)) {
        const prev = S.lastJobs[id];
        if (prev && prev.state === "processing" && job.state !== "processing") {
          refreshList();
          if (id === S.activeId) openMeeting(id);
          toast(job.state === "done" ? "✅ Transcript ready" : "⚠ Processing failed", 5000);
        }
      }
      S.lastJobs = JSON.parse(JSON.stringify(S.jobs));

      // finished summary jobs -> load the summary into the open meeting
      for (const [id, job] of Object.entries(S.summaryJobs)) {
        const prev = S.lastSummaryJobs[id];
        if (prev && prev.state === "processing" && job.state !== "processing") {
          S.busySummary = false;
          if (id === S.activeId) openMeeting(id);
          if (job.state === "done") toast("✅ Summary ready", 6000);
          else if (job.needs_claude) claudeSetupPrompt(job.message);
          else toast("⚠ Summary failed: " + (job.message || ""), 6000);
        }
      }
      // keep the button spinner live while the open meeting's summary runs
      const mine = S.detail && S.summaryJobs[S.detail.id];
      if (mine && mine.state === "processing" && !S.busySummary && !$("sumBtn")?.disabled) renderMain();
      S.lastSummaryJobs = JSON.parse(JSON.stringify(S.summaryJobs));
    }
  } catch (e) { setConnected(false); }  // backend restarting — banner + auto-resync
  setTimeout(pollStatus, S.rec.recording ? 700 : 1200);
}
async function pollDevices() {
  try {
    const d = await api("/api/devices");
    if (!d.recording) {
      const before = JSON.stringify(S.devices);
      S.devices = d;
      if (JSON.stringify(d) !== before) {
        renderSidebar();
        if (S.view === "new" && !S.rec.recording && !mainEditing()) renderRecorder();
      }
    }
  } catch (e) { /* keep last known */ }
  setTimeout(pollDevices, S.rec.recording ? 10000 : 5000);
}
async function pollCalendar() {
  try {
    const c = await api("/api/calendar/today");
    S.calendar = (c && c.events) || [];
    if (S.view === "new" && !S.rec.recording && !mainEditing()) renderRecorder();
  } catch (e) { /* not available */ }
}

/* ----------------------------------------------------------------- boot -- */
(async function boot() {
  await refreshList();
  if (S.meetings.length) await openMeeting(S.meetings[0].id);
  else { S.view = "new"; renderMain(); }
  pollStatus();
  pollDevices();
  pollCalendar();
  loadCues();
  pollLive();
  refreshAuth();
  setInterval(pollCalendar, 300000);
})();

/* ============================================================================
   AURORA ADDITIVE LAYER — command palette, transcript reading-focus, the
   playing-line halo, and (optional) lenis smooth scroll. Everything here READS
   the real state object S and CALLS the real app functions; it never owns app
   data and never redefines an existing global. Scoped in its own IIFE, exposing
   only window.msOpenPalette (referenced by the sidebar launcher's onclick).
   ========================================================================== */
(function auroraLayer() {
  const RM = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  /* ------------------------------------------- transcript reading focus -- */
  let io = null, lenisInst = null, lenisRAF = 0, lastScrollEl = null;
  function teardownIO() { if (io) { io.disconnect(); io = null; } }
  function teardownLenis() {
    if (lenisRAF) { cancelAnimationFrame(lenisRAF); lenisRAF = 0; }
    if (lenisInst) { try { lenisInst.destroy(); } catch (e) {} lenisInst = null; }
    lastScrollEl = null;
  }
  // The seam's reading-progress sheen follows the reader's scroll position.
  function msReadProgress() {
    const rd = document.querySelector(".reader");
    const mr = document.getElementById("miniRead");
    if (!rd || !mr) return;
    const max = rd.scrollHeight - rd.clientHeight;
    mr.style.transform = "scaleY(" + (max > 0 ? Math.min(1, rd.scrollTop / max) : 0).toFixed(4) + ")";
  }
  function wireTranscript() {
    const scroll = document.querySelector(".reader");
    const inner = document.getElementById("trInner");
    if (!scroll || !inner) { teardownIO(); teardownLenis(); return; }
    scroll.classList.toggle("searching", !!(S.tq && S.tq.trim()));
    if (!scroll._msRp) {
      scroll._msRp = true;
      scroll.addEventListener("scroll", msReadProgress, {passive: true});
    }

    // Centre-band reading focus. Only engaged when it can degrade cleanly: with
    // no IntersectionObserver or under reduced motion the class is absent and
    // every turn stays at full contrast (the CSS fallback).
    teardownIO();
    const groups = inner.querySelectorAll(".turn");
    if (!RM && ("IntersectionObserver" in window) && groups.length) {
      scroll.classList.add("rf");
      let cur = groups[0] || null;
      if (cur) cur.classList.add("rf-focus");
      io = new IntersectionObserver((entries) => {
        entries.forEach((en) => {
          if (!en.isIntersecting || en.target === cur) return;
          if (cur) cur.classList.remove("rf-focus");
          en.target.classList.add("rf-focus");
          cur = en.target;
        });
      }, { root: scroll, rootMargin: "-45% 0px -45% 0px", threshold: 0 });
      groups.forEach((g) => io.observe(g));
    } else {
      scroll.classList.remove("rf");
    }

    // lenis smooth wheel on the transcript. Reuse the instance when only the
    // inner content changed (a search rebuild keeps the same scroller node),
    // recreate when the scroller itself is new. All guarded; native scroll is
    // the fallback if lenis is missing, throws, or reduced motion is set.
    if (window.Lenis && !RM) {
      if (scroll === lastScrollEl && lenisInst) {
        try { lenisInst.resize(); } catch (e) {}
      } else {
        teardownLenis();
        try {
          lenisInst = new Lenis({ wrapper: scroll, content: inner, duration: 1.05, smoothWheel: true });
          try { lenisInst.on("scroll", msReadProgress); } catch (e) {}
          lastScrollEl = scroll;
          const raf = (t) => { if (!lenisInst) return; try { lenisInst.raf(t); } catch (e) { teardownLenis(); return; } lenisRAF = requestAnimationFrame(raf); };
          lenisRAF = requestAnimationFrame(raf);
        } catch (e) { teardownLenis(); }
      }
    } else {
      teardownLenis();
    }
  }
  // Re-wire whenever the main pane re-renders (renderMain replaces #main; a
  // search replaces only #trInner). Coalesced to once per frame.
  const mainEl = document.getElementById("main");
  if (mainEl && "MutationObserver" in window) {
    let pending = false;
    new MutationObserver(() => {
      if (pending) return;
      pending = true;
      requestAnimationFrame(() => { pending = false; wireTranscript(); });
    }).observe(mainEl, { childList: true, subtree: true });
  }
  wireTranscript();

  /* -------------------------------------------------- playing-line halo -- */
  // While audio plays, mark the turn under the playhead so the border-beam halo
  // traces it. Reads transportTime() + the data-t on each group. A cheap poll,
  // not a rAF, and a no-op whenever nothing is playing or the tab isn't open.
  setInterval(() => {
    if (!AU || !AU.playing) return;
    const scroll = document.querySelector(".reader");
    if (!scroll) return;
    const groups = scroll.querySelectorAll(".turn[data-t]");
    if (!groups.length) return;
    const t = (typeof transportTime === "function") ? transportTime() : 0;
    let active = null;
    for (let i = 0; i < groups.length; i++) {
      if (parseFloat(groups[i].getAttribute("data-t")) <= t + 0.001) active = groups[i];
      else break;
    }
    for (let j = 0; j < groups.length; j++) groups[j].classList.toggle("playing", groups[j] === active);
  }, 250);

  /* ----------------------------------------------------- command palette -- */
  const overlay = document.getElementById("msCmdkOverlay");
  const input = document.getElementById("msCmdkInput");
  const listEl = document.getElementById("msCmdkList");
  let flat = [], sel = 0, isOpen = false;
  const ic = (name) => icon(name, 16, 1.7);

  function fuzzy(q, s) {
    q = q.toLowerCase(); s = s.toLowerCase();
    if (s.indexOf(q) >= 0) return true;
    let i = 0;
    for (let j = 0; j < s.length && i < q.length; j++) if (s[j] === q[i]) i++;
    return i === q.length;
  }

  function paletteSearch(q) {
    closePalette();
    const m = S.detail;
    if (!m || !(m.turns || []).length) return;
    // The transcript is always on screen — open the floating find bar over it.
    msOpenFind(q);
    if (typeof trSearch === "function") trSearch(q);
  }
  function jumpToSpeaker(key, name) {
    closePalette();
    const m = S.detail; if (!m) return;
    const scroll = document.querySelector(".reader");
    const groups = scroll ? scroll.querySelectorAll(".turn") : [];
    for (let i = 0; i < groups.length; i++) {
      const spk = groups[i].querySelector(".spk");
      if (spk && spk.textContent.trim() === String(name).trim()) {
        groups[i].scrollIntoView({ block: "center", behavior: RM ? "auto" : "smooth" });
        break;
      }
    }
  }
  function jumpTranscript(toEnd) {
    closePalette();
    const scroll = document.querySelector(".reader");
    if (scroll) scroll.scrollTo({ top: toEnd ? scroll.scrollHeight : 0, behavior: RM ? "auto" : "smooth" });
  }

  function buildGroups() {
    const q = input.value.trim();
    const m = S.detail;
    const hasTurns = !!(m && (m.turns || []).length);
    const open = !!(m && S.view === "meeting" && m.status !== "processing");
    const tabbed = open && m.status !== "error";
    const out = [];
    const push = (name, items) => { items = items.filter(Boolean); if (items.length) out.push({ name, items }); };

    if (q && hasTurns) {
      const rx = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig");
      const hits = (m.turns || []).reduce((a, t) => a + ((t.text || "").match(rx) || []).length, 0);
      push("Search", [{ label: 'Search transcript for "' + q + '"', icon: "search",
        hint: hits + (hits === 1 ? " hit" : " hits"), run: () => paletteSearch(q) }]);
    }

    push("Suggested", [
      hasTurns ? { label: m.summary ? "Re-summarize meeting" : "Summarize meeting", icon: "sparkle",
        primary: true, run: () => summarizeMeeting(m.id) } : null,
    ]);

    const nav = [];
    if (tabbed) {
      nav.push({ label: "Go to Overview", icon: "list", run: () => setTab("overview") });
      if (hasTurns) {
        nav.push({ label: "Go to Transcript", icon: "wave", run: () => setTab("transcript") });
        nav.push({ label: "Go to Insights", icon: "wave", run: () => setTab("insights") });
        nav.push({ label: "Ask this meeting", icon: "chat", run: () => setTab("chat") });
        nav.push({ label: "Jump to start of transcript", icon: "list", run: () => jumpTranscript(false) });
        nav.push({ label: "Jump to end of transcript", icon: "list", run: () => jumpTranscript(true) });
      }
    }
    if (hasTurns) {
      Object.keys(m.speakers || {}).forEach((key) => {
        const name = m.speakers[key] || key;
        nav.push({ label: "Jump to " + name, spk: key, spkName: name, run: () => jumpToSpeaker(key, name) });
      });
    }
    push("Navigate", nav);

    if (hasTurns) {
      const email = (m.summary || {}).follow_up_email || {};
      push("Actions", [
        { label: "Tidy transcript", icon: "wave", run: () => tidyMeeting(m.id) },
        { label: "Sync to phone", icon: "phone", run: () => toggleSync(m.id, true) },
        { label: "Copy transcript", icon: "copy", run: () => copyTranscript(m.id) },
        email.body ? { label: "Copy follow-up email", icon: "copy", run: () => copySummaryEmail(m.id) } : null,
        { label: "Save as Markdown", icon: "doc", run: () => { location.href = "/api/meetings/" + m.id + "/export?fmt=md"; } },
        { label: "Save as plain text", icon: "textT", run: () => { location.href = "/api/meetings/" + m.id + "/export?fmt=txt"; } },
        { label: "Reveal folder in Finder", icon: "folder", run: () => revealMd(m.id) },
        m.tidied ? { label: "Undo tidy", icon: "undo", run: () => undoTidy(m.id) } : null,
        { label: "Reprocess audio", icon: "refresh", run: () => reprocess(m.id) },
        { label: "Delete recording…", icon: "trash", danger: true, run: () => delMeeting(m.id) },
      ]);
    }

    push("App", [
      { label: "New recording", icon: "plus", run: () => goNew() },
      (S.auth && S.auth.signed_in) ? { label: "Sync all to phone", icon: "cloud", run: () => syncAll() } : null,
      hasTurns ? { label: "Increase transcript text size", icon: "textT", keepOpen: true, run: () => setTrSize(0.5) } : null,
      hasTurns ? { label: "Decrease transcript text size", icon: "textT", keepOpen: true, run: () => setTrSize(-0.5) } : null,
    ]);

    push("Appearance", THEMES.map((t) => ({ label: "Theme: " + t.name, theme: t, run: () => setTheme(t.id) })));

    return { q, groups: out };
  }

  function render() {
    const built = buildGroups();
    const q = built.q;
    listEl.innerHTML = ""; flat = [];
    const shown = [];
    built.groups.forEach((gr) => {
      const items = gr.name === "Search" ? gr.items : gr.items.filter((it) => !q || fuzzy(q, it.label));
      if (items.length) shown.push({ name: gr.name, items });
    });
    if (!shown.length) { listEl.innerHTML = '<div class="cmdk-empty">No commands match.</div>'; return; }
    shown.forEach((gr) => {
      const gl = document.createElement("div");
      gl.className = "cmdk-group"; gl.textContent = gr.name;
      listEl.appendChild(gl);
      gr.items.forEach((it) => {
        const idx = flat.length;
        const b = document.createElement("button");
        b.className = "cmdk-item" + (it.danger ? " danger" : "");
        let lead;
        if (it.spk) lead = '<span class="av" style="background:' + speakerColor(S.detail, it.spk) + '">' + esc(initials(it.spkName)) + '</span>';
        else if (it.theme) lead = '<span class="av" style="background:' + it.theme.accent + '"></span>';
        else lead = ic(it.icon || "list");
        const hint = it.hint ? '<span class="hint">' + esc(it.hint) + '</span>' : (it.primary ? '<span class="hint">⏎</span>' : '');
        b.innerHTML = lead + "<span>" + esc(it.label) + "</span>" + hint;
        b.addEventListener("mousemove", () => setSel(idx));
        b.addEventListener("click", () => runItem(idx));
        listEl.appendChild(b);
        flat.push({ el: b, run: it.run, keepOpen: !!it.keepOpen });
      });
    });
    setSel(0);
  }
  function setSel(i) {
    if (!flat.length) return;
    sel = Math.max(0, Math.min(flat.length - 1, i));
    flat.forEach((c, j) => c.el.classList.toggle("sel", j === sel));
    const el = flat[sel].el, lr = el.getBoundingClientRect(), pr = listEl.getBoundingClientRect();
    if (lr.bottom > pr.bottom) listEl.scrollTop += lr.bottom - pr.bottom + 8;
    else if (lr.top < pr.top) listEl.scrollTop -= pr.top - lr.top + 8;
  }
  function runItem(i) {
    const c = flat[i]; if (!c) return;
    try { c.run(); } catch (e) {}
    if (!c.keepOpen) closePalette();
  }
  function openPalette() {
    if (!overlay) return;
    isOpen = true;
    overlay.classList.add("open");
    input.value = ""; render();
    setTimeout(() => input.focus(), 20);
  }
  function closePalette() { isOpen = false; if (overlay) overlay.classList.remove("open"); }
  window.msOpenPalette = openPalette;

  if (overlay && input && listEl) {
    input.addEventListener("input", render);
    input.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { setSel(sel + 1); e.preventDefault(); }
      else if (e.key === "ArrowUp") { setSel(sel - 1); e.preventDefault(); }
      else if (e.key === "Enter") { runItem(sel); e.preventDefault(); }
      else if (e.key === "Escape") { closePalette(); }
    });
    overlay.addEventListener("mousedown", (e) => { if (e.target === overlay) closePalette(); });
    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")) { e.preventDefault(); isOpen ? closePalette() : openPalette(); }
      else if ((e.metaKey || e.ctrlKey) && (e.key === "f" || e.key === "F") && S.detail && S.view === "meeting") { e.preventDefault(); msOpenFind(); }
      else if (e.key === "Escape" && isOpen) closePalette();
      else if (e.key === "Escape") { const fb = document.getElementById("findbar"); if (fb && fb.classList.contains("open")) msCloseFind(); }
    });
  }

  /* ------------------------------------- shell chrome: rail, sidebar, seam -- */
  // Converged's collapse choreography, driving classes on the STATIC #shell /
  // #sidebar nodes so the state survives every innerHTML re-render of #main.
  function msSetRail(open) {
    const shellEl = document.getElementById("shell");
    const rail = document.getElementById("rail");
    const t = document.getElementById("railToggle");
    if (!shellEl) return;
    if (t) t.setAttribute("aria-pressed", open ? "true" : "false");
    if (open) {
      shellEl.classList.remove("rail-off");
      requestAnimationFrame(() => {
        if (rail) rail.classList.remove("hiding");
        if (typeof slideTabPill === "function") slideTabPill(_tabPill.index);
        if (typeof drawWave === "function") drawWave();
      });
    } else if (RM) {
      shellEl.classList.add("rail-off");
      if (rail) rail.classList.add("hiding");
      if (typeof drawWave === "function") drawWave();
    } else {
      if (rail) rail.classList.add("hiding");
      setTimeout(() => { shellEl.classList.add("rail-off"); if (typeof drawWave === "function") drawWave(); }, 200);
    }
  }
  window.msToggleRail = function () {
    const shellEl = document.getElementById("shell");
    if (shellEl) msSetRail(shellEl.classList.contains("rail-off"));
  };
  function msIsNarrow() { return window.matchMedia("(max-width:900px)").matches; }
  window.msOpenSidebar = function () {
    const shellEl = document.getElementById("shell"), sb = document.getElementById("sidebar");
    if (!shellEl) return;
    if (msIsNarrow()) { shellEl.classList.add("side-open"); return; }
    shellEl.classList.remove("side-collapsed");
    requestAnimationFrame(() => { if (sb) sb.classList.remove("hiding"); setTimeout(() => { if (typeof drawWave === "function") drawWave(); }, 60); });
  };
  window.msCloseSidebar = function () {
    const shellEl = document.getElementById("shell"), sb = document.getElementById("sidebar");
    if (!shellEl) return;
    if (msIsNarrow()) { shellEl.classList.remove("side-open"); return; }
    if (RM) { shellEl.classList.add("side-collapsed"); if (sb) sb.classList.add("hiding"); if (typeof drawWave === "function") drawWave(); return; }
    if (sb) sb.classList.add("hiding");
    setTimeout(() => { shellEl.classList.add("side-collapsed"); if (typeof drawWave === "function") drawWave(); }, 200);
  };
  window.msToggleSidebar = function () {
    const shellEl = document.getElementById("shell");
    if (!shellEl) return;
    if (msIsNarrow()) { shellEl.classList.toggle("side-open"); return; }
    if (shellEl.classList.contains("side-collapsed")) window.msOpenSidebar(); else window.msCloseSidebar();
  };
  window.msScrimClick = function () {
    const shellEl = document.getElementById("shell");
    if (shellEl) shellEl.classList.remove("side-open");
    if (window.matchMedia("(max-width:640px)").matches) msSetRail(false);
  };

  // Seam: click / drag anywhere on the speaker timeline seeks the real player.
  window.msSeamDown = function (e) {
    const mini = document.getElementById("mini");
    if (!mini || !AU || !AU.dur) return;
    const seek = (clientY) => {
      const r = mini.getBoundingClientRect();
      if (!r.height) return;
      const frac = Math.max(0, Math.min(1, (clientY - r.top) / r.height));
      transportSeek(frac * AU.dur);
    };
    seek(e.clientY);
    const move = (ev) => seek(ev.clientY);
    const up = () => { removeEventListener("pointermove", move); removeEventListener("pointerup", up); };
    addEventListener("pointermove", move);
    addEventListener("pointerup", up);
    e.preventDefault();
  };

  // Floating find bar over the reader (converged's findbar), driving the real
  // trSearch()/#trSearch wiring.
  function msOpenFind(q) {
    const fb = document.getElementById("findbar");
    const inp = document.getElementById("trSearch");
    if (!fb || !inp) return;
    fb.classList.add("open");
    if (q !== undefined) inp.value = q;
    setTimeout(() => { inp.focus(); try { inp.select(); } catch (e) {} }, 30);
  }
  function msCloseFind() {
    const fb = document.getElementById("findbar");
    if (fb) fb.classList.remove("open");
    const inp = document.getElementById("trSearch");
    if (inp) inp.value = "";
    if (typeof trSearch === "function") trSearch("");
  }
  window.msOpenFind = msOpenFind;
  window.msCloseFind = msCloseFind;

  // Phone-width start state: the rail begins as an off-screen drawer.
  if (window.matchMedia("(max-width:640px)").matches) {
    const shellEl = document.getElementById("shell");
    if (shellEl) shellEl.classList.add("rail-off");
  }
  addEventListener("resize", () => { setTimeout(() => { if (typeof drawWave === "function") drawWave(); }, 60); });
})();
</script>
</body>
</html>
