<!DOCTYPE html>
<html lang="en" data-theme="teal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeetingScribe</title>
<!-- Aurora type. Fully progressive: every family below has a system fallback in
     its CSS stack, so the app is unchanged if these never load. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* MeetingScribe — Mac-native pro-tool: SF type, hairline borders, tight density.
   Theme via html[data-theme="teal"|"graphite"|"indigo"|"ember"|"light"].
   Every palette below defines the SAME token set, so no other rule in this file
   ever needs to know which one is active. The JS mirror of this table (THEMES,
   in the state section) only carries the three colours the swatches paint with. */
@property --angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
:root {
  /* Aurora skin: display / body / mono deliberately off the AI-convergent
     Inter/Geist set. Google Fonts, each with a full system fallback so nothing
     changes if the network is down. */
  --font-ui: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", sans-serif;
  --font-display: "Bricolage Grotesque", "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", "Menlo", monospace;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
  --sidebar-w: 264px;
  /* Aurora signature tokens, theme-independent. */
  --aqua: #5eead4; --aqua-2: #7dd3fc; --aqua-ink: #04211c;
  --v-blue: #3b82f6; --v-blue2: #60a5fa; --v-lav: #a5b4fc; --v-vio: #c4b5fd;
  --ease-out: cubic-bezier(0.22,1,0.32,1);
  --ease-in-out: cubic-bezier(0.77,0,0.175,1);
  --ease-drawer: cubic-bezier(0.32,0.72,0,1);
  --ease: cubic-bezier(0.4,0,0.2,1);
  --spring: cubic-bezier(0.34,1.28,0.64,1);
}
/* Teal is the Aurora default: night base, glass panels, hairline borders, and
   the aqua/mint working accent (never AI-textbook purple). */
html[data-theme="teal"] {
  color-scheme: dark;
  --bg: #0a0a12; --bg-sidebar: #0b0b14;
  --panel: rgba(255,255,255,.03); --panel-2: rgba(255,255,255,.055); --panel-3: rgba(255,255,255,.09);
  --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.14);
  --bg-hover: rgba(255,255,255,.045);
  --text: #e7e9f2; --text-dim: rgba(231,233,242,.62); --text-faint: rgba(231,233,242,.40);
  --shadow-pop: 0 18px 48px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  --ok: #2fbf87; --warn: #e0b341; --danger: #f0616a;
  --mark-bg: rgba(94,234,212,.22);
  --accent: #5eead4; --accent-ink: #04211c;
  --spk-a: #c07af6; --spk-b: #2fbf87; --spk-c: #7dd3fc;
  --avatar-ink: #04120f;
}
html[data-theme="graphite"] {
  color-scheme: dark;
  --bg: #0b0d12; --bg-sidebar: #0d0f15;
  --panel: rgba(255,255,255,.035); --panel-2: rgba(255,255,255,.06); --panel-3: rgba(255,255,255,.10);
  --border: rgba(255,255,255,.09); --border-strong: rgba(255,255,255,.15);
  --bg-hover: rgba(255,255,255,.05);
  --text: #eef1f7; --text-dim: rgba(238,241,247,.62); --text-faint: rgba(238,241,247,.40);
  --shadow-pop: 0 18px 48px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  --ok: #2fbf87; --warn: #e0b341; --danger: #f0616a;
  --mark-bg: rgba(125,211,252,.24);
  --accent: #7dd3fc; --accent-ink: #04222e;
  --spk-a: #c07af6; --spk-b: #2fbf87; --spk-c: #5b8cff;
  --avatar-ink: #04120f;
}
html[data-theme="indigo"] {
  color-scheme: dark;
  --bg: #0c0c1a; --bg-sidebar: #0e0e20;
  --panel: rgba(255,255,255,.035); --panel-2: rgba(255,255,255,.06); --panel-3: rgba(255,255,255,.10);
  --border: rgba(255,255,255,.09); --border-strong: rgba(255,255,255,.15);
  --bg-hover: rgba(255,255,255,.05);
  --text: #ecedfa; --text-dim: rgba(236,237,250,.62); --text-faint: rgba(236,237,250,.40);
  --shadow-pop: 0 18px 48px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  --ok: #2fbf87; --warn: #e0b341; --danger: #f0616a;
  --mark-bg: rgba(165,180,252,.26);
  --accent: #a5b4fc; --accent-ink: #0b1030;
  --spk-a: #7dd3fc; --spk-b: #2fbf87; --spk-c: #c07af6;
  --avatar-ink: #0b1030;
}
html[data-theme="ember"] {
  color-scheme: dark;
  --bg: #12100c; --bg-sidebar: #14110d;
  --panel: rgba(255,255,255,.035); --panel-2: rgba(255,255,255,.06); --panel-3: rgba(255,255,255,.10);
  --border: rgba(255,255,255,.09); --border-strong: rgba(255,255,255,.15);
  --bg-hover: rgba(255,255,255,.05);
  --text: #f4f0ea; --text-dim: rgba(244,240,234,.62); --text-faint: rgba(244,240,234,.40);
  --shadow-pop: 0 18px 48px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  --ok: #2fbf87; --warn: #f0b441; --danger: #f0616a;
  --mark-bg: rgba(246,165,79,.26);
  --accent: #f6a54f; --accent-ink: #2a1600;
  --spk-a: #7dd3fc; --spk-b: #2fbf87; --spk-c: #c07af6;
  --avatar-ink: #2a1600;
}
html[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f5f8; --bg-sidebar: #eceef3;
  --panel: rgba(18,20,40,.03); --panel-2: rgba(18,20,40,.05); --panel-3: rgba(18,20,40,.08);
  --border: rgba(18,20,40,.10); --border-strong: rgba(18,20,40,.17);
  --bg-hover: rgba(18,20,40,.05);
  --text: #14161f; --text-dim: rgba(20,22,31,.62); --text-faint: rgba(20,22,31,.42);
  --shadow-pop: 0 18px 48px rgba(20,22,55,.16), 0 0 0 1px rgba(18,20,40,.06);
  --ok: #0f8a5f; --warn: #a3700a; --danger: #d0453c;
  --mark-bg: rgba(13,148,136,.26);
  --accent: #0d9488; --accent-ink: #ffffff;
  --spk-a: #7c3aed; --spk-b: #0d9488; --spk-c: #2563eb;
  --avatar-ink: #ffffff;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font-family: var(--font-ui); font-size: 13px; line-height: 1.45;
  color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
input, select { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.app { display: flex; height: 100vh; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }

/* Sidebar */
.sidebar { width: var(--sidebar-w); flex: none; display: flex; flex-direction: column; background: var(--bg-sidebar); border-right: 1px solid var(--border); }
.sb-head { display: flex; align-items: center; gap: 9px; padding: 16px 16px 10px; }
.sb-logo { width: 26px; height: 26px; border-radius: 7px; flex: none; display: grid; place-items: center; background: linear-gradient(145deg, var(--accent), color-mix(in oklab, var(--accent) 70%, #000)); color: #fff; }
.sb-title { font-size: 13.5px; font-weight: 650; letter-spacing: -0.01em; }
.sb-badge { margin-left: auto; display: flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 550; color: var(--ok); white-space: nowrap; }
.sb-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 6px color-mix(in oklab, var(--ok) 60%, transparent); }
.sb-new { margin: 6px 14px 10px; height: 32px; display: flex; align-items: center; justify-content: center; gap: 7px; border-radius: var(--r-md); background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 12.5px; transition: filter .12s; }
.sb-new:hover { filter: brightness(1.07); }
.sb-new.is-active { outline: 2px solid color-mix(in oklab, var(--accent) 50%, transparent); outline-offset: 2px; }
.sb-search { position: relative; margin: 0 14px 10px; }
.sb-search input { width: 100%; height: 28px; padding: 0 9px 0 28px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--panel); color: var(--text); outline: none; font-size: 12px; }
.sb-search input:focus { border-color: color-mix(in oklab, var(--accent) 55%, transparent); }
.sb-search input::placeholder { color: var(--text-faint); }
.sb-search svg { position: absolute; left: 8px; top: 7px; color: var(--text-faint); }
.sb-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
.sb-more { display: block; width: 100%; text-align: center; padding: 9px 8px; margin-top: 6px;
  border-radius: var(--r-md); font-size: 12px; color: var(--text-dim);
  border: 1px dashed var(--border); transition: background .1s; }
.sb-more:hover { background: var(--bg-hover); color: var(--text); }
.sb-account { display: flex; align-items: center; gap: 7px; width: 100%; padding: 6px 8px;
  border-radius: var(--r-md); font-size: 11.5px; color: var(--text-dim); }
.sb-account .val { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-account.as-btn:hover { background: var(--bg-hover); color: var(--text); }
.sb-syncall { display: flex; align-items: center; justify-content: center; gap: 7px; width: calc(100% - 16px); margin: 2px 8px 4px; padding: 7px 8px; font-size: 11.5px; font-weight: 600; color: var(--accent); border: 1px solid color-mix(in oklab, var(--accent) 35%, var(--border)); border-radius: var(--r-md); background: color-mix(in oklab, var(--accent) 8%, transparent); }
.sb-syncall:hover { background: color-mix(in oklab, var(--accent) 16%, transparent); }
.sb-syncall:disabled { opacity: .7; }
.sb-syncall .spinner { border-top-color: var(--accent); }
.sb-signout { font-size: 11px; color: var(--text-faint); }
.sb-signout:hover { color: var(--danger); }
.btn.sync-on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.am-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid;
  place-items: center; z-index: 90; }
.am-card { width: 340px; background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: 0 18px 50px rgba(0,0,0,.35); }
.am-head { display: flex; align-items: center; justify-content: space-between; }
.am-title { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; }
.am-x { color: var(--text-faint); padding: 2px 6px; border-radius: 6px; }
.am-x:hover { background: var(--bg-hover); color: var(--text); }
.am-sub { font-size: 12px; color: var(--text-dim); line-height: 1.5; margin: 0; }
.am-card input { height: 34px; padding: 0 10px; border-radius: var(--r-md);
  border: 1px solid var(--border); background: var(--panel-2); font-size: 13px; outline: none; }
.am-card input:focus { border-color: var(--accent); }
.am-card .btn { justify-content: center; height: 34px; }
.am-google { font-weight: 650; }
.am-sep { display: flex; align-items: center; gap: 8px; color: var(--text-faint); font-size: 11px; }
.am-sep::before, .am-sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.am-note { font-size: 12px; color: var(--text-dim); text-align: center; margin: 0; }
.am-note a { color: var(--accent); text-decoration: none; }
.sb-group { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-faint); padding: 12px 8px 5px; }
.sb-item { display: block; width: 100%; text-align: left; padding: 7px 8px; border-radius: var(--r-md); transition: background .1s; }
.sb-item:hover { background: color-mix(in oklab, var(--text) 6%, transparent); }
.sb-item.is-active { background: color-mix(in oklab, var(--accent) 16%, transparent); }
.sb-item-title { font-size: 12.5px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-item.is-active .sb-item-title { color: color-mix(in oklab, var(--accent) 60%, var(--text)); }
.sb-item-meta { display: flex; align-items: center; gap: 6px; margin-top: 1px; font-size: 11px; color: var(--text-faint); }
.sb-item-meta .sep { opacity: .6; }
.sb-item-meta .st { display: inline-flex; align-items: center; gap: 4px; }
.sb-item-meta .st .dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
.sb-item-meta .st.processing { color: var(--warn); } .sb-item-meta .st.processing .dot { background: var(--warn); }
.sb-item-meta .st.error { color: var(--danger); } .sb-item-meta .st.error .dot { background: var(--danger); }
.sb-item-meta .st.recording { color: var(--danger); } .sb-item-meta .st.recording .dot { background: var(--danger); animation: ms-blink 1.4s ease-in-out infinite; }
.sb-foot { border-top: 1px solid var(--border); padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 7px; }
.sb-dev { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-dim); min-width: 0; }
.sb-dev .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
.sb-dev .dot.warn { background: var(--warn); } .sb-dev .dot.err { background: var(--danger); }
/* "we could not check" — neither a claim of health nor an alarm. */
.sb-dev .dot.idle { background: var(--text-faint); }
/* "silent": the Mac's own output is the loopback, so the user hears nothing.
   Deliberately louder than .err — a blinking red dot, same language as "recording". */
.sb-dev .dot.silent { background: var(--danger); animation: ms-blink 1.4s ease-in-out infinite; }
.sb-dev .lbl { color: var(--text-faint); flex: none; }
.sb-dev .val { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-alert { display: flex; align-items: flex-start; gap: 6px; font-size: 11px; line-height: 1.4; font-weight: 600; color: var(--danger); }
.sb-alert .ic { flex: none; padding-top: 1px; }
.sb-foot-row { display: flex; align-items: center; justify-content: space-between; margin-top: 3px; }
/* Appearance picker. The swatches paint each palette's OWN colours, so their
   inline styles come from the JS THEMES table — var(--accent) here would just
   repeat the active theme five times. Only the ring is var-driven. */
.sb-appearance { border-top: 1px solid var(--border); margin-top: 3px; padding-top: 9px; }
.sb-appear-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sb-appear-label { font-size: 11.5px; color: var(--text-dim); }
.sb-swatches { display: flex; align-items: center; gap: 5px; }
.sb-sw { width: 20px; height: 20px; border-radius: 50%; flex: none; display: grid; place-items: center;
  border: 1.5px solid transparent; transition: transform .12s; }
.sb-sw:hover { transform: scale(1.12); }
.sb-sw.on { border-color: var(--accent); }
.sb-sw i { display: block; width: 14px; height: 14px; border-radius: 50%; }
.sb-appear-name { margin-top: 4px; text-align: right; font-size: 10.5px; color: var(--text-faint); }
.sb-quit { font-size: 11px; color: var(--text-faint); }
.sb-quit:hover { color: var(--text-dim); }

/* Review header */
.rv-head { padding: 22px 28px 0; }
.rv-title-row { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.rv-title { font-size: 24px; font-weight: 700; letter-spacing: -0.024em; line-height: 1.22; margin: 0; min-width: 240px; flex: 1; border-radius: var(--r-sm); outline: none; }
.rv-title[contenteditable]:focus { box-shadow: 0 0 0 2px color-mix(in oklab, var(--accent) 45%, transparent); }
/* Five buttons: they wrap onto a second row rather than widening the header
   past the pane (the title row already wraps, but the action group itself was
   flex:none and pushed the whole main column sideways below ~800px). */
.rv-actions { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end;
  gap: 8px; flex: 0 1 auto; min-width: 0; padding-top: 1px; }
.rv-meta { display: flex; align-items: center; gap: 7px; margin-top: 5px; font-size: 12px; color: var(--text-dim); flex-wrap: wrap; }
.rv-meta .sep { color: var(--text-faint); }
.rv-meta .chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--border); background: var(--panel); font-size: 11px; color: var(--text-dim); }
.rv-notes { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
.note { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); }
.note .ic { flex: none; display: grid; place-items: center; }
.note.warn .ic { color: var(--warn); }
.note.err .ic { color: var(--danger); }
.note.tidy .ic { color: var(--accent); }
.note .dismiss { color: var(--text-faint); margin-left: 2px; padding: 2px; border-radius: 4px; }
.note .dismiss:hover { color: var(--text); background: var(--panel-2); }

/* Buttons + menus */
.btn { height: 30px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; border-radius: var(--r-md); font-size: 12.5px; font-weight: 550; border: 1px solid var(--border); background: var(--panel); color: var(--text); transition: background .1s, filter .1s; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); background: var(--accent); }
.btn.icon { width: 30px; padding: 0; justify-content: center; color: var(--text-dim); }
.btn.icon:hover { color: var(--text); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .55; cursor: default; }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; min-width: 196px; padding: 5px; background: var(--panel); border-radius: var(--r-lg); box-shadow: var(--shadow-pop); }
.menu-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 9px; border-radius: var(--r-sm); font-size: 12.5px; text-align: left; color: var(--text); }
.menu-item svg { color: var(--text-dim); flex: none; }
.menu-item:hover { background: color-mix(in oklab, var(--accent) 14%, transparent); }
.menu-item.danger, .menu-item.danger svg { color: var(--danger); }
.menu-item.danger:hover { background: color-mix(in oklab, var(--danger) 12%, transparent); }
.menu-item:disabled { opacity: .45; }
.menu-sep { height: 1px; background: var(--border); margin: 5px 4px; }
.menu-note { font-size: 11px; color: var(--text-faint); padding: 5px 9px 4px; }

/* Speaker strip */
.spk-strip { margin: 16px 28px 0; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--panel); }
.spk-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 0; padding: 10px 10px 10px 12px; }
.spk-chip { display: flex; align-items: center; gap: 9px; padding: 4px 14px 4px 6px; border-radius: var(--r-md); flex: none; }
.spk-chip + .spk-chip { border-left: 1px solid var(--border); padding-left: 16px; margin-left: 4px; }
.spk-avatar { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--avatar-ink); }
.spk-info { min-width: 0; }
.spk-name { font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
.spk-name button { color: var(--text-faint); opacity: 0; transition: opacity .1s; display: grid; place-items: center; }
.spk-chip:hover .spk-name button { opacity: 1; }
.spk-name button:hover { color: var(--text); }
.spk-name input { width: 90px; height: 20px; font-size: 12px; border: 1px solid var(--border-strong); border-radius: 5px; background: var(--panel-2); outline: none; padding: 0 5px; }
.spk-sub { font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 7px; margin-top: 1px; }
.spk-bar { width: 64px; height: 3px; border-radius: 2px; background: color-mix(in oklab, var(--text) 10%, transparent); overflow: hidden; flex: none; }
.spk-bar i { display: block; height: 100%; border-radius: 2px; }
.spk-tools { margin-left: auto; display: flex; align-items: center; gap: 14px; padding-left: 18px; flex: none; }
.spk-count { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--text-dim); }
.spk-count select { height: 24px; padding: 0 4px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--panel-2); font-size: 11.5px; outline: none; }
.spk-flash { color: var(--ok); font-size: 11px; font-weight: 550; }
/* Shown only under the mic-only fallback: explains why no chip says "You". */
.spk-note { display: flex; align-items: flex-start; gap: 7px; padding: 9px 12px; border-top: 1px solid var(--border); font-size: 11.5px; line-height: 1.45; color: var(--text-dim); }
.spk-note .ic { flex: none; color: var(--warn); display: grid; place-items: center; padding-top: 1px; }
.spk-count select:disabled { opacity: .5; cursor: not-allowed; }
.spk-toggle { display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 550; color: var(--text-dim); padding: 4px 8px; border-radius: var(--r-sm); }
.spk-toggle:hover { color: var(--text); background: var(--panel-2); }
.spk-toggle svg { transition: transform .15s; }
.spk-toggle.open svg { transform: rotate(180deg); }
.spk-stats { border-top: 1px solid var(--border); padding: 4px 16px 12px; overflow-x: auto; }
.spk-stats table { border-collapse: collapse; width: 100%; font-size: 12px; }
.spk-stats th { text-align: left; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); padding: 9px 18px 4px 0; }
.spk-stats td { padding: 3px 18px 3px 0; color: var(--text-dim); white-space: nowrap; }
.spk-stats td.who { color: var(--text); font-weight: 600; }
.spk-stats td .num { color: var(--text); }

/* Summary panel */
/* Meeting view: tabs + Overview (brief hero, actions, decisions, aside) */
/* The row wraps: below the width where the tabs and the privacy claim can share
   a line the claim drops to its own line rather than either overflowing the
   pane or being hidden. */
.rv-tabs { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; row-gap: 10px;
  padding: 14px 28px 12px; margin-top: 2px; border-bottom: 1px solid var(--border); }
/* Segmented control: four buttons over one sliding pill. The pill is positioned,
   not animated per-button, so the slide is a single transform. Slots are 104px
   wide wherever there is room and shrink evenly when there is not — four fixed
   104px slots plus the row padding no longer fit the main pane below ~745px
   window width, and used to push the whole header sideways. Because the slot
   width is no longer a constant, slideTabPill() measures the real buttons
   instead of multiplying an index by 104. margin-right:auto keeps the privacy
   claim hard right while the two share a line, and leaves it flush left once it
   wraps (an auto margin absorbs only positive free space, so it never blocks
   the shrink). */
.rv-seg { position: relative; display: flex; padding: 2px; border-radius: 9px;
  flex: 0 1 auto; min-width: 0; max-width: 100%; margin-right: auto;
  background: color-mix(in oklab, var(--text) 6%, transparent); }
.rv-seg-pill { position: absolute; top: 2px; left: 2px; width: 104px; height: 28px; border-radius: 7px;
  background: var(--panel-3); box-shadow: 0 1px 2px rgba(0,0,0,.4);
  transition: transform .24s cubic-bezier(.32,.72,0,1); }
/* width (not flex-basis) is what makes the control ASK for 4x104px: a flex item
   sized only by its basis contributes its text width to the container's
   intrinsic size, which would let the strip collapse to the labels even when
   there is room. flex-shrink 1 + min-width 0 is what lets it give that up. */
.rv-tab { position: relative; z-index: 1; width: 104px; flex: 0 1 auto; min-width: 0;
  height: 28px; display: inline-flex; align-items: center; overflow: hidden;
  justify-content: center; font-size: 12.5px; font-weight: 600; color: var(--text-dim); transition: color .16s; }
.rv-tab:hover { color: var(--text); }
.rv-tab.on { color: var(--text); }

/* Privacy claim lives in the tab row — the first thing read on every meeting.
   It is never hidden: this is the product's central promise, so at every width
   at least the headline sentence is on screen (the row wraps it onto its own
   line, and below 1180px the second sentence drops to the tooltip). */
.privacy-pill { display: inline-flex; align-items: center; gap: 7px; flex: none; max-width: 100%;
  padding: 4px 11px 4px 9px; border-radius: 99px; font-size: 11.5px; line-height: 1.3;
  color: color-mix(in oklab, var(--ok) 80%, var(--text));
  background: color-mix(in oklab, var(--ok) 11%, transparent);
  border: 1px solid color-mix(in oklab, var(--ok) 26%, transparent); }
.privacy-pill svg { flex: none; color: var(--ok); }
.privacy-pill b { color: color-mix(in oklab, var(--ok) 92%, var(--text)); font-weight: 650; }
/* Below ~1180px the tabs and the pill stop fitting on one line together: drop
   the second sentence first, and only then let the pill wrap (.rv-tabs above).
   It is never display:none — a narrow window must still state the promise. */
@media (max-width: 1180px) { .privacy-pill .pp-more { display: none; } }

.ov-scroll { flex: 1; overflow-y: auto; }
.ov-grid { display: grid; grid-template-columns: minmax(0,1fr) 316px; gap: 22px; width: min(1160px, 100%); margin: 0 auto; padding: 22px 28px 40px; }
@media (max-width: 1040px) { .ov-grid { grid-template-columns: 1fr; } }
.ov-main { min-width: 0; }
.ov-pad { padding: 22px 28px 40px; max-width: 1000px; }
.section-kicker { display: inline-flex; align-items: center; gap: 7px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }

.brief { position: relative; overflow: hidden; padding: 24px 26px 22px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg); }
.brief::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 3px; background: var(--accent); }
.brief-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brief-depth { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .05em; }
.brief h2 { margin: 14px 0 9px; font-size: clamp(23px, 2.5vw, 30px); font-weight: 720; line-height: 1.14; letter-spacing: -0.03em; color: var(--text); max-width: 660px; }
.brief h2.brief-lead { font-size: clamp(18px, 1.7vw, 21px); font-weight: 640; line-height: 1.4; letter-spacing: -0.015em; max-width: 700px; }
.brief > p { margin: 0; max-width: 660px; font-size: 13px; line-height: 1.65; color: var(--text-dim); }
.brief-signals { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 1px; margin-top: 20px; overflow: hidden; background: var(--border); border: 1px solid var(--border); border-radius: 10px; }
.brief-signals article { padding: 12px 14px; background: var(--panel-2); }
.brief-signals span { display: block; margin-bottom: 5px; font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--text-faint); }
.brief-signals strong { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
.brief-load { display: flex; align-items: center; gap: 9px; margin-top: 14px; font-size: 13px; color: var(--text-dim); }
.brief-cta { display: flex; align-items: center; gap: 16px; }
.brief-cta::before { background: var(--accent); }
.brief-cta-ic { flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in oklab, var(--accent) 16%, transparent); }
.brief-cta-ic svg { color: var(--accent); }
.brief-cta-text { flex: 1; min-width: 0; }
.brief-cta-text h2 { margin: 0 0 4px; font-size: 16px; font-weight: 680; letter-spacing: -0.01em; }
.brief-cta-text p { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--text-dim); }

.ov-section { margin-top: 18px; }
/* The notes rescued onto a failed meeting's card: its own block under the
   Reprocess button, separated so it reads as the user's, not the error's. */
.ov-section.is-standalone { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--border); text-align: left; }
.section-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 11px; }
.section-heading h3 { margin: 4px 0 0; font-size: 16px; font-weight: 680; letter-spacing: -0.01em; }
.section-heading.compact h3 { font-size: 14px; }
.action-list { display: flex; flex-direction: column; gap: 7px; }
.action-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-md); }
.person-badge { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--avatar-ink); background: var(--spk-a); }
.person-badge.me { background: var(--accent); color: var(--accent-ink); }
.action-task { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.action-task b { font-size: 13px; font-weight: 550; color: var(--text); }
.action-task small { font-size: 11px; color: var(--text-faint); }
.due-chip { flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; font-size: 11px; color: var(--text-dim); background: var(--panel-2); border: 1px solid var(--border); border-radius: 99px; }

/* Notes typed on the floating panel during the meeting, each seekable. The
   accent rule is the same one the transcript's .tr-note carries, so the two
   places a note appears are recognisably the same object. */
.note-lede { margin: -3px 0 10px; font-size: 12px; line-height: 1.5; color: var(--text-dim); }
.note-list { display: flex; flex-direction: column; gap: 7px; }
.note-row { display: flex; align-items: flex-start; gap: 12px; padding: 11px 14px; background: var(--panel); border: 1px solid var(--border); border-left: 2px solid var(--accent); border-radius: var(--r-md); }
.note-time { flex: none; min-width: 52px; padding: 2px 8px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--text-dim); background: var(--panel-2); border: 1px solid var(--border); border-radius: 99px; text-align: center; }
button.note-time:hover { color: var(--accent-ink); background: var(--accent); border-color: transparent; }
/* "we do not know when" — an absence, not a time. Hollow and dashed so it can
   never be mistaken for the solid 0:00 pill of a note typed at the very start. */
.note-time.is-untimed { color: var(--text-faint); background: transparent; border-style: dashed; font-weight: 500; letter-spacing: .04em; }
.note-body { flex: 1; min-width: 0; font-size: 13px; line-height: 1.6; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
.note-jump { flex: none; display: inline-flex; align-items: center; gap: 5px; margin-top: 1px; padding: 2px 8px;
  font-size: 11px; color: var(--text-faint); border: 1px solid transparent; border-radius: 99px; }
.note-jump:hover { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 35%, transparent);
  background: color-mix(in oklab, var(--accent) 10%, transparent); }
@media (max-width: 620px) { .note-jump span { display: none; } }
/* Cue checklist in the right rail. */
.cue-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.cue-list li { display: flex; align-items: flex-start; gap: 9px; font-size: 12.5px; line-height: 1.5; color: var(--text-dim); overflow-wrap: anywhere; }
.cue-mark { flex: none; width: 18px; height: 18px; margin-top: 1px; border-radius: 6px; display: grid; place-items: center; color: var(--ok); background: color-mix(in oklab, var(--ok) 15%, transparent); }
.cue-list li.missed { color: var(--text); }
.cue-list li.missed .cue-mark { color: var(--warn); background: color-mix(in oklab, var(--warn) 16%, transparent); }
.cue-note { margin: 11px 0 0; font-size: 11px; line-height: 1.5; color: var(--text-faint); }
.miss-label { color: var(--warn); background: color-mix(in oklab, var(--warn) 15%, transparent); border-radius: 99px; padding: 1px 8px; letter-spacing: .04em; }
.ov-two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
@media (max-width: 720px) { .ov-two { grid-template-columns: 1fr; } }
.ov-card { padding: 16px 17px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg); }
.count-badge { font-size: 11px; font-weight: 650; color: var(--text-dim); background: var(--panel-2); border: 1px solid var(--border); border-radius: 99px; padding: 1px 9px; }
.decision-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.decision-list li { display: flex; gap: 9px; font-size: 12.5px; line-height: 1.5; color: var(--text); }
.decision-mark { flex: none; width: 18px; height: 18px; margin-top: 1px; border-radius: 6px; display: grid; place-items: center; color: var(--ok); background: color-mix(in oklab, var(--ok) 15%, transparent); }
.q-list { margin: 0; padding-left: 17px; display: flex; flex-direction: column; gap: 6px; }
.q-list li { font-size: 12.5px; line-height: 1.55; color: var(--text-dim); }

.ov-aside { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.aside-card { padding: 15px 16px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg); }
.aside-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); }
.ready-label { color: var(--ok); background: color-mix(in oklab, var(--ok) 14%, transparent); border-radius: 99px; padding: 1px 8px; letter-spacing: .04em; }
.balance-bar { display: flex; height: 7px; border-radius: 99px; overflow: hidden; margin-bottom: 12px; background: var(--panel-2); }
.balance-bar span { display: block; }
.cv-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
.cv-name { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.cv-name b { font-size: 12.5px; font-weight: 600; }
.cv-name small { font-size: 11px; color: var(--text-faint); }
.cv-pct { font-size: 12px; color: var(--text-dim); }
.email-preview { padding: 11px 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--r-md); margin-bottom: 11px; }
.email-preview b { display: block; font-size: 12.5px; margin-bottom: 5px; }
.email-preview p { margin: 0; font-size: 12px; line-height: 1.55; color: var(--text-dim); display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.quiet-btn { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; height: 34px; font-size: 12.5px; font-weight: 600; color: var(--text); background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--r-md); }
.quiet-btn:hover { background: var(--panel-3); }

/* Transcript */
.tr-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 14px; }
.tr-toolbar { display: flex; align-items: center; gap: 10px; padding: 0 28px 10px; }
.tr-label { font-size: 10.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint); }
.tr-search { position: relative; margin-left: auto; }
.tr-search input { width: 200px; height: 26px; padding: 0 8px 0 26px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--panel); outline: none; font-size: 12px; transition: width .15s; }
.tr-search input:focus { border-color: color-mix(in oklab, var(--accent) 55%, transparent); width: 250px; }
.tr-search svg { position: absolute; left: 7px; top: 6px; color: var(--text-faint); }
.tr-count { font-size: 11px; color: var(--text-faint); }
.tr-size { display: flex; align-items: center; border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; flex: none; }
.tr-size button { width: 26px; height: 26px; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--text-dim); background: var(--panel); }
.tr-size button:hover { background: var(--panel-2); color: var(--text); }
.tr-size button:disabled { opacity: .4; cursor: default; background: var(--panel); }
.tr-size button + button { border-left: 1px solid var(--border); }
.tr-scroll { flex: 1; overflow-y: auto; padding: 2px 28px 28px; }
.tr-inner { max-width: 780px; }
/* One grid per speaker turn: avatar column spanning both rows, name + timestamp
   on the first, the words on the second. No rules between groups — the avatar
   already carries the rhythm; hover is the only chrome. */
.tr-group { display: grid; grid-template-columns: 30px 1fr; gap: 0 14px; padding: 11px 12px 13px;
  border-radius: 12px; background: transparent; transition: background .1s; }
.tr-group:hover { background: var(--bg-hover); }
.tr-ava { grid-row: span 2; padding-top: 2px; }
.tr-ava i { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  font-size: 10.5px; font-weight: 700; font-style: normal; color: var(--avatar-ink); }
.tr-head { display: flex; align-items: baseline; gap: 9px; margin-bottom: 4px; min-width: 0; }
.tr-time { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); border-radius: 4px; flex: none; }
button.tr-time:hover { color: var(--accent); }
.tr-spk { font-size: 13px; font-weight: 650; letter-spacing: -0.005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-text { font-size: 14.5px; line-height: 1.68; color: var(--text); text-wrap: pretty; min-width: 0; }
.tr-text p { margin: 0 0 6px; }
.tr-text p:last-child { margin-bottom: 0; }
.tr-text mark { background: var(--mark-bg); color: inherit; border-radius: 3px; padding: 0 1px; }
.tr-empty { padding: 40px 0; color: var(--text-faint); font-size: 13px; text-align: center; }

/* A note the user typed during the meeting, standing in the transcript at the
   moment they wrote it. Everything here is chosen so it can never be misread as
   something somebody SAID: the avatar gutter is left empty (nobody spoke), the
   accent rule and tint are the app's "this is yours" colour rather than any
   speaker colour, and the label says so in words. It is indented to 56px so its
   text lines up exactly with the speaker text above and below — a margin note on
   the transcript, in the transcript's own column. */
.tr-note { margin: 7px 0 9px 41px; padding: 9px 13px 11px; border-radius: var(--r-md);
  border: 1px solid color-mix(in oklab, var(--accent) 24%, var(--border));
  border-left: 2px solid var(--accent);
  background: color-mix(in oklab, var(--accent) 8%, transparent); }
/* The note is a disclosure: a <details> whose <summary> is the head row, always
   visible, and whose body is collapsed by default. The chevron rotates and the
   body fades in — transform/opacity only, matching the app's motion (see the
   pre-meeting cues chevron). The reveal is a one-shot class added on a genuine
   user open, so a background re-render of an already-open note never replays it,
   and the native <details> keeps working (toggle + chevron) with no JS at all. */
.tr-note-head { display: flex; align-items: center; gap: 10px; cursor: pointer; list-style: none;
  -webkit-user-select: none; user-select: none; }
.tr-note-head::-webkit-details-marker { display: none; }
.tr-note-head:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: var(--r-sm); }
.tr-note-kicker { display: inline-flex; align-items: center; gap: 6px; flex: 1; min-width: 0;
  font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.tr-note-time { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); border-radius: 4px; flex: none; }
button.tr-note-time:hover { color: var(--accent); }
.tr-note-chev { flex: none; display: grid; place-items: center; color: var(--text-faint); transition: transform .18s ease-out; }
.tr-note[open] .tr-note-chev { transform: rotate(180deg); }
/* Shares .tr-text (colour, leading, <mark>, and the A−/A+ reading size), adds
   only what a typed note needs: its own line breaks kept, no run of characters
   allowed to push the transcript sideways, and a little air below the head. */
.tr-note-body { margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
.tr-note-body.is-revealing { animation: ms-note-open .2s ease-out; }
@keyframes ms-note-open { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .tr-note-chev { transition: none; }
  .tr-note-body.is-revealing { animation: none; }
}
/* Arriving from the Overview's "In transcript": a ring that fades once, so the
   eye lands on the right note without leaving the transcript decorated. */
.tr-note.is-target { animation: ms-note-flash 1.8s ease-out 1; }
@keyframes ms-note-flash {
  0%, 45% { box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 45%, transparent); }
  100% { box-shadow: 0 0 0 3px transparent; }
}

/* Ask tab — a chat over the transcript. Answers cite real turn timestamps, and
   every citation chip is a seek button into the recording. */
.ask-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.ask-privacy { display: flex; align-items: center; gap: 8px; margin: 14px 28px 0; padding: 7px 12px;
  border-radius: var(--r-md); font-size: 11.5px; line-height: 1.4; color: var(--text-dim);
  background: var(--panel); border: 1px solid var(--border); }
.ask-privacy svg { flex: none; color: var(--ok); }
.ask-privacy b { color: var(--text); font-weight: 600; }
.ask-scroll { flex: 1; overflow-y: auto; padding: 16px 28px 6px; }
.ask-inner { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.ask-msg { display: flex; flex-direction: column; gap: 7px; }
.ask-msg.user { align-items: flex-end; }
.ask-msg.assistant { align-items: flex-start; }
.ask-bubble { padding: 10px 14px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.ask-msg.user .ask-bubble { max-width: 66%; background: var(--accent); color: var(--accent-ink); border-radius: 17px 17px 5px 17px; }
.ask-msg.assistant .ask-bubble { max-width: 76%; background: var(--panel); border: 1px solid var(--border); border-radius: 17px 17px 17px 5px; }
.ask-bubble.is-pending { display: inline-flex; align-items: center; gap: 9px; color: var(--text-dim); }
/* The same bubble the spinner sits in becomes the answer as it is written, so
   the first token replaces the wait in place instead of swapping one element
   for another (which reads as a flicker and costs a full re-render). Streaming
   only ever ADDS .is-streaming; nothing here changes a settled answer. */
.ask-bubble.is-pending .ask-stream { display: none; }
.ask-bubble.is-streaming { display: block; color: var(--text); }
.ask-bubble.is-streaming .spinner, .ask-bubble.is-streaming .ask-wait { display: none; }
.ask-bubble.is-streaming .ask-stream { display: inline; }
/* A caret on the last line says "still writing" without moving the text. */
.ask-bubble.is-streaming .ask-stream::after {
  content: ""; display: inline-block; width: 2px; height: 1em; margin-left: 2px;
  vertical-align: -2px; background: var(--accent); animation: ms-caret 1.1s steps(1) infinite;
}
@keyframes ms-caret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
.ask-cites { display: flex; flex-wrap: wrap; gap: 6px; max-width: 76%; }
.ask-cite { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; padding: 4px 10px 4px 9px;
  border-radius: 99px; border: 1px solid var(--border); background: var(--panel-2); font-size: 11.5px; color: var(--text-dim); }
.ask-cite:hover { color: var(--text); border-color: color-mix(in oklab, var(--accent) 55%, transparent); }
.ask-cite .t { font-family: var(--font-mono); color: var(--accent); flex: none; }
.ask-cite .q { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ask-start { padding: 6px 0 2px; }
.ask-start h3 { margin: 0 0 5px; font-size: 16px; font-weight: 680; letter-spacing: -0.01em; }
.ask-start p { margin: 0 0 14px; font-size: 12.5px; line-height: 1.55; color: var(--text-dim); max-width: 520px; }
.ask-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.ask-chip { padding: 6px 12px; border-radius: 99px; border: 1px solid var(--border); background: var(--panel);
  font-size: 12.5px; color: var(--text-dim); }
.ask-chip:hover { color: var(--text); border-color: var(--border-strong); background: var(--panel-2); }
.ask-foot { flex: none; padding: 8px 28px 18px; }
.ask-composer { display: flex; align-items: flex-end; gap: 8px; max-width: 780px; margin: 0 auto;
  padding: 6px 6px 6px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--border-strong); }
.ask-composer:focus-within { border-color: color-mix(in oklab, var(--accent) 55%, transparent); }
.ask-composer textarea { flex: 1; min-width: 0; padding: 7px 0; border: none; outline: none; background: transparent;
  resize: none; font-family: var(--font-ui); font-size: 14px; line-height: 1.5; color: var(--text); max-height: 132px; }
.ask-composer textarea::placeholder { color: var(--text-faint); }
.ask-send { width: 32px; height: 32px; flex: none; border-radius: 10px; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink); }
.ask-send:hover { filter: brightness(1.07); }
.ask-send:disabled { opacity: .5; cursor: default; }
.ask-hint { max-width: 780px; margin: 7px auto 0; font-size: 11px; color: var(--text-faint); text-align: center; }
.aside-p { margin: 0 0 12px; font-size: 12.5px; line-height: 1.5; color: var(--text-dim); }
.aside-btn { width: 100%; justify-content: center; height: 34px; }

/* Transport bar */
.transport { flex: none; display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 20px; border-top: 1px solid var(--border); background: var(--panel); }
.tp-play { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
.tp-play:hover { filter: brightness(1.07); }
.tp-time { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-dim); flex: none; min-width: 86px; }
.tp-time b { color: var(--text); font-weight: 600; }
.tp-wave { flex: 1; height: 36px; position: relative; cursor: pointer; display: flex; align-items: center; }
.tp-wave canvas { width: 100%; height: 100%; display: block; }
.tp-track { display: flex; border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; flex: none; }
.tp-track button { padding: 5px 11px; font-size: 11.5px; font-weight: 550; color: var(--text-dim); background: var(--panel); }
.tp-track button + button { border-left: 1px solid var(--border); }
.tp-track button.on { background: color-mix(in oklab, var(--accent) 18%, transparent); color: var(--text); }

/* Recorder */
.rec-stage { flex: 1; display: grid; place-items: center; padding: 32px; overflow-y: auto; }
/* Centring is right for a card on its own. With the rescued notes under it this
   is a document, not a dialog: it can be many screens long, and it should start
   at the top and scroll from there rather than sit centred on the one screen it
   happens to fit on. (Measured: the stage scrolls either way — this is about
   where the reading starts, not about clipping.) */
.rec-stage.has-notes { place-items: start center; }
.rec-card { width: 460px; max-width: 100%; }
/* The stage's single auto track is sized by the card's 460px max-content, so
   `max-width: 100%` has nothing left to clamp against and the 32px padding
   pushes the whole card off the pane once the window is narrow. Below that,
   hand the width back to the container. */
@media (max-width: 900px) { .rec-stage { padding: 24px 14px; } .rec-card { width: 100%; } }
.rec-kicker { font-size: 10.5px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 6px; }
.rec-h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 22px; }
.field { margin-bottom: 18px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; }
.field input[type="text"] { width: 100%; height: 34px; padding: 0 11px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--panel); outline: none; font-size: 13px; }
.field input[type="text"]:focus { border-color: color-mix(in oklab, var(--accent) 55%, transparent); }
.field input::placeholder { color: var(--text-faint); }
.field .hint { font-size: 11.5px; color: var(--text-faint); margin-top: 6px; line-height: 1.5; }
.cal-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.cal-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--border); background: var(--panel); font-size: 11.5px; color: var(--text-dim); }
.cal-chip:hover { border-color: color-mix(in oklab, var(--accent) 55%, transparent); color: var(--text); }
.cal-chip .when { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); }
.seg { display: flex; border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
.seg button { flex: 1; padding: 7px 0; font-size: 12.5px; font-weight: 550; color: var(--text-dim); display: flex; align-items: center; justify-content: center; gap: 7px; background: var(--panel); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: color-mix(in oklab, var(--accent) 18%, transparent); color: var(--text); }
.rec-devices { border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--panel); padding: 4px 0; }
.rec-dev { display: flex; align-items: center; gap: 10px; padding: 9px 13px; }
.rec-dev + .rec-dev { border-top: 1px solid var(--border); }
.rec-dev .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.rec-dev .dot.warn { background: var(--warn); } .rec-dev .dot.err { background: var(--danger); }
.rec-dev .dot.idle { background: var(--text-faint); }
.rec-dev .dot.silent { background: var(--danger); animation: ms-blink 1.4s ease-in-out infinite; }
.rec-dev .role.silent { color: var(--danger); font-weight: 650; }
/* Routing banner on the setup card. Red by default (the "silent" case: the user
   is about to run a meeting hearing nothing); .warn tones it down for "not_routed". */
.rec-alert { display: flex; align-items: flex-start; gap: 9px; margin-top: 10px; padding: 10px 12px; border-radius: var(--r-md);
  border: 1px solid color-mix(in oklab, var(--danger) 55%, transparent); background: color-mix(in oklab, var(--danger) 12%, transparent); }
.rec-alert .ic { flex: none; color: var(--danger); display: grid; place-items: center; padding-top: 1px; }
.rec-alert b { display: block; font-size: 12.5px; font-weight: 700; color: var(--danger); margin-bottom: 2px; }
.rec-alert span { font-size: 11.5px; line-height: 1.45; color: var(--text-dim); }
.rec-alert.warn { border-color: color-mix(in oklab, var(--warn) 55%, transparent); background: color-mix(in oklab, var(--warn) 12%, transparent); }
.rec-alert.warn .ic, .rec-alert.warn b { color: var(--warn); }
.rec-dev .name { font-size: 12.5px; font-weight: 550; }
.rec-dev .role { font-size: 11px; color: var(--text-faint); margin-left: auto; text-align: right; }
/* Pre-meeting cues. Collapsed to a single row by default: someone who just
   wants to hit record must never have to scroll past an open textarea. */
.cues-toggle { display: flex; align-items: center; gap: 9px; width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--panel); font-size: 12.5px; font-weight: 550; color: var(--text-dim); text-align: left; }
.cues-toggle:hover { color: var(--text); border-color: var(--border-strong); }
.cues-toggle .cues-ic { flex: none; display: grid; place-items: center; color: var(--text-faint); }
.cues-toggle.on .cues-ic, .cues-toggle.on { color: var(--text); }
.cues-toggle .cues-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cues-toggle .cues-count { flex: none; font-family: var(--font-mono); font-size: 10.5px; font-weight: 650; color: var(--accent); background: color-mix(in oklab, var(--accent) 14%, transparent); border-radius: 99px; padding: 1px 8px; }
.cues-toggle .cues-chev { flex: none; display: grid; place-items: center; color: var(--text-faint); transition: transform .15s; }
.cues-toggle.on .cues-chev { transform: rotate(180deg); }
.cues-body { margin-top: 8px; }
.cues-body textarea { display: block; width: 100%; min-height: 96px; max-height: 220px; padding: 10px 11px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--panel); color: var(--text); outline: none; font-family: var(--font-ui); font-size: 12.5px; line-height: 1.65; resize: vertical; }
.cues-body textarea:focus { border-color: color-mix(in oklab, var(--accent) 55%, transparent); }
.cues-body textarea::placeholder { color: var(--text-faint); }
.cues-foot { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.cues-foot .hint { flex: 1; min-width: 0; margin-top: 0; }
.cues-state { flex: none; font-size: 11px; color: var(--text-faint); }
.cues-state.ok { color: var(--ok); }
.cues-state.local { color: var(--warn); }
.cues-clear { flex: none; font-size: 11px; color: var(--text-faint); padding: 2px 6px; border-radius: var(--r-sm); }
.cues-clear:hover { color: var(--danger); background: var(--panel-2); }
.rec-start { width: 100%; height: 40px; border-radius: var(--r-md); background: var(--accent); color: var(--accent-ink); font-size: 13.5px; font-weight: 650; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 2px; }
.rec-start:hover { filter: brightness(1.07); }
.rec-start:disabled { opacity: .6; }
.rec-live { text-align: center; }
.rec-timer { font-family: var(--font-mono); font-size: 44px; font-weight: 300; letter-spacing: .02em; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.rec-live-title { font-size: 13px; color: var(--text-dim); }
.rec-pill { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--danger); margin-bottom: 4px; }
.rec-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); animation: ms-blink 1.4s ease-in-out infinite; }
@keyframes ms-blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
.meters { display: flex; flex-direction: column; gap: 12px; margin: 26px 0 28px; text-align: left; }
.meter .m-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); margin-bottom: 5px; }
.meter .m-track { height: 6px; border-radius: 3px; background: color-mix(in oklab, var(--text) 10%, transparent); overflow: hidden; }
.meter .m-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width .12s linear; }
.rec-stop { width: 100%; height: 40px; border-radius: var(--r-md); background: var(--danger); color: #fff; font-size: 13.5px; font-weight: 650; display: flex; align-items: center; justify-content: center; gap: 8px; }
.rec-lang { width: 100%; height: 34px; padding: 0 8px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--panel-2); font-size: 13px; outline: none; }
.live-pane { text-align: left; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--panel-2); margin: 0 0 22px; overflow: hidden; }
.live-head { display: flex; align-items: center; gap: 7px; padding: 8px 12px; font-size: 11px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--text-dim); border-bottom: 1px solid var(--border); }
.live-head .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--danger); animation: ms-blink 1.6s ease infinite; }
.live-head .live-note { font-weight: 450; text-transform: none; letter-spacing: 0; color: var(--text-faint); margin-left: auto; }
.live-body { max-height: 240px; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; }
.live-row { display: flex; gap: 8px; font-size: 13px; line-height: 1.5; }
.live-row .live-who { flex: 0 0 auto; font-weight: 650; color: var(--text-dim); min-width: 38px; }
.live-row .live-who.you { color: var(--accent); }
.live-row.is-partial { opacity: .55; font-style: italic; }
.rec-stop:hover { filter: brightness(1.08); }
.proc-steps { display: flex; flex-direction: column; gap: 2px; margin-top: 18px; }
.proc-step { display: flex; align-items: center; gap: 11px; padding: 9px 4px; font-size: 13px; color: var(--text-faint); }
.proc-step.active { color: var(--text); }
.proc-step.done { color: var(--text-dim); }
.proc-ic { width: 18px; height: 18px; flex: none; display: grid; place-items: center; }
.proc-step.done .proc-ic { color: var(--ok); }
.proc-detail { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spinner { width: 13px; height: 13px; border-radius: 50%; border: 2px solid color-mix(in oklab, var(--accent) 30%, transparent); border-top-color: var(--accent); animation: ms-spin .7s linear infinite; }
@keyframes ms-spin { to { transform: rotate(360deg) } }

#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel); color: var(--text); padding: 9px 16px; border-radius: var(--r-md); box-shadow: var(--shadow-pop); display: none; z-index: 90; font-size: 12.5px; max-width: 70vw; }
#connBanner { position: fixed; top: 0; left: 0; right: 0; z-index: 200; display: flex; align-items: center; justify-content: center; gap: 9px; padding: 8px; background: var(--warn, #d9a44a); color: #1a1205; font-size: 12.5px; font-weight: 600; }
#connBanner .spinner { border-color: rgba(0,0,0,.3); border-top-color: #1a1205; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: color-mix(in oklab, var(--text) 16%, transparent); border-radius: 5px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: color-mix(in oklab, var(--text) 28%, transparent); border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ============================================================================
   AURORA SKIN — appended, additive. Everything below layers the Aurora look
   over the existing components WITHOUT renaming any selector the JS reads.
   The palette remap above already carries most of the skin (glass panels,
   hairlines, aqua accent, night base); these rules add the display type, the
   signature border-beam / shimmer / reading-focus, the aurora wash, and the
   command palette.
   ========================================================================== */

/* --- Display type on the surfaces that carry the meeting's identity. -------- */
.sb-title, .rv-title, .brief h2, .brief-cta-text h2, .rec-h1, .rec-timer,
.brief-signals strong, .rec-kicker { font-family: var(--font-display); }
.rv-title { letter-spacing: -0.028em; }

/* --- Focus + selection ------------------------------------------------------ */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: color-mix(in oklab, var(--accent) 30%, transparent); }
.tr-text mark, .tr-note-body mark { box-shadow: 0 0 0 1px color-mix(in oklab, var(--accent) 28%, transparent); }
@media (hover: hover) and (pointer: fine) { button:active { transform: scale(.985); } }

/* --- Aurora wash: a fixed, low-opacity aurora behind the shell, masked to the
   top third so it never reaches the transcript's reading column. Purely
   decorative; hidden entirely in the light theme and under reduced motion. --- */
.ms-aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.ms-aurora .ms-blob { position: absolute; border-radius: 50%; filter: blur(90px); mix-blend-mode: screen; will-change: transform; }
.ms-b1 { width: 52vw; height: 52vw; left: 1vw; top: -30vh; background: radial-gradient(circle at 42% 42%, var(--v-blue), transparent 62%); opacity: .30; animation: ms-drift1 66s var(--ease-in-out) infinite; }
.ms-b2 { width: 42vw; height: 42vw; right: -6vw; top: -26vh; background: radial-gradient(circle at 50% 50%, var(--v-lav), transparent 60%); opacity: .28; animation: ms-drift2 78s var(--ease-in-out) infinite; }
.ms-b3 { width: 44vw; height: 44vw; left: 32vw; top: -24vh; background: radial-gradient(circle at 50% 50%, var(--v-vio), transparent 60%); opacity: .18; animation: ms-drift3 92s var(--ease-in-out) infinite; }
.ms-b4 { width: 30vw; height: 30vw; right: 4vw; top: -12vh; background: radial-gradient(circle at 50% 50%, var(--aqua), transparent 64%); opacity: .12; animation: ms-drift1 104s var(--ease-in-out) infinite reverse; }
.ms-aurora::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 0%, color-mix(in oklab, var(--bg) 55%, transparent) 32%, var(--bg) 58%); }
@keyframes ms-drift1 { 0%,100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(5vw,3vw,0) scale(1.1); } }
@keyframes ms-drift2 { 0%,100% { transform: translate3d(0,0,0) scale(1.04); } 50% { transform: translate3d(-4vw,4vw,0) scale(.95); } }
@keyframes ms-drift3 { 0%,100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(3vw,-2vw,0) scale(1.08); } }
html[data-theme="light"] .ms-aurora { display: none; }

/* Shell sits above the wash; sidebar is translucent so the wash glows behind
   the meetings list, while main keeps a near-solid base so the transcript is
   always read on near-black (the wash never fights legibility). */
.app { position: relative; z-index: 1; }
.sidebar { background: linear-gradient(180deg, rgba(255,255,255,.02), transparent 26%), color-mix(in oklab, var(--bg-sidebar) 80%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.main { background: linear-gradient(180deg, color-mix(in oklab, var(--accent) 6%, transparent), transparent 240px), var(--bg); }
html[data-theme="light"] .sidebar { background: var(--bg-sidebar); backdrop-filter: none; -webkit-backdrop-filter: none; }
html[data-theme="light"] .main { background: linear-gradient(180deg, color-mix(in oklab, var(--accent) 5%, transparent), transparent 220px), var(--bg); }
.sb-logo { background: linear-gradient(150deg, var(--accent), color-mix(in oklab, var(--accent) 60%, #000)); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 0 16px color-mix(in oklab, var(--accent) 30%, transparent); }

/* --- Overlays: the panel token is now translucent glass, which is right for
   cards but too faint for floating menus over content. Give them an opaque,
   theme-aware base + blur so they stay legible. ------------------------------ */
.menu, #toast { background: color-mix(in oklab, var(--bg) 88%, var(--text) 6%); border: 1px solid var(--border-strong); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.am-overlay { backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.am-card { background: color-mix(in oklab, var(--bg) 90%, var(--text) 5%); border: 1px solid var(--border-strong); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }

/* --- Aqua action buttons: soft vertical gradient + diffused glow. They already
   paint var(--accent); this just gives them the Aurora depth. ---------------- */
.btn.primary, .sb-new, .rec-start {
  background: linear-gradient(180deg, color-mix(in oklab, var(--accent) 88%, #fff 16%), var(--accent));
  box-shadow: 0 0 18px color-mix(in oklab, var(--accent) 22%, transparent), inset 0 1px 0 rgba(255,255,255,.26);
}
.btn.primary:hover, .sb-new:hover, .rec-start:hover {
  background: linear-gradient(180deg, color-mix(in oklab, var(--accent) 82%, #fff 22%), var(--accent));
  box-shadow: 0 0 24px color-mix(in oklab, var(--accent) 34%, transparent), inset 0 1px 0 rgba(255,255,255,.3);
}
.ask-send, .tp-play { box-shadow: 0 0 16px color-mix(in oklab, var(--accent) 26%, transparent); }

/* --- The border-beam signature: a conic ring traced around the primary Summary
   button, reused as the halo on the currently-playing transcript line. One
   effect, appearing in exactly two places, per the brief. ------------------- */
#sumBtn { position: relative; overflow: hidden; isolation: isolate; }
#sumBtn::after, .tr-group.is-playing::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px;
  background: conic-gradient(from var(--angle), transparent 0 68%, var(--accent) 80%, #eafffb 88%, var(--aqua-2) 94%, transparent 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: ms-beam 7s linear infinite; pointer-events: none; z-index: 2;
}
#sumBtn:disabled::after { animation: none; opacity: .4; }
@keyframes ms-beam { to { --angle: 360deg; } }

/* --- Restrained shimmer on the meeting title only: a white light-sweep over
   solid text (not rainbow gradient text). Reverts to a plain caret-able field
   the instant it is focused for editing. ------------------------------------ */
.rv-title {
  background: linear-gradient(105deg, color-mix(in oklab, var(--text) 74%, transparent) 0 40%, #ffffff 50%, color-mix(in oklab, var(--text) 74%, transparent) 60% 100%);
  background-size: 230% 100%;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  caret-color: var(--accent);
  animation: ms-title-shimmer 7s linear infinite;
}
.rv-title:focus { -webkit-text-fill-color: var(--text); background: none; animation: none; }
@keyframes ms-title-shimmer { to { background-position: -230% 0; } }

/* --- Reading focus: the transcript's centre band reads at full contrast while
   turns above and below dim back, so the eye lands where it is reading. The
   .ms-rf class is added by JS ONLY when it is safe (IntersectionObserver
   present, motion allowed); with JS off, or while searching, every turn stays
   at full contrast. Notes (.tr-note) are never dimmed — they are the user's
   own words. --------------------------------------------------------------- */
.tr-group { position: relative; }
.tr-scroll.ms-rf .tr-group { opacity: .5; transition: opacity .34s var(--ease-out); }
.tr-scroll.ms-rf .tr-group.ms-focus,
.tr-scroll.ms-rf .tr-group.is-playing,
.tr-scroll.ms-rf.ms-searching .tr-group { opacity: 1; }
.tr-group.is-playing { background: color-mix(in oklab, var(--accent) 7%, transparent); box-shadow: 0 0 22px color-mix(in oklab, var(--accent) 12%, transparent); }

/* --- Progressive-blur edge fade so the transcript melts into the night at the
   bottom, just above the transport. ---------------------------------------- */
.tr-wrap { position: relative; }
.tr-wrap::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 72px; z-index: 3; pointer-events: none;
  background: linear-gradient(to top, var(--bg) 8%, transparent);
  -webkit-mask: linear-gradient(to top, #000 42%, transparent); mask: linear-gradient(to top, #000 42%, transparent);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}

/* --- Aurora-styled tabs: the segmented pill picks up a soft aqua glow. ------ */
.rv-seg-pill { background: color-mix(in oklab, var(--accent) 16%, var(--panel-3)); box-shadow: 0 0 16px color-mix(in oklab, var(--accent) 16%, transparent), inset 0 0 0 1px color-mix(in oklab, var(--accent) 26%, transparent); }
.rv-tab.on { color: var(--text); }

/* ============================== COMMAND PALETTE ============================= */
.ms-cmdk-launch {
  display: flex; align-items: center; gap: 8px; width: calc(100% - 16px); margin: 4px 8px 2px; padding: 8px 10px;
  font-size: 11.5px; color: var(--text-dim); border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--panel); transition: border-color .14s var(--ease), background .14s var(--ease), color .14s var(--ease);
}
.ms-cmdk-launch:hover { color: var(--text); border-color: var(--border-strong); background: var(--panel-2); }
.ms-cmdk-launch .lbl { flex: 1; text-align: left; }
.ms-cmdk-launch kbd { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; }

.ms-cmdk-overlay {
  position: fixed; inset: 0; z-index: 150; display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh;
  background: color-mix(in oklab, var(--bg) 55%, transparent); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  opacity: 0; pointer-events: none; transition: opacity .12s var(--ease-out);
}
.ms-cmdk-overlay.open { opacity: 1; pointer-events: auto; }
.ms-cmdk {
  width: min(600px, 92vw); max-height: 64vh; display: flex; flex-direction: column;
  background: color-mix(in oklab, var(--bg) 90%, var(--text) 5%); border: 1px solid var(--border-strong);
  border-radius: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.55); overflow: hidden;
  transform: scale(.97); opacity: 0; transform-origin: center;
  transition: transform .12s var(--ease-out), opacity .12s var(--ease-out);
}
.ms-cmdk-overlay.open .ms-cmdk { transform: none; opacity: 1; }
.ms-cmdk-top { display: flex; align-items: center; gap: 11px; padding: 15px 16px; border-bottom: 1px solid var(--border); }
.ms-cmdk-top svg { color: var(--text-dim); flex: none; }
.ms-cmdk-top input { flex: 1; background: none; border: none; outline: none; font-family: var(--font-ui); font-size: 15px; color: var(--text); }
.ms-cmdk-top input::placeholder { color: var(--text-faint); }
.ms-cmdk-top .esc { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; }
.ms-cmdk-list { overflow-y: auto; padding: 8px; flex: 1; }
.ms-cmdk-group { font-size: 9.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--text-faint); padding: 9px 9px 5px; }
.ms-cmdk-item { display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 10px; border-radius: 10px; font-size: 13.5px; color: var(--text); text-align: left; }
.ms-cmdk-item svg { color: var(--text-dim); flex: none; }
.ms-cmdk-item .av { width: 20px; height: 20px; flex: none; border-radius: 6px; display: grid; place-items: center; font-size: 9px; font-weight: 700; color: var(--avatar-ink); }
.ms-cmdk-item.sel { background: color-mix(in oklab, var(--accent) 14%, transparent); }
.ms-cmdk-item.sel svg { color: var(--accent); }
.ms-cmdk-item .hint { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); }
.ms-cmdk-item.danger, .ms-cmdk-item.danger svg { color: var(--danger); }
.ms-cmdk-empty { padding: 26px; text-align: center; color: var(--text-faint); font-size: 13px; }

/* ============================== REDUCED MOTION ============================= */
@media (prefers-reduced-motion: reduce) {
  .ms-aurora .ms-blob { animation: none; }
  .rv-title { animation: none; -webkit-text-fill-color: var(--text); background: none; }
  #sumBtn::after, .tr-group.is-playing::after { animation: none; background: conic-gradient(from 130deg, transparent 0 70%, var(--accent) 82%, transparent 100%); }
  .tr-scroll.ms-rf .tr-group { opacity: 1 !important; transition: none; }
  .ms-cmdk-overlay, .ms-cmdk { transition: opacity .12s var(--ease); }
  .ms-cmdk { transform: none; }
  button:active { transform: none; }
}
</style>
</head>
<body>
<div class="ms-aurora" aria-hidden="true">
  <div class="ms-blob ms-b1"></div><div class="ms-blob ms-b2"></div><div class="ms-blob ms-b3"></div><div class="ms-blob ms-b4"></div>
</div>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>
<div id="toast"></div>
<div id="modal"></div>

<!-- Command palette (Cmd-K). Static shell; contents + wiring live in the
     additive layer at the end of the main script, pointed at the REAL app functions. -->
<div class="ms-cmdk-overlay" id="msCmdkOverlay">
  <div class="ms-cmdk" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="ms-cmdk-top">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.6" y1="16.6" x2="21" y2="21"/></svg>
      <input id="msCmdkInput" type="text" placeholder="Search transcript, jump to a speaker, or run a command…" autocomplete="off" spellcheck="false">
      <span class="esc">esc</span>
    </div>
    <div class="ms-cmdk-list" id="msCmdkList"></div>
  </div>
</div>

<!-- Lenis smooth scroll (optional). Feature-detected in the additive script; if
     it fails to load the transcript keeps its native scrolling. -->
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.25/dist/lenis.min.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);

/* ---------------------------------------------------------------- icons -- */
const ICONS = {
  mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>',
  phone: '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><line x1="10.5" y1="18.4" x2="13.5" y2="18.4"/>',
  cloud: '<path d="M7 18a4.5 4.5 0 0 1-.4-8.98A6 6 0 0 1 18.3 8.6 4.2 4.2 0 0 1 17.5 18H7z"/>',

  plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
  search: '<circle cx="11" cy="11" r="7"/><line x1="16.6" y1="16.6" x2="21" y2="21"/>',
  sparkle: '<path d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6L4.5 10.5l5.6-1.9L12 3z"/>',
  chevronDown: '<path d="M6 9l6 6 6-6"/>',

  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',

  doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  textT: '<path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/>',
  refresh: '<path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10"/><path d="M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/>',
  play: '<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>',
  pause: '<g fill="currentColor" stroke="none"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></g>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/>',
  pencil: '<path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
  undo: '<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/>',
  folder: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  warn: '<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><circle cx="12" cy="16.6" r=".4" fill="currentColor"/>',
  monitor: '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
  person: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  wave: '<path d="M2 12h2M6 8v8M10 5v14M14 9v6M18 7v10M22 12h-2"/>',
  chat: '<path d="M21 11.5a8 8 0 0 1-11.6 7.2L3.5 20.5l1.8-5.9A8 8 0 1 1 21 11.5z"/>',
  send: '<path d="M12 20V5"/><path d="M5.5 11.5L12 5l6.5 6.5"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
