# with 'python -m pip freeze'. tools/build_dmg_bundle.sh installs these into
# the bundled python-build-standalone runtime, so builds are reproducible.
#
# DELIBERATELY ABSENT, even though a pip freeze of the dev venv lists them.
# Both were verified to be required by nothing: no other distribution here
# declares them outside an optional extra, so pip will not pull them back in.
#   transformers  52.6 MB. Reachable only through ctranslate2/converters/
#                 transformers.py, which is the OFFLINE MODEL CONVERTER and
#                 wraps its `import transformers` in try/except ImportError.
#                 No shipped module imports it; faster-whisper declares it
#                 under extra == "conversion" and speechbrain under
#                 extra == "dev".
#   pytest        1.7 MB with pluggy + iniconfig. A test runner has no job
#                 inside a shipped app; the repo battery runs against
#                 ~/.meetingscribe/venv, not this runtime.
