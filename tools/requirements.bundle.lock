# Exact package set for the self-contained .app bundle.
# Generated from the known-good runtime (~/.meetingscribe/venv, Python 3.11.15)
# with 'python -m pip freeze'. tools/build_dmg_bundle.sh installs these into
# the bundled python-build-standalone runtime, so builds are reproducible.
#
# THIS FILE IS INSTALLED WITH --no-deps, AND MUST BE. It is a full freeze, so
# it already names every transitive dependency; letting pip resolve on top of
# it buys nothing and costs the one thing below. See the mlx-whisper entry.
#
# DELIBERATELY ABSENT, even though a pip freeze of the dev venv lists them.
# Each was verified to be required by nothing that runs: no other distribution
# here reaches it outside an optional extra or a dead module.
#   transformers  52.6 MB. Reachable only through ctranslate2/converters/
#                 transformers.py, which is the OFFLINE MODEL CONVERTER and
#                 wraps its `import transformers` in try/except ImportError.
#                 No shipped module imports it; faster-whisper declares it
#                 under extra == "conversion".
#   pytest        1.7 MB with pluggy + iniconfig. A test runner has no job
#                 inside a shipped app; the repo battery runs against
#                 ~/.meetingscribe/venv, not this runtime.
#   torch         533 MB installed (torch 2.13.0, what pip resolves today; the
#                 2.12.0 this lock used to pin measured 450 MB, and sympy,
#                 networkx and mpmath carried another 102 MB behind it).
#                 A3 replaced the torch/speechbrain ECAPA
#                 embedder with onnxruntime, which removed the only thing in
#                 this app that ever ran a torch op — but mlx-whisper 0.4.3
#                 STILL DECLARES AN UNCONDITIONAL `torch` DEPENDENCY, so a
#                 resolving pip drags all 533 MB of it (plus sympy, networkx
#                 and mpmath) straight back in. It is dead weight there too:
#                 the only file in the mlx_whisper wheel that imports torch is
#                 torch_whisper.py, which NOTHING in the package imports —
#                 mlx_whisper/__init__ pulls audio, decoding, load_models and
#                 transcribe, and none of them reach it. Verified by importing
#                 mlx_whisper in a venv with no torch installed and running
#                 the full tools/test_pipeline.py end to end (real Parakeet
#                 decode, real ONNX embedder) with sys.modules holding no
#                 torch. --no-deps above is what keeps it out; `pip check`
#                 against this runtime therefore reports exactly one
#                 complaint, mlx-whisper's missing torch, and that one is
#                 this paragraph.
#   torchaudio    speechbrain's, and it left with speechbrain.
#   speechbrain   the ECAPA embedder now loads models/ecapa.onnx through
#                 onnxruntime. tools/export_ecapa_onnx.py, which does still
#                 need torch + speechbrain, is a dev-only generator that never
#                 ships. HyperPyYAML, ruamel.yaml, ruamel.yaml.clib and
#                 sentencepiece left with it — each was reachable from
#                 speechbrain and from nothing else here.
